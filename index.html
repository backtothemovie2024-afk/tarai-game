<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;
}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 10;
}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;
}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


#kitchen {

    z-index: 15;
}


#kitchenDamaged {

    z-index: 16;

    display: none;
}


#kitchenDestroyed {

    z-index: 17;

    display: none;
}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;
    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 30;
}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;
    height: 135px;

    top: -150px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 10;

    animation: none;

    transition:
        left 0.8s ease-out,
        top 0.8s ease-out;
}


/*
   CLIENTE 3 LEGGERMENTE PIÙ GRANDE
*/

.customer.type3 {

    width: 108px;
    height: 146px;
}


/* ==================================================
   SPRITE NORMALI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;
}


.customer .frame.active {

    display: block;
}


/* ==================================================
   CLIENTE 3
================================================== */

.customer.type3 .walking-frame {

    transform: scaleX(1);

}


.customer.type3 .walking-frame.flipped {

    transform: scaleX(-1);

}


/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;
}


/* ==================================================
   CUORICINO
================================================== */

.heart {

    position: absolute;

    left: 50%;

    top: -18px;

    transform:
        translateX(-50%);

    font-size: 24px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;
}


.customer.satisfied .heart {

    display: block;
}


@keyframes heartFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

    100% {

        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);

    }

}


/* ==================================================
   ANIMAZIONE CAMMINATA
================================================== */

@keyframes walkDown {

    0% {

        top: var(--walk-start);

    }

    100% {

        top: 69%;

    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;
    height: 135px;

    transform:
        translateX(-50%);

    z-index: 20;
}


#cook img {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;
}


#cook img.active {

    display: block;
}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;
    height: 84px;

    object-fit: contain;

    z-index: 25;

    pointer-events: none;
}


/* ==================================================
   HIT MARKER INVISIBILE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:
        0 0 8px red,
        0 0 15px rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

    opacity: 0;
}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer {

        width: 65px;
        height: 88px;

    }


    .customer.type3 {

        width: 72px;
        height: 98px;

    }


    #cook {

        width: 65px;
        height: 88px;

    }


    .pasta {

        width: 60px;
        height: 60px;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- ==================================================
     MENU
================================================== -->

<div id="menu">

    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt=""
    >

    <button id="playButton">

        PLAY

    </button>

</div>



<!-- ==================================================
     GIOCO
================================================== -->

<div id="game">


    <!-- BACKGROUND -->

    <img
        id="background"
        src="https://i.ibb.co/pj7trt5y/IMG-20260829-WA0012.jpg"
        alt=""
    >


    <!-- CUCINA -->

    <img
        id="kitchen"
        src="https://i.ibb.co/39jfnpgW/IMG-20260829-WA0013-removebg-preview.png"
        alt=""
    >


    <!-- CUCINA DANNEGGIATA -->

    <img
        id="kitchenDamaged"
        src="https://i.ibb.co/7t1CkQYc/IMG-20260829-WA0014-removebg-preview.png"
        alt=""
    >


    <!-- CUCINA DISTRUTTA -->

    <img
        id="kitchenDestroyed"
        src="https://i.ibb.co/HLF1Q2zn/IMG-20260829-WA0015-removebg-preview.png"
        alt=""
    >


    <!-- HUD -->

    <div id="hud">

        <span id="lives">

            ❤️ 3

        </span>

        <span id="score">

            ⭐ 0

        </span>

    </div>



    <!-- ==================================================
         CUOCO
    ================================================== -->

    <div id="cook">


        <!-- FRAME 1 -->

        <img
            class="active"
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 2 -->

        <img
            src="https://i.ibb.co/fY9GKKNP/IMG-20260829-WA0006-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 3 -->

        <img
            src="https://i.ibb.co/kskzw0J1/IMG-20260829-WA0004-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 4 = LANCIO -->

        <img
            src="https://i.ibb.co/9mSrQBZx/IMG-20260829-WA0007-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 5 -->

        <img
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt=""
        >

    </div>


</div>

</div>



<script>


/* ==================================================
   IMPOSTAZIONI
================================================== */


/*
   5 corsie.

   Le coordinate rappresentano il centro
   di ogni spazio tra i tavoli.

   Se dopo la prova una corsia deve essere
   spostata, basta modificare questi numeri.
*/

const LANES = [

    16,
    33,
    50,
    67,
    84

];


/*
   Numero clienti Wave 1.
*/

const WAVE_TOTAL = 15;


/*
   Distanza verticale iniziale.

   I clienti entrano dalla parte alta
   dello schermo.
*/

const SPAWN_TOP = -150;


/*
   Punto in cui iniziano la camminata
   verso la cucina.
*/

const WALK_START = 8;


/*
   Durata della camminata.
*/

const WALK_DURATION = 40;


/*
   Danno della pasta.
*/

const CUSTOMER_DAMAGE = 5;


/*
   HP iniziali.
*/

const CUSTOMER_HP = 50;


/*
   Regolazione punto di impatto.
*/

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;



/* ==================================================
   VARIABILI
================================================== */

let customerTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;

let kitchenEnergy = 100;

let waveSpawnTimers = [];

let waveSatisfied = 0;

let waveSpawned = 0;

let lastLane = -1;



/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    function() {


        document
        .getElementById("menu")
        .style.display =
            "none";


        document
        .getElementById("game")
        .style.display =
            "block";


        resetGame();


        startWave1();


        startCookAnimation();


        startKitchenEnergySystem();


        startFirstAttackDetection();

    }
);



/* ==================================================
   RESET
================================================== */

function resetGame() {


    /*
       Fermiamo eventuali timer precedenti.
    */

    if (customerTimer !== null) {

        clearInterval(
            customerTimer
        );

        customerTimer = null;

    }


    if (cookTimer !== null) {

        clearInterval(
            cookTimer
        );

        cookTimer = null;

    }


    if (firstAttackTimer !== null) {

        clearInterval(
            firstAttackTimer
        );

        firstAttackTimer = null;

    }


    if (kitchenDamageTimer !== null) {

        clearInterval(
            kitchenDamageTimer
        );

        kitchenDamageTimer = null;

    }


    waveSpawnTimers.forEach(
        function(timer) {

            clearTimeout(timer);

        }
    );


    waveSpawnTimers = [];


    /*
       Rimuoviamo vecchi clienti.
    */

    document
    .querySelectorAll(
        ".customer"
    )
    .forEach(
        function(customer) {

            customer.remove();

        }
    );


    /*
       Rimuoviamo pasta rimasta
       sullo schermo.
    */

    document
    .querySelectorAll(
        ".pasta"
    )
    .forEach(
        function(pasta) {

            pasta.remove();

        }
    );


    document
    .querySelectorAll(
        ".hit-marker"
    )
    .forEach(
        function(marker) {

            marker.remove();

        }
    );


    kitchenEnergy = 100;

    waveSatisfied = 0;

    waveSpawned = 0;

    lastLane = -1;


    updateKitchenEnergy();


    updateScore();


    setCookFrame(0);

}



/* ==================================================
   WAVE 1
================================================== */

function startWave1() {


    /*
       Generiamo 15 clienti.

       Ogni cliente entra in un momento
       diverso e sceglie una corsia casuale.
    */

    let accumulatedDelay = 500;


    for (
        let i = 0;
        i < WAVE_TOTAL;
        i++
    ) {


        /*
           Intervallo casuale tra i clienti.

           Tra circa 0.8 e 2.4 secondi.
        */

        const randomDelay =
            800 +
            Math.random() * 1600;


        accumulatedDelay +=
            randomDelay;


        const timer =
            setTimeout(
                function() {

                    spawnCustomer();

                },
                accumulatedDelay
            );


        waveSpawnTimers.push(
            timer
        );

    }

}



/* ==================================================
   SCELTA CORSIA
================================================== */

function chooseRandomLane() {


    let laneIndex;


    /*
       Evitiamo che due clienti consecutivi
       nascano sempre nella stessa corsia.
    */

    do {

        laneIndex =
            Math.floor(
                Math.random() *
                LANES.length
            );

    }
    while (
        laneIndex === lastLane &&
        LANES.length > 1
    );


    lastLane =
        laneIndex;


    return laneIndex;

}



/* ==================================================
   SCELTA SPRITE
================================================== */

function chooseRandomCustomerType() {


    return (
        Math.floor(
            Math.random() * 3
        ) + 1
    );

}



/* ==================================================
   GENERA CLIENTE
================================================== */

function spawnCustomer() {


    if (
        waveSpawned >=
        WAVE_TOTAL
    ) {

        return;

    }


    waveSpawned++;


    const type =
        chooseRandomCustomerType();


    const laneIndex =
        chooseRandomLane();


    const laneX =
        LANES[laneIndex];


    const customer =
        document.createElement(
            "div"
        );


    customer.className =
        "customer";


    if (
        type === 3
    ) {

        customer.classList.add(
            "type3"
        );

    }


    /*
       Dati del cliente.
    */

    customer.dataset.type =
        type;

    customer.dataset.hp =
        CUSTOMER_HP;

    customer.dataset.satisfied =
        "false";

    customer.dataset.atKitchen =
        "false";

    customer.dataset.lane =
        laneIndex;


    /*
       Partenza dalla porta:
       tutti iniziano dal centro
       della parte alta.
    */

    customer.style.left =
        "50%";


    customer.style.top =
        SPAWN_TOP + "px";


    /*
       Sprite CLIENTE 1.
    */

    if (
        type === 1
    ) {

        customer.innerHTML = `

            <img
                class="frame active"
                src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
                alt=""
            >

            <img
                class="frame"
                src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/mV43yWMM/grok-1788037208959-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    /*
       Sprite CLIENTE 2.
    */

    if (
        type === 2
    ) {

        customer.innerHTML = `

            <img
                class="frame active"
                src="https://i.ibb.co/jP6QSPFd/1000040572-removebg-preview.png"
                alt=""
            >

            <img
                class="frame"
                src="https://i.ibb.co/vxJCRK81/1000040573-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/m5xmJrBq/Screenshot-20260830-060945-Grok-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    /*
       Sprite CLIENTE 3.
    */

    if (
        type === 3
    ) {

        customer.innerHTML = `

            <img
                class="frame walking-frame active"
                src="https://i.ibb.co/cS3HRnCY/grok-1788046169803-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/jmGQ910/grok-1788046178397-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    document
    .getElementById("game")
    .appendChild(
        customer
    );


    /*
       Dopo una breve entrata dalla porta,
       il cliente si sposta nella sua corsia.
    */

    requestAnimationFrame(
        function() {


            customer.style.left =
                laneX + "%";


            customer.style.top =
                WALK_START + "%";


        }
    );


    /*
       Dopo 850 ms comincia la vera
       discesa verso la cucina.
    */

    setTimeout(
        function() {


            if (
                customer.dataset.satisfied ===
                "true"
            ) {

                return;

            }


            customer.style.transition =
                "none";


            customer.style.setProperty(
                "--walk-start",
                WALK_START + "%"
            );


            customer.style.animation =
                "walkDown " +
                WALK_DURATION +
                "s linear forwards";


        },
        850
    );


    /*
       Animazione del cliente.
    */

    if (
        type === 1 ||
        type === 2
    ) {

        animateCustomerFrames(
            customer
        );

    }

    else {

        animateCustomer3(
            customer
        );

    }


    /*
       Quando arriva alla cucina,
       viene considerato arrivato.
    */

    customer.addEventListener(
        "animationend",
        function(event) {


            if (
                event.animationName !==
                "walkDown"
            ) {

                return;

            }


            if (
                customer.dataset.satisfied ===
                "true"
            ) {

                return;

            }


            customer.dataset.atKitchen =
                "true";


        }
    );

}



/* ==================================================
   ANIMAZIONE CLIENTI 1 E 2
================================================== */

function animateCustomerFrames(
    customer
) {


    let frameIndex = 0;


    const timer =
        setInterval(
            function() {


                if (
                    !document
                    .body
                    .contains(
                        customer
                    )
                ) {

                    clearInterval(
                        timer
                    );

                    return;

                }


                if (
                    customer.dataset.satisfied ===
                    "true"
                ) {

                    clearInterval(
                        timer
                    );

                    return;

                }


                const frames =
                    customer
                    .querySelectorAll(
                        ".frame"
                    );


                if (
                    frames.length <= 1
                ) {

                    return;

                }


                frames.forEach(
                    function(frame) {

                        frame.classList
                        .remove(
                            "active"
                        );

                    }
                );


                frames[
                    frameIndex
                ]
                .classList
                .add(
                    "active"
                );


                frameIndex++;


                if (
                    frameIndex >=
                    frames.length
                ) {

                    frameIndex = 0;

                }


            },
            300
        );

}



/* ==================================================
   ANIMAZIONE CLIENTE 3
================================================== */

function animateCustomer3(
    customer
) {


    const walkingFrame =
        customer
        .querySelector(
            ".walking-frame"
        );


    const timer =
        setInterval(
            function() {


                if (
                    !document
                    .body
                    .contains(
                        customer
                    )
                ) {

                    clearInterval(
                        timer
                    );

                    return;

                }


                if (
                    customer.dataset.satisfied ===
                    "true"
                ) {

                    clearInterval(
                        timer
                    );

                    return;

                }


                walkingFrame
                .classList
                .toggle(
                    "flipped"
                );


            },
            300
        );

}



/* ==================================================
   CUOCO
================================================== */

function setCookFrame(
    frameNumber
) {


    const frames =
        document
        .getElementById("cook")
        .querySelectorAll(
            "img"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames[frameNumber]
    ) {

        frames[frameNumber]
        .classList
        .add(
            "active"
        );

    }

}



/* ==================================================
   ATTACCO CUOCO
================================================== */

function playCookAttack() {


    const target =
        getNearestVisibleCustomer();


    if (
        target === null
    ) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            setCookFrame(1);

        },
        120
    );


    setTimeout(
        function() {

            setCookFrame(2);

        },
        240
    );


    setTimeout(
        function() {


            setCookFrame(3);


            throwPasta(
                target
            );


        },
        360
    );


    setTimeout(
        function() {

            setCookFrame(4);

        },
        480
    );


    setTimeout(
        function() {

            setCookFrame(0);

        },
        600
    );

}



/* ==================================================
   ATTACCO AUTOMATICO
================================================== */

function startCookAnimation() {


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

    }


    setCookFrame(0);


    /*
       Primo attacco dopo 1 secondo.
    */

    setTimeout(
        function() {

            playCookAttack();

        },
        1000
    );


    /*
       Poi ogni 3 secondi.
    */

    cookTimer =
        setInterval(
            function() {

                playCookAttack();

            },
            3000
        );

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return false;

    }


    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}



/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer() {


    const customers =
        Array.from(
            document
            .querySelectorAll(
                ".customer"
            )
        )
        .filter(
            function(customer) {

                return customerIsVisible(
                    customer
                );

            }
        );


    if (
        customers.length === 0
    ) {

        return null;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const cookRect =
        cook.getBoundingClientRect();


    const cookX =
        cookRect.left +
        cookRect.width / 2;


    let nearest = null;

    let nearestDistance =
        Infinity;


    customers.forEach(
        function(customer) {


            const rect =
                customer
                .getBoundingClientRect();


            const customerX =
                rect.left +
                rect.width / 2;


            const distance =
                Math.abs(
                    customerX -
                    cookX
                );


            if (
                distance <
                nearestDistance
            ) {

                nearestDistance =
                    distance;

                nearest =
                    customer;

            }

        }
    );


    return nearest;

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {


    if (
        !target
    ) {

        return;

    }


    if (
        target.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    const cookRect =
        cook.getBoundingClientRect();



    /* ==================================================
       PARTENZA
    ================================================== */

    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;



    /* ==================================================
       HIT MARKER
    ================================================== */

    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );



    /* ==================================================
       PASTA
    ================================================== */

    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );



    /* ==================================================
       POSIZIONE
    ================================================== */

    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";



    /* ==================================================
       VELOCITÀ
    ================================================== */

    const speed = 350;


    let lastTime =
        performance.now();



    /* ==================================================
       MOVIMENTO
    ================================================== */

    function movePasta(
        currentTime
    ) {


        /*
           Il bersaglio viene ricalcolato
           ad ogni frame.

           Quindi il punto rosso invisibile
           segue sempre il cliente.
        */

        if (
            !target ||
            !document
            .body
            .contains(
                target
            )
        ) {


            pasta.remove();


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        if (
            target.dataset.satisfied ===
            "true"
        ) {


            pasta.remove();


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        const targetRect =
            target.getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;



        /* ==================================================
           HIT MARKER
        ================================================== */

        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";



        /* ==================================================
           DELTA TIME
        ================================================== */

        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;



        /* ==================================================
           DIREZIONE
        ================================================== */

        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );



        /* ==================================================
           MOVIMENTO
        ================================================== */

        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {

            currentX =
                endX;

            currentY =
                endY;

        }

        else {

            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }



        /* ==================================================
           POSIZIONE PASTA
        ================================================== */

        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";



        /* ==================================================
           IMPATTO
        ================================================== */

        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {


            hitCustomer(
                target,
                pasta
            );


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}



/* ==================================================
   CLIENTE COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.remove();

    }


    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    let hp =
        Number(
            customer.dataset.hp
        );


    hp -=
        CUSTOMER_DAMAGE;


    customer.dataset.hp =
        hp;


    if (
        hp <= 0
    ) {

        satisfyCustomer(
            customer
        );

    }

}



/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    customer
) {


    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    customer.dataset.satisfied =
        "true";


    customer.dataset.atKitchen =
        "false";


    customer.style.animation =
        "none";


    customer.classList.add(
        "satisfied"
    );


    /*
       Nascondiamo gli sprite normali.
    */

    const normalFrames =
        customer
        .querySelectorAll(
            ".frame"
        );


    normalFrames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    /*
       Mostriamo lo sprite felice.
    */

    const happyFrame =
        customer
        .querySelector(
            ".happy-frame"
        );


    if (
        happyFrame
    ) {

        happyFrame.style.display =
            "block";

    }


    /*
       Aumentiamo il punteggio.
    */

    waveSatisfied++;

    updateScore();


    /*
       Dopo un secondo
       il cliente scompare.
    */

    setTimeout(
        function() {


            if (
                customer.parentNode
            ) {

                customer.remove();

            }


            /*
               Se tutti i 15 clienti
               sono stati soddisfatti,
               la Wave 1 è terminata.
            */

            if (
                waveSatisfied >=
                WAVE_TOTAL
            ) {

                finishWave1();

            }


        },
        1000
    );

}



/* ==================================================
   FINE WAVE 1
================================================== */

function finishWave1() {


    /*
       Per ora non facciamo partire
       automaticamente la Wave 2.

       Il sistema è pronto per aggiungerla.
    */

    console.log(
        "WAVE 1 COMPLETATA!"
    );

}



/* ==================================================
   PUNTEGGIO
================================================== */

function updateScore() {


    document
    .getElementById(
        "score"
    )
    .textContent =
        "⭐ " +
        waveSatisfied;

}



/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {


    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

    }


    firstAttackTimer =
        setInterval(
            function() {


                const target =
                    getNearestVisibleCustomer();


                if (
                    target
                ) {


                    playCookAttack();


                    clearInterval(
                        firstAttackTimer
                    );


                    firstAttackTimer =
                        null;

                }


            },
            100
        );

}



/* ==================================================
   ENERGIA CUCINA
================================================== */

function startKitchenEnergySystem() {


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
        setInterval(
            function() {


                let damage =
                    0;


                /*
                   Controlliamo tutti i clienti
                   attualmente arrivati alla cucina.
                */

                document
                .querySelectorAll(
                    ".customer"
                )
                .forEach(
                    function(customer) {


                        if (
                            customer.dataset.atKitchen ===
                            "true" &&

                            customer.dataset.satisfied !==
                            "true"
                        ) {

                            damage++;

                        }

                    }
                );


                if (
                    damage > 0
                ) {


                    kitchenEnergy -=
                        damage;


                    if (
                        kitchenEnergy < 0
                    ) {

                        kitchenEnergy = 0;

                    }


                    updateKitchenEnergy();

                }


            },
            5000
        );

}



/* ==================================================
   AGGIORNA CUCINA
================================================== */

function updateKitchenEnergy() {


    const kitchen =
        document
        .getElementById(
            "kitchen"
        );


    const damaged =
        document
        .getElementById(
            "kitchenDamaged"
        );


    const destroyed =
        document
        .getElementById(
            "kitchenDestroyed"
        );


    if (
        kitchenEnergy > 50
    ) {


        kitchen.style.display =
            "block";


        damaged.style.display =
            "none";


        destroyed.style.display =
            "none";

    }

    else if (
        kitchenEnergy > 20
    ) {


        kitchen.style.display =
            "none";


        damaged.style.display =
            "block";


        destroyed.style.display =
            "none";

    }

    else {


        kitchen.style.display =
            "none";


        damaged.style.display =
            "none";


        destroyed.style.display =
            "block";

    }

}
