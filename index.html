<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;
}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 10;
}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;
}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


#kitchen {

    z-index: 70;

}


#kitchenDamaged {

    z-index: 71;

    display: none;

}


#kitchenDestroyed {

    z-index: 72;

    display: none;

}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 100;
}


/* ==================================================
   CONTENITORE CLIENTI
================================================== */

#customersLayer {

    position: absolute;

    inset: 0;

    z-index: 20;

    pointer-events: none;

}


/* ==================================================
   CLIENTE
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -150px;

    transform:
        translateX(-50%);

    pointer-events: none;

}


/* ==================================================
   SPRITE
================================================== */

.customer .frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;
}


.customer .frame.active {

    display: block;

}


/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;
}


/* ==================================================
   CLIENTE 3
================================================== */

.customer.type3 .walking-frame {

    transform:
        scaleX(1);

}


.customer.type3 .walking-frame.flipped {

    transform:
        scaleX(-1);

}


/* ==================================================
   CUORE
================================================== */

.heart {

    position: absolute;

    left: 50%;

    top: -18px;

    transform:
        translateX(-50%);

    font-size: 24px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;

}


.customer.satisfied .heart {

    display: block;

}


@keyframes heartFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

    100% {

        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);

    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform:
        translateX(-50%);

    z-index: 80;

}


#cook img {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;
}


#cook img.active {

    display: block;

}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 90;

    pointer-events: none;

}


/* ==================================================
   HIT MARKER INVISIBILE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:
        0 0 8px red,
        0 0 15px rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 95;

    pointer-events: none;

    opacity: 0;

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer {

        width: 65px;

        height: 88px;

    }


    /*
       Cliente 3 leggermente più grande
    */

    .customer.type3 {

        width: 72px;

        height: 96px;

    }


    #cook {

        width: 65px;

        height: 88px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }

}

<script>


/* ==================================================
   CONFIGURAZIONE
================================================== */


/*
   5 CORSIE

   Sono tutte nello spazio centrale
   tra i tavoli di sinistra e quelli
   di destra.

   Se nel background vuoi spostarle,
   basta modificare questi 5 valori.
*/

const LANES = [

    38,
    44,
    50,
    56,
    62

];


/*
   Tutti i clienti nascono dalla stessa
   posizione centrale.

   50 = centro dello schermo.
*/

const SPAWN_X = 50;


/*
   Partenza fuori dallo schermo.

   Il cliente entra dalla zona della porta.
*/

const SPAWN_Y = -12;


/*
   Punto in cui il cliente arriva
   davanti alla cucina.
*/

const KITCHEN_Y = 69;


/*
   Durata del movimento.

   Tutti percorrono la stessa distanza.
*/

const WALK_DURATION = 26;


/*
   15 clienti nella prima wave.
*/

const WAVE_SIZE = 15;


/*
   Un cliente ogni 2.5 secondi.
*/

const SPAWN_INTERVAL = 2500;


/*
   Distanza minima verticale tra clienti
   della stessa corsia.

   Serve per evitare sovrapposizioni
   eccessive.
*/

const MIN_CUSTOMER_DISTANCE = 7;


/* ==================================================
   HITBOX
================================================== */

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;


/* ==================================================
   VARIABILI
================================================== */

let kitchenEnergy = 100;

let cookTimer = null;

let customerSpawnTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;

let customerAnimationTimer = null;

let customers = [];

let customerIdCounter = 0;

let waveRunning = false;


/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    function() {


        document
        .getElementById("menu")
        .style.display =
            "none";


        document
        .getElementById("game")
        .style.display =
            "block";


        resetGame();


        startWave1();


        startCookAnimation();


        startKitchenEnergySystem();


        startFirstAttackDetection();


        startCustomerAnimation();

    }
);


/* ==================================================
   RESET
================================================== */

function resetGame() {


    kitchenEnergy = 100;


    customers = [];


    customerIdCounter = 0;


    waveRunning = false;


    clearAllTimers();


    document
    .getElementById(
        "customersLayer"
    )
    .innerHTML = "";


    document
    .getElementById(
        "kitchen"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "kitchenDamaged"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "kitchenDestroyed"
    )
    .style.display =
        "none";


    setCookFrame(0);

}


/* ==================================================
   TIMER
================================================== */

function clearAllTimers() {


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

        cookTimer = null;

    }


    if (
        customerSpawnTimer !== null
    ) {

        clearTimeout(
            customerSpawnTimer
        );

        customerSpawnTimer = null;

    }


    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

        firstAttackTimer = null;

    }


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

        kitchenDamageTimer = null;

    }


    if (
        customerAnimationTimer !== null
    ) {

        clearInterval(
            customerAnimationTimer
        );

        customerAnimationTimer = null;

    }

}


/* ==================================================
   WAVE 1
================================================== */

function startWave1() {


    waveRunning = true;


    spawnWaveCustomer(0);

}


/* ==================================================
   GENERAZIONE CLIENTI
================================================== */

function spawnWaveCustomer(
    index
) {


    if (
        index >= WAVE_SIZE
    ) {

        waveRunning = false;

        return;

    }


    createCustomer();


    customerSpawnTimer =
    setTimeout(
        function() {

            spawnWaveCustomer(
                index + 1
            );

        },
        SPAWN_INTERVAL
    );

}


/* ==================================================
   CREA CLIENTE
================================================== */

function createCustomer() {


    const layer =
        document
        .getElementById(
            "customersLayer"
        );


    /*
       Scegliamo casualmente
       uno dei 3 sprite.
    */

    const type =
        Math.floor(
            Math.random() * 3
        ) + 1;


    /*
       Scegliamo casualmente
       una delle 5 corsie.
    */

    const laneIndex =
        Math.floor(
            Math.random() *
            LANES.length
        );


    const laneX =
        LANES[
            laneIndex
        ];


    /*
       Creiamo il cliente.
    */

    const customer =
        document.createElement(
            "div"
        );


    customer.className =
        "customer type" +
        type;


    customer.dataset.type =
        type;


    customer.dataset.lane =
        laneIndex;


    customer.dataset.satisfied =
        "false";


    customer.dataset.hp =
        "50";


    customer.dataset.id =
        customerIdCounter++;


    /*
       POSIZIONE INIZIALE

       Tutti partono esattamente
       dallo stesso punto centrale.
    */

    customer.style.left =
        SPAWN_X + "%";


    customer.style.top =
        SPAWN_Y + "%";


    /*
       Z-index iniziale.
    */

    customer.style.zIndex =
        "20";


    /* ==================================================
       SPRITE
    ================================================== */

    if (
        type === 1
    ) {

        customer.innerHTML = `

            <img
                class="frame active"
                src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
                alt=""
            >

            <img
                class="frame"
                src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/mV43yWMM/grok-1788037208959-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    if (
        type === 2
    ) {

        customer.innerHTML = `

            <img
                class="frame active"
                src="https://i.ibb.co/jP6QSPFd/1000040572-removebg-preview.png"
                alt=""
            >

            <img
                class="frame"
                src="https://i.ibb.co/vxJCRK81/1000040573-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/m5xmJrBq/Screenshot-20260830-060945-Grok-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    if (
        type === 3
    ) {

        customer.innerHTML = `

            <img
                class="frame walking-frame active"
                src="https://i.ibb.co/cS3HRnCY/grok-1788046169803-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/jmGQ910/grok-1788046178397-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    layer.appendChild(
        customer
    );


    /*
       Salviamo i dati del cliente.
    */

    const data = {

        element: customer,

        type: type,

        lane: laneIndex,

        laneX: laneX,

        hp: 50,

        satisfied: false,

        y: SPAWN_Y

    };


    customers.push(
        data
    );


    /*
       Il cliente si sposta prima
       verso la propria corsia.

       Poi continua verso la cucina.
    */

    animateCustomer(
        data
    );

}


/* ==================================================
   MOVIMENTO CLIENTE
================================================== */

function animateCustomer(
    data
) {


    const customer =
        data.element;


    /*
       Punto iniziale.
    */

    const startX =
        SPAWN_X;


    const startY =
        SPAWN_Y;


    /*
       Prima fase:

       dalla porta centrale
       verso la corsia scelta.
    */

    const laneTime = 1800;


    const startTime =
        performance.now();


    function move(
        now
    ) {


        if (
            data.satisfied
        ) {

            return;

        }


        const elapsed =
            now -
            startTime;


        /*
         * FASE 1
         *
         * Porta -> corsia
         */

        if (
            elapsed <
            laneTime
        ) {


            const progress =
                elapsed /
                laneTime;


            /*
               Movimento leggermente
               morbido.
            */

            const eased =
                progress *
                progress *
                (3 - 2 * progress);


            const x =
                startX +
                (
                    data.laneX -
                    startX
                ) *
                eased;


            const y =
                startY +
                (
                    8 -
                    startY
                ) *
                progress;


            data.y = y;


            customer.style.left =
                x + "%";


            customer.style.top =
                y + "%";


            updateCustomerDepth(
                data
            );


            requestAnimationFrame(
                move
            );


            return;

        }


        /*
         * FASE 2
         *
         * Corsia -> cucina
         */

        const walkElapsed =
            elapsed -
            laneTime;


        const walkDuration =
            WALK_DURATION *
            1000;


        const progress =
            Math.min(
                walkElapsed /
                walkDuration,
                1
            );


        const y =
            8 +
            (
                KITCHEN_Y -
                8
            ) *
            progress;


        data.y = y;


        customer.style.left =
            data.laneX + "%";


        customer.style.top =
            y + "%";


        updateCustomerDepth(
            data
        );


        /*
           Arrivato alla cucina.
        */

        if (
            progress >= 1
        ) {

            customer.style.top =
                KITCHEN_Y + "%";

            return;

        }


        requestAnimationFrame(
            move
        );

    }


    requestAnimationFrame(
        move
    );

}


/* ==================================================
   PROFONDITÀ CLIENTI
================================================== */

/*
   Questa è la parte importante:

   più il cliente è in basso,
   più è "avanti".

   Quindi il cliente davanti
   viene disegnato SOPRA quello dietro.

   In questo modo, se due clienti
   sono troppo vicini sulla stessa
   corsia, quello dietro non copre
   quello davanti.
*/

function updateCustomerDepth(
    data
) {


    const customer =
        data.element;


    const depth =
        Math.round(
            20 +
            data.y * 2
        );


    customer.style.zIndex =
        depth;


    /*
       Controlliamo gli altri clienti
       sulla stessa corsia.
    */

    customers.forEach(
        function(other) {


            if (
                other === data
            ) {

                return;

            }


            if (
                other.satisfied
            ) {

                return;

            }


            if (
                other.lane !==
                data.lane
            ) {

                return;

            }


            const distance =
                Math.abs(
                    other.y -
                    data.y
                );


            /*
               Se sono molto vicini,
               quello davanti rimane
               visivamente sopra.
            */

            if (
                distance <
                MIN_CUSTOMER_DISTANCE
            ) {


                if (
                    data.y >
                    other.y
                ) {

                    data.element.style.zIndex =
                        "60";


                    other.element.style.zIndex =
                        "50";

                }

                else {

                    data.element.style.zIndex =
                        "50";


                    other.element.style.zIndex =
                        "60";

                }

            }

        }
    );

}


/* ==================================================
   ANIMAZIONE SPRITE CLIENTI
================================================== */

function startCustomerAnimation() {


    customerAnimationTimer =
    setInterval(
        function() {


            customers.forEach(
                function(data) {


                    if (
                        data.satisfied
                    ) {

                        return;

                    }


                    const customer =
                        data.element;


                    if (
                        data.type === 1 ||
                        data.type === 2
                    ) {


                        const frames =
                            customer
                            .querySelectorAll(
                                ".frame"
                            );


                        if (
                            !frames.length
                        ) {

                            return;

                        }


                        let current =
                            parseInt(
                                customer
                                .dataset
                                .frame ||
                                "0"
                            );


                        frames.forEach(
                            function(frame) {

                                frame.classList
                                .remove(
                                    "active"
                                );

                            }
                        );


                        current++;


                        if (
                            current >=
                            frames.length
                        ) {

                            current = 0;

                        }


                        frames[
                            current
                        ]
                        .classList
                        .add(
                            "active"
                        );


                        customer.dataset.frame =
                            current;

                    }


                    /*
                       Cliente 3:
                       alterna originale/specchiato.
                    */

                    if (
                        data.type === 3
                    ) {


                        const walkingFrame =
                            customer
                            .querySelector(
                                ".walking-frame"
                            );


                        if (
                            walkingFrame
                        ) {


                            walkingFrame
                            .classList
                            .toggle(
                                "flipped"
                            );

                        }

                    }

                }
            );


        },
        300
    );

}


/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {


    if (
        kitchenEnergy > 50
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";

    }

    else if (
        kitchenEnergy > 20
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";

    }

    else {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "block";

    }

}


/* ==================================================
   DANNO CUCINA
================================================== */

function startKitchenEnergySystem() {


    kitchenDamageTimer =
    setInterval(
        function() {


            let damage = 0;


            customers.forEach(
                function(data) {


                    if (
                        !data.satisfied &&
                        data.y >= 65
                    ) {

                        damage++;

                    }

                }
            );


            if (
                damage > 0
            ) {


                kitchenEnergy -=
                    damage;


                if (
                    kitchenEnergy < 0
                ) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();

            }

        },
        5000
    );

}


/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer
    ) {

        return false;

    }


    if (
        customer.style.display ===
        "none"
    ) {

        return false;

    }


    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}


/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {


    firstAttackTimer =
    setInterval(
        function() {


            const target =
                getNearestVisibleCustomer();


            if (
                target
            ) {


                playCookAttack();


                clearInterval(
                    firstAttackTimer
                );


                firstAttackTimer =
                    null;

            }

        },
        100
    );

}


/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer() {


    const available =
        customers.filter(
            function(data) {

                return (

                    !data.satisfied &&

                    customerIsVisible(
                        data.element
                    )

                );

            }
        );


    if (
        available.length === 0
    ) {

        return null;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const cookRect =
        cook.getBoundingClientRect();


    const cookX =
        cookRect.left +
        cookRect.width / 2;


    let nearest =
        null;


    let nearestDistance =
        Infinity;


    available.forEach(
        function(data) {


            const rect =
                data.element
                .getBoundingClientRect();


            const customerX =
                rect.left +
                rect.width / 2;


            const distance =
                Math.abs(
                    customerX -
                    cookX
                );


            if (
                distance <
                nearestDistance
            ) {


                nearestDistance =
                    distance;


                nearest =
                    data;

            }

        }
    );


    return nearest;

}


/* ==================================================
   FRAME CUOCO
================================================== */

function setCookFrame(
    frameNumber
) {


    const frames =
        document
        .getElementById(
            "cook"
        )
        .querySelectorAll(
            "img"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames[
            frameNumber
        ]
    ) {

        frames[
            frameNumber
        ]
        .classList
        .add(
            "active"
        );

    }

}


/* ==================================================
   ATTACCO CUOCO
================================================== */

function playCookAttack() {


    const target =
        getNearestVisibleCustomer();


    if (
        target === null
    ) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            setCookFrame(1);

        },
        120
    );


    setTimeout(
        function() {

            setCookFrame(2);

        },
        240
    );


    setTimeout(
        function() {


            setCookFrame(3);


            throwPasta(
                target
            );


        },
        360
    );


    setTimeout(
        function() {

            setCookFrame(4);

        },
        480
    );


    setTimeout(
        function() {

            setCookFrame(0);

        },
        600
    );

}


/* ==================================================
   ATTACCO AUTOMATICO
================================================== */

function startCookAnimation() {


    setCookFrame(0);


    cookTimer =
    setInterval(
        function() {

            playCookAttack();

        },
        3000
    );

}


/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {


    if (
        !target ||
        target.satisfied
    ) {

        return;

    }


    const targetElement =
        target.element;


    const cook =
        document
        .getElementById(
            "cook"
        );


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    const cookRect =
        cook.getBoundingClientRect();


    /*
       PARTENZA MANO
    */

    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;


    /*
       HIT MARKER INVISIBILE
    */

    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );


    /*
       PASTA
    */

    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );


    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";


    const speed =
        350;


    let lastTime =
        performance.now();


    function movePasta(
        currentTime
    ) {


        if (
            target.satisfied
        ) {


            if (
                pasta.parentNode
            ) {

                pasta.remove();

            }


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        /*
           Il bersaglio segue
           sempre il cliente.
        */

        const targetRect =
            targetElement
            .getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;


        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";


        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;


        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {


            currentX =
                endX;


            currentY =
                endY;

        }

        else {


            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }


        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";


        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {


            hitCustomer(
                target,
                pasta
            );


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}


/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    data,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.remove();

    }


    if (
        !data ||
        data.satisfied
    ) {

        return;

    }


    data.hp -= 5;


    if (
        data.hp <= 0
    ) {

        satisfyCustomer(
            data
        );

    }

}


/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    data
) {


    if (
        data.satisfied
    ) {

        return;

    }


    data.satisfied =
        true;


    data.element
    .dataset
    .satisfied =
        "true";


    data.element
    .classList
    .add(
        "satisfied"
    );


    /*
       Nascondiamo sprite normali.
    */

    const frames =
        data.element
        .querySelectorAll(
            ".frame"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    /*
       Mostriamo sprite felice.
    */

    const happy =
        data.element
        .querySelector(
            ".happy-frame"
        );


    if (
        happy
    ) {

        happy.style.display =
            "block";

    }


    /*
       Dopo 1 secondo
       il cliente esce dal gioco.
    */

    setTimeout(
        function() {


            data.element.style.display =
                "none";


            if (
                happy
            ) {

                happy.style.display =
                    "none";

            }

        },
        1000
    );

}
