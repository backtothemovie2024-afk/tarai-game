<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}

/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;
}

#cover {

    position: absolute;

    width: 100%;

    height: 100%;

    object-fit: cover;

    z-index: 10;
}

#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;
}

/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}

#background {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    z-index: 0;
}

/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}

#kitchen {
    z-index: 45;
}

#kitchenDamaged {

    z-index: 46;

    display: none;
}

#kitchenDestroyed {

    z-index: 47;

    display: none;
}

/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 80;
}

/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -170px;

    z-index: 40;

    pointer-events: none;
}

.customer.satisfied {

    animation: none !important;
}

#customer3 {

    width: 108px;

    height: 146px;
}

/* ==================================================
   FRAME CLIENTI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;
}

.customer .frame.active {
    display: block;
}

/* ==================================================
   CLIENTE 3
================================================== */

#customer3 .walking-frame {
    transform: scaleX(1);
}

#customer3 .walking-frame.flipped {
    transform: scaleX(-1);
}

/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;
}

/* ==================================================
   CUORE
================================================== */

.heart {

    position: absolute;

    left: 50%;

    top: -12px;

    transform:
        translateX(-50%);

    font-size: 12px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;
}

.customer.satisfied .heart {

    display: block;

}

@keyframes heartFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

    100% {

        transform:
            translateX(-50%)
            translateY(-4px)
            scale(1.12);
    }
}

/* ==================================================
   MOVIMENTO CLIENTI
================================================== */

@keyframes walkDown {

    0% {
        top: -170px;
    }

    65% {
        top: 69%;
    }

    100% {
        top: 69%;
    }
}

/* ==================================================
   PERSONAGGI GIOCANTI
================================================== */

.player-character {

    position: absolute;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform:
        translateX(-50%);

    z-index: 50;

    pointer-events: none;
}

/* ==================================================
   CUOCO
================================================== */

#cook {
    left: 20%;
}

#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;
}

#cook img.active {
    display: block;
}

/* ==================================================
   CAMERIERA
================================================== */

#waitress {
    left: 40%;
}

#waitress img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;
}

#waitress img.active {
    display: block;
}

/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 60;

    pointer-events: none;
}

/* ==================================================
   COCKTAIL
================================================== */

.cocktail {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 61;

    pointer-events: none;

    background-image:
        url("https://i.ibb.co/QvkZKDkL/Screenshot-20260830-210005-Grok-removebg-preview.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: contain;
}

/* ==================================================
   HITBOX INVISIBILE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:
        0 0 8px red,
        0 0 15px rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

    opacity: 0;
}

/* ==================================================
   IMPATTO PASTA
================================================== */

.pasta-impact {

    position: absolute;

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background: #fff4d6;

    box-shadow:
        0 0 5px #fff,
        0 0 10px rgba(255,180,80,0.9);

    z-index: 75;

    pointer-events: none;

    transform:
        translate(-50%, -50%);

    animation:
        pastaImpact
        0.3s
        ease-out
        forwards;
}

@keyframes pastaImpact {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(0.5);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--dx)),
                calc(-50% + var(--dy))
            )
            scale(0.15);
    }
}

/* ==================================================
   SCHIZZO COCKTAIL
================================================== */

.splash {

    position: absolute;

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #b9f5ff;

    box-shadow:
        0 0 5px rgba(180,245,255,0.9);

    z-index: 75;

    pointer-events: none;

    transform:
        translate(-50%, -50%);

    animation:
        splashDrop
        0.28s
        ease-out
        forwards;
}

@keyframes splashDrop {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--dx)),
                calc(-50% + var(--dy))
            )
            scale(0.25);
    }
}

/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer {

        width: 65px;

        height: 88px;
    }

    #customer3 {

        width: 72px;

        height: 97px;
    }

    .player-character {

        width: 65px;

        height: 88px;
    }

    .pasta {

        width: 60px;

        height: 60px;
    }

    .cocktail {

        width: 60px;

        height: 60px;
    }
}

</style>

</head>

<body>

<div id="phone">
