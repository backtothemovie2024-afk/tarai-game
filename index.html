<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);
    aspect-ratio: 9 / 16;
    margin: auto;
    overflow: hidden;
    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {
    position: absolute;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#cover {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 10;
}

#playButton {
    position: absolute;
    bottom: 12%;
    width: 60%;
    max-width: 240px;
    height: 70px;
    border: none;
    border-radius: 18px;
    background: #ef6428;
    color: white;
    font-size: 28px;
    font-weight: bold;
    z-index: 30;
}


/* ==================================================
   GIOCO
================================================== */

#game {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: black;
}

#background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;
    left: 50%;
    top: 83%;
    width: 115%;
    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}

#kitchen {
    z-index: 45;
}

#kitchenDamaged {
    z-index: 46;
    display: none;
}

#kitchenDestroyed {
    z-index: 47;
    display: none;
}


/* ==================================================
   HUD
================================================== */

#hud {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;

    color: white;
    font-size: 22px;
    font-weight: bold;

    z-index: 80;
}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;
    height: 135px;

    top: -170px;

    z-index: 40;

    pointer-events: none;
}

.customer.satisfied {
    animation: none !important;
}


/* ==================================================
   CLIENTE 3 LEGGERMENTE PIÙ GRANDE
================================================== */

#customer3 {
    width: 108px;
    height: 146px;
}


/* ==================================================
   SPRITE NORMALI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;
}

.customer .frame.active {
    display: block;
}


/* ==================================================
   CLIENTE 3 - SPECCHIO
================================================== */

#customer3 .walking-frame {
    transform: scaleX(1);
}

#customer3 .walking-frame.flipped {
    transform: scaleX(-1);
}


/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;
}


/* ==================================================
   CUORE
================================================== */

.heart {

    position: absolute;

    left: 50%;
    top: -18px;

    transform:
        translateX(-50%);

    font-size: 12px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;
}

.customer.satisfied .heart {
    display: block;
}

@keyframes heartFloat {

    0% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

    100% {
        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);
    }
}


/* ==================================================
   MOVIMENTO CLIENTE
================================================== */

@keyframes walkDown {

    0% {
        top: -170px;
    }

    65% {
        top: 69%;
    }

    100% {
        top: 69%;
    }
}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;
    bottom: 7%;

    width: 100px;
    height: 135px;

    transform:
        translateX(-50%);

    z-index: 50;
}

#cook img {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;
}

#cook img.active {
    display: block;
}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;
    height: 84px;

    object-fit: contain;

    z-index: 60;

    pointer-events: none;
}


/* ==================================================
   HITBOX INVISIBILE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:
        0 0 8px red,
        0 0 15px rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

    opacity: 0;
}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer {

        width: 65px;
        height: 88px;
    }

    #customer3 {

        width: 72px;
        height: 97px;
    }

    #cook {

        width: 65px;
        height: 88px;
    }

    .pasta {

        width: 60px;
        height: 60px;
    }

}

</style>

</head>


<body>


<div id="phone">


<!-- ==================================================

<div id="menu">

<div id="game">


    <img

    >


    <img

    >

        <img

        <img
            src="https://i.ibb.co/9mSrQBZx/IMG-20260829-WA0007-removebg-preview.png"

        >

        <img

<script>


/* ==================================================
   CONFIGURAZIONE
================================================== */

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;


const LANES = [

    30,
    40,
    50,
    60,
    70

];


const SPAWN_X = 50;

const SPAWN_INTERVAL = 2500;

const WAVE_SIZE = 15;

const WALK_TIME = 60;

const MIN_DISTANCE = 9;


/* ==================================================
   VARIABILI
================================================== */

let customers = [];

let spawnTimer = null;

let waveIndex = 0;

let customerAnimationTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;

let kitchenEnergy = 100;


/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    startGame
);


function startGame() {


    document
    .getElementById("menu")
    .style.display = "none";


    document
    .getElementById("game")
    .style.display = "block";


    kitchenEnergy = 100;

    customers = [];

    waveIndex = 0;

    clearAllTimers();

    clearCustomers();


    document
    .getElementById("kitchen")
    .style.display = "block";


    document
    .getElementById("kitchenDamaged")
    .style.display = "none";


    document
    .getElementById("kitchenDestroyed")
    .style.display = "none";


    updateKitchenEnergy();

    startCustomerAnimation();

    startCookAnimation();

    startKitchenEnergySystem();

    startFirstAttackDetection();

    startWave();

}


/* ==================================================
   RESET TIMER
================================================== */

function clearAllTimers() {


    if (spawnTimer !== null) {

        clearInterval(spawnTimer);

        spawnTimer = null;

    }


    if (customerAnimationTimer !== null) {

        clearInterval(
            customerAnimationTimer
        );

        customerAnimationTimer = null;

    }


    if (cookTimer !== null) {

        clearInterval(cookTimer);

        cookTimer = null;

    }


    if (firstAttackTimer !== null) {

        clearInterval(
            firstAttackTimer
        );

        firstAttackTimer = null;

    }


    if (kitchenDamageTimer !== null) {

        clearInterval(
            kitchenDamageTimer
        );

        kitchenDamageTimer = null;

    }

}


/* ==================================================
   WAVE 1
================================================== */

function startWave() {


    let spawned = 0;


    spawnCustomer();

    spawned++;


    spawnTimer =
    setInterval(
        function() {


            if (
                spawned >= WAVE_SIZE
            ) {


                clearInterval(
                    spawnTimer
                );

                spawnTimer = null;

                return;

            }


            spawnCustomer();

            spawned++;


        },
        SPAWN_INTERVAL
    );

}


/* ==================================================
   SCELTA CORSIA
================================================== */

function chooseLane() {


    const counts =
        LANES.map(
            function(lane) {

                return customers.filter(
                    function(c) {

                        return (
                            c.lane === lane &&
                            c.element.style.display !== "none"
                        );

                    }
                ).length;

            }
        );


    const minimum =
        Math.min(...counts);


    const available =
        [];


    counts.forEach(
        function(count, index) {

            if (
                count === minimum
            ) {

                available.push(index);

            }

        }
    );


    const randomIndex =
        Math.floor(
            Math.random() *
            available.length
        );


    return LANES[
        available[randomIndex]
    ];

}


/* ==================================================
   TIPO CLIENTE
================================================== */

function chooseCustomerType() {


    return (
        Math.floor(
            Math.random() * 3
        ) + 1
    );

}


/* ==================================================
   CREA CLIENTE
================================================== */

function spawnCustomer() {


    const type =
        chooseCustomerType();


    const lane =
        chooseLane();


    let templateId;


    if (
        type === 1
    ) {

        templateId =
            "customer1Template";

    }

    else if (
        type === 2
    ) {

        templateId =
            "customer2Template";

    }

    else {

        templateId =
            "customer3Template";

    }


    const template =
        document
        .getElementById(
            templateId
        );


    const clone =
        template
        .content
        .cloneNode(true);


    const customerElement =
        clone
        .querySelector(
            ".customer"
        );


    const customerData = {

        element:
            customerElement,

        type:
            type,

        lane:
            lane,

        hp:
            50,

        satisfied:
            false,

        atKitchen:
            false

    };


    customerElement.style.left =
        SPAWN_X + "%";


    customerElement.style.top =
        "-170px";


    customerElement.style.transform =
        "translateX(-50%)";


    customerElement.dataset.lane =
        lane;


    if (
        type === 3
    ) {

        customerElement.id =
            "customer3";

    }


    document
    .getElementById("customers")
    .appendChild(
        customerElement
    );


    customers.push(
        customerData
    );


    requestAnimationFrame(
        function() {

            moveCustomerToLane(
                customerData
            );

        }
    );

}


/* ==================================================
   MOVIMENTO CLIENTE
================================================== */

function moveCustomerToLane(
    customer
) {


    if (
        !customer ||
        customer.satisfied
    ) {

        return;

    }


    const element =
        customer.element;


    element.style.transition =
        "left 1.2s ease-out";


    element.style.left =
        customer.lane + "%";


    setTimeout(
        function() {


            if (
                customer.satisfied
            ) {

                return;

            }


            element.style.transition =
                "none";


            element.style.animation =
                "walkDown " +
                WALK_TIME +
                "s linear forwards";


        },
        1200
    );

}


/* ==================================================
   PULIZIA CLIENTI
================================================== */

function clearCustomers() {


    const container =
        document
        .getElementById(
            "customers"
        );


    container.innerHTML = "";

    customers = [];

}


/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (
        customerAnimationTimer !== null
    ) {

        clearInterval(
            customerAnimationTimer
        );

    }


    customerAnimationTimer =
    setInterval(
        function() {


            customers.forEach(
                function(customer) {


                    if (
                        customer.satisfied
                    ) {

                        return;

                    }


                    const frames =
                        customer.element
                        .querySelectorAll(
                            ".frame"
                        );


                    if (
                        customer.type === 1 ||
                        customer.type === 2
                    ) {


                        let current =
                            parseInt(
                                customer.element
                                .dataset
                                .frame ||
                                "0"
                            );


                        frames.forEach(
                            function(frame) {

                                frame.classList
                                .remove(
                                    "active"
                                );

                            }
                        );


                        current =
                            current + 1;


                        if (
                            current >=
                            frames.length
                        ) {

                            current = 0;

                        }


                        frames[
                            current
                        ]
                        .classList
                        .add(
                            "active"
                        );


                        customer.element
                        .dataset
                        .frame =
                            current;

                    }


                    if (
                        customer.type === 3
                    ) {


                        const walkingFrame =
                            customer.element
                            .querySelector(
                                ".walking-frame"
                            );


                        if (
                            walkingFrame
                            .classList
                            .contains(
                                "flipped"
                            )
                        ) {

                            walkingFrame
                            .classList
                            .remove(
                                "flipped"
                            );

                        }

                        else {

                            walkingFrame
                            .classList
                            .add(
                                "flipped"
                            );

                        }

                    }

                }
            );


            preventOverlap();


        },
        300
    );

}


/* ==================================================
   EVITA SOVRAPPOSIZIONE
================================================== */

function preventOverlap() {


    const activeCustomers =
        customers.filter(
            function(c) {

                return (
                    !c.satisfied &&
                    c.element.style.display !== "none"
                );

            }
        );


    LANES.forEach(
        function(lane) {


            const laneCustomers =
                activeCustomers
                .filter(
                    function(c) {

                        return (
                            c.lane === lane
                        );

                    }
                );


            laneCustomers.sort(
                function(a, b) {


                    const aRect =
                        a.element
                        .getBoundingClientRect();


                    const bRect =
                        b.element
                        .getBoundingClientRect();


                    return (
                        aRect.top -
                        bRect.top
                    );

                }
            );


            for (
                let i = 1;
                i < laneCustomers.length;
                i++
            ) {


                const front =
                    laneCustomers[i - 1];


                const back =
                    laneCustomers[i];


                const frontRect =
                    front.element
                    .getBoundingClientRect();


                const backRect =
                    back.element
                    .getBoundingClientRect();


                const distance =
                    backRect.top -
                    frontRect.top;


                if (
                    distance <
                    MIN_DISTANCE
                ) {

                    back.element.style.zIndex =
                        front.element.style.zIndex - 1;

                }

                else {

                    back.element.style.zIndex =
                        40;

                }

            }

        }
    );

}


/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer ||
        customer.element.style.display ===
        "none"
    ) {

        return false;

    }


    const rect =
        customer.element
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}


/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {


    if (
        kitchenEnergy > 50
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";

    }

    else if (
        kitchenEnergy > 20
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";

    }

    else {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "block";

    }

}


/* ==================================================
   ENERGIA CUCINA
================================================== */

function startKitchenEnergySystem() {


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
    setInterval(
        function() {


            let damage = 0;


            customers.forEach(
                function(customer) {


                    if (
                        customer.atKitchen &&
                        !customer.satisfied
                    ) {

                        damage++;

                    }

                }
            );


            if (
                damage > 0
            ) {


                kitchenEnergy -=
                    damage;


                if (
                    kitchenEnergy < 0
                ) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();

            }

        },
        5000
    );

}


/* ==================================================
   CONTROLLO CLIENTI ARRIVATI
================================================== */

setInterval(
    function() {


        customers.forEach(
            function(customer) {


                if (
                    customer.satisfied
                ) {

                    return;

                }


                const rect =
                    customer.element
                    .getBoundingClientRect();


                const game =
                    document
                    .getElementById(
                        "game"
                    );


                const gameRect =
                    game
                    .getBoundingClientRect();


                const kitchenLine =
                    gameRect.top +
                    gameRect.height *
                    0.69;


                if (
                    rect.top >=
                    kitchenLine -
                    30
                ) {

                    customer.atKitchen =
                        true;

                }

            }
        );


    },
    200
);


/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {


    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

    }


    firstAttackTimer =
    setInterval(
        function() {


            const target =
                getNearestVisibleCustomer();


            if (
                target
            ) {


                playCookAttack();


                clearInterval(
                    firstAttackTimer
                );


                firstAttackTimer =
                    null;

            }

        },
        100
    );

}


/* ==================================================
   FRAME CUOCO
================================================== */

function setCookFrame(
    frameNumber
) {


    const frames =
        document
        .getElementById(
            "cook"
        )
        .querySelectorAll(
            "img"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames[frameNumber]
    ) {

        frames[
            frameNumber
        ]
        .classList
        .add(
            "active"
        );

    }

}


/* ==================================================
   ATTACCO
================================================== */

function playCookAttack() {


    /*
       IMPORTANTE:

       Il bersaglio viene scelto
       UNA SOLA VOLTA all'inizio
       dell'attacco.

       Se cambia la posizione dei clienti
       mentre la pasta è in volo,
       questa pasta NON cambia bersaglio.
    */

    const target =
        getNearestVisibleCustomer();


    if (
        target === null
    ) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            setCookFrame(1);

        },
        120
    );


    setTimeout(
        function() {

            setCookFrame(2);

        },
        240
    );


    setTimeout(
        function() {


            setCookFrame(3);


            throwPasta(
                target
            );


        },
        360
    );


    setTimeout(
        function() {

            setCookFrame(4);

        },
        480
    );


    setTimeout(
        function() {

            setCookFrame(0);

        },
        600
    );

}


/* ==================================================
   ATTACCO OGNI 3 SECONDI
================================================== */

function startCookAnimation() {


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

    }


    setCookFrame(0);


    cookTimer =
    setInterval(
        function() {

            /*
               Ad ogni nuovo attacco
               viene scelto nuovamente
               il cliente più vicino.
            */

            playCookAttack();

        },
        3000
    );

}


/* ==================================================
   CLIENTE PIÙ VICINO ALLA CUCINA
================================================== */

function getNearestVisibleCustomer() {


    const visible =
        customers.filter(
            function(customer) {

                return (
                    !customer.satisfied &&
                    customerIsVisible(customer)
                );

            }
        );


    if (
        visible.length === 0
    ) {

        return null;

    }


    let nearest =
        null;


    let nearestTop =
        -Infinity;


    visible.forEach(
        function(customer) {


            const rect =
                customer.element
                .getBoundingClientRect();


            /*
               Più il valore TOP è grande,
               più il cliente è in basso
               sullo schermo.

               Quindi è più vicino
               alla cucina.
            */

            if (
                rect.top >
                nearestTop
            ) {

                nearestTop =
                    rect.top;

                nearest =
                    customer;

            }

        }
    );


    return nearest;

}


/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {


    if (
        !target ||
        target.satisfied
    ) {

        return;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    const cookRect =
        cook
        .getBoundingClientRect();


    const startX =
        cookRect.left +
        cookRect.width *
        0.72;


    const startY =
        cookRect.top +
        cookRect.height *
        0.32;


    /*
       HITBOX INVISIBILE
    */

    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );


    /*
       PASTA
    */

    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );


    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";


    const speed =
        350;


    let lastTime =
        performance.now();


    function movePasta(
        currentTime
    ) {


        /*
           IL TARGET RIMANE FISSO.

           NON cerchiamo un nuovo cliente
           durante questo volo.
        */

        if (
            !target ||
            target.satisfied
        ) {


            if (
                pasta.parentNode
            ) {

                pasta.remove();

            }


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        const targetRect =
            target.element
            .getBoundingClientRect();


        /*
           Il punto d'impatto
           segue il cliente scelto
           durante il suo movimento.
        */

        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;


        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";


        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;


        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {


            currentX =
                endX;


            currentY =
                endY;

        }

        else {


            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }


        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";


        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {


            hitCustomer(
                target,
                pasta
            );


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}


/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.remove();

    }


    if (
        !customer ||
        customer.satisfied
    ) {

        return;

    }


    customer.hp -= 5;


    if (
        customer.hp <= 0
    ) {

        satisfyCustomer(
            customer
        );

    }

}


/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    customer
) {


    customer.satisfied =
        true;


    customer.atKitchen =
        false;


    const element =
        customer.element;


    element.classList.add(
        "satisfied"
    );


    element.style.animation =
        "none";


    const normalFrames =
        element
        .querySelectorAll(
            ".frame"
        );


    normalFrames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    const happyFrame =
        element
        .querySelector(
            ".happy-frame"
        );


    happyFrame.style.display =
        "block";


    setTimeout(
        function() {


            element.style.display =
                "none";


            happyFrame.style.display =
                "none";


        },
        1000
    );

}
