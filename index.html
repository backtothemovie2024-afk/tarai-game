<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Tarai Rush</title>

<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================
   HOME
========================= */

#menu {

    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}


#menu h1 {

    margin: 0 0 45px;

    color: #ffd447;

    font-size: clamp(45px, 14vw, 70px);

    font-weight: 900;

    letter-spacing: 3px;

    text-shadow:
        4px 4px 0 #63240d;
}


.menu-button {

    width: min(70vw, 280px);

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: 900;

    box-shadow:
        0 7px 0 #8d2e0e;

}


/* =========================
   LIVELLO
========================= */

#game {

    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: white;
}


/* =========================
   HUD
========================= */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;
    right: 20px;

    display: flex;

    justify-content: space-between;

    color: black;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* =========================
   CLIENTE
========================= */

#customer {

    position: absolute;

    left: 50%;

    top: -200px;

    transform: translateX(-50%);

    width: 150px;

    height: 200px;

    z-index: 10;
}


/* IMMAGINE DELLA CLIENTE */

#customer img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;
}


/* =========================
   MOVIMENTO
========================= */

@keyframes moveCustomer {

    from {

        top: -200px;

    }

    to {

        top: 55vh;

    }

}

</style>

</head>


<body>


<!-- =========================
     HOME
========================= -->

<div id="menu">

    <h1>
        TARAI RUSH
    </h1>

    <button
        class="menu-button"
        onclick="startGame()">

        PLAY

    </button>

</div>



<!-- =========================
     LIVELLO 1
========================= -->

<div id="game">


    <div id="hud">

        <span>
            ❤️ 3
        </span>

        <span>
            ⭐ 0
        </span>

    </div>


    <div id="customer">

        <img
            id="customerSprite"
            src="https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg"
            alt="Cliente">

    </div>


</div>



<script>

/* =========================
   I 4 FRAME
========================= */

const frames = [

    "https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg",

    "https://i.ibb.co/zV65ZTPs/Screenshot-20260829-161529-Grok-4.jpg",

    "https://i.ibb.co/YxRzGxP/Screenshot-20260829-161529-Grok-3.jpg",

    "https://i.ibb.co/zV65ZTPs/Screenshot-20260829-161529-Grok-4.jpg"

];


let currentFrame = 0;

let animationTimer;


/* =========================
   ANIMAZIONE CAMMINATA
========================= */

function animateCustomer() {

    const sprite =
        document.getElementById("customerSprite");


    sprite.src =
        frames[currentFrame];


    currentFrame++;

    if (currentFrame >= frames.length) {

        currentFrame = 0;

    }


    animationTimer =
        setTimeout(animateCustomer, 150);

}


/* =========================
   INIZIO LIVELLO
========================= */

function startGame() {

    document
        .getElementById("menu")
        .style.display = "none";


    document
        .getElementById("game")
        .style.display = "block";


    const customer =
        document.getElementById("customer");


    customer.style.animation =
        "moveCustomer 5s linear forwards";


    currentFrame = 0;

    animateCustomer();

}

</script>


</body>

</html>
