<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;
}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 10;
}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


#kitchen {

    z-index: 15;

}


#kitchenDamaged {

    z-index: 16;

    display: none;

}


#kitchenDestroyed {

    z-index: 17;

    display: none;

}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: 18%;

    z-index: 10;

}


.customer.satisfied {

    animation: none;

}


/* ==================================================
   CLIENTE 3 LEGGERMENTE PIÙ GRANDE
================================================== */

#customer3 {

    width: 115px;

    height: 155px;

}


/* ==================================================
   SPRITE NORMALI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


.customer .frame.active {

    display: block;

}


/* ==================================================
   CLIENTE 3 - SPECCHIO CAMMINATA
================================================== */

#customer3 .walking-frame {

    transform:
        scaleX(1);

}


#customer3 .walking-frame.flipped {

    transform:
        scaleX(-1);

}


/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;

}


/* ==================================================
   CUORICINO
================================================== */

.heart {

    position: absolute;

    left: 50%;

    top: -18px;

    transform:
        translateX(-50%);

    font-size: 24px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;

}


.customer.satisfied .heart {

    display: block;

}


@keyframes heartFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

    100% {

        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);

    }

}


/* ==================================================
   POSIZIONI INIZIALI
   TUTTI PARTONO DALLA PORTA
================================================== */

#customer1 {

    left: 50%;

    transform:
        translateX(-50%);

}


#customer2 {

    left: 50%;

    transform:
        translateX(-50%);

}


#customer3 {

    left: 50%;

    transform:
        translateX(-50%);

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform:
        translateX(-50%);

    z-index: 20;

}


#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


#cook img.active {

    display: block;

}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 25;

    pointer-events: none;

}


/* ==================================================
   PUNTO ROSSO
   INVISIBILE MA FUNZIONANTE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:

        0 0 8px red,

        0 0 15px
        rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

    opacity: 0;

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer,
    #cook {

        width: 65px;

        height: 88px;

    }


    /*
       Cliente 3 rimane leggermente
       più grande anche su telefono.
    */

    #customer3 {

        width: 75px;

        height: 100px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }

}

</style>

</head>


<body>


<div id="phone">

    <div id="cook">

        >

        <img

        <img

<script>


/* ==================================================
   REGOLAZIONE HITBOX
================================================== */

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;



/* ==================================================
   6 CORSIE INVISIBILI
================================================== */

/*
   Tutte le corsie sono nel corridoio
   tra i tavoli della fila sinistra
   e quelli della fila destra.

   I valori sono percentuali della
   larghezza del gioco.

   NON vengono disegnate sullo schermo.
*/

const LANES = [

    40,

    44,

    47,

    53,

    56,

    60

];



/* ==================================================
   PUNTO DI INGRESSO DALLA PORTA
================================================== */

const ENTRANCE_X = 50;

const ENTRANCE_Y = 18;



/* ==================================================
   VARIABILI
================================================== */

let customerFrame1 = 0;

let customerFrame2 = 0;

let customerFrame3 = 0;

let customerTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;


let kitchenEnergy = 100;


let customer1AtKitchen = false;

let customer2AtKitchen = false;

let customer3AtKitchen = false;


let customer1HP = 50;

let customer2HP = 50;

let customer3HP = 50;


let customer1Satisfied = false;

let customer2Satisfied = false;

let customer3Satisfied = false;



/* ==================================================
   POSIZIONE CORSIA CLIENTI
================================================== */

let customer1Lane = null;

let customer2Lane = null;

let customer3Lane = null;



/* ==================================================
   SCEGLI CORSIA CASUALE
================================================== */

function chooseRandomLane() {

    return LANES[
        Math.floor(
            Math.random() *
            LANES.length
        )
    ];

}



/* ==================================================
   ASSEGNA LE 3 CORSIE
================================================== */

function assignCustomerLanes() {


    customer1Lane =
        chooseRandomLane();


    customer2Lane =
        chooseRandomLane();


    customer3Lane =
        chooseRandomLane();


}



/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    function() {


        document
        .getElementById("menu")
        .style.display =
            "none";


        document
        .getElementById("game")
        .style.display =
            "block";


        kitchenEnergy = 100;


        customer1AtKitchen =
            false;

        customer2AtKitchen =
            false;

        customer3AtKitchen =
            false;


        customer1HP = 50;

        customer2HP = 50;

        customer3HP = 50;


        customer1Satisfied =
            false;

        customer2Satisfied =
            false;

        customer3Satisfied =
            false;


        /*
           Ogni partita assegna
           casualmente una corsia
           a ciascun cliente.
        */

        assignCustomerLanes();


        const customer1 =
            document
            .getElementById(
                "customer1"
            );


        const customer2 =
            document
            .getElementById(
                "customer2"
            );


        const customer3 =
            document
            .getElementById(
                "customer3"
            );


        customer1.style.display =
            "block";


        customer2.style.display =
            "block";


        customer3.style.display =
            "block";


        customer1.classList
        .remove(
            "satisfied"
        );


        customer2.classList
        .remove(
            "satisfied"
        );


        customer3.classList
        .remove(
            "satisfied"
        );


        /*
           Tutti partono
           dalla stessa porta.
        */

        customer1.style.left =
            ENTRANCE_X + "%";


        customer2.style.left =
            ENTRANCE_X + "%";


        customer3.style.left =
            ENTRANCE_X + "%";


        customer1.style.top =
            ENTRANCE_Y + "%";


        customer2.style.top =
            ENTRANCE_Y + "%";


        customer3.style.top =
            ENTRANCE_Y + "%";


        /*
           Reset sprite felici.
        */

        customer1
        .querySelector(
            ".happy-frame"
        )
        .style.display =
            "none";


        customer2
        .querySelector(
            ".happy-frame"
        )
        .style.display =
            "none";


        customer3
        .querySelector(
            ".happy-frame"
        )
        .style.display =
            "none";


        /*
           Reset specchio Cliente 3.
        */

        const walkingFrame3 =
            customer3
            .querySelector(
                ".walking-frame"
            );


        walkingFrame3.classList
        .remove(
            "flipped"
        );


        /*
           Riattiviamo il primo
           frame normale.
        */

        const normalFrames1 =
            customer1
            .querySelectorAll(
                ".frame"
            );


        const normalFrames2 =
            customer2
            .querySelectorAll(
                ".frame"
            );


        const normalFrames3 =
            customer3
            .querySelectorAll(
                ".frame"
            );


        normalFrames1.forEach(
            function(frame) {

                frame.classList
                .remove(
                    "active"
                );

            }
        );


        normalFrames2.forEach(
            function(frame) {

                frame.classList
                .remove(
                    "active"
                );

            }
        );


        normalFrames3.forEach(
            function(frame) {

                frame.classList
                .remove(
                    "active"
                );

            }
        );


        normalFrames1[0]
        .classList
        .add(
            "active"
        );


        normalFrames2[0]
        .classList
        .add(
            "active"
        );


        normalFrames3[0]
        .classList
        .add(
            "active"
        );


        /*
           Avviamo il movimento
           dalla porta alle corsie.
        */

        startCustomerMovement();


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


        updateKitchenEnergy();


        startCustomerAnimation();

        startCookAnimation();

        startKitchenEnergySystem();

        startCustomerKitchenDetection();

        startFirstAttackDetection();

    }
);



/* ==================================================
   MOVIMENTO CLIENTI
================================================== */

/*
   FASE 1:
   partono tutti dalla porta.

   FASE 2:
   ognuno raggiunge la propria
   corsia casuale.

   FASE 3:
   continua dritto verso la cucina.
*/

function startCustomerMovement() {


    const customer1 =
        document.getElementById(
            "customer1"
        );


    const customer2 =
        document.getElementById(
            "customer2"
        );


    const customer3 =
        document.getElementById(
            "customer3"
        );


    moveCustomer(
        customer1,
        customer1Lane,
        0
    );


    moveCustomer(
        customer2,
        customer2Lane,
        700
    );


    moveCustomer(
        customer3,
        customer3Lane,
        1400
    );

}



/* ==================================================
   MOVIMENTO SINGOLO CLIENTE
================================================== */

function moveCustomer(
    customer,
    lane,
    delay
) {


    setTimeout(
        function() {


            if (
                !customer ||
                customer.classList
                .contains("satisfied")
            ) {

                return;

            }


            /*
               Punto di ingresso.
            */

            const startX =
                ENTRANCE_X;


            const startY =
                ENTRANCE_Y;


            /*
               Punto dove termina
               l'ingresso nella corsia.
            */

            const laneX =
                lane;


            /*
               Il cliente prima si sposta
               orizzontalmente verso la corsia.
            */

            customer.style.left =
                startX + "%";


            customer.style.top =
                startY + "%";


            customer.style.transition =
                "left 1.2s linear";


            void customer.offsetWidth;


            customer.style.left =
                laneX + "%";


            /*
               Dopo aver raggiunto la corsia,
               parte il movimento verticale
               verso la cucina.
            */

            setTimeout(
                function() {


                    if (
                        customer.classList
                        .contains("satisfied")
                    ) {

                        return;

                    }


                    customer.style.transition =
                        "top 24s linear";


                    customer.style.top =
                        "69%";


                },
                1200
            );


        },
        delay
    );

}



/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {


    if (
        kitchenEnergy > 50
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


    }

    else if (
        kitchenEnergy > 20
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


    }

    else {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "block";

    }

}



/* ==================================================
   ENERGIA
================================================== */

function startKitchenEnergySystem() {


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
    setInterval(
        function() {


            let damage = 0;


            if (
                customer1AtKitchen &&
                !customer1Satisfied
            ) {

                damage++;

            }


            if (
                customer2AtKitchen &&
                !customer2Satisfied
            ) {

                damage++;

            }


            if (
                customer3AtKitchen &&
                !customer3Satisfied
            ) {

                damage++;

            }


            if (
                damage > 0
            ) {


                kitchenEnergy -=
                    damage;


                if (
                    kitchenEnergy < 0
                ) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();

            }


        },
        5000
    );

}



/* ==================================================
   ARRIVO CLIENTI
================================================== */

function startCustomerKitchenDetection() {


    setTimeout(
        function() {


            if (
                !customer1Satisfied
            ) {

                customer1AtKitchen =
                    true;

            }


        },
        26000
    );


    setTimeout(
        function() {


            if (
                !customer2Satisfied
            ) {

                customer2AtKitchen =
                    true;

            }


        },
        26000
    );


    setTimeout(
        function() {


            if (
                !customer3Satisfied
            ) {

                customer3AtKitchen =
                    true;

            }


        },
        26000
    );

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer ||
        customer.style.display ===
            "none"
    ) {

        return false;

    }


    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}



/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {


    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

    }


    firstAttackTimer =
    setInterval(
        function() {


            const c1 =
                document
                .getElementById(
                    "customer1"
                );


            const c2 =
                document
                .getElementById(
                    "customer2"
                );


            const c3 =
                document
                .getElementById(
                    "customer3"
                );


            if (
                customerIsVisible(c1) &&
                !customer1Satisfied
            ) {


                playCookAttack();


                clearInterval(
                    firstAttackTimer
                );


                return;

            }


            if (
                customerIsVisible(c2) &&
                !customer2Satisfied
            ) {


                playCookAttack();


                clearInterval(
                    firstAttackTimer
                );


                return;

            }


            if (
                customerIsVisible(c3) &&
                !customer3Satisfied
            ) {


                playCookAttack();


                clearInterval(
                    firstAttackTimer
                );


                return;

            }


        },
        100
    );

}



/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (
        customerTimer !== null
    ) {

        clearInterval(
            customerTimer
        );

    }


    customerFrame1 = 0;

    customerFrame2 = 0;

    customerFrame3 = 0;


    customerTimer =
    setInterval(
        function() {


            /*
               CLIENTE 1
            */

            if (
                !customer1Satisfied
            ) {


                const frames =
                    document
                    .getElementById(
                        "customer1"
                    )
                    .querySelectorAll(
                        ".frame"
                    );


                frames.forEach(
                    function(frame) {

                        frame.classList
                        .remove(
                            "active"
                        );

                    }
                );


                frames[
                    customerFrame1
                ]
                .classList
                .add(
                    "active"
                );


                customerFrame1++;


                if (
                    customerFrame1 >=
                    frames.length
                ) {

                    customerFrame1 = 0;

                }

            }



            /*
               CLIENTE 2
            */

            if (
                !customer2Satisfied
            ) {


                const frames =
                    document
                    .getElementById(
                        "customer2"
                    )
                    .querySelectorAll(
                        ".frame"
                    );


                frames.forEach(
                    function(frame) {

                        frame.classList
                        .remove(
                            "active"
                        );

                    }
                );


                frames[
                    customerFrame2
                ]
                .classList
                .add(
                    "active"
                );


                customerFrame2++;


                if (
                    customerFrame2 >=
                    frames.length
                ) {

                    customerFrame2 = 0;

                }

            }



            /*
               CLIENTE 3

               Originale -> specchio
               -> originale -> specchio
            */

            if (
                !customer3Satisfied
            ) {


                const walkingFrame =
                    document
                    .getElementById(
                        "customer3"
                    )
                    .querySelector(
                        ".walking-frame"
                    );


                if (
                    walkingFrame
                    .classList
                    .contains(
                        "flipped"
                    )
                ) {

                    walkingFrame
                    .classList
                    .remove(
                        "flipped"
                    );

                }

                else {

                    walkingFrame
                    .classList
                    .add(
                        "flipped"
                    );

                }

            }


        },
        300
    );

}

/* ==================================================
   ATTACCO
================================================== */

function playCookAttack() {


    const target =
        getNearestVisibleCustomer();


    if (
        target === null
    ) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            setCookFrame(1);

        },
        120
    );


    setTimeout(
        function() {

            setCookFrame(2);

        },
        240
    );


    setTimeout(
        function() {


            setCookFrame(3);


            throwPasta(
                target
            );


        },
        360
    );


    setTimeout(
        function() {

            setCookFrame(4);

        },
        480
    );


    setTimeout(
        function() {

            setCookFrame(0);

        },
        600
    );

}



/* ==================================================
   ATTACCO OGNI 3 SECONDI
================================================== */

function startCookAnimation() {


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

    }


    setCookFrame(0);


    cookTimer =
    setInterval(
        function() {

            playCookAttack();

        },
        3000
    );

}



/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer() {


    const customers = [];


    const c1 =
        document
        .getElementById(
            "customer1"
        );


    const c2 =
        document
        .getElementById(
            "customer2"
        );


    const c3 =
        document
        .getElementById(
            "customer3"
        );


    if (
        customerIsVisible(c1) &&
        !customer1Satisfied
    ) {

        customers.push(c1);

    }


    if (
        customerIsVisible(c2) &&
        !customer2Satisfied
    ) {

        customers.push(c2);

    }


    if (
        customerIsVisible(c3) &&
        !customer3Satisfied
    ) {

        customers.push(c3);

    }


    if (
        customers.length === 0
    ) {

        return null;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const cookRect =
        cook.getBoundingClientRect();


    const cookX =
        cookRect.left +
        cookRect.width / 2;


    let nearest = null;

    let nearestDistance =
        Infinity;


    customers.forEach(
        function(customer) {


            const rect =
                customer
                .getBoundingClientRect();


            const customerX =
                rect.left +
                rect.width / 2;


            const distance =
                Math.abs(
                    customerX -
                    cookX
                );


            if (
                distance <
                nearestDistance
            ) {


                nearestDistance =
                    distance;


                nearest =
                    customer;

            }

        }
    );


    return nearest;

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {


    if (!target) {

        return;

    }


    if (
        target.id ===
            "customer1" &&
        customer1Satisfied
    ) {

        return;

    }


    if (
        target.id ===
            "customer2" &&
        customer2Satisfied
    ) {

        return;

    }


    if (
        target.id ===
            "customer3" &&
        customer3Satisfied
    ) {

        return;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    const cookRect =
        cook.getBoundingClientRect();


    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;


    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );


    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );


    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";


    const speed = 350;


    let lastTime =
        performance.now();


    function movePasta(
        currentTime
    ) {


        const targetRect =
            target.getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;


        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";


        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;


        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {


            currentX =
                endX;


            currentY =
                endY;


        }

        else {


            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }


        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";


        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {


            hitCustomer(
                target,
                pasta
            );


            if (
                hitMarker.parentNode
            ) {

                hitMarker.parentNode
                .removeChild(
                    hitMarker
                );

            }


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}



/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {


        pasta.parentNode
        .removeChild(
            pasta
        );

    }


    if (
        customer.id ===
        "customer1"
    ) {


        if (
            customer1Satisfied
        ) {

            return;

        }


        customer1HP -= 5;


        if (
            customer1HP <= 0
        ) {

            satisfyCustomer1();

        }

    }


    if (
        customer.id ===
        "customer2"
    ) {


        if (
            customer2Satisfied
        ) {

            return;

        }


        customer2HP -= 5;


        if (
            customer2HP <= 0
        ) {

            satisfyCustomer2();

        }

    }


    if (
        customer.id ===
        "customer3"
    ) {


        if (
            customer3Satisfied
        ) {

            return;

        }


        customer3HP -= 5;


        if (
            customer3HP <= 0
        ) {

            satisfyCustomer3();

        }

    }

}
