<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Tarai Rush</title>

<style>

/* =========================
   IMPOSTAZIONI GENERALI
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =========================
   HOME
========================= */

#menu {

    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}


/* TITOLO */

#menu h1 {

    margin: 0 0 45px;

    color: #ffd447;

    font-size: clamp(45px, 14vw, 70px);

    font-weight: 900;

    letter-spacing: 3px;

    text-shadow:
        4px 4px 0 #63240d;
}


/* PLAY */

.menu-button {

    width: min(70vw, 280px);

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: 900;

    box-shadow:
        0 7px 0 #8d2e0e;

    cursor: pointer;
}


.menu-button:active {

    transform: translateY(6px);

    box-shadow:
        0 1px 0 #8d2e0e;
}


/* =========================
   LIVELLO 1
========================= */

#game {

    display: none;

    position: relative;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: white;
}


/* =========================
   HUD
========================= */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: black;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* =========================
   CLIENTE
========================= */

/*
   Questa è la "finestra"
   attraverso cui vediamo
   un frame alla volta.
*/

#customer {

    position: absolute;

    top: 50%;

    left: 50%;

    width: 150px;

    height: 200px;

    transform:
        translate(-50%, -50%);

    overflow: hidden;

    z-index: 10;
}


/*
   Lo sprite contiene
   4 frame affiancati.
*/

#customerSprite {

    position: absolute;

    top: 0;

    left: 0;

    width: 600px;

    height: 200px;

    max-width: none;

    animation:
        walk 0.8s steps(4) infinite;
}


/* =========================
   ANIMAZIONE 4 FRAME
========================= */

@keyframes walk {

    0% {
        left: 0;
    }

    100% {
        left: -450px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HOME
========================= -->

<div id="menu">

    <h1>
        TARAI RUSH
    </h1>

    <button
        class="menu-button"
        onclick="startGame()">

        PLAY

    </button>

</div>



<!-- =========================
     LIVELLO 1
========================= -->

<div id="game">


    <!-- HUD -->

    <div id="hud">

        <span>
            ❤️ 3
        </span>

        <span>
            ⭐ 0
        </span>

    </div>


    <!-- CLIENTE -->

    <div id="customer">

        <img
            id="customerSprite"

            src="https://i.ibb.co/39yMsFWJ/1787786320198-3.jpg"

            alt="Cliente">

    </div>


</div>



<script>

/* =========================
   AVVIO DEL GIOCO
========================= */

function startGame() {

    document
        .getElementById("menu")
        .style.display = "none";

    document
        .getElementById("game")
        .style.display = "block";

}

</script>


</body>

</html>
