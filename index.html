<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =====================
   HOME
===================== */

#menu {
    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#menu h1 {
    margin: 0 0 40px;

    color: #ffd447;

    font-size: 55px;

    font-weight: 900;
}

#playButton {
    width: 240px;
    height: 70px;

    border: none;
    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;
    font-weight: bold;
}


/* =====================
   GIOCO
===================== */

#game {
    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    background: white;

    overflow: hidden;
}


/* =====================
   HUD
===================== */

#hud {
    position: absolute;

    top: 15px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;

    font-size: 22px;
    font-weight: bold;

    z-index: 10;
}


/* =====================
   CLIENTE
===================== */

#customer {
    position: absolute;

    width: 150px;
    height: 200px;

    left: 50%;

    top: -220px;

    transform: translateX(-50%);

    z-index: 5;

    animation: walkDown 5s linear forwards;
}


/* IMMAGINE */

#customerSprite {
    width: 150px;
    height: 200px;

    object-fit: contain;

    display: block;
}


/* =====================
   MOVIMENTO VERSO IL BASSO
===================== */

@keyframes walkDown {

    from {
        top: -220px;
    }

    to {
        top: 55vh;
    }

}

</style>

</head>


<body>


<!-- =====================
     HOME
===================== -->

<div id="menu">

    <h1>TARAI RUSH</h1>

    <button id="playButton">
        PLAY
    </button>

</div>


<!-- =====================
     LIVELLO 1
===================== -->

<div id="game">

    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>


    <div id="customer">

        <img
            id="customerSprite"
            src="https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg"
            alt="Cliente">

    </div>

</div>


<script>

/* =====================
   I 4 FRAME
===================== */

const frames = [

    "https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg",

    "https://i.ibb.co/zV65ZTPs/Screenshot-20260829-161529-Grok-4.jpg",

    "https://i.ibb.co/YxRzGxP/Screenshot-20260829-161529-Grok-3.jpg",

    "https://i.ibb.co/zV65ZTPs/Screenshot-20260829-161529-Grok-4.jpg"

];


/* =====================
   PRECARICA LE IMMAGINI
===================== */

const loadedFrames = [];

for (let i = 0; i < frames.length; i++) {

    const image = new Image();

    image.src = frames[i];

    loadedFrames.push(image);

}


/* =====================
   VARIABILI
===================== */

let currentFrame = 0;

let frameTimer = null;


/* =====================
   PLAY
===================== */

document.getElementById("playButton").onclick = function() {

    document.getElementById("menu").style.display = "none";

    document.getElementById("game").style.display = "block";


    const customer =
        document.getElementById("customer");

    customer.style.animation =
        "walkDown 5s linear forwards";


    currentFrame = 0;


    const sprite =
        document.getElementById("customerSprite");


    sprite.src =
        loadedFrames[0].src;


    if (frameTimer) {
        clearInterval(frameTimer);
    }


    frameTimer = setInterval(function() {

        currentFrame++;

        if (currentFrame >= loadedFrames.length) {
            currentFrame = 0;
        }

        sprite.src =
            loadedFrames[currentFrame].src;

    }, 400);

};

</script>

</body>

</html>
