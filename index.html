/* [CSS 02.1] ALLINEAMENTO DEGLI OTTO CLIENTI
   Dimensioni misurate sui pixel visibili, escludendo i margini trasparenti.
   --client-height: altezza VISIBILE comune a camminata/felice/congelato.
   --client-ground: appoggio comune, misurato nel riquadro del cliente.
   Le variabili --asset-* sugli img compensano il ritaglio di ogni file.
   Larghezza automatica: nessun allungamento o schiacciamento dei disegni.
   Per GIF/WebP si usa una misura fissa mediana dell'intero ciclo:
   il movimento naturale non viene corretto fotogramma per fotogramma. */
.customer.sprite-aligned {
  --client-height: 95%;
  --client-ground: 100%;
}
.customer1-template { --client-height: 80.111821%; }
.customer2-template { --client-height: 95.000000%; }
.customer3-template { --client-height: 95.027624%; }
.customer4-template { --client-height: 90.617284%; }
.customer5-template { --client-height: 81.175000%; }
.customer6-template { --client-height: 84.470247%; }
.customer7-template { --client-height: 83.846154%; }
.customer8-template { --client-height: 94.498069%; }

.customer.sprite-aligned > .frame,
.customer.sprite-aligned > .happy-frame,
.customer.sprite-aligned > .frozen-frame {
  top: calc(var(--client-ground) - var(--client-height) * var(--asset-bottom));
  left: 50%;
  bottom: auto;
  right: auto;
  width: auto;
  height: calc(var(--client-height) * var(--asset-height));
  max-width: none;
  max-height: none;
  object-fit: contain;
  object-position: center;
  transform: translateX(var(--asset-anchor));
  transform-origin: center bottom;
  pointer-events: none;
}

function gameLater(callback, delay) {
  const id = nextTaskId++;
  gameTasks.set(id, {
    callback,
    due: gameClock + delay,
    interval: 0
  });
  return id;
}

  const id = nextTaskId++;
  gameTasks.set(id, {
    callback,
    due: gameClock + delay,
    interval: delay
  });
  return id;
}
/* ── cancelTask ────────────────────────────────────────── */
function cancelTask(id) {
  gameTasks.delete(id);
}
/* ── gameFrame ────────────────────────────────────────── */
function gameFrame(callback) {
  const token = generation;
  const id = requestAnimationFrame(function(time) {
    gameFrames.delete(id);
    if (token === generation) callback(time);
  });
  gameFrames.add(id);
  return id;
}
/* ── tickGameClock ────────────────────────────────────────── */
function tickGameClock(now) {
  const delta = now - lastClockTime;
  lastClockTime = now;
  if (!powerUpPaused && !specialPaused && !bossIntroPlaying && !gameFinished) {
    gameClock += delta;
    for (const [id, task] of Array.from(gameTasks)) {
      if (powerUpPaused || specialPaused || bossIntroPlaying || gameFinished) break;
      if (!gameTasks.has(id) || task.due > gameClock) continue;
      if (task.interval) task.due = gameClock + task.interval;
      else gameTasks.delete(id);
      task.callback();
    }
  }
  requestAnimationFrame(tickGameClock);
}

/* ── getAvailablePowerUps ────────────────────────────────────────── */
function getAvailablePowerUps() {
  const available = [];

  function add(types) {
    types.forEach(type => {
      if (powerUps[type] < 3) available.push({
        type,
        level: powerUps[type] + 1
      });
    });
  }
  add(['pasta', 'speed', 'sauce']);
  // I supporti restano candidati a OGNI level up finché non sono evocati.
  if (!powerUps.waitress) {
    if (currentLevel >= 2) available.push({
      type: 'waitress',
      level: 1
    });
  } else add(['iceShot', 'iceChain', 'deepFreeze']);
  if (!powerUps.seon) {
    if (currentLevel >= 3) available.push({
      type: 'seon',
      level: 1
    });
  } else add(['hotSplash', 'caffeineRush', 'doubleShot']);
  return available;
}
/* ── shuffle ────────────────────────────────────────── */
function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}
/* ── selectPowerUpBase ────────────────────────────────────────── */
function selectPowerUpBase(type) {
  if (!powerUpPaused) return;
  const choice = offeredPowerUps.find(p => p.type === type);
  if (!choice || !getAvailablePowerUps().some(p => p.type === type && p.level === choice.level)) return;
  if (type === 'waitress') {
    powerUps.waitress = true;
    summonWaitress();
  } else if (type === 'seon') {
    powerUps.seon = true;
    document.getElementById('seon').style.display = 'block';
    setActorFrame('seon', 0);
  } else {
    powerUps[type]++;
    if (type === 'pasta' && powerUps.pasta === 2) pastaSpeedBonus = .15;
  }
  // Caffeine Rush modifica solo la frequenza di Seon Jeong.
  if (type === 'caffeineRush') startSeonAttack();
  offeredPowerUps = [];
  document.getElementById('powerup-overlay').style.display = 'none';
  document.getElementById('powerup-options').innerHTML = '';
  powerUpPaused = false;
  document.getElementById('game').classList.remove('powerup-paused');
  lockPowerUpBackground(false);
  updateEXPBar();
  updateSpecialPanels();
}

/* ── spawnWaveCustomers ────────────────────────────────────────── */
function spawnWaveCustomers() {
  if (currentWave === BOSS_WAVE) {
    spawnBossWave();
    return;
  }
  const config = WAVES[currentWave - 1],
    wave = currentWave;
  if (!config) return;

  function next() {
    if (currentWave !== wave || waveFinished || gameFinished) return;
    const type = chooseCustomerType();
    const templateId = 'customer' + type + 'Template';
    const height = measureCustomerHeight(templateId);

    function attempt() {
      if (currentWave !== wave || waveFinished || gameFinished) return;
      const game = document.getElementById('game');
      const start = CUSTOMER_START_Y * game.clientHeight;
      const lanes = LANES.map((_, i) => i).filter(lane => customers.every(c => {
        if (!c.isConnected || c.style.display === 'none' || Number(c.dataset.lane) !== lane) return true;
        return hasLaneSpace(start, height, c._walkY * game.clientHeight, c.offsetHeight);
      }));
      if (!lanes.length) {
        gameLater(attempt, 100);
        return;
      }
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      createCustomer(templateId, type, config.hp, lane, config.walkTime, false);
      waveSpawned++;
      if (waveSpawned >= config.customers) scheduleWaveCheck();
      else gameLater(next, config.spawnInterval);
    }
    attempt();
  }
  next();
}
/* ── measureCustomerHeight ────────────────────────────────────────── */
function measureCustomerHeight(templateId) {
  const probe = document.getElementById(templateId).cloneNode(true);
  probe.removeAttribute('id');
  probe.style.display = 'block';
  probe.style.visibility = 'hidden';
  document.getElementById('game').appendChild(probe);
  const height = probe.offsetHeight;
  probe.remove();
  return height;
}
/* Il margine superiore copre anche gli sprite ingranditi al 115%. */
/* ── laneTopLimit ────────────────────────────────────────── */
function laneTopLimit(frontY, frontHeight, backHeight) {
  return frontY - frontHeight * .15 - backHeight - CUSTOMER_GAP * Math.max(frontHeight, backHeight);
}
/* ── hasLaneSpace ────────────────────────────────────────── */
function hasLaneSpace(backY, backHeight, frontY, frontHeight) {
  return backY <= laneTopLimit(frontY, frontHeight, backHeight);
}
/* ── spawnBossWave ────────────────────────────────────────── */

  spawnBossEntity('assistantBossTemplate', 120, 0, 36, 'assistant');

let nextCustomerId = 0;
/* ── createCustomerBase ────────────────────────────────────────── */
function createCustomerBase(templateId, type, hp, lane, walkTime, isBoss) {
  const customer = document.getElementById(templateId).cloneNode(true);
  customer.id = 'customer-' + (++nextCustomerId);
  customer.classList.remove('customer-template', 'satisfied');
  customer.classList.add('spawned-customer');
  customer.style.display = 'block';
  customer.style.animation = 'none';
  customer.style.top = (CUSTOMER_START_Y * 100) + '%';
  customer.style.left = LANES[lane] + '%';
  Object.assign(customer.dataset, {
    type: String(type),
    hp: String(hp),
    lane: String(lane),
    satisfied: 'false',
    atKitchen: 'false',
    frame: '0',
    frozen: 'false',
    wave: String(currentWave)
  });
  if (isBoss) customer.dataset.boss = 'true';
  customer.querySelectorAll('.frame').forEach((f, i) => f.classList.toggle('active', i === 0));
  customer.querySelector('.happy-frame').style.display = 'none';
  const frozen = customer.querySelector('.frozen-frame');
  if (frozen) frozen.style.display = 'none';
  document.getElementById('game').appendChild(customer);
  customers.push(customer);
  customer._walkY = CUSTOMER_START_Y;
  customer._walkTime = walkTime;
  // Movimento gestito dal ciclo comune per mantenere le distanze.
  customer.style.animation = 'none';
  customer.classList.add('walking');
  return customer;
}
/* ── scheduleWaveCheck ────────────────────────────────────────── */
function scheduleWaveCheck() {
  cancelTask(waveCheckTimer);
  // Attesa originale verso il boss; dimezzata verso le altre wave.
  const interval = currentWave >= BOSS_WAVE - 1 ? 500 : 250;
  waveCheckTimer = gameEvery(function() {
    if (waveFinished) return;
    const active = customers.filter(c => c.isConnected && c.dataset.wave == currentWave && c.style.display !== 'none');
    const expected = currentWave === BOSS_WAVE ? 3 : WAVES[currentWave - 1].customers;
    if (waveSpawned >= expected && !active.length) {
      cancelTask(waveCheckTimer);
      waveCheckTimer = null;
      completeWave();
    }
  }, interval);
}
/* ── completeWave ────────────────────────────────────────── */
function completeWave() {
  if (waveFinished) return;
  waveFinished = true;
  if (currentWave >= TOTAL_WAVES) {
    finishLevel();
    return;
  }
  const next = currentWave + 1;
  // Nessuna durata minima della wave: passa subito alla preparazione successiva.
  startWave(next);
}

const bossIntro = document.getElementById('bossIntro');
const bossVideo = document.getElementById('bossIntroVideo');
const bossVideoAction = document.getElementById('bossVideoAction');
let videoSession = 0,
  bossLeaving = false,
  videoWatchdog = null,
  videoExitTimer = null;
/* ── stopBossIntro ────────────────────────────────────────── */
function stopBossIntro() {
  videoSession++;
  clearTimeout(videoWatchdog);
  clearTimeout(videoExitTimer);
  bossVideo.onended = null;
  bossVideo.onplaying = null;
  bossVideo.onerror = null;
  bossVideo.pause();
  bossIntroPlaying = false;
  bossLeaving = false;
  bossIntro.style.display = 'none';
  bossIntro.classList.remove('entering', 'leaving');
  bossVideoAction.hidden = true;
  bossVideoAction.onclick = null;
  document.getElementById('testBossButton').disabled = false;
}
/* ── showBossIntro ────────────────────────────────────────── */
function showBossIntro() {
  stopBossIntro();
  bossIntroPlaying = true;
  const session = videoSession;
  document.getElementById('testBossButton').disabled = true;
  bossIntro.style.display = 'flex';
  void bossIntro.offsetWidth;
  bossIntro.classList.add('entering');
  bossVideo.muted = true;
  bossVideo.currentTime = 0;

  function valid() {
    return session === videoSession && bossIntroPlaying && !bossLeaving;
  }

  function showAction(text, callback) {
    if (!valid()) return;
    bossVideoAction.textContent = text;
    bossVideoAction.onclick = callback;
    bossVideoAction.hidden = false;
  }

  function playVideo() {
    if (!valid()) return;
    bossVideoAction.hidden = true;
    const promise = bossVideo.play();
    if (promise) promise.catch(function(error) {
      if (!valid()) return;
      if (error.name === 'NotAllowedError') showAction('TOCCA PER AVVIARE IL VIDEO', playVideo);
      else showAction('VIDEO NON DISPONIBILE · CONTINUA', finishBossIntro);
    });
  }
  bossVideo.onplaying = function() {
    if (valid()) {
      clearTimeout(videoWatchdog);
      bossVideoAction.hidden = true;
    }
  };
  bossVideo.onended = function() {
    if (valid()) finishBossIntro();
  };
  bossVideo.onerror = function() {
    showAction('VIDEO NON DISPONIBILE · CONTINUA', finishBossIntro);
  };
  // Nessun timer tronca il filmato: l'uscita parte solo dall'evento ended.
  videoWatchdog = setTimeout(function() {
    if (valid() && (bossVideo.paused || bossVideo.readyState < 3)) showAction('VIDEO IN CARICAMENTO · SALTA', finishBossIntro);
  }, 15000);
  playVideo();
}
/* ── finishBossIntro ────────────────────────────────────────── */
function finishBossIntro() {
  if (!bossIntroPlaying || bossLeaving) return;
  bossLeaving = true;
  bossVideo.pause();
  bossVideoAction.hidden = true;
  clearTimeout(videoWatchdog);
  bossIntro.classList.remove('entering');
  bossIntro.classList.add('leaving');
  const session = videoSession;
  videoExitTimer = setTimeout(function() {
    if (session !== videoSession) return;
    stopBossIntro();
    gameLater(function() {
      waveStarting = false;
      spawnWaveCustomers();
    }, BOSS_WAVE_DELAY);
  }, 200);
}

/* ================================================================
   ANIMAZIONI CUOCO / CAMERIERA / SEON — TEMPI E RILASCIO
   ================================================================ */
/* ================================================================
 [JS 04] ATTACCHI DEI TRE PERSONAGGI
 ================================================================ */
function startActorAttack(actor) {
  if (powerUpPaused || specialPaused || bossIntroPlaying || gameFinished || gameClock < nextAttackAt[actor]) return;
  if (actor !== 'cook' && !powerUps[actor]) return;
  if (actor === 'cook' ? cookAttacking : actor === 'waitress' ? waitressAttacking : seonAttacking) return;
  const targets = actor === 'cook' ? getAttackTargets() : [getNearestVisibleCustomer()].filter(Boolean);
  if (!targets.length) {
    setActorFrame(actor, 0);
    return;
  }
  const interval = actor === 'cook' ? getCookAttackInterval() : actor === 'waitress' ? getWaitressAttackInterval() : getSeonAttackInterval();
  const steps = actor === 'cook' ? 5 : actor === 'waitress' ? 7 : 6;
  // Con molti potenziamenti, accorcia i fotogrammi per non saltare attacchi.
  const frameTime = Math.min(160, (interval - 60) / steps);
  const release = actor === 'waitress' ? 4 : 3;
  const type = actor === 'cook' ? 'pasta' : actor === 'waitress' ? 'drink' : 'cappuccino';
  if (actor === 'cook') cookAttacking = true;
  else if (actor === 'waitress') waitressAttacking = true;
  else seonAttacking = true;
  nextAttackAt[actor] = gameClock + interval;
  setActorFrame(actor, 0);
  for (let i = 1; i < steps; i++) gameLater(() => {
    setActorFrame(actor, i);
    if (i === release) {
      // Sceglie i bersagli al rilascio: chi è già soddisfatto viene sostituito.
      const releaseTargets = actor === 'cook' ? getAttackTargets() : [getNearestVisibleCustomer()].filter(Boolean);
      releaseTargets.forEach(target => throwProjectile(target, type));
    }
  }, i * frameTime);
  gameLater(() => {
    setActorFrame(actor, 0);
    if (actor === 'cook') cookAttacking = false;
    else if (actor === 'waitress') waitressAttacking = false;
    else seonAttacking = false;
  }, steps * frameTime);
}

/* ================================================================
   SEON JEONG — DANNI E SPLASH
   ================================================================ */
function hitCustomerWithCoffee(customer, projectile) {
  if (projectile) projectile.remove();
  if (!customerIsVisible(customer) || customer.dataset.satisfied === 'true') return;
  const damage = 3 * (1 + [0, .20, .40, .65][powerUps.doubleShot]);
  const chance = [.10, .25, .45, .70][powerUps.hotSplash];
  // Un solo bersaglio aggiuntivo, vicino: lo splash non genera altri splash.
  const r = customer.getBoundingClientRect();
  const radius = document.getElementById('game').getBoundingClientRect().width * .32;
  let nearby = null,
    best = radius;
  if (Math.random() < chance) customers.forEach(c => {
    if (c === customer || !customerIsVisible(c) || c.dataset.satisfied === 'true') return;
    const b = c.getBoundingClientRect();
    const distance = Math.hypot(b.left + b.width / 2 - r.left - r.width / 2, b.top + b.height / 2 - r.top - r.height / 2);
    if (distance < best) {
      best = distance;
      nearby = c;
    }
  });

  function hit(c) {
    createImpactEffect(c, 'cappuccino');
    c.dataset.hp = String(Math.max(0, Number(c.dataset.hp) - damage));
    if (Number(c.dataset.hp) <= 0) satisfyCustomer(c, 'seon');
  }
  hit(customer);
  if (nearby) hit(nearby);
}

/* ================================================================
   LANCIO PASTA / DRINK / CAPPUCCINO — TRAIETTORIA
   ================================================================ */
/* ================================================================
 [JS 05] LANCIO E IMPATTI
 ================================================================ */
function throwProjectile(target, type, special = false) {
  if (!target || !target.isConnected || target.dataset.satisfied === 'true') return;
  const isDrink = type === 'drink',
    isCoffee = type === 'cappuccino',
    game = document.getElementById('game'),
    gameRect = game.getBoundingClientRect();
  const frame = document.querySelector(isCoffee ? '#seon img.active' : isDrink ? '#waitress img.active' : '#cook img.active');
  if (!frame) return;
  const rect = frame.getBoundingClientRect();
  let currentX = rect.left + rect.width * (isCoffee ? .72 : isDrink ? .88 : .72),
    currentY = rect.top + rect.height * (isCoffee ? .38 : isDrink ? .34 : .32);
  const marker = document.createElement('div');
  marker.className = 'hit-marker';
  game.appendChild(marker);
  const projectile = isCoffee ? makeCappuccino() : document.createElement('img');
  projectile.className = type + (special ? ' special-projectile' : '');
  if (!isCoffee) projectile.src = isDrink ? 'MDk4xzJd_1788234306668-removebg-preview.png' : 'LDw4VzQs_1788013611587-removebg-preview.png';
  game.appendChild(projectile);
  const pr = projectile.getBoundingClientRect();
  const halfWidth = pr.width / 2,
    halfHeight = pr.height / 2;

  function position() {
    projectile.style.left = currentX - gameRect.left - halfWidth + 'px';
    projectile.style.top = currentY - gameRect.top - halfHeight + 'px';
  }
  position();
  const speed = special ? SPECIAL_CONFIG.projectileSpeed : (isDrink || isCoffee) ? 350 : 350 * (1 + powerUps.speed * .33) * (1 + pastaSpeedBonus);
  let lastTime = performance.now();

  function move(now) {
    if (!target.isConnected || target.dataset.satisfied === 'true') {
      projectile.remove();
      marker.remove();
      return;
    }
    if (powerUpPaused || specialPaused || bossIntroPlaying) {
      lastTime = now;
      gameFrame(move);
      return;
    }
    const r = target.getBoundingClientRect(),
      endX = r.left + r.width / 2 + HIT_X,
      endY = r.top + r.height * HIT_POSITION_Y + HIT_Y;
    marker.style.left = endX - gameRect.left + 'px';
    marker.style.top = endY - gameRect.top + 'px';
    const dt = Math.min((now - lastTime) / 1000, .05);
    lastTime = now;
    const dx = endX - currentX,
      dy = endY - currentY,
      distance = Math.hypot(dx, dy),
      movement = speed * dt;
    if (distance <= movement) {
      currentX = endX;
      currentY = endY;
    } else {
      currentX += dx / distance * movement;
      currentY += dy / distance * movement;
    }
    position();
    if (Math.hypot(endX - currentX, endY - currentY) <= 3) {
      if (special) hitSpecialProjectile(target, projectile, type);
      else if (isCoffee) hitCustomerWithCoffee(target, projectile);
      else if (isDrink) hitCustomerWithDrink(target, projectile);
      else hitCustomer(target, projectile);
      marker.remove();
      return;
    }
    gameFrame(move);
  }
  gameFrame(move);
}
/* ================================================================
   EFFETTI DI IMPATTO
   ================================================================ */
function createImpactEffect(customer, type) {
  if (!customer) return;
  const game = document.getElementById('game'),
    g = game.getBoundingClientRect(),
    r = customer.getBoundingClientRect();
  const isDrink = type !== 'pasta';
  for (let i = 0; i < (isDrink ? 7 : 6); i++) {
    const particle = document.createElement('div');
    particle.className = 'impact-particle ' + (isDrink ? 'drink-drop' : 'pasta-strand');
    if (type === 'cappuccino') {
      particle.classList.add('coffee-drop');
      particle.style.background = i % 2 ? '#a56a38' : '#ffe4b5';
    }
    particle.style.left = r.left + r.width / 2 - g.left + 'px';
    particle.style.top = r.top + r.height * .45 - g.top + 'px';
    const angle = Math.random() * Math.PI * 2,
      distance = isDrink ? 18 + Math.random() * 28 : 20 + Math.random() * 30;
    particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
    particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
    if (!isDrink) particle.style.setProperty('--rot', Math.floor(Math.random() * 180) + 'deg');
    game.appendChild(particle);
    gameLater(() => particle.remove(), isDrink ? 400 : 450);
  }
}
/* ── hitCustomer ────────────────────────────────────────── */
function hitCustomer(customer, pasta) {
  if (pasta) pasta.remove();
  if (!customer || !customer.isConnected || customer.dataset.satisfied === 'true') return;
  createImpactEffect(customer, 'pasta');
  const hp = Number(customer.dataset.hp || '30') - (5 + powerUps.sauce);
  customer.dataset.hp = hp;
  if (hp <= 0) satisfyCustomer(customer, 'cook');
}
/* ── hitCustomerWithDrink ────────────────────────────────────────── */
function hitCustomerWithDrink(customer, drink) {
  if (drink) drink.remove();
  if (!customer || !customer.isConnected || customer.dataset.satisfied === 'true') return;
  createImpactEffect(customer, 'drink');
  const hp = Number(customer.dataset.hp || '30') - 3;
  customer.dataset.hp = hp;
  if (hp <= 0) satisfyCustomer(customer, 'waitress');
  else if (Math.random() < [.10, .20, .35, .50][powerUps.iceShot]) {
    freezeCustomer(customer);
    tryIceChain(customer);
  }
}
/* ================================================================
   CAMERIERA — CONGELAMENTO
   ================================================================ */
function freezeCustomer(customer, duration = [500, 1500, 2000, 2500][powerUps.deepFreeze]) {
  if (!customer || !customer.isConnected || customer.style.display === 'none' || customer.dataset.satisfied === 'true') return;
  duration = Math.max(duration, (customer._freezeUntil || 0) - gameClock);

/* ── cameraPosition ────────────────────────────────────────── */
function cameraPosition(boss, cameraX = BOSS_CAMERA_X, cameraY = BOSS_CAMERA_Y) {
  const img = boss.querySelector('.frame.active'),
    r = (img || boss).getBoundingClientRect(),
    g = document.getElementById('game').getBoundingClientRect();
  const scale = img && img.naturalWidth ? Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight) : 1;
  const w = img && img.naturalWidth ? img.naturalWidth * scale : r.width,
    h = img && img.naturalHeight ? img.naturalHeight * scale : r.height;
  return {
    x: r.left - g.left + (r.width - w) / 2 + w * cameraX,
    y: r.top - g.top + (r.height - h) / 2 + h * cameraY
  };
}

  const BOSS_GIF_CYCLE_MS = 7500;

      const customer = createCustomer('customer' + type + 'Template', type, config.hp, lane, config.walkTime, false);
      customer.dataset.wave = String(currentWave);

    if (!valid() || boss.dataset.frozen === 'true') return;
    const p = cameraPosition(boss, photo.cameraX, photo.cameraY);
    const light = document.createElement('div');
    light.className = 'camera-light fired';

      light.remove();
      ring.remove();
    }, 650);
  }

  function runGifCycle() {
    if (!valid()) return;
    restartBossGif();
    BOSS_PHOTOS.forEach(photo => gameLater(() => firePhoto(photo), photo.at));
    gameLater(runGifCycle, BOSS_GIF_CYCLE_MS);

  });
  new ResizeObserver(() => Object.values(specialButtons).forEach(layoutTicketLights)).observe(container);
  updateSpecialPanels();
}
function layoutTicketLights(button) {
  const img = button.querySelector('img');
  if (!img.naturalWidth || !button.clientHeight) return;
  const factor = Math.min(button.clientWidth/img.naturalWidth,button.clientHeight/img.naturalHeight);
  const w = img.naturalWidth*factor, h = img.naturalHeight*factor;
  const x = (button.clientWidth-w)/2, y = (button.clientHeight-h)/2;
  button.querySelectorAll('.special-ticket-light, .special-ticket-check').forEach(light => {
    const i = Number(light.dataset.ticket);
    light.style.fontSize = w*.19+'px';
    light.style.left = (x+w*(.185+i*.215))+'px';
    light.style.top = (y+h*.67)+'px';
    light.style.width = w*.18+'px';
    light.style.height = h*.21+'px';
    light.style.transform = 'rotate('+([-8,0,8][i])+'deg)';
  });
}
function updateSpecialPanels() {
  for (const actor of ['cook','waitress','seon']) {
    const button = specialButtons[actor];
    if (!button) continue;
    const amount = specialCharge[actor];
    const ready = amount >= SPECIAL_CONFIG.killsRequired;
    button.hidden = !actorIsSummoned(actor);
    button.disabled = !ready;
    button.classList.toggle('ready',ready);
    button.setAttribute('aria-label',SPECIAL_CONFIG[actor].name+': '+amount+'/'+SPECIAL_CONFIG.killsRequired+(ready?', pronta':''));
    button.querySelector('.special-counter').textContent = ready ? 'READY' : amount+'/'+SPECIAL_CONFIG.killsRequired;
    button.querySelectorAll('.special-ticket-light').forEach((light,i) => {
      const part = SPECIAL_CONFIG.killsRequired/3;
      light.style.setProperty('--fill',Math.max(0,Math.min(1,(amount-i*part)/part))*100+'%');
    });
    button.querySelectorAll('.special-ticket-check').forEach((check,i) => {
      check.hidden = amount < (i+1)*SPECIAL_CONFIG.killsRequired/3;
    });
    layoutTicketLights(button);
  }
}
function creditSpecialKill(actor) {
  if (!(actor in specialCharge) || !actorIsSummoned(actor)) return;
  specialCharge[actor] = Math.min(SPECIAL_CONFIG.killsRequired,specialCharge[actor]+1);
  updateSpecialPanels();
}
function resetSpecials() {
  cancelSpecialPresentation();
  espressoUntil = 0;
  for (const actor in specialCharge) specialCharge[actor] = 0;
  updateSpecialPanels();
}
// GIF e WebP non si fermano con animation-play-state.
// Un canvas mostra il fotogramma corrente durante la pausa, senza modificare i file.
function snapshotAnimatedCustomers() {
  document.querySelectorAll('.spawned-customer .walk-gif.active').forEach(img => {
    if (!img.complete || !img.naturalWidth || getComputedStyle(img).display === 'none') return;
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    try { canvas.getContext('2d').drawImage(img,0,0); } catch (_) { return; }
    const style = getComputedStyle(img);
    for (const key of ['position','left','top','width','height','transform','transformOrigin','zIndex','filter']) canvas.style[key] = style[key];
    canvas.style.pointerEvents = 'none';
    img.parentNode.appendChild(canvas);
    pausedImageSnapshots.push({img,canvas,visibility:img.style.visibility});
    img.style.visibility = 'hidden';
  });
}
function restoreAnimatedCustomers() {
  pausedImageSnapshots.forEach(({img,canvas,visibility}) => {
    img.style.visibility = visibility;
    canvas.remove();
  });
  pausedImageSnapshots = [];
}
function cancelSpecialPresentation() {
  specialSession++;
  clearTimeout(specialPresentationTimer);
  specialPresentationTimer = null;
  specialPaused = false;
  document.getElementById('specialPresentation').hidden = true;
  document.getElementById('game').classList.remove('special-paused');
  restoreAnimatedCustomers();
}
function activateSpecial(actor) {
  if (!gameStarted || gameFinished || powerUpPaused || bossIntroPlaying || specialPaused ||
      !actorIsSummoned(actor) || !(actor in specialCharge) || specialCharge[actor] < SPECIAL_CONFIG.killsRequired) return;
  // Non consumare una speciale offensiva se non ci sono bersagli.
  if (!orderedTargets().length) return;
  specialCharge[actor] = 0;
  updateSpecialPanels();
  specialPaused = true;
  lastClockTime = performance.now();
  snapshotAnimatedCustomers();
  document.getElementById('game').classList.add('special-paused');
  const overlay = document.getElementById('specialPresentation');
  const art = document.getElementById('specialArtwork');
  const fallback = document.getElementById('specialFallback');
  overlay.dataset.actor = actor;
  const preload = specialPreloads[actor];
  const loaded = preload.complete && preload.naturalWidth > 0;
  art.style.display = loaded ? 'block' : 'none';
  art.src = SPECIAL_CONFIG[actor].artwork;
  art.alt = SPECIAL_CONFIG[actor].name;
  fallback.textContent = loaded ? '' : SPECIAL_CONFIG[actor].name;
  overlay.hidden = false;
  const session = ++specialSession;
  specialPresentationTimer = setTimeout(() => {
    if (session !== specialSession) return;
    cancelSpecialPresentation();
    lastClockTime = performance.now();
    if (!gameStarted || gameFinished) return;
    applySpecial(actor);
  },SPECIAL_CONFIG.presentationMs);
}
function applySpecial(actor) {
  if (actor === 'cook') {
    const volley = () => orderedTargets().slice(0,SPECIAL_CONFIG.chefTargets)
      .forEach(target => throwProjectile(target,'pasta',true));
    // Prima raffica visibile nello stesso callback che nasconde l'illustrazione.
    volley();
    for (let i=1;i<SPECIAL_CONFIG.chefVolleys;i++) {
      gameLater(volley,i*SPECIAL_CONFIG.volleyIntervalMs);
    }
  } else if (actor === 'waitress') {
    orderedTargets().forEach(target => hitSpecialProjectile(target,null,'drink'));
  } else if (actor === 'seon') {
    espressoUntil = gameClock + SPECIAL_CONFIG.espressoMs;
    for (const member in nextAttackAt) {
      nextAttackAt[member] = gameClock + Math.max(0,nextAttackAt[member]-gameClock)/1.5;
    }
    document.getElementById('game').classList.add('espresso-active');
    gameLater(() => {
      espressoUntil = 0;
      document.getElementById('game').classList.remove('espresso-active');
    },SPECIAL_CONFIG.espressoMs);
  }
}
function hitSpecialProjectile(customer, projectile, type) {
  if (projectile) projectile.remove();
  if (!customerIsVisible(customer) || customer.dataset.satisfied === 'true') return;
  createImpactEffect(customer,type);
  const chef = type === 'pasta';
  const damage = chef ? (5+powerUps.sauce)*SPECIAL_CONFIG.chefDamageMultiplier : SPECIAL_CONFIG.waitressDamage;
  customer.dataset.hp = Math.max(0,Number(customer.dataset.hp)-damage);
  // Le uccisioni dirette delle speciali non ricaricano le speciali.
  if (Number(customer.dataset.hp) <= 0) satisfyCustomer(customer,chef?'cook':'waitress',false);
  else if (!chef) freezeCustomer(customer,customer.dataset.boss === 'true'?SPECIAL_CONFIG.bossFreezeMs:SPECIAL_CONFIG.freezeMs);
}
/* [JS 03.1] Blocca il resto della pagina durante la scelta delle carte. */
function lockPowerUpBackground(locked) {
  for (const child of document.getElementById('game').children) {
    if (child.id !== 'powerup-overlay') child.inert = locked;
  }
}
function guardPowerUpInput(event) {
  if (!powerUpPaused) return;
  const options = document.getElementById('powerup-options');
  const slot = event.target.closest?.('button.powerup-slot');
  const allowed = slot && options.contains(slot);
  if (event.type === 'keydown' && event.key === 'Tab') {
    const cards = Array.from(options.querySelectorAll('button.powerup-slot'));
    if (cards.length) {
      const index = cards.indexOf(document.activeElement);
      cards[(index + (event.shiftKey ? cards.length-1 : 1)) % cards.length].focus();
    }
    event.preventDefault();
    event.stopImmediatePropagation();
    return;
  }
  if (!allowed) {
    event.preventDefault();
    event.stopImmediatePropagation();
  }
}
for (const type of ['pointerdown','pointerup','click','touchstart','touchend','keydown']) {
  document.addEventListener(type,guardPowerUpInput,{capture:true,passive:false});
}
initSpecialPanels();

</script>
