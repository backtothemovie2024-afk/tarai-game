<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================
   HOME
========================= */

#menu {

    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


#menu h1 {

    margin: 0 0 45px;

    color: #ffd447;

    font-size: clamp(45px, 14vw, 70px);

    font-weight: 900;

    text-shadow:
        4px 4px 0 #63240d;
}


.menu-button {

    width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: 900;
}


/* =========================
   LIVELLO
========================= */

#game {

    display: none;

    position: relative;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: white;
}


/* =========================
   HUD
========================= */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    color: black;

    z-index: 20;
}


/* =========================
   CLIENTE
========================= */

#customer {

    position: absolute;

    left: 50%;

    top: -180px;

    transform: translateX(-50%);

    width: 150px;

    height: 180px;

    overflow: hidden;

    z-index: 10;
}


/* =========================
   SPRITE
========================= */

#customerSprite {

    width: 600px;

    height: 180px;

    max-width: none;

    background-image:
        url("https://i.ibb.co/39yMsFWJ/1787786320198-3.jpg");

    background-size: 600px 180px;

    background-repeat: no-repeat;

    animation:

        walk 0.8s steps(4) infinite;
}


/* =========================
   4 FRAME
========================= */

@keyframes walk {

    from {

        background-position-x: 0;

    }

    to {

        background-position-x: -450px;

    }

}


/* =========================
   MOVIMENTO
========================= */

@keyframes moveDown {

    from {

        top: -180px;

    }

    to {

        top: 55vh;

    }

}

</style>

</head>


<body>


<!-- HOME -->

<div id="menu">

    <h1>
        TARAI RUSH
    </h1>

    <button
        class="menu-button"
        onclick="startGame()">

        PLAY

    </button>

</div>



<!-- GIOCO -->

<div id="game">


    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>


    <div id="customer">

        <div id="customerSprite"></div>

    </div>


</div>



<script>

function startGame() {

    document.getElementById("menu").style.display = "none";

    document.getElementById("game").style.display = "block";


    const customer =
        document.getElementById("customer");


    customer.style.animation =
        "moveDown 5s linear forwards";

}

</script>


</body>

</html>
