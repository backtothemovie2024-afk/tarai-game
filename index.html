<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#111;
font-family:Arial,sans-serif;
}

#phone{
position:relative;
width:min(100vw,56.25vh);
height:min(100vh,177.7778vw);
aspect-ratio:9/16;
margin:auto;
overflow:hidden;
background:#000;
}

#menu{
position:absolute;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:100;
}

#cover{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
z-index:10;
}

#playButton{
position:absolute;
bottom:12%;
width:60%;
max-width:240px;
height:70px;
border:none;
border-radius:18px;
background:#ef6428;
color:white;
font-size:28px;
font-weight:bold;
z-index:30;
}

#game{
display:none;
position:absolute;
inset:0;
overflow:hidden;
background:#000;
}

#background{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
image-rendering:auto;
z-index:0;
}

#kitchen,
#kitchenDamaged,
#kitchenDestroyed{
position:absolute;
left:50%;
top:83%;
width:115%;
height:auto;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:50;
}

#kitchen{display:block}
#kitchenDamaged,
#kitchenDestroyed{display:none}

#hud{
position:absolute;
top:15px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
color:white;
font-size:22px;
font-weight:bold;
z-index:80;
}

#exp-bar{
position:absolute;
left:2.5%;
bottom:1.5%;
width:95%;
height:30px;
background:#321b10;
border:3px solid #8a512d;
border-radius:15px;
box-shadow:
0 4px 0 #160b07,
0 6px 12px rgba(0,0,0,.6),
inset 0 2px 3px rgba(255,255,255,.18);
overflow:hidden;
z-index:200;
}

#exp-fill{
position:absolute;
left:0;
top:0;
width:0%;
height:100%;
background:linear-gradient(
180deg,
#ffe477,
#f5a623 50%,
#d96b16
);
border-radius:10px;
z-index:1;
transition:width .35s ease-out;
}

#exp-level{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:14px;
font-weight:900;
text-shadow:2px 2px 3px #000;
z-index:2;
pointer-events:none;
}

.customer{
position:absolute;
width:100px;
height:135px;
top:5%;
z-index:10;
}

.customer.walking{
animation:walkDown 60s linear forwards;
}

.customer.satisfied{
animation:none!important;
}

.customer .frame{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
display:none;
}

.customer .frame.active{
display:block;
}

.customer .happy-frame{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
display:none;
z-index:2;
}

.heart{
position:absolute;
left:50%;
top:-18px;
transform:translateX(-50%);
font-size:24px;
line-height:1;
z-index:5;
display:none;
animation:heartFloat .8s ease-in-out infinite alternate;
}

.customer.satisfied .heart{
display:block;
}

@keyframes heartFloat{
0%{
transform:translateX(-50%) translateY(0) scale(1)
}
100%{
transform:translateX(-50%) translateY(-7px) scale(1.12)
}
}

@keyframes walkDown{
0%{top:8%}
100%{top:69%}
}

#cook,
#waitress{
position:absolute;
bottom:7%;
width:100px;
height:135px;
transform:translateX(-50%);
z-index:60;
}

#cook{
left:37.5%;
}

#cook img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
display:none;
}

#cook img.active{
display:block;
}

#waitress{
left:62.5%;
display:none;
}

#waitress img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
display:none;
transform:scale(1.18);
transform-origin:center bottom;
}

#waitress img.active{
display:block;
}

.pasta,
.drink{
position:absolute;
width:84px;
height:84px;
object-fit:contain;
z-index:70;
pointer-events:none;
}

.drink{
width:140px;
height:140px;
}

.hit-marker{
position:absolute;
width:22px;
height:22px;
border-radius:50%;
background:red;
border:3px solid white;
box-shadow:
0 0 8px red,
0 0 15px rgba(255,0,0,.8);
transform:translate(-50%,-50%);
z-index:90;
pointer-events:none;
opacity:0;
}

/* ==================================================
   POWER UP
================================================== */

#powerup-overlay{
position:absolute;
inset:0;
background:rgba(18,8,3,.82);
display:none;
align-items:center;
justify-content:center;
z-index:500;
}

#powerup-panel{
width:96%;
height:78%;
position:relative;
background:transparent;
border:none;
border-radius:0;
box-shadow:none;
padding:0;
}

#powerup-options{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
gap:1.5%;
}

.powerup-slot{
position:relative;
width:32%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.powerup-slot img{
width:100%;
height:100%;
object-fit:contain;
display:block;
pointer-events:none;
}

#game.powerup-paused *{
animation-play-state:paused!important;
}

/* ==================================================
   WAVE DISPLAY
================================================== */

#wave-display{
position:absolute;
top:52px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:18px;
font-weight:900;
text-shadow:2px 2px 4px #000;
z-index:100;
pointer-events:none;
white-space:nowrap;
}

#wave-message{
position:absolute;
left:50%;
top:45%;
transform:translate(-50%,-50%);
padding:14px 25px;
border-radius:15px;
background:rgba(0,0,0,.72);
color:white;
font-size:25px;
font-weight:900;
text-align:center;
text-shadow:2px 2px 3px #000;
z-index:400;
display:none;
pointer-events:none;
}

@media(max-width:500px){

.customer,
#cook,
#waitress{
width:65px;
height:88px;
}

.pasta{
width:60px;
height:60px;
}

.drink{
width:60px;
height:60px;
}

#exp-bar{
height:27px;
left:2.5%;
width:95%;

#exp-level{
font-size:13px;
}

#powerup-panel{
width:98%;
height:78%;
}

#powerup-options{
gap:0;
}

.powerup-slot{
width:33.33%;
}

#wave-display{
font-size:15px;
top:50px;
}

#wave-message{
font-size:21px;
}

}
</style>
</head>

<script>

/* ==================================================
   REGOLAZIONE HITBOX
================================================== */

const HIT_X=5;
const HIT_Y=0;
const HIT_POSITION_Y=.45;


/* ==================================================
   POSIZIONE MANO CAMERIERA
================================================== */

const WAITRESS_HAND_X=.70;
const WAITRESS_HAND_Y=.30;


/* ==================================================
   SISTEMA 20 WAVE
================================================== */

/*
   Difficoltà aumentata progressivamente.

   customers       = numero clienti
   spawnInterval   = intervallo tra clienti
   walkTime        = tempo di percorrenza
   hp              = vita dei clienti
*/

const WAVES=[

{customers:5,  spawnInterval:3800, walkTime:70, hp:30},
{customers:6,  spawnInterval:3600, walkTime:68, hp:32},
{customers:6,  spawnInterval:3400, walkTime:66, hp:34},
{customers:7,  spawnInterval:3200, walkTime:64, hp:36},
{customers:7,  spawnInterval:3000, walkTime:62, hp:38},

{customers:8,  spawnInterval:2850, walkTime:60, hp:40},
{customers:8,  spawnInterval:2700, walkTime:58, hp:42},
{customers:9,  spawnInterval:2550, walkTime:56, hp:44},
{customers:9,  spawnInterval:2400, walkTime:54, hp:46},
{customers:10, spawnInterval:2250, walkTime:52, hp:48},

{customers:10, spawnInterval:2150, walkTime:50, hp:50},
{customers:11, spawnInterval:2050, walkTime:48, hp:52},
{customers:11, spawnInterval:1950, walkTime:46, hp:54},
{customers:12, spawnInterval:1850, walkTime:44, hp:56},
{customers:12, spawnInterval:1750, walkTime:42, hp:58},

{customers:13, spawnInterval:1650, walkTime:40, hp:60},
{customers:13, spawnInterval:1550, walkTime:38, hp:62},
{customers:14, spawnInterval:1450, walkTime:36, hp:64},
{customers:15, spawnInterval:1350, walkTime:34, hp:66},
{customers:16, spawnInterval:1250, walkTime:32, hp:70}

];

const TOTAL_WAVES=WAVES.length;

let currentWave=1;
let waveSpawned=0;
let waveFinished=false;
let waveTimer=null;
let waveCheckTimer=null;
let waveStarting=false;


/* ==================================================
   CORSIE
================================================== */

const LANES=[
29,
36.4,
43.8,
51.2,
58.6
];


/* ==================================================
   DISTANZA MINIMA CLIENTI STESSA CORSIA
================================================== */

const SAME_LANE_MIN_DELAY=1500;


/* ==================================================
   SISTEMA EXP
================================================== */

let currentLevel=1;
let currentEXP=0;

const EXP_PER_CUSTOMER=5;

const EXP_REQUIREMENTS=[
15,
20,
25,
30,
35,
40,
45,
50,
55,
60,
65
];

const MAX_LEVEL=12;


/* ==================================================
   POWER UP
================================================== */

let powerUps={
pasta:0,
speed:0,
sauce:0,
waitress:false
};

/*
   Bonus velocità specifico della PASTA.

   Pasta:
   LV0 = nessun bonus
   LV1 = nessun bonus
   LV2 = +15%
   LV3 = nessun ulteriore bonus

   Il bonus viene applicato alla velocità
   di lancio della pasta.
*/

let pastaSpeedBonus=0;

let powerUpPaused=false;


/* ==================================================
   PANNELLI POWER UP
================================================== */

const POWER_UP_PANELS={

pasta:[

"https://i.ibb.co/fVytY9Q0/file-00000000e20481fa9b76f5fa0d30ba53-removebg-preview-removebg-preview-800x1500.png",

"https://i.ibb.co/4gT30T9h/file-00000000eae481f684cfd2789751d01c-removebg-preview-800x1500.png",

"https://i.ibb.co/cXr3fFDL/file-00000000a260821187b48b306fc2fe79-removebg-preview-800x1500.png"

],

speed:[

"https://i.ibb.co/RGdJT5fx/file-00000000516481fab57f2c7137dbb936-removebg-preview-800x1500.png",

"https://i.ibb.co/RTXHXDcB/file-000000005a8481f693949f689bf265db-removebg-preview-800x1500.png",

"https://i.ibb.co/fbLrtF6/file-000000008db88211b40fe2988f4f3623-removebg-preview-800x1500.png"

],

sauce:[

"https://i.ibb.co/LXMPB4c7/file-000000005b408211a76255b46c29a71a-removebg-preview-800x1500.png",

"https://i.ibb.co/840LBt1Y/file-00000000a9008230bbc9b469a34b2107-removebg-preview-800x1500.png",

"https://i.ibb.co/gb4wX305/file-00000000925082308307cb91361e8001-removebg-preview-800x1500.png"

],

waitress:
"https://i.ibb.co/dRbXm7z/file-000000006b8881f590068e56e39361f6-800x1500-removebg-preview.png"

};


/* ==================================================
   VERIFICA POWER UP DISPONIBILI
================================================== */

function getAvailablePowerUps(){

let available=[];


/*
   Pasta
*/

if(powerUps.pasta<3){

available.push({
type:"pasta",
level:powerUps.pasta+1
});

}


/*
   Velocità
*/

if(powerUps.speed<3){

available.push({
type:"speed",
level:powerUps.speed+1
});

}


/*
   Salsa
*/

if(powerUps.sauce<3){

available.push({
type:"sauce",
level:powerUps.sauce+1
});

}


/*
   Cameriera
*/

if(!powerUps.waitress){

available.push({
type:"waitress",
level:1
});

}


return available;

}


/* ==================================================
   MOSTRA POWER UP
================================================== */

function showPowerUpScreen(){

/*
   IMPORTANTE:

   Se tutti i power-up sono già stati presi,
   NON blocchiamo il gioco.
*/

if(powerUpPaused)return;


const available=
getAvailablePowerUps();


if(available.length===0){

/*
   Nessuna scelta disponibile.
   Il livello è già stato aumentato,
   quindi continuiamo normalmente.
*/

document
.getElementById("powerup-overlay")
.style.display="none";

document
.getElementById("game")
.classList.remove("powerup-paused");

powerUpPaused=false;

return;

}


const options=
document.getElementById("powerup-options");

options.innerHTML="";


/*
   Mischia
*/

for(let i=available.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[available[i],available[j]]=
[available[j],available[i]];

}


/*
   Massimo 3 scelte
*/

const selected=
available.slice(0,3);


selected.forEach(function(powerUp){

const slot=
document.createElement("div");

slot.className="powerup-slot";

slot.dataset.type=
powerUp.type;

slot.dataset.level=
powerUp.level;


const image=
document.createElement("img");


if(powerUp.type==="waitress"){

image.src=
POWER_UP_PANELS.waitress;

}else{

image.src=
POWER_UP_PANELS[
powerUp.type
][powerUp.level-1];

}


image.alt="";

slot.appendChild(image);


slot.addEventListener(
"click",
function(){

selectPowerUp(powerUp.type);

});


options.appendChild(slot);

});


powerUpPaused=true;


document
.getElementById("game")
.classList.add("powerup-paused");


document
.getElementById("powerup-overlay")
.style.display="flex";

}


/* ==================================================
   SCELTA POWER UP
================================================== */

function selectPowerUp(type){

if(!powerUpPaused)return;


if(type==="waitress"){

if(powerUps.waitress)return;

powerUps.waitress=true;

summonWaitress();

}else{


if(powerUps[type]>=3)return;


powerUps[type]++;


/*
   PASTA LV2
   +15% velocità
*/

if(
type==="pasta" &&
powerUps.pasta===2
){

pastaSpeedBonus=.15;

}

}


document
.getElementById("powerup-overlay")
.style.display="none";


document
.getElementById("powerup-options")
.innerHTML="";


powerUpPaused=false;


document
.getElementById("game")
.classList.remove("powerup-paused");


updateEXPBar();

}


/* ==================================================
   EVOCA CAMERIERA
================================================== */

function summonWaitress(){

const waitress=
document.getElementById("waitress");

waitress.style.display="block";

setWaitressFrame(0);

startWaitressAnimation();

}


/* ==================================================
   ANIMAZIONE CAMERIERA
================================================== */

let waitressTimer=null;

function startWaitressAnimation(){

if(waitressTimer!==null){

clearInterval(waitressTimer);

}

setWaitressFrame(0);

}


/* ==================================================
   FRAME CAMERIERA
================================================== */

function setWaitressFrame(frameNumber){

const frames=
document
.getElementById("waitress")
.querySelectorAll("img");


frames.forEach(function(frame){

frame.classList.remove("active");

});


if(frames[frameNumber]){

frames[frameNumber].classList.add("active");

}

}


/* ==================================================
   BARRA EXP
================================================== */

function updateEXPBar(){

const fill=
document.getElementById("exp-fill");

const levelText=
document.getElementById("exp-level");


if(currentLevel>=MAX_LEVEL){

currentLevel=MAX_LEVEL;
currentEXP=0;

fill.style.width="100%";

levelText.textContent="LV MAX";

return;

}


const requiredEXP=
EXP_REQUIREMENTS[currentLevel-1];


const percentage=
Math.min(
100,
(currentEXP/requiredEXP)*100
);


fill.style.width=
percentage+"%";


levelText.textContent=
"LV "+currentLevel;

}


/* ==================================================
   AGGIUNGI EXP
================================================== */

function addEXP(amount){

if(currentLevel>=MAX_LEVEL)return;


currentEXP+=amount;


let levelUp=false;


while(
currentLevel<MAX_LEVEL &&
currentEXP>=EXP_REQUIREMENTS[currentLevel-1]
){

currentEXP-=
EXP_REQUIREMENTS[currentLevel-1];

currentLevel++;

levelUp=true;

}


updateEXPBar();


/*
   Mostriamo una sola schermata
   per il/i livello/i raggiunto/i.

   Se non esistono più power-up,
   showPowerUpScreen() non bloccherà il gioco.
*/

if(levelUp){

showPowerUpScreen();

}

}


/* ==================================================
   VARIABILI
================================================== */

let customerTimer=null;
let cookTimer=null;
let waitressAttackTimer=null;
let firstAttackTimer=null;
let kitchenDamageTimer=null;
let zIndexTimer=null;

let kitchenEnergy=100;

let customers=[];


/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener("click",function(){

document
.getElementById("menu")
.style.display="none";

document
.getElementById("game")
.style.display="block";


resetGame();


startWave(1);

startCustomerAnimation();
startCookAnimation();
startWaitressAttack();
startKitchenEnergySystem();
startFirstAttackDetection();
startZIndexSystem();

});


/* ==================================================
   RESET GAME
================================================== */

function resetGame(){

clearAllTimers();


customers=[];


currentWave=1;
waveSpawned=0;
waveFinished=false;
waveStarting=false;


kitchenEnergy=100;


currentLevel=1;
currentEXP=0;


powerUps.pasta=0;
powerUps.speed=0;
powerUps.sauce=0;
powerUps.waitress=false;


pastaSpeedBonus=0;


powerUpPaused=false;


document
.getElementById("waitress")

/* ==================================================
   INIZIO WAVE
================================================== */

function startWave(waveNumber){

if(waveNumber>TOTAL_WAVES){

finishLevel();

return;

}


currentWave=waveNumber;
waveSpawned=0;
waveFinished=false;
waveStarting=true;


updateWaveDisplay();


showWaveMessage(
"WAVE "+currentWave
);


setTimeout(function(){

hideWaveMessage();

waveStarting=false;

spawnWaveCustomers();

},1200);

}


/* ==================================================
   MOSTRA WAVE
================================================== */

function showWaveMessage(text){

const message=
document.getElementById("wave-message");

message.textContent=text;
message.style.display="block";

}


/* ==================================================
   NASCONDI WAVE
================================================== */

function hideWaveMessage(){

const message=
document.getElementById("wave-message");

message.style.display="none";

}


/* ==================================================
   TESTO WAVE
================================================== */

function updateWaveDisplay(){

document
.getElementById("wave-display")
.textContent=
"WAVE "+currentWave+" / "+TOTAL_WAVES;

}


/* ==================================================
   CREA CLIENTI DELLA WAVE
================================================== */

function spawnWaveCustomers(){

const config=
WAVES[currentWave-1];

if(!config)return;


const lastLaneSpawn=[];

for(let i=0;i<LANES.length;i++){

lastLaneSpawn[i]=-Infinity;

}


for(let i=0;i<config.customers;i++){

const delay=
i*config.spawnInterval;


waveTimer=
setTimeout(function(){

if(powerUpPaused){

waitForPowerUpThenSpawn(
i,
lastLaneSpawn,
config
);

}else{

spawnWaveCustomer(
i,
lastLaneSpawn,
config
);

}

},delay);

}

}


/* ==================================================
   ATTESA POWER UP PRIMA DELLO SPAWN
================================================== */

function waitForPowerUpThenSpawn(
index,
lastLaneSpawn,
config
){

if(powerUpPaused){

setTimeout(function(){

waitForPowerUpThenSpawn(
index,
lastLaneSpawn,
config
);

},250);

return;

}


spawnWaveCustomer(
index,
lastLaneSpawn,
config
);

}


/* ==================================================
   SPAWN SINGOLO CLIENTE DELLA WAVE
================================================== */

function spawnWaveCustomer(
index,
lastLaneSpawn,
config
){

if(waveSpawned>=config.customers)return;


let laneIndex;

let attempts=0;

const currentTime=
performance.now();


do{

laneIndex=
Math.floor(
Math.random()*LANES.length
);

attempts++;

}while(

attempts<50 &&

currentTime-lastLaneSpawn[laneIndex]
<
SAME_LANE_MIN_DELAY

);


lastLaneSpawn[laneIndex]=currentTime;


spawnCustomer(
waveSpawned,
laneIndex,
config.walkTime,
config.hp
);


waveSpawned++;


if(waveSpawned>=config.customers){

scheduleWaveCheck();

}

}


/* ==================================================
   CONTROLLO FINE WAVE
================================================== */

function scheduleWaveCheck(){

if(waveCheckTimer!==null){

clearInterval(waveCheckTimer);

}


waveCheckTimer=
setInterval(function(){

if(powerUpPaused)return;

if(waveFinished)return;


const activeWaveCustomers=
customers.filter(function(customer){

return(
customer &&
customer.dataset.wave==
currentWave &&
customer.style.display!=="none"
);

});


if(
waveSpawned>=
WAVES[currentWave-1].customers
&&
activeWaveCustomers.length===0
){

clearInterval(waveCheckTimer);

waveCheckTimer=null;

completeWave();

}

},500);

}


/* ==================================================
   COMPLETA WAVE
================================================== */

function completeWave(){

if(waveFinished)return;

waveFinished=true;


if(currentWave>=TOTAL_WAVES){

finishLevel();

return;

}


/*
   NESSUNA PAUSA TRA LE WAVE.

   La wave successiva parte immediatamente.
*/

startWave(currentWave+1);

}


/* ==================================================
   FINE LIVELLO
================================================== */

function finishLevel(){

showWaveMessage(
"LIVELLO COMPLETATO!"
);

}


/* ==================================================
   CREA CLIENTE
================================================== */

function spawnCustomer(
index,
forcedLaneIndex=null,
walkTime=null,
waveHP=null
){

const game=
document.getElementById("game");


const type=
Math.random()<.5
?1
:2;


const template=
document.getElementById(
type===1
?"customer1Template"
:"customer2Template"
);


const customer=
template.cloneNode(true);


customer.id=
"customer-"+Date.now()+"-"+index;


customer.classList.remove(
"customer-template"
);

customer.classList.add(
"spawned-customer"
);


customer.style.display="block";
customer.style.animation="none";
customer.classList.remove("satisfied");
customer.style.top="5%";


let laneIndex;


if(
forcedLaneIndex!==null &&
forcedLaneIndex!==undefined
){

laneIndex=forcedLaneIndex;

}else{

laneIndex=
Math.floor(
Math.random()*LANES.length
);

}


customer.dataset.lane=
laneIndex;


customer.style.left=
LANES[laneIndex]+"%";


customer.dataset.type=type;


/*
   HP determinati dalla wave.
*/

customer.dataset.hp=
String(
waveHP || 30
);


customer.dataset.satisfied="false";

customer.dataset.atKitchen="false";

customer.dataset.frame="0";

customer.dataset.wave=
currentWave;


const frames=
customer.querySelectorAll(".frame");


frames.forEach(function(frame){

frame.classList.remove("active");

});


if(frames.length>0){

frames[0].classList.add("active");

}


const happyFrame=
customer.querySelector(".happy-frame");

happyFrame.style.display="none";


game.appendChild(customer);

customers.push(customer);


const actualWalkTime=
walkTime || 60;


requestAnimationFrame(function(){

customer.style.animation=
"walkDown "+actualWalkTime+"s linear forwards";

customer.classList.add("walking");

});


setTimeout(function(){

if(
customer &&
customer.dataset.satisfied!=="true"
){

customer.dataset.atKitchen="true";

updateZIndexes();

}

},actualWalkTime*1000);

}

function customerIsVisible(customer){

if(
!customer ||
customer.style.display==="none"
)return false;


const rect=
customer.getBoundingClientRect();

const game=
document.getElementById("game");

const gameRect=
game.getBoundingClientRect();

rect.top<gameRect.bottom

);

function updateZIndexes(){

const activeCustomers=
customers.filter(function(customer){

return(
customer &&
customer.style.display!=="none"
);

});


activeCustomers.sort(function(a,b){

const aTop=
a.getBoundingClientRect().top;

const bTop=
b.getBoundingClientRect().top;

return aTop-bTop;

});


activeCustomers.forEach(function(customer,index){

10+index;

/* ==================================================

================================================== */

function getAttackTargets(){

const activeCustomers=
customers.filter(function(customer){

if(!customer)return false;

if(
customer.style.display==="none"
)return false;

if(
customer.dataset.satisfied==="true"
)return false;

return customerIsVisible(customer);

});


activeCustomers.sort(function(a,b){

return(
b.getBoundingClientRect().top-
a.getBoundingClientRect().top
);

});


/*
   NUMERO PASTE:

   LV0 = 1
   LV1 = 2
   LV2 = 2
   LV3 = 3
*/

let numberOfPasta=1;


if(powerUps.pasta===1){

numberOfPasta=2;

}else if(powerUps.pasta===2){

numberOfPasta=2;

}else if(powerUps.pasta>=3){

numberOfPasta=3;

}


return activeCustomers.slice(
0,
numberOfPasta
);

}

/* ==================================================
   VELOCITÀ CUOCO
================================================== */

function getCookAttackInterval(){

/*
   Il power-up SPEED rimane indipendente.

   Il power-up PASTA LV2 aggiunge inoltre
   +15% velocità.
*/

let speedMultiplier=
1+(powerUps.speed*.33);


/*
   Bonus pasta LV2:
   +15% velocità di attacco.
*/

speedMultiplier*=
(1+pastaSpeedBonus);


return Math.round(
3000/speedMultiplier
);

}

function getWaitressAttackInterval(){

getCookAttackInterval()*.67
);

}


/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer(){

const activeCustomers=
customers.filter(function(customer){

if(!customer)return false;

if(
customer.style.display==="none"
)return false;

if(
customer.dataset.satisfied==="true"
)return false;

return customerIsVisible(customer);

});


if(activeCustomers.length===0)
return null;


let nearest=
activeCustomers[0];


let nearestTop=
nearest.getBoundingClientRect().top;


activeCustomers.forEach(function(customer){

const top=
customer.getBoundingClientRect().top;


if(top>nearestTop){

nearest=customer;
nearestTop=top;

}

});


return nearest;

}


/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(target){

if(!target)return;

if(
target.dataset.satisfied==="true"
)return;


const cook=
document.getElementById("cook");

const game=
document.getElementById("game");


const gameRect=
game.getBoundingClientRect();

const cookRect=
cook.getBoundingClientRect();


const startX=
cookRect.left+
cookRect.width*.72;


const startY=
cookRect.top+
cookRect.height*.32;


const hitMarker=
document.createElement("div");

hitMarker.className="hit-marker";

game.appendChild(hitMarker);


const pasta=
document.createElement("img");

pasta.className="pasta";


pasta.src=
"https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


game.appendChild(pasta);


let currentX=startX;
let currentY=startY;


pasta.style.left=
(currentX-gameRect.left-42)+"px";


pasta.style.top=
(currentY-gameRect.top-42)+"px";


/*
   Velocità del proiettile.

   Anche qui LV2 pasta applica +15%.
*/

const speed=
350*
(1+powerUps.speed*.33)*
(1+pastaSpeedBonus);


let lastTime=
performance.now();


function movePasta(currentTime){

if(
!target ||
target.dataset.satisfied==="true"
){

if(pasta.parentNode)
pasta.remove();

if(hitMarker.parentNode)
hitMarker.remove();

return;

}


if(powerUpPaused){

lastTime=currentTime;

requestAnimationFrame(movePasta);

return;

}


const targetRect=
target.getBoundingClientRect();


const endX=
targetRect.left+
targetRect.width/2+
HIT_X;


const endY=
targetRect.top+
targetRect.height*HIT_POSITION_Y+
HIT_Y;


hitMarker.style.left=
(endX-gameRect.left)+"px";


hitMarker.style.top=
(endY-gameRect.top)+"px";


const deltaTime=
Math.min(
(currentTime-lastTime)/1000,
.05
);


lastTime=currentTime;


const dx=endX-currentX;
const dy=endY-currentY;


const distance=
Math.sqrt(
dx*dx+
dy*dy
);


const movement=
speed*deltaTime;


if(distance<=movement){

currentX=endX;
currentY=endY;

}else{

currentX+=
(dx/distance)*movement;

currentY+=
(dy/distance)*movement;

}


pasta.style.left=
(currentX-gameRect.left-42)+"px";


pasta.style.top=
(currentY-gameRect.top-42)+"px";


const remainingX=
endX-currentX;

const remainingY=
endY-currentY;


const remainingDistance=
Math.sqrt(
remainingX*remainingX+
remainingY*remainingY
);


if(remainingDistance<=3){

hitCustomer(
target,
pasta
);


if(hitMarker.parentNode)
hitMarker.remove();

return;

}


requestAnimationFrame(movePasta);

}


requestAnimationFrame(movePasta);

}

!customer ||
customer.dataset.satisfied==="true"
)return;


const rect=
customer.getBoundingClientRect();


const game=
document.getElementById("game");

const gameRect=
game.getBoundingClientRect();


const currentTop=
rect.top-gameRect.top;

rect.left-gameRect.left;

customer.classList.add("satisfied");

currentTop+"px";

currentLeft+"px";

customer.dataset.atKitchen="false";

customer.querySelectorAll(".frame");


normalFrames.forEach(function(frame){

});

customer.querySelector(".happy-frame");


happyFrame.style.display="block";


updateZIndexes();

customer.style.display="none";

happyFrame.style.display="none";

customer.classList.remove("satisfied");


updateZIndexes();

},1000);

}
