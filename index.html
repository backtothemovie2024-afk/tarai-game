<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>


<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================
   HOME
========================= */

#menu {

    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


#menu h1 {

    margin: 0 0 40px;

    color: #ffd447;

    font-size: 55px;

    font-weight: 900;
}


#playButton {

    width: 240px;
    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   GIOCO
========================= */

#game {

    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    background: white;

    overflow: hidden;
}


/* =========================
   HUD
========================= */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;
    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* =========================
   CLIENTE
========================= */

#customer {

    position: absolute;

    width: 150px;
    height: 200px;

    left: 50%;

    top: -220px;

    transform: translateX(-50%);

    z-index: 10;

    animation: walkDown 5s linear forwards;
}


/* =========================
   I 4 FRAME
========================= */

.frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 150px;
    height: 200px;

    object-fit: contain;

    display: none;
}


/* PRIMO FRAME VISIBILE */

.frame1 {

    display: block;
}


/* =========================
   MOVIMENTO CLIENTE
========================= */

@keyframes walkDown {

    from {

        top: -220px;

    }

    to {

        top: 55vh;

    }

}

</style>

</head>


<body>


<!-- =========================
     HOME
========================= -->

<div id="menu">

    <h1>
        TARAI RUSH
    </h1>


    <button id="playButton">

        PLAY

    </button>

</div>



<!-- =========================
     LIVELLO 1
========================= -->

<div id="game">


    <div id="hud">

        <span>
            ❤️ 3
        </span>


        <span>
            ⭐ 0
        </span>

    </div>



    <!-- CLIENTE -->

    <div id="customer">


        <!-- FRAME 1 -->

        <img
            class="frame frame1"
            src="https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg"
            alt="Cliente frame 1">


        <!-- FRAME 2 -->

        <img
            class="frame frame2"
            src="https://i.ibb.co/zV65ZTPs/Screenshot-20260829-161529-Grok-4.jpg"
            alt="Cliente frame 2">


        <!-- FRAME 3 -->

        <img
            class="frame frame3"
            src="https://i.ibb.co/YxRzGxP/Screenshot-20260829-161529-Grok-3.jpg"
            alt="Cliente frame 3">


        <!-- FRAME 4 -->

        <img
            class="frame frame4"
            src="https://i.ibb.co/zV65ZTPs/Screenshot-20260829-161529-Grok-4.jpg"
            alt="Cliente frame 4">


    </div>


</div>



<script>

/* =========================
   VARIABILI
========================= */

let currentFrame = 1;

let walkAnimation;


/* =========================
   PLAY
========================= */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        /* NASCONDE HOME */

        document
            .getElementById("menu")
            .style.display = "none";


        /* MOSTRA GIOCO */

        document
            .getElementById("game")
            .style.display = "block";


        /* CLIENTE */

        const customer =
            document.getElementById("customer");


        /* RIAVVIA MOVIMENTO */

        customer.style.animation = "none";


        void customer.offsetWidth;


        customer.style.animation =
            "walkDown 5s linear forwards";


        /* AVVIA CAMMINATA */

        startWalking();


    });


/* =========================
   ANIMAZIONE 4 FRAME
========================= */

function startWalking() {


    /* FERMA EVENTUALE ANIMAZIONE PRECEDENTE */

    if (walkAnimation) {

        clearInterval(walkAnimation);

    }


    currentFrame = 1;


    walkAnimation = setInterval(function() {


        /* NASCONDE TUTTI I FRAME */

        document
            .querySelectorAll(".frame")
            .forEach(function(frame) {

                frame.style.display = "none";

            });


        /* PASSA AL FRAME SUCCESSIVO */

        currentFrame++;


        if (currentFrame > 4) {

            currentFrame = 1;

        }


        /* MOSTRA IL FRAME CORRETTO */

        document
            .querySelector(".frame" + currentFrame)
            .style.display = "block";


    }, 150
                              );

}

</script>


</body>

</html>
