<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================
   MENU
========================= */

#menu {

    width: 100vw;
    height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: #1b1b2f;
}


.logo h1 {

    margin: 0;

    color: #ffd447;

    font-size: 60px;

    text-shadow:
        4px 4px 0 #63240d;
}

.logo h2 {

    margin: 0 0 50px;

    color: white;

    font-size: 35px;

    letter-spacing: 8px;
}


.menu-button {

    width: 240px;

    height: 65px;

    margin: 10px;

    border: none;

    border-radius: 16px;

    background: #ef6428;

    color: white;

    font-size: 26px;

    font-weight: bold;

    box-shadow:
        0 7px 0 #8d2e0e;
}


/* =========================
   LIVELLO
========================= */

#game {

    display: none;

    position: relative;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: white;
}


/* =========================
   HUD
========================= */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: #222;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* =========================
   CLIENTE
========================= */

#customer {

    position: absolute;

    left: 50%;

    top: -160px;

    transform: translateX(-50%);

    width: 120px;

    height: 160px;

    overflow: hidden;

    z-index: 10;
}


/* SPRITE SHEET */

#customerSprite {

    position: absolute;

    left: 0;

    top: 0;

    width: 400%;

    height: 100%;

    max-width: none;
}


/* =========================
   ANIMAZIONE
========================= */

@keyframes walk {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-75%);
    }

}


@keyframes moveCustomer {

    from {
        top: -160px;
    }

    to {
        top: 55vh;
    }

}

</style>

</head>


<body>


<!-- =========================
     HOME
========================= -->

<div id="menu">

    <div class="logo">

        <h1>TARAI</h1>

        <h2>RUSH</h2>

    </div>

    <button
        class="menu-button"
        onclick="startGame()">

        PLAY

    </button>

</div>



<!-- =========================
     LIVELLO 1
========================= -->

<div id="game">


    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>


    <!-- CLIENTE -->

    <div id="customer">

        <img
            id="customerSprite"
            src="https://i.ibb.co/39yMsFWJ/1787786320198-3.jpg"
            alt="Cliente">

    </div>


</div>



<script>

function startGame() {

    document.getElementById("menu").style.display = "none";

    document.getElementById("game").style.display = "block";

    startCustomer();

}


function startCustomer() {

    const customer =
        document.getElementById("customer");

    const sprite =
        document.getElementById("customerSprite");


    sprite.style.animation =
        "walk 0.8s steps(4) infinite";


    customer.style.animation =
        "moveCustomer 5s linear forwards";

}

</script>


</body>

</html>
