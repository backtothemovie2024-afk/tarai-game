<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>


<style>

/* =====================
   BASE
===================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* =====================
   SCHERMATA SMARTPHONE
===================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* =====================
   HOME
===================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 50;
}


/* =====================
   COPERTINA
===================== */

#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    opacity: 0;

    z-index: 10;

    animation:
        suddenAppear
        0s
        linear
        1s
        forwards;
}


/* =====================
   APPARIZIONE IMPROVVISA
===================== */

@keyframes suddenAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =====================
   PLAY
===================== */

#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    opacity: 0;

    z-index: 30;

    animation:
        playIntro
        0.6s
        ease-out
        1.5s
        forwards;
}


@keyframes playIntro {

    from {

        opacity: 0;

        transform: translateY(30px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


/* =====================
   GIOCO
===================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;
}


/* =====================
   BACKGROUND LIVELLO
===================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* =====================
   HUD
===================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* =====================
   CLIENTE
===================== */

#customer {

    position: absolute;

    width: 150px;

    height: 200px;

    left: 50%;

    top: -220px;

    transform: translateX(-50%);

    z-index: 10;

    animation:
        walkDown
        5s
        linear
        forwards;
}


/* =====================
   FRAME CLIENTE
===================== */

.frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 150px;

    height: 200px;

    object-fit: contain;

    display: none;
}


.frame1 {

    display: block;
}


/* =====================
   MOVIMENTO CLIENTE
===================== */

@keyframes walkDown {

    from {

        top: -220px;

    }

    to {

        top: 55%;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- =====================
     HOME
===================== -->

<div id="menu">


    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt="Tarai Rush">


    <button id="playButton">

        PLAY

    </button>


</div>



<!-- =====================
     GIOCO
===================== -->

<div id="game">


    <img
        id="background"
        src="https://i.ibb.co/fzKdg9TY/1787950008908.png"
        alt="Background">


    <div id="hud">

        <span>
            ❤️ 3
        </span>

        <span>
            ⭐ 0
        </span>

    </div>



    <!-- CLIENTE -->

    <div id="customer">


        <!-- GAMBA SINISTRA -->

        <img
            class="frame frame1"
            src="https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg"
            alt="Gamba sinistra">


        <!-- GAMBA DESTRA -->

        <img
            class="frame frame2"
            src="https://i.ibb.co/YxRzGxP/Screenshot-20260829-161529-Grok-3.jpg"
            alt="Gamba destra">


    </div>


</div>


</div>



<script>

/* =====================
   CAMMINATA
===================== */

let currentFrame = 1;

let walkAnimation;


/* =====================
   PLAY
===================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        document
            .getElementById("menu")
            .style.display = "none";


        document
            .getElementById("game")
            .style.display = "block";


        const customer =
            document.getElementById("customer");


        customer.style.animation = "none";

        void customer.offsetWidth;

        customer.style.animation =
            "walkDown 5s linear forwards";


        startWalking();

    });



/* =====================
   ANIMAZIONE GAMBE
===================== */

function startWalking() {


    if (walkAnimation) {

        clearInterval(walkAnimation);

    }


    currentFrame = 1;


    walkAnimation = setInterval(function() {


        document
            .querySelectorAll(".frame")
            .forEach(function(frame) {

                frame.style.display = "none";

            });


        if (currentFrame === 1) {

            currentFrame = 2;

        } else {

            currentFrame = 1;

        }


        document
            .querySelector(".frame" + currentFrame)
            .style.display = "block";


    }, 300);

}

</script>


</body>

</html>
