<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

/* =====================
   BASE
===================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* =====================
   AREA SMARTPHONE
===================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* =====================
   HOME
===================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 50;
}


/* =====================
   COPERTINA
===================== */

#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    opacity: 0;

    z-index: 10;

    animation:
        suddenAppear
        0s
        linear
        1s
        forwards;
}


@keyframes suddenAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =====================
   PLAY
===================== */

#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    opacity: 0;

    z-index: 30;

    animation:
        playIntro
        0.6s
        ease-out
        1.5s
        forwards;
}


@keyframes playIntro {

    from {

        opacity: 0;

        transform: translateY(30px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


/* =====================
   GIOCO
===================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;
}


/* =====================
   BACKGROUND
===================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* =====================
   HUD
===================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* ==================================================
   CLIENTI
================================================== */


/* =====================
   CLIENTE GENERALE
===================== */

.customer {

    position: absolute;

    width: 84.4px;

    height: 112.5px;

    top: -130px;

    z-index: 10;

    animation:
        walkDown
        5s
        linear
        forwards;
}


/* =====================
   CLIENTE 1
===================== */

#customer1 {

    left: 35%;

}


/* =====================
   CLIENTE 2
===================== */

#customer2 {

    left: 65%;

}


/* =====================
   FRAME
===================== */

.frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 84.4px;

    height: 112.5px;

    object-fit: contain;

    display: none;
}


/* =====================
   FRAME VISIBILE
===================== */

.frame.active {

    display: block;

}


/* =====================
   FRAME SPECCHIATO
===================== */

.mirrored {

    transform: scaleX(-1);

}


/* =====================
   MOVIMENTO
===================== */

@keyframes walkDown {

    from {

        top: -130px;

    }

    to {

        top: 55%;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- ==================================================
     HOME
================================================== -->

<div id="menu">


    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt="Tarai Rush">


    <button id="playButton">

        PLAY

    </button>


</div>



<!-- ==================================================
     GIOCO
================================================== -->

<div id="game">


    <!-- BACKGROUND -->

    <img
        id="background"
        src="https://i.ibb.co/fzKdg9TY/1787950008908.png"
        alt="Background">


    <!-- HUD -->

    <div id="hud">

        <span>
            ❤️ 3
        </span>

        <span>
            ⭐ 0
        </span>

    </div>



    <!-- ==================================================
         CLIENTE 1
    ================================================== -->

    <div
        id="customer1"
        class="customer">


        <!-- GAMBA SINISTRA -->

        <img
            class="frame active"
            src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
            alt="Cliente 1 sinistra">


        <!-- GAMBA DESTRA -->

        <img
            class="frame"
            src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
            alt="Cliente 1 destra">


    </div>



    <!-- ==================================================
         CLIENTE 2
    ================================================== -->

    <div
        id="customer2"
        class="customer">


        <!-- GAMBA SINISTRA -->

        <img
            class="frame active"
            src="https://i.ibb.co/23VxFJw7/Screenshot-20260829-175521-Grok-removebg-preview.png"
            alt="Cliente 2 sinistra">


        <!-- GAMBA DESTRA SPECCHIATA -->

        <img
            class="frame mirrored"
            src="https://i.ibb.co/23VxFJw7/Screenshot-20260829-175521-Grok-removebg-preview.png"
            alt="Cliente 2 destra">


    </div>


</div>


</div>



<script>

/* ==================================================
   ANIMAZIONE
================================================== */


/* =====================
   CLIENTE 1
===================== */

let frame1 = 0;


/* =====================
   CLIENTE 2
===================== */

let frame2 = 0;


/* =====================
   TIMER
===================== */

let animationTimer;



/* ==================================================
   PLAY
================================================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        /* NASCONDE HOME */

        document
            .getElementById("menu")
            .style.display = "none";


        /* MOSTRA GIOCO */

        document
            .getElementById("game")
            .style.display = "block";


        /* RIAVVIA CLIENTI */

        const customers =
            document.querySelectorAll(".customer");


        customers.forEach(function(customer) {

            customer.style.animation = "none";

            void customer.offsetWidth;

            customer.style.animation =
                "walkDown 5s linear forwards";

        });


        startWalking();

    });



/* ==================================================
   CAMMINATA
================================================== */

function startWalking() {


    if (animationTimer) {

        clearInterval(animationTimer);

    }


    frame1 = 0;

    frame2 = 0;


    animationTimer = setInterval(function() {


        /* =====================
           CLIENTE 1
        ===================== */

        const customer1Frames =
            document
                .getElementById("customer1")
                .querySelectorAll(".frame");


        customer1Frames.forEach(function(frame) {

            frame.classList.remove("active");

        });


        customer1Frames[frame1]
            .classList.add("active");


        frame1++;

        if (frame1 >= 2) {

            frame1 = 0;

        }



        /* =====================
           CLIENTE 2
        ===================== */

        const customer2Frames =
            document
                .getElementById("customer2")
                .querySelectorAll(".frame");


        customer2Frames.forEach(function(frame) {

            frame.classList.remove("active");

        });


        customer2Frames[frame2]
            .classList.add("active");


        frame2++;

        if (frame2 >= 2) {

            frame2 = 0;

        }


    }, 300);

}

</script>


</body>

</html>
