<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* =====================
   AREA SMARTPHONE
===================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* =====================
   HOME
===================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 50;
}


/* =====================
   COPERTINA
===================== */

#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    opacity: 0;

    z-index: 10;

    animation:
        suddenAppear
        0s
        linear
        1s
        forwards;
}


@keyframes suddenAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =====================
   PLAY
===================== */

#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    opacity: 0;

    z-index: 30;

    animation:
        playIntro
        0.6s
        ease-out
        1.5s
        forwards;
}


@keyframes playIntro {

    from {

        opacity: 0;

        transform: translateY(30px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


/* =====================
   GIOCO
===================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;
}


/* =====================
   BACKGROUND
===================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* =====================
   HUD
===================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 84.4px;

    height: 112.5px;

    top: -130px;

    z-index: 10;

    animation:
        walkDown
        5s
        linear
        forwards;
}


/* =====================
   CLIENTE 1
===================== */

#customer1 {

    left: 35%;

}


/* =====================
   CLIENTE 2
===================== */

#customer2 {

    left: 65%;

}


/* =====================
   FRAME
===================== */

.frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 84.4px;

    height: 112.5px;

    object-fit: contain;

    display: none;
}


.frame.active {

    display: block;

}


/* =====================
   MOVIMENTO
===================== */

@keyframes walkDown {

    from {

        top: -130px;

    }

    to {

        top: 55%;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- =====================
     HOME
===================== -->

<div id="menu">


    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt="Tarai Rush">


    <button id="playButton">

        PLAY

    </button>


</div>



<!-- =====================
     GIOCO
===================== -->

<div id="game">


    <img
        id="background"
        src="https://i.ibb.co/fzKdg9TY/1787950008908.png"
        alt="Background">


    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>



    <!-- =====================
         CLIENTE 1
    ===================== -->

    <div
        id="customer1"
        class="customer">


        <img
            id="customer1Frame1"
            class="frame active"
            src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
            alt="Cliente 1">


        <img
            id="customer1Frame2"
            class="frame"
            src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
            alt="Cliente 1">


    </div>



    <!-- =====================
         CLIENTE 2
    ===================== -->

    <div
        id="customer2"
        class="customer">


        <img
            id="customer2Frame1"
            class="frame active"
            src="https://i.ibb.co/23VxFJw7/Screenshot-20260829-175521-Grok-removebg-preview.png"
            alt="Cliente 2">


        <img
            id="customer2Frame2"
            class="frame"
            src="https://i.ibb.co/Kz8H26Yf/Screenshot-20260829-181131-Grok-removebg-preview.png"
            alt="Cliente 2">


    </div>


</div>


</div>



<script>

/* =====================
   VARIABILI
===================== */

let frame1 = 0;

let frame2 = 0;

let animationTimer;


/* =====================
   PLAY
===================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        document
            .getElementById("menu")
            .style.display = "none";


        document
            .getElementById("game")
            .style.display = "block";


        const customer1 =
            document.getElementById("customer1");


        const customer2 =
            document.getElementById("customer2");


        /* RIAVVIA CLIENTE 1 */

        customer1.style.animation = "none";

        void customer1.offsetWidth;

        customer1.style.animation =
            "walkDown 5s linear forwards";


        /* RIAVVIA CLIENTE 2 */

        customer2.style.animation = "none";

        void customer2.offsetWidth;

        customer2.style.animation =
            "walkDown 5s linear forwards";


        startWalking();

    });



/* =====================
   CAMMINATA
===================== */

function startWalking() {


    if (animationTimer) {

        clearInterval(animationTimer);

    }


    frame1 = 0;

    frame2 = 0;


    animationTimer = setInterval(function() {


        /* =====================
           CLIENTE 1
        ===================== */

        const c1 =
            document
                .getElementById("customer1")
                .querySelectorAll(".frame");


        c1.forEach(function(frame) {

            frame.classList.remove("active");

        });


        c1[frame1].classList.add("active");


        frame1++;


        if (frame1 >= 2) {

            frame1 = 0;

        }



        /* =====================
           CLIENTE 2
        ===================== */

        const c2 =
            document
                .getElementById("customer2")
                .querySelectorAll(".frame");


        c2.forEach(function(frame) {

            frame.classList.remove("active");

        });


        c2[frame2].classList.add("active");


        frame2++;


        if (frame2 >= 2) {

            frame2 = 0;

        }


    }, 300);

}

</script>


</body>

</html>
