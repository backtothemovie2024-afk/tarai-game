<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;
}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 10;
}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


#kitchen {

    z-index: 15;

}


#kitchenDamaged {

    z-index: 16;

    display: none;

}


#kitchenDestroyed {

    z-index: 17;

    display: none;

}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -130px;

    z-index: 10;

}


.customer.walking {

    animation:

        walkDown

        60s

        linear

        forwards;

}


.customer.satisfied {

    animation: none !important;

}


/* ==================================================
   SPRITE NORMALI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


.customer .frame.active {

    display: block;

}


/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;

}


/* ==================================================
   CUORICINO
================================================== */

.heart {

    position: absolute;

    left: 50%;

    top: -18px;

    transform:
        translateX(-50%);

    font-size: 24px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;

}


.customer.satisfied .heart {

    display: block;

}


@keyframes heartFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

    100% {

        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);

    }

}


/* ==================================================
   MOVIMENTO CLIENTI
================================================== */

@keyframes walkDown {

    0% {

        top: -130px;

    }

    100% {

        top: 69%;

    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform:
        translateX(-50%);

    z-index: 20;

}


#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


#cook img.active {

    display: block;

}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 25;

    pointer-events: none;

}


/* ==================================================
   PUNTO ROSSO
   INVISIBILE MA FUNZIONANTE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:

        0 0 8px red,

        0 0 15px
        rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

    opacity: 0;

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer,
    #cook {

        width: 65px;

        height: 88px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- ==================================================

<div id="menu">

<div id="game">

        <img

<script>


/* ==================================================
   REGOLAZIONE HITBOX
================================================== */

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;



/* ==================================================
   IMPOSTAZIONI WAVE 1
================================================== */


/*
   NUMERO TOTALE CLIENTI

   MODIFICATO:
   15 → 10
*/

const TOTAL_CUSTOMERS = 10;


/*
   Primo cliente:
   secondo 1
*/

const FIRST_SPAWN_SECOND = 1;


/*
   Ultimo cliente:
   secondo 60
*/

const LAST_SPAWN_SECOND = 60;


/*
   Ogni cliente impiega
   60 secondi dalla comparsa
   ad arrivare alla cucina.
*/

const CUSTOMER_WALK_TIME = 60;


/*
   ==================================================
   5 CORSIE DEL CORRIDOIO CENTRALE
   ==================================================

   Le corsie sono state ristrette
   rispetto alla versione precedente.

   Tutte rimangono comprese
   nella zona centrale tra
   le due file di tavoli.

*/

const LANES = [

    35,
    42.5,
    50,
    57.5,
    65

];



/* ==================================================
   VARIABILI
================================================== */

let customerTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;

let zIndexTimer = null;


let kitchenEnergy = 100;


let customers = [];

let customerCounter = 0;


let customer1AtKitchen = false;

let customer2AtKitchen = false;


let customer1HP = 50;

let customer2HP = 50;


let customer1Satisfied = false;

let customer2Satisfied = false;



/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    function() {


        document
        .getElementById("menu")
        .style.display =
            "none";


        document
        .getElementById("game")
        .style.display =
            "block";


        /* RESET */

        kitchenEnergy = 100;


        customers = [];

        customerCounter = 0;


        customer1AtKitchen = false;

        customer2AtKitchen = false;


        customer1HP = 50;

        customer2HP = 50;


        customer1Satisfied = false;

        customer2Satisfied = false;



        /* ==================================================
           ELIMINIAMO EVENTUALI CLIENTI PRECEDENTI
        ================================================== */

        document
        .querySelectorAll(
            ".spawned-customer"
        )
        .forEach(
            function(customer) {

                customer.remove();

            }
        );



        /* ==================================================
           RESET CUCINA
        ================================================== */

        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


        updateKitchenEnergy();



        /* ==================================================
           GENERAZIONE WAVE 1
        ================================================== */

        createWave1();



        /* ==================================================
           SISTEMI DI GIOCO
        ================================================== */

        startCustomerAnimation();

        startCookAnimation();

        startKitchenEnergySystem();

        startFirstAttackDetection();

        startZIndexSystem();

    }
);



/* ==================================================
   CREA WAVE 1
================================================== */

function createWave1() {


    /*
       Generiamo 10 istanti di spawn.

       Il primo è obbligatoriamente
       al secondo 1.

       L'ultimo è obbligatoriamente
       al secondo 60.

       Gli altri 8 vengono scelti
       casualmente tra 2 e 59.

       In questo modo i clienti
       sono più distanziati rispetto
       alla versione precedente.
    */

    const spawnTimes = [

        FIRST_SPAWN_SECOND

    ];


    while (
        spawnTimes.length <
        TOTAL_CUSTOMERS - 1
    ) {


        const randomSecond =
            Math.floor(
                Math.random() *
                (
                    LAST_SPAWN_SECOND -
                    FIRST_SPAWN_SECOND -
                    1
                )
            ) +
            FIRST_SPAWN_SECOND +
            1;


        if (
            !spawnTimes.includes(
                randomSecond
            )
        ) {

            spawnTimes.push(
                randomSecond
            );

        }

    }


    spawnTimes.push(
        LAST_SPAWN_SECOND
    );


    spawnTimes.sort(
        function(a, b) {

            return a - b;

        }
    );



    /*
       Creiamo i 10 clienti
       nei tempi stabiliti.
    */

    spawnTimes.forEach(
        function(second, index) {


            setTimeout(
                function() {

                    spawnCustomer(
                        index
                    );

                },
                second * 1000
            );

        }
    );

}



/* ==================================================
   CREA SINGOLO CLIENTE
================================================== */

function spawnCustomer(
    index
) {


    const game =
        document
        .getElementById(
            "game"
        );


    /*
       Tipo casuale:
       Cliente 1 oppure Cliente 2.
    */

    const type =
        Math.random() < 0.5
            ? 1
            : 2;


    const template =
        document
        .getElementById(
            type === 1
                ? "customer1Template"
                : "customer2Template"
        );


    const customer =
        template.cloneNode(
            true
        );


    customer.id =
        "customer-" +
        (
            index + 1
        );


    customer.classList
    .remove(
        "customer-template"
    );


    customer.classList
    .add(
        "spawned-customer"
    );


    customer.style.display =
        "block";


    customer.style.animation =
        "none";


    customer.classList
    .remove(
        "satisfied"
    );



    /*
       Partenza sopra lo schermo.
    */

    customer.style.top =
        "-130px";



    /*
       ==================================================
       SCELTA DELLE 5 CORSIE
       ==================================================

       Tutte le corsie sono comprese
       nel corridoio centrale.
    */

    const laneIndex =
        Math.floor(
            Math.random() *
            LANES.length
        );


    customer.dataset.lane =
        laneIndex;


    customer.style.left =
        LANES[laneIndex] +
        "%";



    /*
       Salviamo il tipo.
    */

    customer.dataset.type =
        type;



    /*
       HP indipendente.
    */

    customer.dataset.hp =
        "50";


    customer.dataset.satisfied =
        "false";


    customer.dataset.atKitchen =
        "false";


    customer.dataset.spawned =
        "true";


    customer.dataset.frame =
        "0";



    /*
       Riattiviamo il primo frame normale.
    */

    const frames =
        customer
        .querySelectorAll(
            ".frame"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames.length > 0
    ) {

        frames[0]
        .classList
        .add(
            "active"
        );

    }



    /*
       Sprite felice nascosto.
    */

    const happyFrame =
        customer
        .querySelector(
            ".happy-frame"
        );


    happyFrame.style.display =
        "none";



    /*
       Aggiungiamo il cliente
       al gioco.
    */

    game.appendChild(
        customer
    );


    customers.push(
        customer
    );



    /*
       Facciamo partire
       la camminata.
    */

    requestAnimationFrame(
        function() {


            customer.style.animation =
                "walkDown " +
                CUSTOMER_WALK_TIME +
                "s linear forwards";


            customer.classList
            .add(
                "walking"
            );

        }
    );



    /*
       Dopo 60 secondi dalla comparsa
       il cliente è arrivato alla cucina.
    */

    setTimeout(
        function() {


            if (
                customer.dataset.satisfied !==
                "true"
            ) {


                customer.dataset.atKitchen =
                    "true";


                updateZIndexes();

            }

        },
        CUSTOMER_WALK_TIME * 1000
    );

}



/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {


    if (
        kitchenEnergy > 50
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


    }

    else if (
        kitchenEnergy > 20
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


    }

    else {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "block";

    }

}



/* ==================================================
   ENERGIA
================================================== */

function startKitchenEnergySystem() {


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
    setInterval(
        function() {


            let damage = 0;


            customers.forEach(
                function(customer) {


                    if (
                        customer &&
                        customer.dataset.atKitchen ===
                            "true" &&
                        customer.dataset.satisfied !==
                            "true"
                    ) {

                        damage++;

                    }

                }
            );


            if (
                damage > 0
            ) {


                kitchenEnergy -=
                    damage;


                if (
                    kitchenEnergy < 0
                ) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();

            }


        },
        5000
    );

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer ||
        customer.style.display ===
            "none"
    ) {

        return false;

    }


    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}



/* ==================================================
   Z-INDEX CLIENTI
================================================== */

function startZIndexSystem() {


    if (
        zIndexTimer !== null
    ) {

        clearInterval(
            zIndexTimer
        );

    }


    zIndexTimer =
    setInterval(
        function() {

            updateZIndexes();

        },
        50
    );

}


function updateZIndexes() {


    const activeCustomers =
        customers.filter(
            function(customer) {

                return (

                    customer &&
                    customer.style.display !==
                        "none"

                );

            }
        );


    activeCustomers.forEach(
        function(customer) {


            const rect =
                customer
                .getBoundingClientRect();


            /*
               Più avanti = più in basso
               = z-index maggiore.
            */

            customer.style.zIndex =
                Math.round(
                    rect.top
                ) +
                100;

        }
    );

}



/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {


    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

    }


    firstAttackTimer =
    setInterval(
        function() {


            const target =
                getNearestVisibleCustomer();


            if (
                target
            ) {


                playCookAttack();


                clearInterval(
                    firstAttackTimer
                );

            }


        },
        100
    );

}



/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (
        customerTimer !== null
    ) {

        clearInterval(
            customerTimer
        );

    }


    customerTimer =
    setInterval(
        function() {


            customers.forEach(
                function(customer) {


                    if (
                        !customer ||
                        customer.style.display ===
                            "none" ||
                        customer.dataset.satisfied ===
                            "true"
                    ) {

                        return;

                    }


                    const frames =
                        customer
                        .querySelectorAll(
                            ".frame"
                        );


                    if (
                        frames.length === 0
                    ) {

                        return;

                    }


                    let frame =
                        parseInt(
                            customer.dataset.frame ||
                            "0"
                        );


                    frames.forEach(
                        function(image) {

                            image.classList
                            .remove(
                                "active"
                            );

                        }
                    );


                    frames[frame]
                    .classList
                    .add(
                        "active"
                    );


                    frame++;


                    if (
                        frame >=
                        frames.length
                    ) {

                        frame = 0;

                    }


                    customer.dataset.frame =
                        frame;

                }
            );


        },
        300
    );

}



/* ==================================================
   FRAME CUOCO
================================================== */

function setCookFrame(
    frameNumber
) {


    const frames =
        document
        .getElementById(
            "cook"
        )
        .querySelectorAll(
            "img"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames[frameNumber]
    ) {

        frames[
            frameNumber
        ]
        .classList
        .add(
            "active"
        );

    }

}



/* ==================================================
   ATTACCO
================================================== */

function playCookAttack() {


    const target =
        getNearestVisibleCustomer();


    if (
        target === null
    ) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            setCookFrame(1);

        },
        120
    );


    setTimeout(
        function() {

            setCookFrame(2);

        },
        240
    );


    /*
       FRAME 4 = LANCIO
    */

    setTimeout(
        function() {


            if (
                target.dataset.satisfied !==
                "true"
            ) {


                setCookFrame(3);


                throwPasta(
                    target
                );

            }


        },
        360
    );


    setTimeout(
        function() {

            setCookFrame(4);

        },
        480
    );


    setTimeout(
        function() {

            setCookFrame(0);

        },
        600
    );

}



/* ==================================================
   ATTACCO OGNI 3 SECONDI
================================================== */

function startCookAnimation() {


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

    }


    setCookFrame(0);


    cookTimer =
    setInterval(
        function() {


            const target =
                getNearestVisibleCustomer();


            if (
                target !== null
            ) {

                playCookAttack();

            }

            else {

                setCookFrame(0);

            }


        },
        3000
    );

}



/* ==================================================
   CLIENTE PIÙ VICINO ALLA CUCINA
================================================== */

function getNearestVisibleCustomer() {


    const activeCustomers =
        customers.filter(
            function(customer) {


                if (
                    !customer
                ) {

                    return false;

                }


                if (
                    customer.style.display ===
                    "none"
                ) {

                    return false;

                }


                if (
                    customer.dataset.satisfied ===
                    "true"
                ) {

                    return false;

                }


                return customerIsVisible(
                    customer
                );

            }
        );


    if (
        activeCustomers.length ===
        0
    ) {

        return null;

    }



    /*
       Il cliente con TOP maggiore
       è quello più vicino alla cucina.

       La corsia non viene considerata.
    */

    let nearest =
        activeCustomers[0];


    let nearestTop =
        nearest
        .getBoundingClientRect()
        .top;


    activeCustomers.forEach(
        function(customer) {


            const top =
                customer
                .getBoundingClientRect()
                .top;


            if (
                top >
                nearestTop
            ) {


                nearest =
                    customer;


                nearestTop =
                    top;

            }

        }
    );


    return nearest;

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {


    if (!target) {

        return;

    }


    if (
        target.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    const cookRect =
        cook.getBoundingClientRect();



    /* ==================================================
       PARTENZA MANO
    ================================================== */

    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;



    /* ==================================================
       PUNTO ROSSO
    ================================================== */

    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );



    /* ==================================================
       PASTA
    ================================================== */

    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );



    /* ==================================================
       POSIZIONE INIZIALE
    ================================================== */

    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";



    /* ==================================================
       VELOCITÀ PASTA
    ================================================== */

    const speed = 350;


    let lastTime =
        performance.now();



    /* ==================================================
       MOVIMENTO PASTA
    ================================================== */

    function movePasta(
        currentTime
    ) {


        if (
            !target ||
            target.dataset.satisfied ===
            "true"
        ) {


            if (
                pasta.parentNode
            ) {

                pasta.remove();

            }


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }



        /*
           Il punto di arrivo segue
           sempre il cliente.
        */

        const targetRect =
            target.getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;



        /* ==================================================
           PUNTO DI IMPATTO
        ================================================== */

        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";



        /* ==================================================
           TEMPO TRA FRAME
        ================================================== */

        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;



        /* ==================================================
           DIREZIONE
        ================================================== */

        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );



        /* ==================================================
           MOVIMENTO
        ================================================== */

        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {


            currentX =
                endX;


            currentY =
                endY;


        }

        else {


            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }



        /* ==================================================
           AGGIORNA PASTA
        ================================================== */

        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";



        /* ==================================================
           IMPATTO
        ================================================== */

        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {


            hitCustomer(
                target,
                pasta
            );


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}



/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.remove();

    }


    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    let hp =
        parseInt(
            customer.dataset.hp ||
            "50"
        );


    hp -= 5;


    customer.dataset.hp =
        hp;


    if (
        hp <= 0
    ) {

        satisfyCustomer(
            customer
        );

    }

}



/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    customer
) {


    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }



    /*
       BLOCCO IMMEDIATO DEL MOVIMENTO

       Il cliente rimane esattamente
       nella posizione in cui è stato
       soddisfatto.
    */

    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    const currentTop =
        rect.top -
        gameRect.top;


    const currentLeft =
        rect.left -
        gameRect.left;


    customer.style.animation =
        "none";


    customer.classList
    .remove(
        "walking"
    );


    customer.classList
    .add(
        "satisfied"
    );


    customer.style.top =
        currentTop +
        "px";


    customer.style.left =
        currentLeft +
        "px";



    /*
       Segniamo il cliente
       come soddisfatto.
    */

    customer.dataset.satisfied =
        "true";


    customer.dataset.atKitchen =
        "false";



    /*
       Nascondiamo i frame normali.
    */

    const normalFrames =
        customer
        .querySelectorAll(
            ".frame"
        );


    normalFrames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );



    /*
       Mostriamo lo sprite felice.
    */

    const happyFrame =
        customer
        .querySelector(
            ".happy-frame"
        );


    happyFrame.style.display =
        "block";



    /*
       Il cuore viene mostrato
       automaticamente.
    */

    updateZIndexes();



    /*
       Dopo 1 secondo
       il cliente scompare.
    */

    setTimeout(
        function() {


            customer.style.display =
                "none";


            happyFrame.style.display =
                "none";


            customer.classList
            .remove(
                "satisfied"
            );


            updateZIndexes();


        },
        1000
    );

}



/* ==================================================
   COMPATIBILITÀ
================================================== */

function satisfyCustomer1() {


    const customer =
        customers.find(
            function(c) {

                return (
                    c.dataset.type === "1" &&
                    c.dataset.satisfied !== "true"
                );

            }
        );


    if (
        customer
    ) {

        satisfyCustomer(
            customer
        );

    }

}



function satisfyCustomer2() {


    const customer =
        customers.find(
            function(c) {

                return (
                    c.dataset.type === "2" &&
                    c.dataset.satisfied !== "true"
                );

            }
        );


    if (
        customer
    ) {

        satisfyCustomer(
            customer
        );

    }

}
