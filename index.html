<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =====================
   HOME
===================== */

#menu {
    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#menu h1 {
    margin: 0 0 40px;

    color: #ffd447;

    font-size: 55px;

    font-weight: 900;
}

#playButton {
    width: 240px;
    height: 70px;

    border: none;
    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;
    font-weight: bold;

    cursor: pointer;
}


/* =====================
   GIOCO
===================== */

#game {
    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    background: white;

    overflow: hidden;
}


/* =====================
   HUD
===================== */

#hud {
    position: absolute;

    top: 15px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;

    font-size: 22px;
    font-weight: bold;

    z-index: 20;
}


/* =====================
   CLIENTE
===================== */

#customer {
    position: absolute;

    width: 150px;
    height: 200px;

    left: 50%;

    top: -220px;

    transform: translateX(-50%);

    z-index: 10;

    animation: walkDown 5s linear forwards;
}


/* =====================
   SPRITE
===================== */

.frame {
    position: absolute;

    top: 0;
    left: 0;

    width: 150px;
    height: 200px;

    object-fit: contain;

    display: none;
}


/* PRIMO FRAME */

.frame1 {
    display: block;
}


/* =====================
   MOVIMENTO VERSO IL BASSO
===================== */

@keyframes walkDown {

    from {
        top: -220px;
    }

    to {
        top: 55vh;
    }

}

</style>

</head>


<body>


<!-- =====================
     HOME
===================== -->

<div id="menu">

    <h1>
        TARAI RUSH
    </h1>

    <button id="playButton">
        PLAY
    </button>

</div>



<!-- =====================
     LIVELLO 1
===================== -->

<div id="game">

    <div id="hud">

        <span>
            ❤️ 3
        </span>

        <span>
            ⭐ 0
        </span>

    </div>


    <div id="customer">


        <!-- GAMBA SINISTRA -->

        <img
            class="frame frame1"
            src="https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg"
            alt="Cliente gamba sinistra">


        <!-- GAMBA DESTRA -->

        <img
            class="frame frame2"
            src="https://i.ibb.co/YxRzGxP/Screenshot-20260829-161529-Grok-3.jpg"
            alt="Cliente gamba destra">


    </div>

</div>



<script>

/* =====================
   ANIMAZIONE CAMMINATA
===================== */

let currentFrame = 1;

let walkAnimation;


document
    .getElementById("playButton")
    .addEventListener("click", function() {


        /* NASCONDE HOME */

        document
            .getElementById("menu")
            .style.display = "none";


        /* MOSTRA LIVELLO */

        document
            .getElementById("game")
            .style.display = "block";


        /* CLIENTE */

        const customer =
            document.getElementById("customer");


        /* RIAVVIA IL MOVIMENTO */

        customer.style.animation = "none";

        void customer.offsetWidth;

        customer.style.animation =
            "walkDown 5s linear forwards";


        /* AVVIA CAMMINATA */

        startWalking();

    });



function startWalking() {


    /* FERMA ANIMAZIONE PRECEDENTE */

    if (walkAnimation) {

        clearInterval(walkAnimation);

    }


    currentFrame = 1;


    walkAnimation = setInterval(function() {


        /* NASCONDE I FRAME */

        document
            .querySelectorAll(".frame")
            .forEach(function(frame) {

                frame.style.display = "none";

            });


        /* CAMBIA GAMBA */

        if (currentFrame === 1) {

            currentFrame = 2;

        } else {

            currentFrame = 1;

        }


        /* MOSTRA IL FRAME */

        document
            .querySelector(".frame" + currentFrame)
            .style.display = "block";


    }, 130);

}

</script>


</body>

</html>
