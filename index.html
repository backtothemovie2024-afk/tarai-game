<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

/* ==================================================
   TELEFONO
================================================== */

#phone {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);
    aspect-ratio: 9 / 16;
    margin: auto;
    overflow: hidden;
    background: black;
}

/* ==================================================
   MENU
================================================== */

#menu {
    position: absolute;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#cover {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 10;
}

#playButton {
    position: absolute;
    bottom: 12%;
    width: 60%;
    max-width: 240px;
    height: 70px;
    border: none;
    border-radius: 18px;
    background: #ef6428;
    color: white;
    font-size: 28px;
    font-weight: bold;
    z-index: 30;
}

/* ==================================================
   GIOCO
================================================== */

#game {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: black;
}

#background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: auto;
    z-index: 0;
}

/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {
    position: absolute;
    left: 50%;
    top: 83%;
    width: 115%;
    height: auto;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 50;
}

#kitchen {
    display: block;
}

#kitchenDamaged {
    display: none;
}

#kitchenDestroyed {
    display: none;
}

/* ==================================================
   HUD
================================================== */

#hud {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-size: 22px;
    font-weight: bold;
    z-index: 80;
}

/* ==================================================
   BARRA EXP
================================================== */

#exp-bar {
    position: absolute;
    left: 2.5%;
    bottom: 1.5%;
    width: 95%;
    height: 30px;
    background: #321b10;
    border: 3px solid #8a512d;
    border-radius: 15px;
    box-shadow:
        0 4px 0 #160b07,
        0 6px 12px rgba(0,0,0,0.6),
        inset 0 2px 3px rgba(255,255,255,0.18);
    overflow: hidden;
    z-index: 200;
}

#exp-fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 0%;
    height: 100%;
    background:
        linear-gradient(
            180deg,
            #ffe477,
            #f5a623 50%,
            #d96b16
        );
    border-radius: 10px;
    z-index: 1;
    transition: width 0.35s ease-out;
}

#exp-level {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    font-weight: 900;
    text-shadow:
        2px 2px 3px #000;
    z-index: 2;
    pointer-events: none;
}

/* ==================================================
   CLIENTI
================================================== */

.customer {
    position: absolute;
    width: 100px;
    height: 135px;
    top: -130px;
    z-index: 10;
}

.customer.walking {
    animation:
        walkDown
        60s
        linear
        forwards;
}

.customer.satisfied {
    animation: none !important;
}

.customer .frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

.customer .frame.active {
    display: block;
}

.customer .happy-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    z-index: 2;
}

.heart {
    position: absolute;
    left: 50%;
    top: -18px;
    transform: translateX(-50%);
    font-size: 24px;
    line-height: 1;
    z-index: 5;
    display: none;
    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;
}

.customer.satisfied .heart {
    display: block;
}

@keyframes heartFloat {

    0% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

    100% {
        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);
    }

}

@keyframes walkDown {

    0% {
        top: -130px;
    }

    100% {
        top: 69%;
    }

}

/* ==================================================
   ZONE PERSONAGGI
================================================== */

/*
   4 zone uguali:

   ZONA 1 = 12.5%
   ZONA 2 = 37.5%
   ZONA 3 = 62.5%
   ZONA 4 = 87.5%

   Cuoco    = zona 2
   Cameriera = zona 3
*/

#cook,
#waitress {
    position: absolute;
    bottom: 7%;
    width: 100px;
    height: 135px;
    transform: translateX(-50%);
    z-index: 60;
}

/* ==================================================
   CUOCO
================================================== */

#cook {
    left: 37.5%;
}

#cook img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

#cook img.active {
    display: block;
}

/* ==================================================
   CAMERIERA
================================================== */

#waitress {
    left: 62.5%;
    display: none;
}

/* La cameriera normalmente è ferma */

#waitress img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

#waitress img.active {
    display: block;
}

/* ==================================================
   PASTA / PROIETTILE CAMERIERA
================================================== */

.pasta,
.drink {
    position: absolute;
    width: 84px;
    height: 84px;
    object-fit: contain;
    z-index: 70;
    pointer-events: none;
}

.drink {
    width: 70px;
    height: 70px;
}

/* ==================================================
   HITBOX INVISIBILE
================================================== */

.hit-marker {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: red;
    border: 3px solid white;
    box-shadow:
        0 0 8px red,
        0 0 15px rgba(255,0,0,0.8);
    transform: translate(-50%, -50%);
    z-index: 90;
    pointer-events: none;
    opacity: 0;
}

/* ==================================================
   POWER UP OVERLAY
================================================== */

#powerup-overlay {
    position: absolute;
    inset: 0;
    background:
        rgba(18, 8, 3, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
}

/* ==================================================
   PANNELLO
================================================== */

#powerup-panel {
    width: 92%;
    max-width: 430px;
    height: 560px;
    background-image:
        url("https://i.ibb.co/60d5SFdx/1788123346934-removebg-preview.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    border: none;
    border-radius: 0;
    box-shadow: none;
    padding: 0;
    position: relative;
}

/* ==================================================
   POWER UP OPTIONS
================================================== */

#powerup-options {
    position: absolute;
    inset: 0;
    display: block;
}

.powerup-slot {
    position: absolute;
    width: 27%;
    height: 22%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.powerup-slot:nth-child(1) {
    left: 25%;
    top: 50%;
}

.powerup-slot:nth-child(2) {
    left: 50%;
    top: 50%;
}

.powerup-slot:nth-child(3) {
    left: 75%;
    top: 50%;
}

/* ==================================================
   IMMAGINE POWER UP
================================================== */

.powerup-slot img {
    width: 82%;
    height: 82%;
    object-fit: contain;
    display: block;
    pointer-events: none;
}

.powerup-slot[data-type="pasta"] img {
    width: 68%;
    height: 68%;
}

.powerup-slot[data-type="speed"] img {
    width: 68%;
    height: 68%;
}

.powerup-slot[data-type="sauce"] img {
    width: 78%;
    height: 78%;
}

/* Power-up speciale cameriera */

.powerup-slot[data-type="waitress"] img {
    width: 82%;
    height: 82%;
}

/* ==================================================
   LIVELLO POWER UP
================================================== */

.powerup-level {
    position: absolute;
    right: 4%;
    bottom: 4%;
    min-width: 24px;
    height: 24px;
    padding: 0 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ef6428;
    border: 2px solid white;
    color: white;
    font-size: 12px;
    font-weight: 900;
    text-shadow:
        1px 1px 2px #000;
    box-shadow:
        0 2px 5px rgba(0,0,0,0.5);
}

/* ==================================================
   PAUSA
================================================== */

#game.powerup-paused * {
    animation-play-state: paused !important;
}

/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer,
    #cook,
    #waitress {
        width: 65px;
        height: 88px;
    }

    .pasta {
        width: 60px;
        height: 60px;
    }

    .drink {
        width: 52px;
        height: 52px;
    }

    #exp-bar {
        height: 27px;
        left: 2.5%;
        width: 95%;
    }

    #exp-level {
        font-size: 13px;
    }

    #powerup-panel {
        width: 94%;
        height: 560px;
    }

}

</style>

</head>

<body>

<script>

/* ==================================================
   REGOLAZIONE HITBOX
================================================== */

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;

/* ==================================================
   POSIZIONE MANO CAMERIERA
================================================== */

/*
   Questi valori indicano il punto da cui parte
   il drink durante il FRAME 3.

   X = posizione orizzontale della mano
   Y = posizione verticale della mano
*/

const WAITRESS_HAND_X = 0.70;

const WAITRESS_HAND_Y = 0.30;

/* ==================================================
   IMPOSTAZIONI WAVE 1
================================================== */

const TOTAL_CUSTOMERS = 10;

const FIRST_SPAWN_SECOND = 1;

const LAST_SPAWN_SECOND = 60;

const CUSTOMER_WALK_TIME = 70;

const LANES = [
    29,
    36.4,
    43.8,
    51.2,
    58.6
];

/* ==================================================
   DISTANZA MINIMA CLIENTI STESSA CORSIA
================================================== */

const SAME_LANE_MIN_DELAY = 1500;

/* ==================================================
   SISTEMA EXP
================================================== */

let currentLevel = 1;

let currentEXP = 0;

const EXP_PER_CUSTOMER = 5;

const EXP_REQUIREMENTS = [
    15,
    20,
    25,
    30,
    35,
    40,
    45,
    50,
    55,
    60,
    65
];

const MAX_LEVEL = 12;

/* ==================================================
   POWER UP
================================================== */

let powerUps = {

    pasta: 0,

    speed: 0,

    sauce: 0,

    waitress: false

};

let powerUpPaused = false;

/* ==================================================
   IMMAGINI POWER UP
================================================== */

const POWER_UP_IMAGES = {

    pasta:
        "https://i.ibb.co/zwM5xNK/1788123621728-removebg-preview.png",

    speed:
        "https://i.ibb.co/tP1rgx4D/1788123653567-removebg-preview.png",

    sauce:
        "https://i.ibb.co/pB62NXDf/1788123663443-removebg-preview.png",

    waitress:
        "https://i.ibb.co/k2brGmM0/1787717800004.jpg"

};

/* ==================================================
   MOSTRA POWER UP
================================================== */

function showPowerUpScreen() {

    if (powerUpPaused) {
        return;
    }

    const options =
        document.getElementById(
            "powerup-options"
        );

    options.innerHTML = "";

    let normalPowerUps = [];

    Object.keys(powerUps).forEach(
        function(type) {

            if (type === "waitress") {
                return;
            }

            if (powerUps[type] < 3) {

                normalPowerUps.push({
                    type: type,
                    level: powerUps[type] + 1
                });

            }

        }
    );

    /* ==================================================
       SHUFFLE POWER UP NORMALI
    ================================================== */

    for (
        let i = normalPowerUps.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        const temp =
            normalPowerUps[i];

        normalPowerUps[i] =
            normalPowerUps[j];

        normalPowerUps[j] =
            temp;

    }

    let selectedPowerUps = [];

    /* ==================================================
       POWER UP CAMERIERA OBBLIGATORIO
    ================================================== */

    if (!powerUps.waitress) {

        selectedPowerUps.push({
            type: "waitress",
            level: 1
        });

    }

    /* ==================================================
       AGGIUNGI GLI ALTRI POWER UP
    ================================================== */

    normalPowerUps.forEach(
        function(powerUp) {

            if (
                selectedPowerUps.length <
                3
            ) {

                selectedPowerUps.push(
                    powerUp
                );

            }

        }
    );

    /* ==================================================
       SHUFFLE DELLE 3 POSIZIONI
    ================================================== */

    for (
        let i = selectedPowerUps.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        const temp =
            selectedPowerUps[i];

        selectedPowerUps[i] =
            selectedPowerUps[j];

        selectedPowerUps[j] =
            temp;

    }

    selectedPowerUps.forEach(
        function(powerUp) {

            const slot =
                document.createElement("div");

            slot.className =
                "powerup-slot";

            slot.dataset.type =
                powerUp.type;

            slot.dataset.level =
                powerUp.level;

            const image =
                document.createElement("img");

            image.src =
                POWER_UP_IMAGES[
                    powerUp.type
                ];

            image.alt = "";

            slot.appendChild(image);

            /*
               La cameriera è un power-up unico,
               quindi non mostra LV 1/2/3.
            */

            if (
                powerUp.type !==
                "waitress"
            ) {

                const level =
                    document.createElement("div");

                level.className =
                    "powerup-level";

                level.textContent =
                    "LV " +
                    powerUp.level;

                slot.appendChild(level);

            }

            slot.addEventListener(
                "click",
                function() {

                    selectPowerUp(
                        powerUp.type
                    );

                }
            );

            options.appendChild(slot);

        }
    );

    powerUpPaused = true;

    document
    .getElementById("game")
    .classList
    .add("powerup-paused");

    document
    .getElementById("powerup-overlay")
    .style.display = "flex";

}

/* ==================================================
   SCELTA POWER UP
================================================== */

function selectPowerUp(type) {

    if (!powerUpPaused) {
        return;
    }

    /* ==================================================
       CAMERIERA
    ================================================== */

    if (type === "waitress") {

        if (powerUps.waitress) {
            return;
        }

        powerUps.waitress = true;

        summonWaitress();

    }

    /* ==================================================
       POWER UP NORMALI
    ================================================== */

    else {

        if (powerUps[type] >= 3) {
            return;
        }

        powerUps[type]++;

    }

    document
    .getElementById("powerup-overlay")
    .style.display = "none";

    document
    .getElementById("powerup-options")
    .innerHTML = "";

    powerUpPaused = false;

    document
    .getElementById("game")
    .classList
    .remove("powerup-paused");

    updateEXPBar();

}

/* ==================================================
   EVOCA CAMERIERA
================================================== */

function summonWaitress() {

    const waitress =
        document.getElementById(
            "waitress"
        );

    waitress.style.display =
        "block";

    setWaitressFrame(0);

    startWaitressAnimation();

}

/* ==================================================
   ANIMAZIONE CAMERIERA
================================================== */

let waitressTimer = null;

function startWaitressAnimation() {

    if (waitressTimer !== null) {

        clearInterval(
            waitressTimer
        );

    }

    /*
       La cameriera è ferma.
       L'animazione viene gestita
       esclusivamente durante il lancio.
    */

    setWaitressFrame(0);

}

/* ==================================================
   FRAME CAMERIERA
================================================== */

function setWaitressFrame(frameNumber) {

    const frames =
        document
        .getElementById("waitress")
        .querySelectorAll("img");

    frames.forEach(
        function(frame) {

            frame.classList.remove(
                "active"
            );

        }
    );

    if (frames[frameNumber]) {

        frames[frameNumber]
        .classList
        .add("active");

    }

}

/* ==================================================
   AGGIORNA BARRA EXP
================================================== */

function updateEXPBar() {

    const fill =
        document.getElementById("exp-fill");

    const levelText =
        document.getElementById("exp-level");

    if (currentLevel >= MAX_LEVEL) {

        currentLevel = MAX_LEVEL;

        currentEXP = 0;

        fill.style.width = "100%";

        levelText.textContent = "LV MAX";

        return;

    }

    const requiredEXP =
        EXP_REQUIREMENTS[
            currentLevel - 1
        ];

    const percentage =
        Math.min(
            100,
            (
                currentEXP /
                requiredEXP
            ) * 100
        );

    fill.style.width =
        percentage + "%";

    levelText.textContent =
        "LV " +
        currentLevel;

}

/* ==================================================
   AGGIUNGI EXP
================================================== */

function addEXP(amount) {

    if (currentLevel >= MAX_LEVEL) {
        return;
    }

    currentEXP += amount;

    const requiredEXP =
        EXP_REQUIREMENTS[
            currentLevel - 1
        ];

    if (currentEXP >= requiredEXP) {

        currentEXP -= requiredEXP;

        currentLevel++;

        updateEXPBar();

        showPowerUpScreen();

        return;

    }

    updateEXPBar();

}

/* ==================================================
   CREA WAVE 1
================================================== */

function createWave1() {

    const spawnTimes = [
        FIRST_SPAWN_SECOND
    ];

    while (
        spawnTimes.length <
        TOTAL_CUSTOMERS - 1
    ) {

        const randomSecond =
            Math.floor(
                Math.random() *
                (
                    LAST_SPAWN_SECOND -
                    FIRST_SPAWN_SECOND +
                    1
                )
            ) +
            FIRST_SPAWN_SECOND;

        if (
            !spawnTimes.includes(
                randomSecond
            )
        ) {

            spawnTimes.push(
                randomSecond
            );

        }

    }

    spawnTimes.push(
        LAST_SPAWN_SECOND
    );

    spawnTimes.sort(
        function(a, b) {
            return a - b;
        }
    );

    /*
       Tiene traccia dell'ultimo spawn
       per ogni corsia.
    */

    const lastLaneSpawn = [];

    for (
        let i = 0;
        i < LANES.length;
        i++
    ) {

        lastLaneSpawn[i] = -Infinity;

    }

    spawnTimes.forEach(
        function(second, index) {

            setTimeout(
                function() {

                    if (!powerUpPaused) {

                        let attempts = 0;

                        let laneIndex;

                        do {

                            laneIndex =
                                Math.floor(
                                    Math.random() *
                                    LANES.length
                                );

                            attempts++;

                            /*
                               Se possibile scegliamo una
                               corsia che non ha avuto un
                               cliente negli ultimi 1.5 secondi.
                            */

                        } while (
                            attempts < 50 &&
                            (
                                (
                                    second * 1000
                                ) -
                                lastLaneSpawn[laneIndex]
                            ) <
                            SAME_LANE_MIN_DELAY
                        );

                        /*
                           Se tutte le corsie sono occupate
                           scegliamo comunque una corsia.
                        */

                        lastLaneSpawn[laneIndex] =
                            second * 1000;

                        spawnCustomer(
                            index,
                            laneIndex
                        );

                    }

                },
                second * 1000
            );

        }
    );

}

function spawnCustomer(
    index,
    forcedLaneIndex = null
) {

    const game =
        document.getElementById("game");

    const type =
        Math.random() < 0.5
            ? 1
            : 2;

    const template =
        document.getElementById(
            type === 1
                ? "customer1Template"
                : "customer2Template"
        );

    const customer =
        template.cloneNode(true);

    customer.id =
        "customer-" +
        (index + 1);

    customer.classList.remove(
        "customer-template"
    );

    customer.classList.add(
        "spawned-customer"
    );

    customer.style.display = "block";

    customer.style.animation = "none";

    customer.classList.remove(
        "satisfied"
    );

    customer.style.top = "-130px";

    let laneIndex;

    if (
        forcedLaneIndex !== null &&
        forcedLaneIndex !== undefined
    ) {

        laneIndex =
            forcedLaneIndex;

    }

    else {

        laneIndex =
            Math.floor(
                Math.random() *
                LANES.length
            );

    }

    customer.dataset.lane =
        laneIndex;

    customer.style.left =
        LANES[laneIndex] + "%";

    customer.dataset.type =
        type;

    customer.dataset.hp =
        "30";

    customer.dataset.satisfied =
        "false";

    customer.dataset.atKitchen =
        "false";

    customer.dataset.frame =
        "0";

    const frames =
        customer.querySelectorAll(
            ".frame"
        );

    frames.forEach(
        function(frame) {

            frame.classList.remove(
                "active"
            );

        }
    );

    if (frames.length > 0) {

        frames[0]
        .classList
        .add("active");

    }

    const happyFrame =
        customer.querySelector(
            ".happy-frame"
        );

    happyFrame.style.display =
        "none";

    game.appendChild(customer);

    customers.push(customer);

    requestAnimationFrame(
        function() {

            customer.style.animation =
                "walkDown " +
                CUSTOMER_WALK_TIME +
                "s linear forwards";

            customer.classList.add(
                "walking"
            );

        }
    );

    setTimeout(
        function() {

            if (
                customer.dataset.satisfied !==
                "true"
            ) {

                customer.dataset.atKitchen =
                    "true";

                updateZIndexes();

            }

        },
        CUSTOMER_WALK_TIME * 1000
    );

}

function startKitchenEnergySystem() {

    if (kitchenDamageTimer !== null) {

        clearInterval(
            kitchenDamageTimer
        );

    }

    kitchenDamageTimer =
    setInterval(
        function() {

            if (powerUpPaused) {
                return;
            }

            let damage = 0;

            customers.forEach(
                function(customer) {

                    if (
                        customer &&
                        customer.dataset.atKitchen ===
                            "true" &&
                        customer.dataset.satisfied !==
                            "true"
                    ) {

                        damage++;

                    }

                }
            );

            if (damage > 0) {

                kitchenEnergy -= damage;

                if (kitchenEnergy < 0) {
                    kitchenEnergy = 0;
                }

                updateKitchenEnergy();

            }

        },
        5000
    );

}

/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(customer) {

    if (
        !customer ||
        customer.style.display === "none"
    ) {

        return false;

    }

    const rect =
        customer.getBoundingClientRect();

    const game =
        document.getElementById("game");

    const gameRect =
        game.getBoundingClientRect();

    return (
        rect.bottom > gameRect.top &&
        rect.top < gameRect.bottom
    );

}

/* ==================================================
   Z-INDEX
================================================== */

function startZIndexSystem() {

    if (zIndexTimer !== null) {

        clearInterval(
            zIndexTimer
        );

    }

    zIndexTimer =
    setInterval(
        function() {

            if (powerUpPaused) {
                return;
            }

            updateZIndexes();

        },
        50
    );

}

function updateZIndexes() {

    const activeCustomers =
        customers.filter(
            function(customer) {

                return (
                    customer &&
                    customer.style.display !==
                        "none"
                );

            }
        );

    activeCustomers.sort(
        function(a, b) {

            const aTop =
                a
                .getBoundingClientRect()
                .top;

            const bTop =
                b
                .getBoundingClientRect()
                .top;

            return aTop - bTop;

        }
    );

    activeCustomers.forEach(
        function(customer, index) {

            customer.style.zIndex =
                10 + index;

        }
    );

}

================================================== */

function playCookAttack() {

    if (powerUpPaused) {
        return;
    }

    const targets =
        getAttackTargets();

    if (targets.length === 0) {

        setCookFrame(0);

        return;

    }

    setCookFrame(0);

    setTimeout(
        function() {

            if (!powerUpPaused) {
                setCookFrame(1);
            }

        },
        120
    );

    setTimeout(
        function() {

            if (!powerUpPaused) {
                setCookFrame(2);
            }

        },
        240
    );

    setTimeout(
        function() {

            if (!powerUpPaused) {

                setCookFrame(3);

                targets.forEach(
                    function(target) {

                        if (
                            target &&
                            target.dataset.satisfied !==
                                "true"
                        ) {

                            throwPasta(target);

                        }

                    }
                );

            }

        },
        360
    );

    setTimeout(
        function() {

            if (!powerUpPaused) {
                setCookFrame(4);
            }

        },
        480
    );

    setTimeout(
        function() {

            if (!powerUpPaused) {
                setCookFrame(0);
            }

        },
        600
    );

/* ==================================================
   CLIENTI DA COLPIRE
================================================== */

function getAttackTargets() {

    const activeCustomers =
        customers.filter(
            function(customer) {

                if (!customer) {
                    return false;
                }

                if (
                    customer.style.display ===
                    "none"
                ) {
                    return false;
                }

                if (
                    customer.dataset.satisfied ===
                    "true"
                ) {
                    return false;
                }

                return customerIsVisible(
                    customer
                );

            }
        );

    activeCustomers.sort(
        function(a, b) {

            return (
                b.getBoundingClientRect().top -
                a.getBoundingClientRect().top
            );

        }
    );

    let numberOfPasta =
        1 +
        powerUps.pasta;

    return activeCustomers.slice(
        0,
        numberOfPasta
    );

}

   ATTACCO AUTOMATICO CUOCO
================================================== */

function startCookAnimation() {

    if (cookTimer !== null) {

        clearInterval(
            cookTimer
        );

    }

    setCookFrame(0);

    cookTimer =
    setInterval(
        function() {

            if (powerUpPaused) {
                return;
            }

            const target =

            if (target !== null) {

            }

        },
        getCookAttackInterval()
    );

}

/* ==================================================
   VELOCITÀ ATTACCO CUOCO
================================================== */

function getCookAttackInterval() {

    return Math.round(
        3000 /
        (
            1 +
            powerUps.speed * 0.33
        )
    );

}

/* ==================================================
   VELOCITÀ ATTACCO CAMERIERA
================================================== */

/*
   La cameriera lancia il 33% più frequentemente
   rispetto al cuoco.

   Non cambia la velocità del drink.
*/

function getWaitressAttackInterval() {

    return Math.round(
        getCookAttackInterval() *
        0.67
    );

}

/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer() {

    const activeCustomers =
        customers.filter(
            function(customer) {

                if (!customer) {
                    return false;
                }

                if (
                    customer.style.display ===
                    "none"
                ) {
                    return false;
                }

                if (
                    customer.dataset.satisfied ===
                    "true"
                ) {
                    return false;
                }

                return customerIsVisible(
                    customer
                );

            }
        );

    if (
        activeCustomers.length ===
        0
    ) {

        return null;

    }

    let nearest =
        activeCustomers[0];

    let nearestTop =
        nearest
        .getBoundingClientRect()
        .top;

    activeCustomers.forEach(
        function(customer) {

            const top =
                customer
                .getBoundingClientRect()
                .top;

            if (
                top >
                nearestTop
            ) {

                nearest =
                    customer;

                nearestTop =
                    top;

            }

        }
    );

    return nearest;

}

/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(target) {

    if (!target) {
        return;
    }

    if (
        target.dataset.satisfied ===
        "true"
    ) {

        return;

    }

    const cook =
        document.getElementById("cook");

    const game =
        document.getElementById("game");

    const gameRect =
        game.getBoundingClientRect();

    const cookRect =
        cook.getBoundingClientRect();

    const startX =
        cookRect.left +
        cookRect.width * 0.72;

    const startY =
        cookRect.top +
        cookRect.height * 0.32;

    const hitMarker =
        document.createElement("div");

    hitMarker.className =
        "hit-marker";

    game.appendChild(
        hitMarker
    );

    const pasta =
        document.createElement("img");

    pasta.className =
        "pasta";

    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";

    game.appendChild(
        pasta
    );

    let currentX =
        startX;

    let currentY =
        startY;

    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";

    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";

    const speed =
        350 *
        (
            1 +
            powerUps.speed * 0.33
        );

    let lastTime =
        performance.now();

    function movePasta(currentTime) {

        if (
            !target ||
            target.dataset.satisfied ===
            "true"
        ) {

            if (pasta.parentNode) {
                pasta.remove();
            }

            if (hitMarker.parentNode) {
                hitMarker.remove();
            }

            return;

        }

        if (powerUpPaused) {

            lastTime =
                currentTime;

            requestAnimationFrame(
                movePasta
            );

            return;

        }

        const targetRect =
            target.getBoundingClientRect();

        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;

        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;

        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";

        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";

        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );

        lastTime =
            currentTime;

        const dx =
            endX -
            currentX;

        const dy =
            endY -
            currentY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const movement =
            speed *
            deltaTime;

        if (
            distance <=
            movement
        ) {

            currentX =
                endX;

            currentY =
                endY;

        }

        else {

            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;

            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }

        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";

        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";

        const remainingX =
            endX -
            currentX;

        const remainingY =
            endY -
            currentY;

        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );

        if (
            remainingDistance <=
            3
        ) {

            hitCustomer(
                target,
                pasta
            );

            if (hitMarker.parentNode) {
                hitMarker.remove();
            }

            return;

        }

        requestAnimationFrame(
            movePasta
        );

    }

    requestAnimationFrame(
        movePasta
    );

}

    );

/* ==================================================
   LANCIO DRINK
================================================== */

function throwDrink(target) {

    if (!target) {
        return;
    }

    if (
        target.dataset.satisfied ===
        "true"
    ) {

        return;

    }

    const waitress =
        document.getElementById(
            "waitress"
        );

    const game =
        document.getElementById(
            "game"
        );

    const gameRect =
        game.getBoundingClientRect();

    const waitressRect =
        waitress.getBoundingClientRect();

    /*
       Il punto di partenza viene calcolato
       sul FRAME 3, cioè quello con la mano alzata.

       Questi due valori sono facilmente
       regolabili se durante il test vediamo
       che il drink deve essere spostato
       di qualche pixel.
    */

    const startX =
        waitressRect.left +
        waitressRect.width *
        WAITRESS_HAND_X;

    const startY =
        waitressRect.top +
        waitressRect.height *
        WAITRESS_HAND_Y;

    const hitMarker =
        document.createElement("div");

    hitMarker.className =
        "hit-marker";

    game.appendChild(
        hitMarker
    );

    const drink =
        document.createElement("img");

    drink.className =
        "drink";

    drink.src =
        "https://i.ibb.co/nqJ8Lh8w/Screenshot-20260830-210005-Grok-removebg-preview.png";

    game.appendChild(
        drink
    );

    let currentX =
        startX;

    let currentY =
        startY;

    drink.style.left =
        (
            currentX -
            gameRect.left -
            35
        ) + "px";

    drink.style.top =
        (
            currentY -
            gameRect.top -
            35
        ) + "px";

    /*
       La velocità del drink NON viene
       modificata dalla velocità di attacco.

       Rimane indipendente.
    */

    const speed = 350;

    let lastTime =
        performance.now();

    function moveDrink(currentTime) {

        if (
            !target ||
            target.dataset.satisfied ===
            "true"
        ) {

            if (drink.parentNode) {
                drink.remove();
            }

            if (hitMarker.parentNode) {
                hitMarker.remove();
            }

            return;

        }

        if (powerUpPaused) {

            lastTime =
                currentTime;

            requestAnimationFrame(
                moveDrink
            );

            return;

        }

        const targetRect =
            target.getBoundingClientRect();

        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;

        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;

        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";

        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";

        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );

        lastTime =
            currentTime;

        const dx =
            endX -
            currentX;

        const dy =
            endY -
            currentY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const movement =
            speed *
            deltaTime;

        if (
            distance <=
            movement
        ) {

            currentX =
                endX;

            currentY =
                endY;

        }

        else {

            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;

            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }

        drink.style.left =
            (
                currentX -
                gameRect.left -
                35
            ) + "px";

        drink.style.top =
            (
                currentY -
                gameRect.top -
                35
            ) + "px";

        const remainingX =
            endX -
            currentX;

        const remainingY =
            endY -
            currentY;

        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );

        if (
            remainingDistance <=
            3
        ) {

            hitCustomerWithDrink(
                target,
                drink
            );

            if (hitMarker.parentNode) {
                hitMarker.remove();
            }

            return;

        }

        requestAnimationFrame(
            moveDrink
        );

    }

    requestAnimationFrame(
        moveDrink
    );

}

/* ==================================================
   COLPITO DAL DRINK
================================================== */

function hitCustomerWithDrink(
    customer,
    drink
) {

    if (
        drink &&
        drink.parentNode
    ) {

        drink.remove();

    }

    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }

    let hp =
        parseInt(
            customer.dataset.hp ||
            "30"
        );

    /*
       Cameriera = 3 danni
    */

    const damage = 3;

    hp -=
        damage;

    customer.dataset.hp =
        hp;

    if (
        hp <= 0
    ) {

        satisfyCustomer(
            customer
        );

    }

}

/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {

    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.remove();

    }

    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }

    let hp =
        parseInt(
            customer.dataset.hp ||
            "30"
        );

    const damage =
        5 +
        powerUps.sauce;

    hp -=
        damage;

    customer.dataset.hp =
        hp;

    if (
        hp <= 0
    ) {

        satisfyCustomer(
            customer
        );

    }

}

/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    customer
) {

    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }

    const rect =
        customer
        .getBoundingClientRect();

    const game =
        document
        .getElementById("game");

    const gameRect =
        game
        .getBoundingClientRect();

    const currentTop =
        rect.top -
        gameRect.top;

    const currentLeft =
        rect.left -
        gameRect.left;

    customer.style.animation =
        "none";

    customer.classList.remove(
        "walking"
    );

    customer.classList.add(
        "satisfied"
    );

    customer.style.top =
        currentTop + "px";

    customer.style.left =
        currentLeft + "px";

    customer.dataset.satisfied =
        "true";

    customer.dataset.atKitchen =
        "false";

    addEXP(
        EXP_PER_CUSTOMER
    );

    const normalFrames =
        customer
        .querySelectorAll(
            ".frame"
        );

    normalFrames.forEach(
        function(frame) {

            frame.classList.remove(
                "active"
            );

        }
    );

    const happyFrame =
        customer
        .querySelector(
            ".happy-frame"
        );

    happyFrame.style.display =
        "block";

    updateZIndexes();

    setTimeout(
        function() {

            customer.style.display =
                "none";

            happyFrame.style.display =
                "none";

            customer.classList.remove(
                "satisfied"
            );

            updateZIndexes();

        },
        1000
    );

}

    const customer =

                return (

}
