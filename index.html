<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarai Rush</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Knewave&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#phone{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;margin:auto;overflow:hidden;background:#000}
#intro{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1000}
#introVideo{width:100%;height:100%;object-fit:cover;display:block}
/* DISSOLVENZA INTRO → NERO → MENU */
#introFade{position:absolute;inset:0;background:#000;opacity:0;display:none;z-index:1100;transition:opacity .8s ease-in-out;pointer-events:auto}
#introTap{position:absolute;inset:0;z-index:1001;cursor:pointer}
#menu{position:absolute;inset:0;background:#000;display:flex;justify-content:center;align-items:center;z-index:100}
#cover,#coverOverlay{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:fill;display:block}
#cover{z-index:10;pointer-events:none}#coverOverlay{z-index:20;pointer-events:none}
#playButton{position:absolute;left:12%;top:58%;width:76%;height:14%;border:none;background:transparent;color:transparent;font-size:0;z-index:30;cursor:pointer;-webkit-tap-highlight-color:transparent}
#blackTransition{position:absolute;inset:0;background:#000;display:none;overflow:hidden;z-index:2000;pointer-events:none}
.transition-image{position:absolute;width:100%;height:auto;display:block;pointer-events:none}
#transitionImage1{top:5%;left:-100%}#transitionImage2{top:35%;right:-100%}#transitionImage3{bottom:5%;left:-100%}
@keyframes transitionFromLeft{from{left:-100%}to{left:0%}}
@keyframes transitionFromRight{from{right:-100%}to{right:0%}}
@keyframes transitionExit{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
@keyframes gameEnter{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
#game{display:none;position:absolute;inset:0;overflow:hidden;background:#000}
#background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto;z-index:0}
#kitchen,#kitchenDamaged,#kitchenDestroyed{position:absolute;left:50%;top:83%;width:115%;height:auto;transform:translate(-50%,-50%);pointer-events:none;z-index:50}
#kitchen{display:block}#kitchenDamaged,#kitchenDestroyed{display:none}
#exp-bar{position:absolute;left:2.5%;bottom:1.5%;width:95%;height:30px;background:#321b10;border:3px solid #8a512d;border-radius:15px;box-shadow:0 4px 0 #160b07,0 6px 12px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.18);overflow:hidden;z-index:200}
#exp-fill{position:absolute;left:0;top:0;width:0%;height:100%;background:linear-gradient(180deg,#ffe477,#f5a623 50%,#d96b16);border-radius:10px;z-index:1;transition:width .35s ease-out}
#exp-level{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:900;text-shadow:2px 2px 3px #000;z-index:2;pointer-events:none}
.customer{position:absolute;width:100px;height:135px;top:3%;z-index:10}
.customer.walking{animation:walkDown 60s linear forwards}.customer.satisfied{animation:none!important}
.customer .frame,.customer .happy-frame,.customer .frozen-frame{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:none}
.customer .frame.active{display:block}.customer .happy-frame{z-index:2}.customer .frozen-frame{z-index:3}
.customer1-sprite,.customer2-sprite{display:none}
.customer1-template .frame{width:100%;height:100%;object-fit:contain;transform:scale(1);transform-origin:center bottom}
.customer1-template{width:100px;height:135px}
.customer1-template .happy-frame{transform:scale(.90);transform-origin:center bottom}
.customer1-template .frozen-frame{transform:scale(.92);transform-origin:center bottom}
.customer2-sprite + .happy-frame{width:100%;height:100%;object-fit:contain;left:0%}
.customer2-template .frame:nth-of-type(1),.customer2-template .frame:nth-of-type(2){transform:scale(1);transform-origin:center bottom}
.customer2-template .happy-frame{width:100%;height:100%;object-fit:contain;left:0%;transform:scale(1);transform-origin:center bottom}
.customer2-template .frozen-frame{transform:scale(.90);transform-origin:center bottom}
.customer3-template .frame,.customer3-template .happy-frame,.customer4-template .frame,.customer4-template .happy-frame,.customer5-template .frame,.customer5-template .happy-frame{transform-origin:center bottom}
.customer3-template .frame:nth-of-type(1){transform:translateX(0)}
.customer3-template .frame:nth-of-type(2){transform:translateX(14.0625%)}
.customer6-template .frame,.customer6-template .happy-frame,.customer6-template .frozen-frame,.customer7-template .frame,.customer7-template .happy-frame,.customer7-template .frozen-frame,.customer8-template .frame,.customer8-template .happy-frame,.customer8-template .frozen-frame{width:100%;height:100%;object-fit:contain;object-position:center bottom;transform:scale(1);transform-origin:center bottom}
.boss-unit-template .frame,.boss-unit-template .happy-frame{width:100%;height:100%;object-fit:contain;transform:scale(1);transform-origin:center bottom}
/* VIDEO BOSS: ingresso e uscita secchi, 0,2 secondi. */
#bossIntro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;background:#000;z-index:450}
#bossIntroVideo{width:100%;height:100%;object-fit:cover;display:block}
#bossIntro.entering{animation:bossSnapIn .2s ease-out both}
#bossIntro.leaving{animation:bossSnapOut .2s ease-in both;pointer-events:none}
@keyframes bossSnapIn{0%{transform:scale(.72)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes bossSnapOut{from{transform:translateX(0)}to{transform:translateX(110%)}}
#bossVideoAction{position:absolute;left:10%;right:10%;bottom:12%;padding:14px;border:2px solid #fff;border-radius:10px;background:#191919;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
/* TEST TEMPORANEO: disattivare ENABLE_BOSS_TEST nel JavaScript per nasconderlo. */
#testBossButton{position:absolute;top:12px;right:10px;z-index:420;padding:8px 10px;border:2px solid #ffd45a;border-radius:8px;background:rgba(0,0,0,.78);color:#ffd45a;font-size:12px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent}
#testBossButton:disabled{opacity:.45;cursor:default}
.heart{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:24px;line-height:1;z-index:5;display:none;animation:heartFloat .8s ease-in-out infinite alternate}
.customer.satisfied .heart{display:block}
@keyframes heartFloat{0%{transform:translateX(-50%) translateY(0) scale(1)}100%{transform:translateX(-50%) translateY(-7px) scale(1.12)}}
@keyframes walkDown{0%{top:3%}100%{top:69%}}
#cook,#waitress{position:absolute;bottom:7%;width:100px;height:135px;transform:translateX(-50%);z-index:60}
#cook{left:37.5%;bottom:12%}
#cook img{position:absolute;top:0;left:0;width:170%;height:170%;object-fit:contain;display:none}
#cook img.active,#waitress img.active{display:block}
#waitress{left:62.5%;bottom:6%;display:none;overflow:visible}
#waitress img{position:absolute;left:50%;bottom:0;top:auto;width:104%;height:104%;max-width:none;max-height:none;object-fit:contain;display:none;transform:translateX(-50%);transform-origin:center bottom;pointer-events:none}
.pasta,.drink{position:absolute;width:84px;height:84px;object-fit:contain;z-index:70;pointer-events:none}.drink{width:140px;height:140px}
.hit-marker{position:absolute;width:22px;height:22px;border-radius:50%;background:red;border:3px solid white;box-shadow:0 0 8px red,0 0 15px rgba(255,0,0,.8);transform:translate(-50%,-50%);z-index:90;pointer-events:none;opacity:0}
.impact-particle{position:absolute;pointer-events:none;z-index:95;transform:translate(-50%,-50%)}
.drink-drop{width:7px;height:11px;border-radius:50% 50% 55% 55%;background:#62d9ff;box-shadow:0 0 5px rgba(98,217,255,.8);animation:drinkDropFly .32s ease-out forwards}
@keyframes drinkDropFly{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.45)}}
.pasta-strand{width:18px;height:5px;border-radius:50%;background:#ffd45a;box-shadow:0 0 3px rgba(255,190,40,.8);transform-origin:center;animation:pastaStrandFly .36s ease-out forwards}
@keyframes pastaStrandFly{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) rotate(var(--rot)) scaleX(.7)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(calc(var(--rot) + 90deg)) scaleX(1.2)}}
#powerup-overlay{position:absolute;inset:0;background:rgba(18,8,3,.82);display:none;align-items:center;justify-content:center;z-index:500}
#powerup-panel{width:103%;height:91%;position:relative;background:transparent;border:none;border-radius:0;box-shadow:none;padding:0}
#powerup-options{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.5%}
.powerup-slot{position:relative;width:32%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.powerup-slot img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.powerup-slot img[src*="MkNSjJwS"],
.powerup-slot img[src*="S4pzKRB7"],
.powerup-slot img[src*="yFG9djjL"],
.powerup-slot img[src*="WN2w5Gdr"],
.powerup-slot img[src*="TB2VNLT9"],
.powerup-slot img[src*="v4HTHVvD"],
.powerup-slot img[src*="wN1wThJ4"],
.powerup-slot img[src*="bRBNBZjK"],
.powerup-slot img[src*="9mqm7dsN"],
.powerup-slot img[src*="5WW0VDPS"],
.powerup-slot img[src*="3mytpycj"],
.powerup-slot img[src*="RpPWmLf1"],
.powerup-slot img[src*="kg8ZJ26R"],
.powerup-slot img[src*="4RctQkYn"],
.powerup-slot img[src*="YBXzXK8T"],
.powerup-slot img[src*="R46THQGk"],
.powerup-slot img[src*="d0wKYzSF"],
.powerup-slot img[src*="1f3rLZ6L"],
.powerup-slot img[src*="PG5PFZfw"]{width:130%;height:115%}
#game.powerup-paused *{animation-play-state:paused!important}
/* POSIZIONE LAVAGNA: valori da rifinire sullo sfondo se necessario. */
#wave-display{
position:absolute;
left:11.6%;
top:2.5%;
width:11%;
height:4.6%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-family:"Knewave","Comic Sans MS",cursive;
font-weight:400;
font-size:18px;
line-height:1.15;
text-align:center;
white-space:nowrap;
overflow:hidden;
padding:2px;
z-index:5;
pointer-events:none;
}

#wave-message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:14px 25px;border-radius:15px;background:rgba(0,0,0,.72);color:white;font-size:25px;font-weight:900;text-align:center;text-shadow:2px 2px 3px #000;z-index:400;display:none;pointer-events:none}
@media(max-width:500px){
.customer,#cook,#waitress{width:65px;height:88px}
.customer1-template,.customer2-template,.customer3-template,.customer4-template,.customer5-template,.customer6-template,.customer7-template,.customer8-template{width:75px;height:102px}
.pasta,.drink{width:60px;height:60px}
#exp-bar{height:27px;left:2.5%;width:95%}#exp-level{font-size:13px}
#powerup-panel{width:110%;height:96%}#powerup-options{gap:0}.powerup-slot{width:33.33%;height:100%}.powerup-slot img{width:110%;height:96%;object-fit:contain}
#wave-message{font-size:21px}
}
.customer6-template .happy-frame,.customer7-template .happy-frame,.customer8-template .happy-frame{transform:scale(.90);transform-origin:center bottom}

.customer7-template .frame,.customer7-template .happy-frame,.customer7-template .frozen-frame{transform:scale(1.15);transform-origin:center bottom}
.customer7-template .frame:nth-of-type(2){transform:translateX(0) scale(1.15)}
#seon{position:absolute;left:12.5%;bottom:6%;width:100px;height:135px;transform:translateX(-50%);z-index:60;display:none}
#seon img{position:absolute;left:50%;bottom:0;width:104%;height:104%;object-fit:contain;transform:translateX(calc(-50% + var(--shift,0%)));display:none;pointer-events:none}
#seon img.active{display:block}
.cappuccino{position:absolute;width:70px;height:55px;z-index:70;pointer-events:none}
.cappuccino svg{width:100%;height:100%;display:block}
.coffee-drop{background:#aa6b38;box-shadow:0 0 3px #ffe6b7}
.powerup-slot{border:0;padding:0;background:transparent}
.powerup-slot.seon-panel img{width:130%;height:115%}
@media(max-width:500px){#seon{width:65px;height:88px}.cappuccino{width:52px;height:42px}}

/* CORREZIONE DIMENSIONI SEON JEONG */
#seon{
 left:22%;
 width:110px;
 height:149px;
 bottom:5%;
}
.cappuccino{
 width:28px;
 height:21px;
}
.powerup-slot.seon-panel img{
 width:100%;
 height:100%;
}
@media(max-width:500px){
 #seon{
  width:72px;
  height:98px;
  bottom:5%;
 }
 .cappuccino{
  width:28px;
  height:21px;
 }
}

/* STAGE 1: energia, bersaglio, flash, test e fine partita. */
#phone{container-type:inline-size}
#testGameOverButton{position:absolute;top:52px;right:10px;z-index:420;padding:8px 10px;border:2px solid #ffae91;border-radius:8px;background:rgba(0,0,0,.8);color:#ffae91;font-size:12px;font-weight:bold;cursor:pointer}
#skipTransition{position:absolute;bottom:4%;right:5%;z-index:2100;padding:12px 20px;border:2px solid #ffd45a;border-radius:24px;background:#16100c;color:#ffe7a2;font-weight:bold;font-size:15px;pointer-events:auto;cursor:pointer}
#kitchenHud{position:absolute;left:29%;top:1.8%;width:33%;z-index:205;color:#fff;font-weight:bold;font-size:10px;text-align:center;pointer-events:none;text-shadow:0 1px 3px #000}
#kitchenMeter{height:9px;margin-top:4px;background:#241b14;border:1px solid #ffe1a0;border-radius:8px;overflow:hidden}
#kitchenFill{height:100%;width:100%;background:#9de48b;transition:width .2s,background .2s}
#damageVignette{position:absolute;inset:0;pointer-events:none;z-index:210;box-shadow:inset 0 0 65px #ff301fcc;opacity:0}
#damageVignette.active{animation:damagePulse .4s ease-out}
@keyframes damagePulse{0%{opacity:.9}100%{opacity:0}}
.customer{cursor:pointer;-webkit-tap-highlight-color:transparent}
.customer.priority::after{content:'';position:absolute;left:15%;right:15%;bottom:-4%;height:14%;border:2px solid #ffe378;border-radius:50%;box-shadow:0 0 10px #ffcc4a;pointer-events:none}
.customer.boosted .frame{filter:drop-shadow(0 0 5px #ffdc74)}
.camera-light{position:absolute;width:10px;height:10px;z-index:180;border-radius:50%;background:#fff9cc;box-shadow:0 0 9px 5px #fff5bc;pointer-events:none;transform:translate(-50%,-50%)}
.camera-light.charging{animation:chargeLens .65s ease-in forwards}
.camera-light.fired{animation:fireLens .32s ease-out forwards}
@keyframes chargeLens{from{opacity:.2;transform:translate(-50%,-50%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1.6)}}
@keyframes fireLens{from{opacity:1;transform:translate(-50%,-50%) scale(3)}to{opacity:0;transform:translate(-50%,-50%) scale(8)}}
.flash-ring{position:absolute;width:24px;height:24px;border:2px solid #fff1bd;border-radius:50%;z-index:181;pointer-events:none;animation:flashRing .55s ease-out forwards}
@keyframes flashRing{from{opacity:.9;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(8)}}
#bossFlashWash{position:absolute;inset:0;pointer-events:none;background:#fff9e9;z-index:182;opacity:0}
#bossFlashWash.active{animation:flashWash .28s ease-out forwards}
@keyframes flashWash{0%{opacity:.25}100%{opacity:0}}
#endScreen{position:absolute;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#4b2019e8,#0b0806f5);padding:7%;color:#fff5dc;text-align:center}
#endScreen[hidden],#testGameOverButton[hidden],#skipTransition[hidden]{display:none}
#endCard{width:100%;padding:12% 6%;border-top:2px solid #c99558;border-bottom:2px solid #c99558}
#endEyebrow{font-size:12px;letter-spacing:3px;color:#d6b790}
#endTitle{font-family:Knewave,cursive;font-size:clamp(32px,10cqw,65px);line-height:1.12;color:#ffd66a;margin:20px 0 10px;text-shadow:0 5px 0 #6c251d}
#endSubtitle{font-size:clamp(13px,4cqw,20px);letter-spacing:1px}
#endStats{margin:22px 0;font-size:14px;color:#dfc9ac}
#retryButton{border:0;border-radius:24px;padding:14px 30px;background:linear-gradient(#ffe49a,#eaaa3d);box-shadow:0 4px 0 #75461d;color:#362114;font-size:16px;font-weight:900;cursor:pointer}
@media(prefers-reduced-motion:reduce){#bossFlashWash.active{animation:none}.flash-ring{display:none}}


/* Game Over: illustrazione in alto, un solo personaggio animato sotto. */
#gameOverArt,#gameOverCharacter{display:none;position:absolute;pointer-events:none;object-fit:contain}
#endScreen.loss{padding:0;background:#000}
#endScreen.loss #gameOverArt{display:block;left:0;top:0;width:100%;height:auto;z-index:0}
#endScreen.loss #gameOverCharacter{display:block;left:8%;top:47%;width:84%;height:38%;z-index:1}
#endScreen.loss #endCard{position:absolute;inset:0;padding:0;border:0}
#endScreen.loss #endEyebrow,#endScreen.loss #endSubtitle{display:none}
#endScreen.loss #endTitle{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
#endScreen.loss #endStats{position:absolute;left:3%;right:3%;bottom:11%;margin:0;font-size:12px;z-index:2}
#endScreen.loss #retryButton{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);z-index:2}

</style>
</head>
<body>
<div id="phone">
<div id="intro"><video id="introVideo" autoplay muted playsinline preload="auto"><source src="https://yourimageshare.com/ib/LjN0a6FLZL.mp4" type="video/mp4"></video><div id="introTap"></div></div>
<div id="introFade"></div>
<div id="menu">
<video id="cover" muted loop playsinline preload="auto" poster="https://i.ibb.co/7JzwW3pP/file-00000000e8d8820b9cbd75d3f8d8e3a1.png">
<source src="https://github.com/backtothemovie2024-afk/tarai-game/raw/refs/heads/main/Animate_chef_image_with_steam_20260915082519.mp4" type="video/mp4">
</video>
<img id="coverOverlay" src="https://i.ibb.co/67Fhq4qw/file-0000000053c481f796fb5ec6162a6b2e-removebg-preview.png" alt="">
<button id="playButton" aria-label="Play" disabled>PLAY</button></div>
<div id="game">
<img id="background" src="https://cdn.imgchest.com/files/25a5041a8483.jpg" alt="">
<img id="kitchen" src="https://i.ibb.co/39jfnpgW/IMG-20260829-WA0013-removebg-preview.png" alt="">
<img id="kitchenDamaged" src="https://i.ibb.co/7t1CkQYc/IMG-20260829-WA0014-removebg-preview.png" alt="">
<img id="kitchenDestroyed" src="https://i.ibb.co/HLF1Q2zn/IMG-20260829-WA0015-removebg-preview.png" alt="">
<div id="wave-display">WAVE 1</div>
<!-- Riservato al messaggio finale: nessuna scritta temporanea a inizio wave. -->
<div id="wave-message"></div>
<button id="testBossButton" type="button" hidden>TEST BOSS</button>
<button id="testGameOverButton" type="button" hidden>TEST GAME OVER</button>
<div id="kitchenHud"><span id="kitchenLabel">CUCINA 100%</span><div id="kitchenMeter" role="progressbar" aria-label="Energia cucina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="kitchenFill"></div></div></div>
<div id="damageVignette"></div><div id="bossFlashWash"></div>
<div id="endScreen" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
 <img id="gameOverArt" src="https://i.ibb.co/LDvGMpXr/file-0000000046a881f59037eda06ba19c32.png" alt="">
 <img id="gameOverCharacter" alt="Personaggio stordito">
 <div id="endCard"><div id="endEyebrow">TARAI RUSH · STAGE 1</div><h1 id="endTitle">GAME OVER</h1><div id="endSubtitle">KITCHEN COLLAPSED</div><div id="endStats"></div><button id="retryButton" type="button">RIPROVA</button></div>
</div>
<div id="bossIntro">
<video id="bossIntroVideo" muted playsinline preload="auto"><source src="https://github.com/backtothemovie2024-afk/tarai-game/raw/refs/heads/main/Video_animation_instructions_for%E2%80%A6_20260915063937.mp4" type="video/mp4"></video>
<button id="bossVideoAction" type="button" hidden>TOCCA PER AVVIARE IL VIDEO</button>
</div>

<div id="customer1Template" class="customer customer-template customer1-template" style="display:none;">
<img class="frame active" src="https://i.ibb.co/TMLpLFpV/tile006-191x720-removebg-preview.png" alt="">
<img class="frame" src="https://i.ibb.co/qYHtzZC6/tile008-191x720-removebg-preview.png" alt="">
<img class="happy-frame" src="https://i.ibb.co/xK0KvtVy/file-00000000c12c82098b5b04e3cf209f24-removebg-preview.png" alt="">
<img class="frozen-frame" src="https://i.ibb.co/Kx64hLcM/1000042445-removebg-preview.png" alt="">
<div class="heart">❤️</div>
</div>

<div id="customer2Template" class="customer customer-template customer2-template" style="display:none;">
<img class="frame active" src="https://i.ibb.co/KcRsHGBM/file-00000000c98081f5b726e6e0d5b17f8d-removebg-preview.png" alt="">
<img class="frame" src="https://i.ibb.co/SXD5sdPw/IMG-20260903-WA0001-removebg-preview.png" alt="">
<img class="happy-frame" src="https://i.ibb.co/Nd07D6qM/IMG-20260903-WA0000-removebg-preview.png" alt="">
<img class="frozen-frame" src="https://i.ibb.co/YT061kxh/1000042452-removebg-preview.png" alt="">
<div class="heart">❤️</div>

/* Tutti i timer del gioco sono cancellabili al salto di wave.
   Il tempo di gioco si ferma durante la scelta dei potenziamenti. */
let gameClock=0,lastClockTime=performance.now(),nextTaskId=1;
let generation=0;
const gameTasks=new Map();
const gameFrames=new Set();
function gameLater(callback,delay){
 const id=nextTaskId++;
 gameTasks.set(id,{callback,due:gameClock+delay,interval:0});
 return id;
}
function gameEvery(callback,delay){
 const id=nextTaskId++;
 gameTasks.set(id,{callback,due:gameClock+delay,interval:delay});
 return id;
}
function cancelTask(id){gameTasks.delete(id);}
function gameFrame(callback){
 const token=generation;
 const id=requestAnimationFrame(function(time){
  gameFrames.delete(id);
  if(token===generation) callback(time);
 });
 gameFrames.add(id);return id;
}
function tickGameClock(now){
 const delta=now-lastClockTime;lastClockTime=now;
 if(!powerUpPaused&&!bossIntroPlaying&&!gameFinished){
  gameClock+=delta;
  for(const [id,task] of Array.from(gameTasks)){
   if(powerUpPaused||bossIntroPlaying||gameFinished) break;
   if(!gameTasks.has(id)||task.due>gameClock) continue;
   if(task.interval) task.due=gameClock+task.interval;
   else gameTasks.delete(id);
   task.callback();
  }
 }
 requestAnimationFrame(tickGameClock);
}
requestAnimationFrame(tickGameClock);
function clearAllTimersBase(){
 generation++;
 gameTasks.clear();
 nextAttackAt.cook=nextAttackAt.waitress=nextAttackAt.seon=0;
 gameFrames.forEach(id=>cancelAnimationFrame(id));gameFrames.clear();
 customerTimer=customer4Timer=cookTimer=waitressAttackTimer=null;
 firstAttackTimer=kitchenDamageTimer=zIndexTimer=waveCheckTimer=null;
 cookAttacking=waitressAttacking=seonAttacking=false;seonAttackTimer=null;
}

function getAvailablePowerUps(){
 const available=[];
 function add(types){types.forEach(type=>{
  if(powerUps[type]<3)available.push({type,level:powerUps[type]+1});
 });}
 add(['pasta','speed','sauce']);
 if(!powerUps.waitress){
  if(currentLevel>=2)available.push({type:'waitress',level:1});
 }else add(['iceShot','iceChain','deepFreeze']);
 if(!powerUps.seon){
  if(currentLevel>=3)available.push({type:'seon',level:1});
 }else add(['hotSplash','caffeineRush','doubleShot']);
 return available;
}
function shuffle(items){
 for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
 return items;
}
function showPowerUpScreen(){
 if(powerUpPaused)return;
 const available=shuffle(getAvailablePowerUps());
 if(!available.length)return;
 // Sblocchi garantiti tra le tre scelte; gli altri pannelli sono mescolati.
 const guaranteed=currentLevel===2?'waitress':currentLevel===3?'seon':null;
 const fixed=available.find(p=>p.type===guaranteed);
 offeredPowerUps=fixed?[fixed,...available.filter(p=>p!==fixed).slice(0,2)]:available.slice(0,3);
 shuffle(offeredPowerUps);
 const options=document.getElementById('powerup-options');options.innerHTML='';
 offeredPowerUps.forEach(p=>{
  const slot=document.createElement('button');slot.type='button';slot.className='powerup-slot';
  if(['seon','hotSplash','caffeineRush','doubleShot'].includes(p.type))slot.classList.add('seon-panel');
  slot.dataset.type=p.type;slot.dataset.level=p.level;
  const image=document.createElement('img');
  const panel=POWER_UP_PANELS[p.type];image.src=Array.isArray(panel)?panel[p.level-1]:panel;
  image.alt=p.type+' '+p.level;slot.appendChild(image);
  slot.addEventListener('click',()=>selectPowerUp(p.type));options.appendChild(slot);
 });
 powerUpPaused=true;
 document.getElementById('game').classList.add('powerup-paused');
 document.getElementById('powerup-overlay').style.display='flex';
}
function selectPowerUpBase(type){
 if(!powerUpPaused)return;
 const choice=offeredPowerUps.find(p=>p.type===type);
 if(!choice||!getAvailablePowerUps().some(p=>p.type===type&&p.level===choice.level))return;
 if(type==='waitress'){powerUps.waitress=true;summonWaitress();}
 else if(type==='seon'){
  powerUps.seon=true;document.getElementById('seon').style.display='block';setActorFrame('seon',0);
 }else{
  powerUps[type]++;
  if(type==='pasta'&&powerUps.pasta===2)pastaSpeedBonus=.15;
 }
 // Caffeine Rush modifica solo la frequenza di Seon Jeong.
 if(type==='caffeineRush')startSeonAttack();
 offeredPowerUps=[];
 document.getElementById('powerup-overlay').style.display='none';
 document.getElementById('powerup-options').innerHTML='';
 powerUpPaused=false;document.getElementById('game').classList.remove('powerup-paused');
 updateEXPBar();
}
function summonWaitress(){document.getElementById('waitress').style.display='block';setWaitressFrame(0);}
function setWaitressFrame(n){setActorFrame('waitress',n);}
function setCookFrame(n){setActorFrame('cook',n);}
function setActorFrame(id,n){
 document.getElementById(id).querySelectorAll('img').forEach((f,i)=>f.classList.toggle('active',i===n));
}
function updateEXPBar(){
 const fill=document.getElementById('exp-fill'),text=document.getElementById('exp-level');
 if(currentLevel>=MAX_LEVEL){currentLevel=MAX_LEVEL;currentEXP=0;fill.style.width='100%';text.textContent='LV MAX';return;}
 fill.style.width=Math.min(100,currentEXP/EXP_REQUIREMENTS[currentLevel-1]*100)+'%';
 text.textContent='LV '+currentLevel;
}
function addEXP(amount){
 if(currentLevel>=MAX_LEVEL) return;
 currentEXP+=amount;let levelUp=false;
 while(currentLevel<MAX_LEVEL&&currentEXP>=EXP_REQUIREMENTS[currentLevel-1]){
  currentEXP-=EXP_REQUIREMENTS[currentLevel-1];currentLevel++;levelUp=true;
 }
 updateEXPBar();if(levelUp) showPowerUpScreen();
}

   if(currentWave!==wave||waveFinished||gameFinished)return;
   const game=document.getElementById('game');
   const start=CUSTOMER_START_Y*game.clientHeight;
   const lanes=LANES.map((_,i)=>i).filter(lane=>customers.every(c=>{
    if(!c.isConnected||c.style.display==='none'||Number(c.dataset.lane)!==lane)return true;
    return hasLaneSpace(start,height,c._walkY*game.clientHeight,c.offsetHeight);
   }));
   if(!lanes.length){gameLater(attempt,100);return;}
   const lane=lanes[Math.floor(Math.random()*lanes.length)];
   createCustomer(templateId,type,config.hp,lane,config.walkTime,false);

   const height=document.getElementById('game').clientHeight;

    const queue=customers.filter(c=>c.isConnected&&c.style.display!=='none'&&Number(c.dataset.lane)===lane)
     .sort((a,b)=>b._walkY-a._walkY);

let waveStartedAt=0;
let priorityCustomer=null,transitionTimers=[],transitionRunning=false;
let servedCustomers=0,stageElapsed=0,lastOffer=[];
const CUSTOMER_ROLES={1:'normal',2:'heavy',3:'normal',4:'normal',5:'heavy',6:'fast',7:'normal',8:'heavy'};
function chooseCustomerType(){
 const normal=[1,3,4,7];
 if(currentWave<3)return normal[Math.floor(Math.random()*normal.length)];
 const roll=Math.random();
 if(roll<.22)return 6;
 if(currentWave>=5&&roll<.47)return [2,5,8][Math.floor(Math.random()*3)];
 return normal[Math.floor(Math.random()*normal.length)];
}
function createCustomer(templateId,type,hp,lane,walkTime,isBoss){
 const role=isBoss?'boss':CUSTOMER_ROLES[type];
 if(role==='fast'){hp=Math.round(hp*.75);walkTime/=1.3;}
 if(role==='heavy'){hp=Math.round(hp*1.4);walkTime/=.8;}
 const c=createCustomerBase(templateId,type,hp,lane,walkTime,isBoss);
 c.dataset.role=role;c._boostUntil=0;
 c.addEventListener('click',e=>{
  e.stopPropagation();if(powerUpPaused||bossIntroPlaying||gameFinished||c.dataset.satisfied==='true')return;
  const previous=priorityCustomer;
  if(previous)previous.classList.remove('priority');
  priorityCustomer=previous===c?null:c;
  if(priorityCustomer)priorityCustomer.classList.add('priority');
 });
 return c;
}
function orderedTargets(){
 const active=customers.filter(c=>c.dataset.satisfied!=='true'&&customerIsVisible(c));
 if(!active.includes(priorityCustomer))priorityCustomer=null;
 active.sort((a,b)=>a===priorityCustomer?-1:b===priorityCustomer?1:b._walkY-a._walkY);
 return active;
}
function getAttackTargets(){return orderedTargets().slice(0,powerUps.pasta>=3?3:powerUps.pasta>=1?2:1);}
function getNearestVisibleCustomer(){return orderedTargets()[0]||null;}
/* Distanza solo all'ingresso: un congelato non ferma il resto della fila. */
function startCustomerMovement(){
 let last=performance.now();
 function move(now){
  const dt=Math.min(Math.max(0,(now-last)/1000),.05);last=now;
  if(!powerUpPaused&&!bossIntroPlaying&&!gameFinished){
   stageElapsed+=dt;
   for(const c of customers){
    if(!c.isConnected||c.style.display==='none'||c.dataset.satisfied==='true')continue;
    const boost=c._boostUntil>gameClock?1.45:1;
    c.classList.toggle('boosted',boost>1);
    if(c.dataset.frozen!=='true')c._walkY=Math.min(CUSTOMER_END_Y,c._walkY+(CUSTOMER_END_Y-CUSTOMER_START_Y)*dt/c._walkTime*boost);
    c.style.top=c._walkY*100+'%';c.dataset.atKitchen=c._walkY>=CUSTOMER_END_Y?'true':'false';
   }
  }
  if(!gameFinished)gameFrame(move);
 }
 gameFrame(move);
}
function satisfyCustomer(c){
 if(!c||!c.isConnected||c.dataset.satisfied==='true')return;
 servedCustomers++;
 if(priorityCustomer===c){c.classList.remove('priority');priorityCustomer=null;}
 satisfyCustomerBase(c);
}
function clearAllTimers(){
 clearAllTimersBase();
 document.querySelectorAll('.camera-light,.flash-ring').forEach(e=>e.remove());
 document.getElementById('bossFlashWash').classList.remove('active');
}
function clearTransition(){transitionTimers.forEach(clearTimeout);transitionTimers=[];transitionRunning=false;}
function beginGame(){
 if(!transitionRunning)return;
 clearTransition();
 document.getElementById('blackTransition').style.display='none';
 document.getElementById('skipTransition').hidden=true;
 launchStage();
}
function launchStage(){
 resetGame();gameStarted=true;
 const game=document.getElementById('game');game.style.display='block';game.style.animation='gameEnter .4s ease-out forwards';
 document.getElementById('testBossButton').hidden=!ENABLE_BOSS_TEST;
 document.getElementById('testGameOverButton').hidden=!ENABLE_GAMEOVER_TEST;
 startWave(1);startGameSystems();
}
document.getElementById('playButton').addEventListener('click',()=>{
 if(!menuReady||transitionRunning||gameStarted)return;
 menuVideo.pause();document.getElementById('menu').style.display='none';
 transitionRunning=true;
 const black=document.getElementById('blackTransition');black.style.display='block';black.style.animation='none';
 document.getElementById('skipTransition').hidden=false;
 const later=(f,ms)=>transitionTimers.push(setTimeout(f,ms));
 later(()=>document.getElementById('transitionImage1').style.animation='transitionFromLeft 1.165s ease-out forwards',2000);
 later(()=>document.getElementById('transitionImage2').style.animation='transitionFromRight 1.165s ease-out forwards',5165);
 later(()=>document.getElementById('transitionImage3').style.animation='transitionFromLeft 2.34s ease-out forwards',8320);
 later(()=>black.style.animation='transitionExit .8s ease-in forwards',15660);
 later(beginGame,16460);
});
document.getElementById('skipTransition').addEventListener('click',beginGame);
function resetGame(){
 document.getElementById('endScreen').hidden=true;
 document.getElementById('gameOverCharacter').removeAttribute('src');
 document.getElementById('game').classList.remove('ended');
 document.getElementById('damageVignette').classList.remove('active');
 priorityCustomer=null;servedCustomers=0;stageElapsed=0;lastOffer=[];
 resetGameBase();
}
const GAME_OVER_ANIMATIONS=[
 'https://raw.githubusercontent.com/backtothemovie2024-afk/tarai-game/main/video_trasparente.webp',
 'https://raw.githubusercontent.com/backtothemovie2024-afk/tarai-game/main/barista_stordita_trasparente%281%29.webp',
 'https://raw.githubusercontent.com/backtothemovie2024-afk/tarai-game/main/cameriera_stordita_trasparente.webp'
];
function endStage(won){
 if(gameFinished)return;
 clearTransition();stopBossIntro();gameFinished=true;powerUpPaused=false;clearAllTimers();
 document.getElementById('powerup-overlay').style.display='none';
 document.getElementById('powerup-options').innerHTML='';offeredPowerUps=[];
 document.getElementById('game').classList.remove('powerup-paused');
 document.querySelectorAll('.pasta,.drink,.cappuccino,.hit-marker,.impact-particle').forEach(e=>e.remove());
 setCookFrame(0);setWaitressFrame(0);setActorFrame('seon',0);
 document.getElementById('endTitle').textContent=won?'STAGE CLEAR!':'GAME OVER';
 document.getElementById('endSubtitle').textContent=won?'SERVIZIO COMPLETATO':'KITCHEN COLLAPSED';
 document.getElementById('endStats').textContent='WAVE '+currentWave+' / 20 · LV '+currentLevel+' · '+servedCustomers+' clienti serviti';
 const endScreen=document.getElementById('endScreen');
 endScreen.classList.toggle('loss',!won);
 const character=document.getElementById('gameOverCharacter');
 if(won)character.removeAttribute('src');
 else character.src=GAME_OVER_ANIMATIONS[Math.floor(Math.random()*GAME_OVER_ANIMATIONS.length)];
 endScreen.hidden=false;
 document.getElementById('testBossButton').hidden=true;
 document.getElementById('testGameOverButton').hidden=true;
 document.getElementById('retryButton').focus();
}
function finishLevel(){endStage(true);}
function showGameOver(){endStage(false);}
document.getElementById('retryButton').addEventListener('click',()=>{if(gameFinished)launchStage();});
document.getElementById('testGameOverButton').addEventListener('click',()=>{
 if(!ENABLE_GAMEOVER_TEST||!gameStarted||gameFinished)return;
 kitchenEnergy=0;updateKitchenEnergy();showGameOver();
});
function updateKitchenEnergy(){
 updateKitchenEnergyBase();
 document.getElementById('kitchenLabel').textContent='CUCINA '+Math.ceil(kitchenEnergy)+'%';
 document.getElementById('kitchenFill').style.width=kitchenEnergy+'%';
 document.getElementById('kitchenFill').style.background=kitchenEnergy>50?'#9de48b':kitchenEnergy>20?'#ffd064':'#ff7968';
 document.getElementById('kitchenMeter').setAttribute('aria-valuenow',kitchenEnergy);
}
function startKitchenEnergySystem(){
 cancelTask(kitchenDamageTimer);
 kitchenDamageTimer=gameEvery(()=>{
  const damage=customers.filter(c=>c.isConnected&&c.dataset.atKitchen==='true'&&c.dataset.satisfied!=='true').length;
  if(!damage)return;
  kitchenEnergy=Math.max(0,kitchenEnergy-damage);updateKitchenEnergy();
  const fx=document.getElementById('damageVignette');fx.classList.remove('active');void fx.offsetWidth;fx.classList.add('active');
  if(kitchenEnergy<=0)showGameOver();
 },2000);
}
/* Una scelta per livello, anche quando due impatti danno EXP insieme. */
function addEXP(amount){
 if(currentLevel>=MAX_LEVEL)return;
 currentEXP+=amount;
 if(!powerUpPaused&&currentEXP>=EXP_REQUIREMENTS[currentLevel-1]){
  currentEXP-=EXP_REQUIREMENTS[currentLevel-1];currentLevel++;showPowerUpScreen();
 }
 updateEXPBar();
}
function selectPowerUp(type){
 if(!powerUpPaused||!offeredPowerUps.some(p=>p.type===type))return;
 lastOffer=offeredPowerUps.map(p=>p.type);
 selectPowerUpBase(type);
 if(!powerUpPaused)addEXP(0);
}
function showPowerUpScreen(){
 if(powerUpPaused||gameFinished)return;
 const available=shuffle(getAvailablePowerUps());if(!available.length)return;
 const selected=[];
 const add=p=>{if(p&&!selected.includes(p)&&selected.length<3)selected.push(p);};
 add(available.find(p=>p.type===(currentLevel===2?'waitress':currentLevel===3?'seon':null)));
 // Almeno una scelta offensiva; poi varietà rispetto al pannello precedente.
 const offense=['pasta','speed','sauce','doubleShot','caffeineRush','hotSplash'];
 if(!selected.some(p=>offense.includes(p.type)))add(available.find(p=>offense.includes(p.type)&&!lastOffer.includes(p.type))||available.find(p=>offense.includes(p.type)));
 for(const p of available.filter(p=>!lastOffer.includes(p.type)))add(p);
 for(const p of available)add(p);
 offeredPowerUps=shuffle(selected);
 const options=document.getElementById('powerup-options');options.innerHTML='';
 for(const p of offeredPowerUps){
  const slot=document.createElement('button');slot.type='button';slot.className='powerup-slot';
  if(['seon','hotSplash','caffeineRush','doubleShot'].includes(p.type))slot.classList.add('seon-panel');
  const image=document.createElement('img'),panel=POWER_UP_PANELS[p.type];image.src=Array.isArray(panel)?panel[p.level-1]:panel;image.alt=p.type+' '+p.level;
  slot.appendChild(image);slot.addEventListener('click',()=>selectPowerUp(p.type));options.appendChild(slot);
 }
 powerUpPaused=true;document.getElementById('game').classList.add('powerup-paused');document.getElementById('powerup-overlay').style.display='flex';
}
/* Punto dell'obiettivo dentro lo sprite (regolabile senza cambiare gli effetti). */
const BOSS_CAMERA_X=.35,BOSS_CAMERA_Y=.21;
function cameraPosition(boss){
 const img=boss.querySelector('.frame.active'),r=(img||boss).getBoundingClientRect(),g=document.getElementById('game').getBoundingClientRect();
 const scale=img&&img.naturalWidth?Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight):1;
 const w=img&&img.naturalWidth?img.naturalWidth*scale:r.width,h=img&&img.naturalHeight?img.naturalHeight*scale:r.height;
 return {x:r.left-g.left+(r.width-w)/2+w*BOSS_CAMERA_X,y:r.top-g.top+(r.height-h)/2+h*BOSS_CAMERA_Y};
}
function startBossFlash(boss){
 const valid=()=>!gameFinished&&boss.isConnected&&boss.dataset.satisfied!=='true';
 function charge(){
  if(!valid())return;
  if(boss.dataset.frozen==='true'){gameLater(charge,500);return;}
  const light=document.createElement('div');light.className='camera-light charging';document.getElementById('game').appendChild(light);
  const follow=()=>{
   if(!light.isConnected||!valid()){light.remove();return;}
   const p=cameraPosition(boss);light.style.left=p.x+'px';light.style.top=p.y+'px';gameFrame(follow);
  };follow();
  gameLater(()=>{
   if(!valid()){light.remove();return;}
   if(boss.dataset.frozen==='true'){light.remove();gameLater(charge,1000);return;}
   light.className='camera-light fired';
   const p=cameraPosition(boss),ring=document.createElement('div');ring.className='flash-ring';ring.style.left=p.x+'px';ring.style.top=p.y+'px';document.getElementById('game').appendChild(ring);
   const wash=document.getElementById('bossFlashWash');wash.classList.remove('active');void wash.offsetWidth;wash.classList.add('active');
   customers.filter(c=>['assistant','cameraman'].includes(c.dataset.type)&&c.dataset.satisfied!=='true').forEach(c=>c._boostUntil=gameClock+4000);
   gameLater(()=>{light.remove();ring.remove();},600);
   gameLater(charge,6300);
  },700);
 }
 gameLater(charge,6000);
}

</script>
