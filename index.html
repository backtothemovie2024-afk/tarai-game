<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#111;
font-family:Arial,sans-serif;
}

#phone{
position:relative;
width:min(100vw,56.25vh);
height:min(100vh,177.7778vw);
aspect-ratio:9/16;
margin:auto;
overflow:hidden;
background:#000;
}

/* ==================================================
   INTRO VIDEO
================================================== */

#intro{
position:absolute;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:1000;
}

#introVideo{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

#introTap{
position:absolute;
inset:0;
z-index:1001;
cursor:pointer;
}

/* ==================================================
   MENU HOME
================================================== */

#menu{
position:absolute;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:100;
}

#cover{
position:absolute;
inset:0;
width:100%;
height:100%;
max-width:100%;
max-height:100%;
object-fit:fill;
display:block;
z-index:10;
}

#coverOverlay{
position:absolute;
inset:0;
width:100%;
height:100%;
max-width:100%;
max-height:100%;
object-fit:fill;
z-index:20;
pointer-events:none;
}

#playButton{
position:absolute;
left:12%;
top:58%;
width:76%;
height:14%;
border:none;
background:transparent;
color:transparent;
font-size:0;
z-index:30;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

/* ==================================================
   TRANSIZIONE NERA DOPO PLAY
================================================== */

#blackTransition{
position:absolute;
inset:0;
background:#000;
display:none;
overflow:hidden;
z-index:2000;
pointer-events:none;
}

.transition-image{
position:absolute;
width:100%;
height:auto;
display:block;
pointer-events:none;
}

#transitionImage1{
top:5%;
left:-100%;
}

#transitionImage2{
top:35%;
right:-100%;
}

#transitionImage3{
bottom:5%;
left:-100%;
}

@keyframes transitionFromLeft{
from{left:-100%;}
to{left:0%;}
}

@keyframes transitionFromRight{
from{right:-100%;}
to{right:0%;}
}

@keyframes transitionExit{
from{
opacity:1;
transform:scale(1);
}
to{
opacity:0;
transform:scale(1.08);
}
}

@keyframes gameEnter{
from{
opacity:0;
transform:scale(0.94);
}
to{
opacity:1;
transform:scale(1);
}
}

/* ==================================================
   GIOCO
================================================== */

#game{
display:none;
position:absolute;
inset:0;
overflow:hidden;
background:#000;
}

#background{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
image-rendering:auto;
z-index:0;
}

#kitchen,
#kitchenDamaged,
#kitchenDestroyed{
position:absolute;
left:50%;
top:83%;
width:115%;
height:auto;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:50;
}

#kitchen{display:block;}

#kitchenDamaged,
#kitchenDestroyed{display:none;}

#hud{
position:absolute;
top:15px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
color:white;
font-size:22px;
font-weight:bold;
z-index:80;
}

#exp-bar{
position:absolute;
left:2.5%;
bottom:1.5%;
width:95%;
height:30px;
background:#321b10;
border:3px solid #8a512d;
border-radius:15px;
box-shadow:
0 4px 0 #160b07,
0 6px 12px rgba(0,0,0,.6),
inset 0 2px 3px rgba(255,255,255,.18);
overflow:hidden;
z-index:200;
}

#exp-fill{
position:absolute;
left:0;
top:0;
width:0%;
height:100%;
background:linear-gradient(
180deg,
#ffe477,
#f5a623 50%,
#d96b16
);
border-radius:10px;
z-index:1;
transition:width .35s ease-out;
}

#exp-level{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:14px;
font-weight:900;
text-shadow:2px 2px 3px #000;
z-index:2;
pointer-events:none;
}

/* ==================================================
   CLIENTI
================================================== */

.customer{
position:absolute;
width:100px;
height:135px;
top:5%;
z-index:10;
}

.customer.walking{
animation:walkDown 60s linear forwards;
}

.customer.satisfied{
animation:none!important;
}

.customer .frame{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
display:none;
}

.customer .frame.active{display:block;}

.customer .happy-frame{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
display:none;
z-index:2;
}

.customer .frozen-frame{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
display:none;
z-index:3;
}

/* ==================================================
   CLIENTE 1
================================================== */

.customer1-sprite{
display:none;
}

.customer1-template .frame{
width:100%;
height:100%;
object-fit:contain;
transform:scale(1);
transform-origin:center bottom;
}

/* ==================================================
   DIMENSIONE CLIENTE 1
================================================== */

.customer1-template{
width:160px;
height:202px;
}
.customer1-template .happy-frame{
transform:scale(0.90);
transform-origin:center bottom;
}
   .customer1-template .frozen-frame{
transform:scale(0.92);
transform-origin:center bottom;
   }
   
   
/* ==================================================
   CLIENTE 2
================================================== */

.customer2-sprite{
display:none;
}

.customer2-sprite + .happy-frame{
width:100%;
height:100%;
object-fit:contain;
left:0%;
}

.customer2-template .frame:nth-of-type(1){
transform:scale(1);
transform-origin:center bottom;
}

.customer2-template .frame:nth-of-type(2){
transform:scale(1);
transform-origin:center bottom;
}

.customer2-template .happy-frame{
width:100%;
height:100%;
object-fit:contain;
left:0%;
transform:scale(1);
transform-origin:center bottom;
}

.customer2-template .frozen-frame{
transform:scale(0.90);
transform-origin:center bottom;
}
   
/* ==================================================
   CLIENTE 3 - 4 - 5
================================================== */

.customer3-template .frame,
.customer3-template .happy-frame,
.customer4-template .frame,
.customer4-template .happy-frame,
.customer5-template .frame,
.customer5-template .happy-frame{
transform-origin:center bottom;
}

/* ==================================================
   CLIENTE 3 - CORREZIONE FRAME
================================================== */

.customer3-template .frame:nth-of-type(1){
transform:translateX(0);
}

.customer3-template .frame:nth-of-type(2){
transform:translateX(14.0625%);
}

.heart{
position:absolute;
left:50%;
top:-18px;
transform:translateX(-50%);
font-size:24px;
line-height:1;
z-index:5;
display:none;
animation:heartFloat .8s ease-in-out infinite alternate;
}

.customer.satisfied .heart{display:block;}

@keyframes heartFloat{
0%{
transform:translateX(-50%) translateY(0) scale(1)
}
100%{
transform:translateX(-50%) translateY(-7px) scale(1.12)
}
}

@keyframes walkDown{
0%{top:8%}
100%{top:69%}
}

/* ==================================================
   CUOCO
================================================== */

#cook,
#waitress{
position:absolute;
bottom:7%;
width:100px;
height:135px;
transform:translateX(-50%);
z-index:60;
}

#cook{
left:37.5%;
bottom:12%;
}

#cook img{
position:absolute;
top:0;
left:0;
width:170%;
height:170%;
object-fit:contain;
display:none;
}

#cook img.active{
display:block;
}

/* ==================================================
   CAMERIERA
================================================== */

#waitress{
left:62.5%;
bottom:6%;
display:none;
overflow:visible;
}

#waitress img{
position:absolute;
left:50%;
bottom:0;
top:auto;
width:104%;
height:104%;
max-width:none;
max-height:none;
object-fit:contain;
display:none;
transform:translateX(-50%);
transform-origin:center bottom;
pointer-events:none;
}

#waitress img.active{
display:block;
}

/* ==================================================
   PASTA / DRINK
================================================== */

.pasta,
.drink{
position:absolute;
width:84px;
height:84px;
object-fit:contain;
z-index:70;
pointer-events:none;
}

.drink{
width:140px;
height:140px;
}

/* ==================================================
   HIT MARKER
================================================== */

.hit-marker{
position:absolute;
width:22px;
height:22px;
border-radius:50%;
background:red;
border:3px solid white;
box-shadow:
0 0 8px red,
0 0 15px rgba(255,0,0,.8);
transform:translate(-50%,-50%);
z-index:90;
pointer-events:none;
opacity:0;
}

/* ==================================================
   EFFETTO IMPATTO PASTA / COCKTAIL
================================================== */

.impact-particle{
position:absolute;
pointer-events:none;
z-index:95;
transform:translate(-50%,-50%);
}

/* GOCCIOLINE COCKTAIL */

.drink-drop{
width:7px;
height:11px;
border-radius:50% 50% 55% 55%;
background:#62d9ff;
box-shadow:0 0 5px rgba(98,217,255,.8);
animation:drinkDropFly .32s ease-out forwards;
}

@keyframes drinkDropFly{

0%{
opacity:1;
transform:
translate(-50%,-50%)
translate(0,0)
scale(1);
}

100%{
opacity:0;
transform:
translate(-50%,-50%)
translate(var(--dx),var(--dy))
scale(.45);
}

}

/* FILI DI PASTA */

.pasta-strand{
width:18px;
height:5px;
border-radius:50%;
background:#ffd45a;
box-shadow:0 0 3px rgba(255,190,40,.8);
transform-origin:center;
animation:pastaStrandFly .36s ease-out forwards;
}

@keyframes pastaStrandFly{

0%{
opacity:1;
transform:
translate(-50%,-50%)
translate(0,0)
rotate(var(--rot))
scaleX(.7);
}

100%{
opacity:0;
transform:
translate(-50%,-50%)
translate(var(--dx),var(--dy))
rotate(calc(var(--rot) + 90deg))
scaleX(1.2);
}

}
   
/* ==================================================
   POWER UP
================================================== */

#powerup-overlay{
position:absolute;
inset:0;
background:rgba(18,8,3,.82);
display:none;
align-items:center;
justify-content:center;
z-index:500;
}

#powerup-panel{
width:103%;
height:91%;
position:relative;
background:transparent;
border:none;
border-radius:0;
box-shadow:none;
padding:0;
}

#powerup-options{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
gap:1.5%;
}

.powerup-slot{
position:relative;
width:32%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.powerup-slot img{
width:100%;
height:100%;
object-fit:contain;
display:block;
pointer-events:none;
}

.powerup-slot img[src*="MkNSjJwS"],
.powerup-slot img[src*="S4pzKRB7"],
.powerup-slot img[src*="yFG9djjL"],

.powerup-slot img[src*="WN2w5Gdr"],
.powerup-slot img[src*="TB2VNLT9"],
.powerup-slot img[src*="v4HTHVvD"],

.powerup-slot img[src*="wN1wThJ4"],
.powerup-slot img[src*="bRBNBZjK"],
.powerup-slot img[src*="9mqm7dsN"],

.powerup-slot img[src*="5WW0VDPS"],

.powerup-slot img[src*="zHJCDX0c"],
.powerup-slot img[src*="Xk49TNxm"],
.powerup-slot img[src*="r2wzK0fM"],

.powerup-slot img[src*="v4dnG4ry"],
.powerup-slot img[src*="GN40kyx"],
.powerup-slot img[src*="YFGsKmf2"],

.powerup-slot img[src*="G4cdTHN6"],
.powerup-slot img[src*="QGT2rB0"],
.powerup-slot img[src*="j9MwgSxz"]{
width:130%;
height:115%;
};

}

#game.powerup-paused *{
animation-play-state:paused!important;
}

/* ==================================================
   WAVE DISPLAY
================================================== */

#wave-display{
position:absolute;
top:52px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:18px;
font-weight:900;
text-shadow:2px 2px 4px #000;
z-index:100;
pointer-events:none;
white-space:nowrap;
}

#wave-message{
position:absolute;
left:50%;
top:45%;
transform:translate(-50%,-50%);
padding:14px 25px;
border-radius:15px;
background:rgba(0,0,0,.72);
color:white;
font-size:25px;
font-weight:900;
text-align:center;
text-shadow:2px 2px 3px #000;
z-index:400;
display:none;
pointer-events:none;
}

/* ==================================================
   MOBILE
================================================== */

@media(max-width:500px){

.customer,
#cook,
#waitress{
width:65px;
height:88px;
}

.customer1-template{
width:80px;
height:108px;
}
   
.customer2-template,
.customer3-template,
.customer4-template,
.customer5-template{
width:75px;
height:102px;
}

.pasta{
width:60px;
height:60px;
}

.drink{
width:60px;
height:60px;
}

#exp-bar{
height:27px;
left:2.5%;
width:95%;
}

#exp-level{
font-size:13px;
}

#powerup-panel{
width:110%;
height:96%;
}

#powerup-options{
gap:0;
}

.powerup-slot{
width:33.33%;
height:100%;
}

.powerup-slot img{
width:110%;
height:96%;
object-fit:contain;
}

#wave-display{
font-size:15px;
top:50px;
}

#wave-message{
font-size:21px;
}

}
</style>

function getAvailablePowerUps(){

let available=[];

if(powerUps.pasta<3){
available.push({
type:"pasta",
level:powerUps.pasta+1
});
}

if(powerUps.speed<3){
available.push({
type:"speed",
level:powerUps.speed+1
});
}

if(powerUps.sauce<3){

type:"sauce",

available.push({

function showPowerUpScreen(){

.style.display="none";

document
.getElementById("game")
.classList.remove("powerup-paused");

powerUpPaused=false;

document.getElementById("powerup-options");

options.innerHTML="";

for(let i=available.length-1;i>0;i--){

const j=
Math.floor(
Math.random()*(i+1)
);

[
available[i],
available[j]
]=[
available[j],
available[i]
];

}

const selected=
available.slice(0,3);

selected.forEach(function(powerUp){

const slot=
document.createElement("div");

slot.className="powerup-slot";

slot.dataset.type=
powerUp.type;

slot.dataset.level=
powerUp.level;

const image=
document.createElement("img");

image.src=
POWER_UP_PANELS.waitress;

}else{

image.src=
POWER_UP_PANELS[
powerUp.type
][powerUp.level-1];

}

image.alt="";
slot.appendChild(image);

slot.addEventListener(
"click",
function(){

selectPowerUp(powerUp.type);

});

options.appendChild(slot);

});

powerUpPaused=true;

document
.getElementById("game")
.classList.add("powerup-paused");

.getElementById("powerup-overlay")

/* ==================================================

================================================== */

function updateEXPBar(){

const fill=
document.getElementById("exp-fill");

const levelText=
document.getElementById("exp-level");

if(currentLevel>=MAX_LEVEL){

currentLevel=MAX_LEVEL;
currentEXP=0;

fill.style.width="100%";
levelText.textContent="LV MAX";

return;
}

const requiredEXP=
EXP_REQUIREMENTS[currentLevel-1];

const percentage=
Math.min(
100,
(currentEXP/requiredEXP)*100
);

fill.style.width=
percentage+"%";

levelText.textContent=
"LV "+currentLevel;

}

/* ==================================================
   AGGIUNGI EXP
================================================== */

function addEXP(amount){

if(currentLevel>=MAX_LEVEL)
return;

currentEXP+=amount;

let levelUp=false;

while(
currentLevel<MAX_LEVEL &&
currentEXP>=
EXP_REQUIREMENTS[currentLevel-1]
){

currentEXP-=
EXP_REQUIREMENTS[currentLevel-1];

currentLevel++;

levelUp=true;

}

updateEXPBar();

if(levelUp){
showPowerUpScreen();
}

}

/* ==================================================
   INIZIO WAVE
================================================== */

function startWave(waveNumber){

if(waveNumber>TOTAL_WAVES){

finishLevel();
return;

}

currentWave=waveNumber;
waveSpawned=0;
waveFinished=false;
waveStarting=true;

updateWaveDisplay();

showWaveMessage(
"WAVE "+currentWave
);

setTimeout(function(){

hideWaveMessage();
waveStarting=false;

if(waveNumber===1){

setTimeout(function(){

spawnWaveCustomers();

},3000);

}else{

spawnWaveCustomers();

}

},1200);

}

/* ==================================================
   CREA CLIENTI DELLA WAVE
================================================== */

function spawnWaveCustomers(){

const config=
WAVES[currentWave-1];

if(!config)
return;

const lastLaneSpawn=[];

for(let i=0;i<LANES.length;i++){

lastLaneSpawn[i]=-Infinity;

}

for(let i=0;i<config.customers;i++){

const delay=
i*config.spawnInterval;

waveTimer=
setTimeout(function(){

if(powerUpPaused){

waitForPowerUpThenSpawn(
i,
lastLaneSpawn,
config
);

}else{

spawnWaveCustomer(
i,
lastLaneSpawn,
config
);

}

},delay);

}

}

/* ==================================================
   ATTESA POWER UP
================================================== */

function waitForPowerUpThenSpawn(
index,
lastLaneSpawn,
config
){

if(powerUpPaused){

setTimeout(function(){

waitForPowerUpThenSpawn(
index,
lastLaneSpawn,
config
);

},250);

return;

}

spawnWaveCustomer(
index,
lastLaneSpawn,
config
);

}

/* ==================================================
   SPAWN SINGOLO CLIENTE
================================================== */

function spawnWaveCustomer(
index,
lastLaneSpawn,
config
){

if(
waveSpawned>=config.customers
)
return;

let laneIndex;
let attempts=0;

const currentTime=
performance.now();

do{

laneIndex=
Math.floor(
Math.random()*LANES.length
);

attempts++;

}while(

attempts<50 &&

currentTime-
lastLaneSpawn[laneIndex]
<
SAME_LANE_MIN_DELAY

);

lastLaneSpawn[laneIndex]=currentTime;

spawnCustomer(
waveSpawned,
laneIndex,
config.walkTime,
config.hp
);

waveSpawned++;

if(
waveSpawned>=config.customers
){

scheduleWaveCheck();

}

}

/* ==================================================
   CONTROLLO FINE WAVE
================================================== */

function scheduleWaveCheck(){

if(waveCheckTimer!==null){

clearInterval(waveCheckTimer);

}

waveCheckTimer=
setInterval(function(){

if(powerUpPaused)
return;

if(waveFinished)
return;

const activeWaveCustomers=
customers.filter(function(customer){

return(
customer &&
customer.dataset.wave==
currentWave &&
customer.style.display!=="none"
);

});

if(

waveSpawned>=
WAVES[currentWave-1].customers

&&

activeWaveCustomers.length===0

){

clearInterval(waveCheckTimer);
waveCheckTimer=null;

completeWave();

}

},500);

}

/* ==================================================
   COMPLETA WAVE
================================================== */

function completeWave(){

if(waveFinished)
return;

waveFinished=true;

if(currentWave>=TOTAL_WAVES){

finishLevel();
return;

}

startWave(
currentWave+1
);

}

================================================== */

showWaveMessage(
"LIVELLO COMPLETATO!"
);

}

/* ==================================================
   CREA CLIENTE
================================================== */

function spawnCustomer(
index,
forcedLaneIndex=null,
walkTime=null,
waveHP=null
){

const game=
document.getElementById("game");

const type=
Math.floor(
Math.random()*5
)+1;

const template=
document.getElementById(
"customer"+
type+
"Template"
);

const customer=
template.cloneNode(true);

customer.id=
"customer-"+
Date.now()+
"-"+
index;

customer.classList.remove(
"customer-template"
);

customer.classList.add(
"spawned-customer"
);

customer.style.display="block";
customer.style.animation="none";

customer.classList.remove(
"satisfied"
);

customer.style.top="5%";

let laneIndex;

if(
forcedLaneIndex!==null &&
forcedLaneIndex!==undefined
){

laneIndex=forcedLaneIndex;

}else{

laneIndex=
Math.floor(
Math.random()*LANES.length
);

}

customer.dataset.lane=
laneIndex;

customer.style.left=
LANES[laneIndex]+"%";

customer.dataset.type=type;

customer.dataset.hp=
String(
waveHP || 30
);

customer.dataset.satisfied="false";
customer.dataset.atKitchen="false";
customer.dataset.frame="0";

customer.dataset.wave=
currentWave;

const frames=
customer.querySelectorAll(
".frame"
);

frames.forEach(function(frame){

frame.classList.remove(
"active"
);

});

if(frames.length>0){

frames[0].classList.add(
"active"
);

}

const happyFrame=
customer.querySelector(
".happy-frame"
);

happyFrame.style.display="none";

game.appendChild(customer);
customers.push(customer);

const actualWalkTime=
walkTime || 60;

requestAnimationFrame(function(){

customer.style.animation=
"walkDown "+
actualWalkTime+
"s linear forwards";

customer.classList.add(
"walking"
);

});

setTimeout(function(){

if(
customer &&
customer.dataset.satisfied!=="true"
){

customer.dataset.atKitchen="true";

updateZIndexes();

}

},actualWalkTime*1000);

}

/* ==================================================
   ENERGIA CUCINA
================================================== */

function startKitchenEnergySystem(){

if(kitchenDamageTimer!==null){

clearInterval(
kitchenDamageTimer
);

}

kitchenDamageTimer=
setInterval(function(){

if(powerUpPaused)
return;

let damage=0;

customers.forEach(function(customer){

if(
customer &&
customer.dataset.atKitchen==="true" &&
customer.dataset.satisfied!=="true"
){

damage++;

}

});

if(damage>0){

kitchenEnergy-=damage;

if(kitchenEnergy<0)
kitchenEnergy=0;

updateKitchenEnergy();

}

},5000);

}

/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(customer){

if(
!customer ||
customer.style.display==="none"
)
return false;

const rect=
customer.getBoundingClientRect();

const game=
document.getElementById("game");

const gameRect=
game.getBoundingClientRect();

return(

rect.bottom>gameRect.top &&

rect.top<gameRect.bottom

);

}

/* ==================================================
   Z INDEX
================================================== */

function startZIndexSystem(){

if(zIndexTimer!==null){

clearInterval(zIndexTimer);

}

zIndexTimer=
setInterval(function(){

if(powerUpPaused)
return;

updateZIndexes();

},50);

}

function updateZIndexes(){

const activeCustomers=
customers.filter(function(customer){

return(
customer &&
customer.style.display!=="none"
);

});

activeCustomers.sort(function(a,b){

const aTop=
a.getBoundingClientRect().top;

const bTop=
b.getBoundingClientRect().top;

return aTop-bTop;

});

activeCustomers.forEach(function(customer,index){

customer.style.zIndex=
10+index;

});

}

/* ==================================================
   CLIENTI DA COLPIRE
================================================== */

function getAttackTargets(){

const activeCustomers=
customers.filter(function(customer){

if(!customer)
return false;

if(customer.style.display==="none")
return false;

if(customer.dataset.satisfied==="true")
return false;

return customerIsVisible(
customer
);

});

activeCustomers.sort(function(a,b){

return(
b.getBoundingClientRect().top-
a.getBoundingClientRect().top
);

});

let numberOfPasta=1;

if(powerUps.pasta===1){

numberOfPasta=2;

}else if(powerUps.pasta===2){

numberOfPasta=2;

}else if(powerUps.pasta>=3){

numberOfPasta=3;

}

return activeCustomers.slice(
0,
numberOfPasta
);

}

/* ==================================================

function getCookAttackInterval(){

1+(powerUps.speed*.33);

(1+pastaSpeedBonus);

return Math.round(
3000/speedMultiplier
);

}

   VELOCITÀ CAMERIERA
================================================== */

function getWaitressAttackInterval(){

getCookAttackInterval()*.67
);

/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer(){

const activeCustomers=
customers.filter(function(customer){

if(!customer)
return false;

if(customer.style.display==="none")
return false;

if(customer.dataset.satisfied==="true")
return false;

return customerIsVisible(
customer
);

});

if(activeCustomers.length===0)
return null;

let nearest=
activeCustomers[0];

let nearestTop=
nearest.getBoundingClientRect().top;

activeCustomers.forEach(function(customer){

const top=
customer.getBoundingClientRect().top;

if(top>nearestTop){

nearest=customer;
nearestTop=top;

}

});

return nearest;

}

/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(target){

if(!target)
return;

if(
target.dataset.satisfied==="true"
)
return;

const cook=
document.getElementById("cook");

const game=
document.getElementById("game");

const gameRect=
game.getBoundingClientRect();

const activeCookFrame=
cook.querySelector("img.active");

if(!activeCookFrame)
return;

const cookRect=
activeCookFrame.getBoundingClientRect();

/* PUNTO MANO SPRITE 4 */

const startX=
cookRect.left+
cookRect.width*.72;

const startY=
cookRect.top+
cookRect.height*.32;

const hitMarker=
document.createElement("div");

hitMarker.className="hit-marker";

game.appendChild(
hitMarker
);

const pasta=
document.createElement("img");

pasta.className="pasta";

pasta.src=
"https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";

game.appendChild(
pasta
);

let currentX=startX;
let currentY=startY;

pasta.style.left=
(
currentX-
gameRect.left-
42
)+"px";

pasta.style.top=
(
currentY-
gameRect.top-
42
)+"px";

const speed=
350*
(1+powerUps.speed*.33)*
(1+pastaSpeedBonus);

let lastTime=
performance.now();

function movePasta(currentTime){

if(
!target ||
target.dataset.satisfied==="true"
){

if(pasta.parentNode)
pasta.remove();

if(hitMarker.parentNode)
hitMarker.remove();

return;

}

if(powerUpPaused){

lastTime=currentTime;

requestAnimationFrame(
movePasta
);

return;

}

const targetRect=
target.getBoundingClientRect();

const endX=
targetRect.left+
targetRect.width/2+
HIT_X;

const endY=
targetRect.top+
targetRect.height*
HIT_POSITION_Y+
HIT_Y;

hitMarker.style.left=
(
endX-
gameRect.left
)+"px";

hitMarker.style.top=
(
endY-
gameRect.top
)+"px";

const deltaTime=
Math.min(
(currentTime-lastTime)/1000,
.05
);

lastTime=currentTime;

const dx=
endX-currentX;

const dy=
endY-currentY;

const distance=
Math.sqrt(
dx*dx+
dy*dy
);

const movement=
speed*deltaTime;

if(distance<=movement){

currentX=endX;
currentY=endY;

}else{

currentX+=
(dx/distance)*
movement;

currentY+=
(dy/distance)*
movement;

}

pasta.style.left=
(
currentX-
gameRect.left-
42
)+"px";

pasta.style.top=
(
currentY-
gameRect.top-
42
)+"px";

const remainingX=
endX-currentX;

const remainingY=
endY-currentY;

const remainingDistance=
Math.sqrt(
remainingX*remainingX+
remainingY*remainingY
);

if(remainingDistance<=3){

hitCustomer(
target,
pasta
);

if(hitMarker.parentNode)
hitMarker.remove();

return;

}

requestAnimationFrame(
movePasta
);

}

requestAnimationFrame(
movePasta
);

}

/* ==================================================
   EFFETTO IMPATTO
================================================== */

function createImpactEffect(customer,type){

if(!customer)
return;

const game=
document.getElementById("game");

const gameRect=
game.getBoundingClientRect();

const rect=
customer.getBoundingClientRect();

const centerX=
rect.left+
rect.width/2-
gameRect.left;

const centerY=
rect.top+
rect.height*.45-
gameRect.top;


/* COCKTAIL = GOCCIOLINE */

if(type==="drink"){

for(let i=0;i<7;i++){

const drop=
document.createElement("div");

drop.className=
"impact-particle drink-drop";

drop.style.left=
centerX+"px";

drop.style.top=
centerY+"px";

const angle=
Math.random()*
Math.PI*2;

const distance=
18+
Math.random()*28;

const dx=
Math.cos(angle)*
distance;

const dy=
Math.sin(angle)*
distance;

drop.style.setProperty(
"--dx",
dx+"px"
);

drop.style.setProperty(
"--dy",
dy+"px"
);

game.appendChild(drop);

setTimeout(function(){

if(drop.parentNode)
drop.remove();

},400);

}

}


/* PASTA = FILI DI SPAGHETTI */

if(type==="pasta"){

for(let i=0;i<6;i++){

const strand=
document.createElement("div");

strand.className=
"impact-particle pasta-strand";

strand.style.left=
centerX+"px";

strand.style.top=
centerY+"px";

const angle=
Math.random()*
Math.PI*2;

const distance=
20+
Math.random()*30;

const dx=
Math.cos(angle)*
distance;

const dy=
Math.sin(angle)*
distance;

const rotation=
Math.floor(
Math.random()*180
);

strand.style.setProperty(
"--dx",
dx+"px"
);

strand.style.setProperty(
"--dy",
dy+"px"
);

strand.style.setProperty(
"--rot",
rotation+"deg"
);

game.appendChild(strand);

setTimeout(function(){

if(strand.parentNode)
strand.remove();

},450);

}

}

}
   
/* ==================================================
   COLPITO DAL DRINK
================================================== */

function hitCustomerWithDrink(
customer,
drink
){

if(drink&&drink.parentNode)
drink.remove();

if(
!customer ||
customer.dataset.satisfied==="true"
)
return;

createImpactEffect(
customer,
"drink"
);

let hp=
parseInt(
customer.dataset.hp||"30"
);

const damage=3;

hp-=damage;

customer.dataset.hp=hp;

if(hp<=0){

satisfyCustomer(
customer
);

}else{

/* 10% CHANCE CONGELAMENTO */

if(Math.random()<0.10){

freezeCustomer(customer);

}

}

}

/* ==================================================
   CONGELAMENTO CAMERIERA
   10% CHANCE - 0.5 SECONDI
================================================== */

function freezeCustomer(customer){

if(
!customer ||
customer.style.display==="none" ||
customer.dataset.satisfied==="true"
)
return;

if(customer._freezeTimer){

clearTimeout(customer._freezeTimer);

}

customer.dataset.frozen="true";

customer.style.animationPlayState="paused";

const normalFrames=
customer.querySelectorAll(".frame");

normalFrames.forEach(function(frame){

frame.classList.remove("active");

});

const frozenFrame=
customer.querySelector(".frozen-frame");

if(frozenFrame){

frozenFrame.style.display="block";

}

customer._freezeTimer=
setTimeout(function(){

if(
customer &&
customer.style.display!=="none" &&
customer.dataset.satisfied!=="true"
){

customer.style.animationPlayState="running";
customer.dataset.frozen="false";

if(frozenFrame){

frozenFrame.style.display="none";

}

const frames=
customer.querySelectorAll(".frame");

let frameIndex=
parseInt(customer.dataset.frame||"0");

if(frameIndex>=frames.length)
frameIndex=0;

frames.forEach(function(frame){

frame.classList.remove("active");

});

if(frames[frameIndex]){

frames[frameIndex].classList.add("active");

}

}

customer._freezeTimer=null;

},500);

}

/* ==================================================
   COLPITO DALLA PASTA
================================================== */

function hitCustomer(
customer,
pasta
){

if(pasta&&pasta.parentNode)
pasta.remove();

if(
!customer ||
customer.dataset.satisfied==="true"
)
return;

createImpactEffect(
customer,
"pasta"
);

let hp=
parseInt(
customer.dataset.hp||"30"
);

const damage=
5+
powerUps.sauce;

hp-=damage;

customer.dataset.hp=hp;

if(hp<=0){

satisfyCustomer(
customer
);

}

}

/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
customer
){

if(
!customer ||
customer.dataset.satisfied==="true"
)
return;

const rect=
customer.getBoundingClientRect();

const game=
document.getElementById(
"game"
);

const gameRect=
game.getBoundingClientRect();

const currentTop=
rect.top-
gameRect.top;

const currentLeft=
rect.left-
gameRect.left;

customer.style.animation="none";

customer.classList.remove(
"walking"
);

customer.classList.add(
"satisfied"
);

customer.style.top=
currentTop+"px";

customer.style.left=
currentLeft+"px";

customer.dataset.satisfied="true";

customer.dataset.atKitchen="false";

addEXP(
EXP_PER_CUSTOMER
);

const normalFrames=
customer.querySelectorAll(
".frame"
);

normalFrames.forEach(function(frame){

frame.classList.remove(
"active"
);

});

const frozenFrame=
customer.querySelector(
".frozen-frame"
);

if(frozenFrame){

frozenFrame.style.display="none";

}
   
const happyFrame=
customer.querySelector(
".happy-frame"
);

happyFrame.style.display="block";

updateZIndexes();

setTimeout(function(){

customer.style.display="none";

happyFrame.style.display="none";

customer.classList.remove(
"satisfied"
);

updateZIndexes();

},1000);

}
