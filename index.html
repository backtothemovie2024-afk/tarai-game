/* [CSS 02.1] ALLINEAMENTO DEGLI OTTO CLIENTI */

.customer.sprite-aligned {
  --client-height:95%;
  --client-ground:100%;
}

.customer1-template {
  --client-height:80.111821%;
}

.customer2-template {
  --client-height:95.000000%;
}

.customer3-template {
  --client-height:95.027624%;
}

.customer4-template {
  --client-height:90.617284%;
}

.customer5-template {
  --client-height:81.175000%;
}

.customer6-template {
  --client-height:84.470247%;
}

.customer7-template {
  --client-height:83.846154%;
}

.customer8-template {
  --client-height:94.498069%;
}

.customer.sprite-aligned > .frame,
.customer.sprite-aligned > .happy-frame,
.customer.sprite-aligned > .frozen-frame {

  top:
    calc(
      var(--client-ground)
      -
      var(--client-height) * var(--asset-bottom)
    );

  left:50%;
  bottom:auto;
  right:auto;

  width:auto;

  height:
    calc(
      var(--client-height)
      *
      var(--asset-height)
    );

  max-width:none;
  max-height:none;

  object-fit:contain;
  object-position:center;

  transform:
    translateX(
      var(--asset-anchor)
    );

  transform-origin:center bottom;

  pointer-events:none;
}

  if (

    intro.style.display === 'none'

    'block';

      menuReady = true;

      document

let gameClock = 0;

let lastClockTime =
  performance.now();

let nextTaskId = 1;

let generation = 0;


const gameTasks =
  new Map();


const gameFrames =
  new Set();



function gameLater(
  callback,
  delay
) {

  const id =
    nextTaskId++;

  gameTasks.set(
    id,
    {
      callback,
      due:
        gameClock
        +
        delay,
      interval:0
    }
  );

  return id;

}



function gameEvery(
  callback,
  delay
) {

  const id =
    nextTaskId++;

  gameTasks.set(
    id,
    {
      callback,
      due:
        gameClock
        +
        delay,
      interval:delay
    }
  );

  return id;

}



function cancelTask(id) {

  gameTasks.delete(id);

}



function gameFrame(callback) {

  const token =
    generation;

  const id =
    requestAnimationFrame(
      function(time) {

        gameFrames.delete(id);

        if (
          token
          ===
          generation
        ) {

          callback(time);

        }

      }
    );

  gameFrames.add(id);

  return id;

}



function tickGameClock(now) {

  const delta =
    now
    -
    lastClockTime;

  lastClockTime =
    now;


  if (
    !powerUpPaused
    &&
    !specialPaused
    &&
    !bossIntroPlaying
    &&
    !gameFinished
  ) {

    gameClock += delta;


    for (
      const [id,task]
      of
      Array.from(gameTasks)
    ) {

      if (
        powerUpPaused
        ||
        specialPaused
        ||
        bossIntroPlaying
        ||
        gameFinished
      ) break;


      if (
        !gameTasks.has(id)
        ||
        task.due > gameClock
      ) continue;


      if (task.interval) {

        task.due =
          gameClock
          +
          task.interval;

      } else {

        gameTasks.delete(id);

      }


      task.callback();

    }

  }


  requestAnimationFrame(
    tickGameClock
  );

}


requestAnimationFrame(
  tickGameClock
);

function getAvailablePowerUps() {

  const available = [];


  function add(types) {

    types.forEach(
      type => {

        if (
          powerUps[type] < 3
        ) {

          available.push(
            {
              type,
              level:
                powerUps[type]
                +
                1
            }
          );

        }

      }
    );

  }


  add([
    'pasta',
    'speed',
    'sauce'
  ]);


  if (
    !powerUps.waitress
  ) {

    if (
      currentLevel >= 2
    ) {

      available.push(
        {
          type:'waitress',
          level:1
        }
      );

    }

  } else {

    add([
      'iceShot',
      'iceChain',
      'deepFreeze'
    ]);

  }


  if (
    !powerUps.seon
  ) {

    if (
      currentLevel >= 3
    ) {

      available.push(
        {
          type:'seon',
          level:1
        }
      );

    }

  } else {

    add([
      'hotSplash',
      'caffeineRush',
      'doubleShot'
    ]);

  }


  return available;

}



function shuffle(items) {

  for (
    let i =
      items.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random()
        *
        (i + 1)
      );


    [
      items[i],
      items[j]
    ]
    =
    [
      items[j],
      items[i]
    ];

  }


  return items;

}



function selectPowerUpBase(type) {

  if (!powerUpPaused) return;


  const choice =
    offeredPowerUps.find(

    !choice
    ||
    !getAvailablePowerUps()
      .some(
        p =>
          p.type === type
          &&
          p.level === choice.level
      )
  ) return;


  if (
    type === 'waitress'
  ) {

    powerUps.waitress =
      true;

    summonWaitress();

function startWave(number) {

  if (
    number > TOTAL_WAVES
  ) {

    finishLevel();

    return;

  }


  waveStartedAt =
    gameClock;


  currentWave =
    number;


  waveSpawned =
    0;


  waveFinished =
    false;


  waveStarting =
    true;


  updateWaveDisplay();


  if (
    number === BOSS_WAVE
  ) {

    showBossIntro();

    return;

  }


  gameLater(
    function() {

      waveStarting =
        false;

      spawnWaveCustomers();

    },

    number === 1
      ?
      4200
      :
      NORMAL_WAVE_DELAY
  );

}



function spawnWaveCustomers() {

  if (
    currentWave === BOSS_WAVE
  ) {

    spawnBossWave();

    return;

  }


  const config =
    WAVES[
      currentWave - 1
    ];


  const wave =
    currentWave;


  if (!config) return;


  function next() {

    if (
      currentWave !== wave
      ||
      waveFinished
      ||
      gameFinished
    ) return;


    const type =
      chooseCustomerType();


    const templateId =
      'customer'
      +
      type
      +
      'Template';


    const height =
      measureCustomerHeight(
        templateId
      );


    function attempt() {

      if (
        currentWave !== wave
        ||
        waveFinished
        ||
        gameFinished
      ) return;


      const game =
        document
          .getElementById('game');


      const start =
        CUSTOMER_START_Y
        *
        game.clientHeight;


      const lanes =
        LANES
          .map(
            (_,i) => i
          )
          .filter(
            lane =>
              customers.every(
                c => {

                  if (
                    !c.isConnected
                    ||
                    c.style.display === 'none'
                    ||
                    Number(c.dataset.lane)
                    !==
                    lane
                  ) return true;


                  return hasLaneSpace(

                    start,

                    height,

                    c._walkY
                    *
                    game.clientHeight,

                    c.offsetHeight

                  );

                }
              )
          );


      if (
        !lanes.length
      ) {

        gameLater(
          attempt,
          100
        );

        return;

      }


      const lane =
        lanes[
          Math.floor(
            Math.random()
            *
            lanes.length
          )
        ];


      createCustomer(

        templateId,

        type,

        config.hp,

        lane,

        config.walkTime,

        false

      );


      waveSpawned++;


      if (
        waveSpawned
        >=
        config.customers
      ) {

        scheduleWaveCheck();

      }

      else {

        gameLater(
          next,
          config.spawnInterval
        );

      }

    }


    attempt();

  }


  next();

}



function measureCustomerHeight(
  templateId
) {

  const probe =
    document
      .getElementById(templateId)
      .cloneNode(true);


  probe.removeAttribute('id');

  probe.style.display =
    'block';

  probe.style.visibility =
    'hidden';


  document
    .getElementById('game')
    .appendChild(probe);


  const height =
    probe.offsetHeight;


  probe.remove();


  return height;

}



function laneTopLimit(
  frontY,
  frontHeight,
  backHeight
) {

  return (
    frontY
    -
    frontHeight * .15
    -
    backHeight
    -
    CUSTOMER_GAP
    *
    Math.max(
      frontHeight,
      backHeight
    )
  );

}



function hasLaneSpace(
  backY,
  backHeight,
  frontY,
  frontHeight
) {

  return (
    backY
    <=
    laneTopLimit(
      frontY,
      frontHeight,
      backHeight
    )
  );

}

let nextCustomerId =
  0;



function createCustomerBase(
  templateId,
  type,
  hp,
  lane,
  walkTime,
  isBoss
) {

  const customer =
    document
      .getElementById(templateId)
      .cloneNode(true);


  customer.id =
    'customer-'
    +
    (++nextCustomerId);


  customer.classList.remove(
    'customer-template',
    'satisfied'
  );


  customer.classList.add(
    'spawned-customer'
  );


  customer.style.display =
    'block';


  customer.style.animation =
    'none';


  customer.style.top =
    (
      CUSTOMER_START_Y
      *
      100
    )
    +
    '%';


  customer.style.left =
    LANES[lane]
    +
    '%';


  Object.assign(
    customer.dataset,
    {

      type:String(type),

      hp:String(hp),

      lane:String(lane),

      satisfied:'false',

      atKitchen:'false',

      frame:'0',

      frozen:'false',

      wave:String(currentWave)

    }
  );


  if (isBoss) {

    customer.dataset.boss =
      'true';

  }


  customer
    .querySelectorAll('.frame')
    .forEach(
      (f,i) =>
        f.classList.toggle(
          'active',
          i === 0
        )
    );


  customer
    .querySelector('.happy-frame')
    .style.display =
      'none';


  const frozen =
    customer
      .querySelector('.frozen-frame');


  if (frozen) {

    frozen.style.display =
      'none';

  }


  document
    .getElementById('game')
    .appendChild(customer);


  customers.push(customer);


  customer._walkY =
    CUSTOMER_START_Y;


  customer._walkTime =
    walkTime;


  customer.style.animation =
    'none';


  customer.classList.add(
    'walking'
  );


  return customer;

}



function scheduleWaveCheck() {

  cancelTask(
    waveCheckTimer
  );


  const interval =
    currentWave
    >=
    BOSS_WAVE - 1
      ?
      500
      :
      250;


  waveCheckTimer =
    gameEvery(
      function() {

        if (
          waveFinished
        ) return;


        const active =
          customers.filter(
            c =>
              c.isConnected
              &&
              c.dataset.wave
              ==
              currentWave
              &&
              c.style.display
              !==
              'none'
          );


        const expected =
          currentWave
          ===
          BOSS_WAVE
            ?
            3
            :
            WAVES[
              currentWave - 1
            ].customers;


        if (
          waveSpawned
          >=
          expected
          &&
          !active.length
        ) {

          cancelTask(
            waveCheckTimer
          );


          waveCheckTimer =
            null;


          completeWave();

        }

      },

      interval

    );

}



function completeWave() {

  if (
    waveFinished
  ) return;


  waveFinished =
    true;


  if (
    currentWave
    >=
    TOTAL_WAVES
  ) {

    finishLevel();

    return;

  }


  const next =
    currentWave
    +
    1;


  startWave(
    next
  );

}

function showBossIntro() {

  stopBossIntro();


  bossIntroPlaying =
    true;


  const session =
    videoSession;


  document
    .getElementById('testBossButton')
    .disabled =
      true;


  bossIntro.style.display =
    'flex';


  void bossIntro.offsetWidth;


  bossIntro.classList.add(
    'entering'
  );


  bossVideo.muted =
    true;


  bossVideo.currentTime =
    0;



  function valid() {

    return (
      session
      ===
      videoSession
      &&
      bossIntroPlaying
      &&
      !bossLeaving
    );

  }



  function showAction(
    text,
    callback
  ) {

    if (!valid()) return;


    bossVideoAction.textContent =
      text;


    bossVideoAction.onclick =
      callback;


    bossVideoAction.hidden =
      false;

  }



  function playVideo() {

    if (!valid()) return;


    bossVideoAction.hidden =
      true;


    const promise =
      bossVideo.play();


    if (promise) {

      promise.catch(
        function(error) {

          if (!valid()) return;


          if (
            error.name
            ===
            'NotAllowedError'
          ) {

            showAction(
              'TOCCA PER AVVIARE IL VIDEO',
              playVideo
            );

          }

          else {

            showAction(
              'VIDEO NON DISPONIBILE · CONTINUA',
              finishBossIntro
            );

          }

        }
      );

    }

  }



  bossVideo.onplaying =
    function() {

      if (valid()) {

        clearTimeout(
          videoWatchdog
        );


        bossVideoAction.hidden =
          true;

      }

    };


  bossVideo.onended =
    function() {

      if (valid()) {

        finishBossIntro();

      }

    };


  bossVideo.onerror =
    function() {

      showAction(
        'VIDEO NON DISPONIBILE · CONTINUA',
        finishBossIntro
      );

    };


  videoWatchdog =
    setTimeout(
      function() {

        if (
          valid()
          &&
          (
            bossVideo.paused
            ||
            bossVideo.readyState < 3
          )
        ) {

          showAction(
            'VIDEO IN CARICAMENTO · SALTA',
            finishBossIntro
          );

        }

      },
      15000
    );


  playVideo();

}



function finishBossIntro() {

  if (
    !bossIntroPlaying
    ||
    bossLeaving
  ) return;


  bossLeaving =
    true;


  bossVideo.pause();


  bossVideoAction.hidden =

    );

 [JS 04] ATTACCHI DEI TRE PERSONAGGI
 ================================================================ */

function startActorAttack(
  actor
) {

  if (
    powerUpPaused
    ||
    specialPaused
    ||
    bossIntroPlaying
    ||
    gameFinished
    ||
    gameClock
      <
      nextAttackAt[actor]
  ) return;


  if (
    actor !== 'cook'
    &&
    !powerUps[actor]
  ) return;


  if (
    actor === 'cook'
      ?
      cookAttacking
      :
      actor === 'waitress'
        ?
        waitressAttacking
        :
        seonAttacking
  ) return;


  const targets =
    actor === 'cook'
      ?
      getAttackTargets()
      :
      [
        getNearestVisibleCustomer()
      ].filter(Boolean);


  if (
    !targets.length
  ) {

    setActorFrame(
      actor,
      0
    );

    return;

  }


  const interval =
    actor === 'cook'
      ?
      getCookAttackInterval()
      :
      actor === 'waitress'
        ?
        getWaitressAttackInterval()
        :
        getSeonAttackInterval();


  const steps =
    actor === 'cook'
      ?
      5
      :
      actor === 'waitress'
        ?
        7
        :
        6;


  const frameTime =
    Math.min(
      160,
      (
        interval - 60
      )
      /
      steps
    );


  const release =
    actor === 'waitress'
      ?
      4
      :
      3;


  const type =
    actor === 'cook'
      ?
      'pasta'
      :
      actor === 'waitress'
        ?
        'drink'
        :
        'cappuccino';


  if (
    actor === 'cook'
  ) {

    cookAttacking =
      true;

  }

  else if (
    actor === 'waitress'
  ) {

    waitressAttacking =
      true;

  }

  else {

    seonAttacking =
      true;

  }


  nextAttackAt[actor] =
    gameClock
    +
    interval;


  setActorFrame(
    actor,
    0
  );


  for (
    let i = 1;

    i < steps;

    i++
  ) {

    gameLater(
      () => {

        setActorFrame(
          actor,
          i
        );


        if (
          i === release
        ) {

          const releaseTargets =
            actor === 'cook'
              ?
              getAttackTargets()
              :
              [
                getNearestVisibleCustomer()
              ].filter(Boolean);


          releaseTargets.forEach(
            target =>
              throwProjectile(
                target,
                type
              )
          );

        }

      },
      i * frameTime
    );

  }


  gameLater(
    () => {

      setActorFrame(
        actor,
        0
      );


      if (
        actor === 'cook'
      ) {

        cookAttacking =
          false;

      }

      else if (
        actor === 'waitress'
      ) {

        waitressAttacking =
          false;

      }

      else {

        seonAttacking =
          false;

      }

    },

    steps
    *
    frameTime

  );

}

/* SEON JEONG */

function hitCustomerWithCoffee(
  customer,
  projectile
) {

  if (projectile) {

    projectile.remove();

  }


  if (
    !customerIsVisible(customer)
    ||
    customer.dataset.satisfied === 'true'
  ) return;


  const damage =
    3
    *
    (
      1
      +
      [
        0,
        .20,
        .40,
        .65
      ][
        powerUps.doubleShot
      ]
    );


  const chance =
    [
      .10,
      .25,
      .45,
      .70
    ][
      powerUps.hotSplash
    ];


  const r =
    customer
      .getBoundingClientRect();


  const radius =
    document
      .getElementById('game')
      .getBoundingClientRect()
      .width
    *
    .32;


  let nearby =
    null;


  let best =
    radius;


  if (
    Math.random() < chance
  ) {

    customers.forEach(
      c => {

        if (
          c === customer
          ||
          !customerIsVisible(c)
          ||
          c.dataset.satisfied === 'true'
        ) return;


        const b =
          c.getBoundingClientRect();


        const distance =
          Math.hypot(

            b.left
            +
            b.width / 2
            -
            r.left
            -
            r.width / 2,

            b.top
            +
            b.height / 2
            -
            r.top
            -
            r.height / 2

          );


        if (
          distance < best
        ) {

          best =
            distance;

          nearby =
            c;

        }

      }
    );

  }



  function hit(c) {

    createImpactEffect(
      c,
      'cappuccino'
    );


    c.dataset.hp =
      String(
        Math.max(
          0,
          Number(c.dataset.hp)
          -
          damage
        )
      );


    if (
      Number(c.dataset.hp)
      <=
      0
    ) {

      satisfyCustomer(
        c,
        'seon'
      );

    }

  }


  hit(customer);


  if (nearby) {

    hit(nearby);

  }

}

function throwProjectile(
  target,
  type,
  special = false
) {

  if (
    !target
    ||
    !target.isConnected
    ||
    target.dataset.satisfied === 'true'
  ) return;


  const isDrink =
    type === 'drink';


  const isCoffee =
    type === 'cappuccino';


  const game =
    document
      .getElementById('game');


  const gameRect =
    game
      .getBoundingClientRect();


  const frame =
    document.querySelector(

      isCoffee
        ?
        '#seon img.active'
        :
        isDrink
          ?
          '#waitress img.active'
          :
          '#cook img.active'

    );


  if (!frame) return;


  const rect =
    frame
      .getBoundingClientRect();


  let currentX =
    rect.left
    +
    rect.width
    *
    (
      isCoffee
        ?
        .72
        :
        isDrink
          ?
          .88
          :
          .72
    );


  let currentY =
    rect.top
    +
    rect.height
    *
    (
      isCoffee
        ?
        .38
        :
        isDrink
          ?
          .34
          :
          .32
    );


  const marker =
    document
      .createElement('div');


  marker.className =
    'hit-marker';


  game.appendChild(
    marker
  );


  const projectile =
    isCoffee
      ?
      makeCappuccino()
      :
      document
        .createElement('img');


  projectile.className =
    type
    +
    (
      special
        ?
        ' special-projectile'
        :
        ''
    );


  if (!isCoffee) {

    projectile.src =
      isDrink
        ?
        'MDk4xzJd_1788234306668-removebg-preview.png'
        :
        'LDw4VzQs_1788013611587-removebg-preview.png';

  }


  game.appendChild(
    projectile
  );


  const pr =
    projectile
      .getBoundingClientRect();


  const halfWidth =
    pr.width / 2;


  const halfHeight =
    pr.height / 2;



  function position() {

    projectile.style.left =
      currentX
      -
      gameRect.left
      -
      halfWidth
      +
      'px';


    projectile.style.top =
      currentY
      -
      gameRect.top
      -
      halfHeight
      +
      'px';

  }


  position();


  const speed =
    special
      ?
      SPECIAL_CONFIG.projectileSpeed
      :
      (
        isDrink
        ||
        isCoffee
      )
        ?
        350
        :
        350
        *
        (
          1
          +
          powerUps.speed * .33
        )
        *
        (
          1
          +
          pastaSpeedBonus
        );


  let lastTime =
    performance.now();



  function move(now) {

    if (
      !target.isConnected
      ||
      target.dataset.satisfied
      ===
      'true'
    ) {

      projectile.remove();

      marker.remove();

      return;

    }


    if (
      powerUpPaused
      ||
      specialPaused
      ||
      bossIntroPlaying
    ) {

      lastTime =
        now;


      gameFrame(
        move
      );


      return;

    }


    const r =
      target
        .getBoundingClientRect();


    const endX =
      r.left
      +
      r.width / 2
      +
      HIT_X;


    const endY =
      r.top
      +
      r.height
      *
      HIT_POSITION_Y
      +
      HIT_Y;


    marker.style.left =
      endX
      -
      gameRect.left
      +
      'px';


    marker.style.top =
      endY
      -
      gameRect.top
      +
      'px';


    const dt =
      Math.min(
        (
          now
          -
          lastTime
        )
        /
        1000,
        .05
      );


    lastTime =
      now;


    const dx =
      endX
      -
      currentX;


    const dy =
      endY
      -
      currentY;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    const movement =
      speed
      *
      dt;


    if (
      distance <= movement
    ) {

      currentX =
        endX;

      currentY =
        endY;

    }

    else {

      currentX +=
        dx
        /
        distance
        *
        movement;


      currentY +=
        dy
        /
        distance
        *
        movement;

    }


    position();


    if (
      Math.hypot(
        endX - currentX,
        endY - currentY
      )
      <=
      3
    ) {

      if (special) {

        hitSpecialProjectile(
          target,
          projectile,
          type
        );

      }

      else if (isCoffee) {

        hitCustomerWithCoffee(
          target,
          projectile
        );

      }

      else if (isDrink) {

        hitCustomerWithDrink(
          target,
          projectile
        );

      }

      else {

        hitCustomer(
          target,
          projectile
        );

      }


      marker.remove();


      return;

    }


    gameFrame(
      move
    );

  }


  gameFrame(
    move
  );

}



/* IMPATTO */

function createImpactEffect(
  customer,
  type
) {

  if (!customer) return;


  const game =
    document
      .getElementById('game');


  const g =
    game
      .getBoundingClientRect();


  const r =
    customer
      .getBoundingClientRect();


  const isDrink =
    type !== 'pasta';


  for (
    let i = 0;

    i <
    (
      isDrink
        ?
        7
        :
        6
    );

    i++
  ) {

    const particle =
      document
        .createElement('div');


    particle.className =
      'impact-particle '
      +
      (
        isDrink
          ?
          'drink-drop'
          :
          'pasta-strand'
      );


    if (
      type === 'cappuccino'
    ) {

      particle.classList.add(
        'coffee-drop'
      );


      particle.style.background =
        i % 2
          ?
          '#a56a38'
          :
          '#ffe4b5';

    }


    particle.style.left =
      r.left
      +
      r.width / 2
      -
      g.left
      +
      'px';


    particle.style.top =
      r.top
      +
      r.height * .45
      -
      g.top
      +
      'px';


    const angle =
      Math.random()
      *
      Math.PI
      *
      2;


    const distance =
      isDrink
        ?
        18
        +
        Math.random() * 28
        :
        20
        +
        Math.random() * 30;


    particle.style.setProperty(
      '--dx',
      Math.cos(angle)
      *
      distance
      +
      'px'
    );


    particle.style.setProperty(
      '--dy',
      Math.sin(angle)
      *
      distance
      +
      'px'
    );


    if (!isDrink) {

      particle.style.setProperty(
        '--rot',
        Math.floor(
          Math.random()
          *
          180
        )
        +
        'deg'
      );

    }


    game.appendChild(
      particle
    );


    gameLater(
      () =>
        particle.remove(),
      isDrink
        ?
        400
        :
        450
    );

  }

}

      1500,
      2000,
      2500
    ][
      powerUps.deepFreeze
    ]

) {

  if (
    !customer
    ||
    !customer.isConnected
    ||
    customer.style.display === 'none'
    ||
    customer.dataset.satisfied === 'true'
  ) return;


  duration =
    Math.max(
      duration,
      (
        customer._freezeUntil
        ||
        0
      )
      -
      gameClock
    );


  customer._freezeUntil =
    gameClock
    +
    duration;


  cancelTask(
    customer._freezeTimer
  );


  customer.dataset.frozen =
    'true';


  customer.style.animationPlayState =
    'paused';


  const frozen =
    customer
      .querySelector('.frozen-frame');


  if (frozen) {

    customer
      .querySelectorAll('.frame')
      .forEach(
        f =>
          f.classList.remove(
            'active'
          )
      );


    frozen.style.display =
      'block';

  }


  customer._freezeTimer =
    gameLater(
      function() {

        if (
          customer.isConnected
          &&
          customer.style.display !== 'none'
          &&
          customer.dataset.satisfied !== 'true'
        ) {

          customer.style.animationPlayState =
            'running';


          customer.dataset.frozen =
            'false';


          if (frozen) {

            frozen.style.display =
              'none';

          }


          const frames =
            customer
              .querySelectorAll('.frame');


          const n =
            parseInt(
              customer.dataset.frame
              ||
              '0'
            )
            %
            frames.length;


          frames.forEach(
            (f,i) =>
              f.classList.toggle(
                'active',
                i === n
              )
          );

        }


        customer._freezeTimer =
          null;

      },

      duration
    );

}



function tryIceChain(
  original
) {

  if (
    powerUps.iceChain <= 0
    ||
    Math.random()
    >=
    [
      0,
      .30,
      .50,
      .75
    ][
      powerUps.iceChain
    ]
  ) return;


  const r =
    original
      .getBoundingClientRect();


  const x =
    r.left
    +
    r.width / 2;


  const y =
    r.top
    +
    r.height / 2;


  let nearest =
    null;


  let best =
    Infinity;


  customers.forEach(
    c => {

      if (
        !c.isConnected
        ||
        c === original
        ||
        c.style.display === 'none'
        ||
        c.dataset.satisfied === 'true'
      ) return;


      const rect =
        c
          .getBoundingClientRect();


      const distance =
        Math.hypot(

          rect.left
          +
          rect.width / 2
          -
          x,

          rect.top
          +
          rect.height / 2
          -
          y

        );


      if (
        distance < best
      ) {

        best =
          distance;

        nearest =
          c;

      }

    }
  );


  if (nearest) {

    freezeCustomer(
      nearest
    );

  }

}

function chooseCustomerType() {

      4,
      7

  if (
    currentWave < 3

    return normal[
      Math.floor(
        Math.random()
        *
        normal.length

    Math.random();


  if (

    return heavy[
      Math.floor(

        heavy.length
      )
    ];

  }


  return normal[
    Math.floor(
      Math.random()
      *
      normal.length
    )
  ];

}



function createCustomer(
  templateId,
  type,
  hp,
  lane,
  walkTime,
  isBoss
) {

  const role =
    isBoss
      ?
      'boss'
      :
      CUSTOMER_ROLES[type];


  if (
    role === 'fast'
  ) {

    hp =
      Math.round(
        hp * .75
      );


    walkTime /=
      1.3;

  }


  if (
    role === 'heavy'
  ) {

    hp =
      Math.round(
        hp * 1.4
      );


    walkTime /=
      .8;

  }


  const c =
    createCustomerBase(

      templateId,

      type,

      hp,

      lane,

      walkTime,

      isBoss

    );


  c.dataset.role =
    role;


  c._boostUntil =
    0;


  c.addEventListener(
    'click',
    e => {

      e.stopPropagation();


      if (
        powerUpPaused
        ||
        specialPaused
        ||
        bossIntroPlaying
        ||
        gameFinished
        ||
        c.dataset.satisfied === 'true'
      ) return;


      const previous =
        priorityCustomer;


      if (previous) {

        previous.classList.remove(
          'priority'
        );

      }


      priorityCustomer =
        previous === c
          ?
          null
          :
          c;


      if (
        priorityCustomer
      ) {

        priorityCustomer.classList.add(
          'priority'
        );

      }

    }
  );


  return c;

}



function orderedTargets() {

  const active =
    customers.filter(
      c =>
        c.dataset.satisfied !== 'true'
        &&
        customerIsVisible(c)
    );


  if (
    !active.includes(
      priorityCustomer
    )
  ) {

    priorityCustomer =
      null;

  }


  active.sort(
    (a,b) =>
      a === priorityCustomer
        ?
        -1
        :
        b === priorityCustomer
          ?
          1
          :
          b._walkY - a._walkY
  );


  return active;

}

function startCustomerMovement() {

  let last =
    performance.now();



  function move(now) {

    const dt =
      Math.min(
        Math.max(
          0,
          (
            now
            -
            last
          )
          /
          1000
        ),
        .05
      );


    last =
      now;


    if (
      !powerUpPaused
      &&
      !specialPaused
      &&
      !bossIntroPlaying
      &&
      !gameFinished
    ) {

      stageElapsed +=
        dt;


      for (
        const c
        of
        customers
      ) {

        if (
          !c.isConnected
          ||
          c.style.display === 'none'
          ||
          c.dataset.satisfied === 'true'
        ) continue;


        const boost =
          c._boostUntil
          >
          gameClock
            ?
            1.45
            :
            1;


        c.classList.toggle(
          'boosted',
          boost > 1
        );


        if (
          c.dataset.frozen
          !==
          'true'
        ) {

          c._walkY =
            Math.min(

              CUSTOMER_END_Y,

              c._walkY
              +
              (
                CUSTOMER_END_Y
                -
                CUSTOMER_START_Y
              )
              *
              dt
              /
              c._walkTime
              *
              boost

            );

        }


        c.style.top =
          c._walkY
          *
          100
          +
          '%';


        c.dataset.atKitchen =
          c._walkY
          >=
          CUSTOMER_END_Y
            ?
            'true'
            :
            'false';

      }

    }


    if (
      !gameFinished
    ) {

      gameFrame(
        move
      );

    }

  }


  gameFrame(
    move
  );

}

/* EXP */

function addEXP(amount) {

  if (
    currentLevel >= MAX_LEVEL
  ) return;


  currentEXP +=
    amount;


  if (
    !powerUpPaused
    &&
    currentEXP
    >=
    EXP_REQUIREMENTS[
      currentLevel - 1
    ]
  ) {

    currentEXP -=
      EXP_REQUIREMENTS[
        currentLevel - 1
      ];


    currentLevel++;


    showPowerUpScreen();

  }


  updateEXPBar();

}



function selectPowerUp(type) {

  if (
    !powerUpPaused
    ||
    !offeredPowerUps.some(
      p =>
        p.type === type
    )
  ) return;


  lastOffer =
    offeredPowerUps.map(
      p => p.type
    );


  selectPowerUpBase(
    type
  );


  if (
    !powerUpPaused
  ) {

    addEXP(0);

  }

}



function showPowerUpScreen() {

  if (
    powerUpPaused
    ||
    gameFinished
  ) return;


  const available =
    shuffle(
      getAvailablePowerUps()
    );


  if (
    !available.length
  ) return;


  const selected =
    [];


  const add =
    p => {

      if (
        p
        &&
        !selected.includes(p)
        &&
        selected.length < 3
      ) {

        selected.push(p);

      }

    };


  add(
    available.find(
      p =>
        p.type
        ===
        (
          currentLevel === 2
            ?
            'waitress'
            :
            currentLevel === 3
              ?
              'seon'
              :
              null
        )
    )
  );


  const offense =
    [
      'pasta',
      'speed',
      'sauce',
      'doubleShot',
      'caffeineRush',
      'hotSplash'
    ];


  if (
    !selected.some(
      p =>
        offense.includes(
          p.type
        )
    )
  ) {

    add(
      available.find(
        p =>
          offense.includes(
            p.type
          )
          &&
          !lastOffer.includes(
            p.type
          )
      )
      ||
      available.find(
        p =>
          offense.includes(
            p.type
          )
      )
    );

  }


  for (
    const p
    of
    available.filter(
      p =>
        !lastOffer.includes(
          p.type
        )
    )
  ) {

    add(p);

  }


  for (
    const p
    of
    available
  ) {

    add(p);

  }


  offeredPowerUps =
    shuffle(
      selected
    );


  const options =
    document
      .getElementById('powerup-options');


  options.innerHTML =
    '';


  for (
    const p
    of
    offeredPowerUps
  ) {

    const slot =
      document
        .createElement('button');


    slot.type =
      'button';


    slot.className =
      'powerup-slot';


    if (
      [
        'seon',
        'hotSplash',
        'caffeineRush',
        'doubleShot'
      ]
      .includes(
        p.type
      )
    ) {

      slot.classList.add(
        'seon-panel'
      );

    }


    const image =
      document
        .createElement('img');


    const panel =
      POWER_UP_PANELS[
        p.type
      ];


    image.src =
      Array.isArray(panel)
        ?
        panel[
          p.level - 1
        ]
        :
        panel;


    image.alt =
      p.type
      +
      ' '
      +
      p.level;


    slot.appendChild(
      image
    );


    slot.addEventListener(
      'click',
      () =>
        selectPowerUp(
          p.type
        )
    );


    options.appendChild(
      slot
    );

  }


  powerUpPaused =
    true;


  document
    .getElementById('game')
    .classList
    .add(
      'powerup-paused'
    );


  document
    .getElementById('powerup-overlay')
    .style.display =
      'flex';


  lockPowerUpBackground(
    true
  );


  options
    .querySelector('button')
    ?.focus();

}

const BOSS_CAMERA_X =
  .35;


const BOSS_CAMERA_Y =
  .21;



function cameraPosition(
  boss,
  cameraX = BOSS_CAMERA_X,
  cameraY = BOSS_CAMERA_Y
) {

  const img =
    boss
      .querySelector(
        '.frame.active'
      );


  const r =
    (
      img
      ||
      boss
    )
    .getBoundingClientRect();


  const g =
    document
      .getElementById('game')
      .getBoundingClientRect();


  const scale =
    img
    &&
    img.naturalWidth
      ?
      Math.min(
        r.width / img.naturalWidth,
        r.height / img.naturalHeight
      )
      :
      1;


  const w =
    img
    &&
    img.naturalWidth
      ?
      img.naturalWidth
      *
      scale
      :
      r.width;


  const h =
    img
    &&
    img.naturalHeight
      ?
      img.naturalHeight
      *
      scale
      :
      r.height;


  return {

    x:
      r.left
      -
      g.left
      +
      (
        r.width - w
      )
      /
      2
      +
      w
      *
      cameraX,

    y:
      r.top
      -
      g.top
      +
      (
        r.height - h
      )
      /
      2
      +
      h
      *
      cameraY

  };

}



function startBossFlash(
  boss
) {

  const BOSS_GIF_CYCLE_MS =
    7500;


  const BOSS_SUMMON_CHANCE =
    .50;


  const BOSS_PHOTOS = [

    {
      at:3080,
      cameraX:.11,
      cameraY:.21
    },

    {
      at:6830,
      cameraX:.80,
      cameraY:.21
    }

  ];


  const valid =
    () =>
      !gameFinished
      &&
      boss.isConnected
      &&
      boss.dataset.satisfied
      !==
      'true';



  function restartBossGif() {

    const gif =
      boss
        .querySelector(
          '.boss-foodie-gif'
        );


    if (
      !gif
      ||
      !valid()
    ) return;


    const source =
      gif
        .getAttribute('src');


    gif.removeAttribute(
      'src'
    );


    void gif.offsetWidth;


    gif.setAttribute(
      'src',
      source
    );

  }



  function summonTwoRandomCustomers() {

    let remaining =
      2;


    const config =
      WAVES[
        BOSS_WAVE - 2
      ]
      ||
      WAVES[
        WAVES.length - 2
      ];



    function summonOne() {

      if (
        !valid()
        ||
        !remaining
      ) return;


      const game =
        document
          .getElementById('game');


      const startY =
        CUSTOMER_START_Y
        *
        game.clientHeight;


      const height =
        measureCustomerHeight(
          'customer1Template'
        );


      const lanes =
        LANES
          .map(
            (_,i) => i
          )
          .filter(
            lane =>
              customers.every(
                c => {

                  if (
                    !c.isConnected
                    ||
                    c.style.display === 'none'
                    ||
                    Number(c.dataset.lane)
                    !==
                    lane
                  ) return true;


                  return hasLaneSpace(

                    startY,

                    height,

                    c._walkY
                    *
                    game.clientHeight,

                    c.offsetHeight

                  );

                }
              )
          );


      if (
        !lanes.length
      ) {

        return gameLater(
          summonOne,
          100
        );

      }


      const type =
        chooseCustomerType();


      const lane =
        lanes[
          Math.floor(
            Math.random()
            *
            lanes.length
          )
        ];


      const customer =
        createCustomer(

          'customer'
          +
          type
          +
          'Template',

          type,

          config.hp,

          lane,

          config.walkTime,

          false

        );


      customer.dataset.wave =
        String(
          currentWave
        );


      customer.dataset.bossSummon =
        'true';


      remaining--;


      if (
        remaining
      ) {

        gameLater(
          summonOne,
          180
        );

      }

    }


    summonOne();

  }



  function firePhoto(
    photo
  ) {

    if (
      !valid()
      ||
      boss.dataset.frozen === 'true'
    ) return;


    const p =
      cameraPosition(
        boss,
        photo.cameraX,
        photo.cameraY
      );


    const light =
      document
        .createElement('div');


    light.className =
      'camera-light fired';


    light.style.left =
      p.x
      +
      'px';


    light.style.top =
      p.y
      +
      'px';


    const ring =
      document
        .createElement('div');


    ring.className =
      'flash-ring';


    ring.style.left =
      p.x
      +
      'px';


    ring.style.top =
      p.y
      +
      'px';


    const game =
      document
        .getElementById('game');


    game.append(
      light,
      ring
    );


    const wash =
      document
        .getElementById('bossFlashWash');


    wash.classList.remove(
      'active'
    );


    void wash.offsetWidth;


    wash.classList.add(
      'active'
    );


    if (
      Math.random()
      <
      BOSS_SUMMON_CHANCE
    ) {

      summonTwoRandomCustomers();

    }


    gameLater(
      () => {

        light.remove();

        ring.remove();

      },
      650
    );

  }



  function runGifCycle() {

    if (
      !valid()
    ) return;


    restartBossGif();


    BOSS_PHOTOS.forEach(
      photo =>
        gameLater(
          () =>
            firePhoto(
              photo
            ),
          photo.at
        )
    );


    gameLater(
      runGifCycle,
      BOSS_GIF_CYCLE_MS
    );

  }


  runGifCycle();

}

          )
      );

  );


  new ResizeObserver(

      Object.values(
        specialButtons
      )

      )
  )
  .observe(

  );

function layoutTicketLights(
  button
) {

  const img =
    button
      .querySelector('img');


  if (
    !img.naturalWidth
    ||
    !button.clientHeight
  ) return;


  const factor =
    Math.min(

      button.clientWidth
      /
      img.naturalWidth,

      button.clientHeight
      /
      img.naturalHeight

    );


  const w =
    img.naturalWidth
    *
    factor;


  const h =
    img.naturalHeight
    *
    factor;


  const x =
    (
      button.clientWidth
      -
      w
    )
    /
    2;


  const y =
    (
      button.clientHeight
      -
      h
    )
    /
    2;


  button
    .querySelectorAll(
      '.special-ticket-light, .special-ticket-check'
    )
    .forEach(
      light => {

        const i =
          Number(
            light.dataset.ticket
          );


        light.style.fontSize =
          w * .19
          +
          'px';


        light.style.left =
          (
            x
            +
            w
            *
            (
              .185
              +
              i * .215
            )
          )
          +
          'px';


        light.style.top =
          (
            y
            +
            h * .67
          )
          +
          'px';


        light.style.width =
          w * .18
          +
          'px';


        light.style.height =
          h * .21
          +
          'px';


        light.style.transform =
          'rotate('
          +
          [
            -8,
            0,
            8
          ][i]
          +
          'deg)';

      }
    );

}



function updateSpecialPanels() {

  for (
    const actor
    of
    [
      'cook',
      'waitress',
      'seon'
    ]
  ) {

    const button =
      specialButtons[
        actor
      ];


    if (!button) continue;


    const amount =
      specialCharge[
        actor
      ];


    const ready =
      amount
      >=
      SPECIAL_CONFIG.killsRequired;


    button.hidden =
      !actorIsSummoned(
        actor
      );


    button.disabled =
      !ready;


    button.classList.toggle(
      'ready',
      ready
    );


    button.setAttribute(
      'aria-label',

      SPECIAL_CONFIG[actor].name
      +
      ': '
      +
      amount
      +
      '/'
      +
      SPECIAL_CONFIG.killsRequired
      +
      (
        ready
          ?
          ', pronta'
          :
          ''
      )
    );


    button
      .querySelector(
        '.special-counter'
      )
      .textContent =
        ready
          ?
          'READY'
          :
          amount
          +
          '/'
          +
          SPECIAL_CONFIG.killsRequired;


    button
      .querySelectorAll(
        '.special-ticket-light'
      )
      .forEach(
        (light,i) => {

          const part =
            SPECIAL_CONFIG.killsRequired
            /
            3;


          light.style.setProperty(

            '--fill',

            Math.max(
              0,
              Math.min(
                1,
                (
                  amount
                  -
                  i * part
                )
                /
                part
              )
            )
            *
            100
            +
            '%'

          );

        }
      );


    button
      .querySelectorAll(
        '.special-ticket-check'
      )
      .forEach(
        (check,i) => {

          check.hidden =
            amount
            <
            (
              i + 1
            )
            *
            SPECIAL_CONFIG.killsRequired
            /
            3;

        }
      );


    layoutTicketLights(
      button
    );

  }

}



function creditSpecialKill(
  actor
) {

  if (
    !(actor in specialCharge)
    ||
    !actorIsSummoned(actor)
  ) return;


  specialCharge[actor] =
    Math.min(

      SPECIAL_CONFIG.killsRequired,

      specialCharge[actor]
      +
      1

    );


  updateSpecialPanels();

}



function resetSpecials() {

  cancelSpecialPresentation();


  espressoUntil =
    0;


  for (
    const actor
    in
    specialCharge
  ) {

    specialCharge[actor] =
      0;

  }


  updateSpecialPanels();

}



function snapshotAnimatedCustomers() {

  document
    .querySelectorAll(
      '.spawned-customer .walk-gif.active'
    )
    .forEach(
      img => {

        if (
          !img.complete
          ||
          !img.naturalWidth
          ||
          getComputedStyle(img).display
          ===
          'none'
        ) return;


        const canvas =
          document
            .createElement('canvas');


        canvas.width =
          img.naturalWidth;


        canvas.height =
          img.naturalHeight;


        try {

          canvas
            .getContext('2d')
            .drawImage(
              img,
              0,
              0
            );

        }

        catch (_) {

          return;

        }


        const style =
          getComputedStyle(img);


        for (
          const key
          of
          [
            'position',
            'left',
            'top',
            'width',
            'height',
            'transform',
            'transformOrigin',
            'zIndex',
            'filter'
          ]
        ) {

          canvas.style[key] =
            style[key];

        }


        canvas.style.pointerEvents =
          'none';


        img.parentNode.appendChild(
          canvas
        );


        pausedImageSnapshots.push(
          {
            img,
            canvas,
            visibility:
              img.style.visibility
          }
        );


        img.style.visibility =
          'hidden';

      }
    );

}



function restoreAnimatedCustomers() {

  pausedImageSnapshots.forEach(
    (
      {
        img,
        canvas,
        visibility
      }
    ) => {

      img.style.visibility =
        visibility;


      canvas.remove();

    }
  );


  pausedImageSnapshots =
    [];

}



function cancelSpecialPresentation() {

  specialSession++;


  clearTimeout(
    specialPresentationTimer
  );


  specialPresentationTimer =
    null;


  specialPaused =
    false;


  document
    .getElementById('specialPresentation')
    .hidden =
      true;


  document
    .getElementById('game')
    .classList
    .remove(
      'special-paused'
    );


  restoreAnimatedCustomers();

}



function activateSpecial(
  actor
) {

  if (
    !gameStarted
    ||
    gameFinished
    ||
    powerUpPaused
    ||
    bossIntroPlaying
    ||
    specialPaused
    ||
    !actorIsSummoned(actor)
    ||
    !(actor in specialCharge)
    ||
    specialCharge[actor]
      <
      SPECIAL_CONFIG.killsRequired
  ) return;


  if (
    !orderedTargets().length
  ) return;


  specialCharge[actor] =
    0;


  updateSpecialPanels();


  specialPaused =
    true;


  lastClockTime =
    performance.now();


  snapshotAnimatedCustomers();


  document
    .getElementById('game')
    .classList
    .add(
      'special-paused'
    );


  const overlay =
    document
      .getElementById('specialPresentation');


  const art =
    document
      .getElementById('specialArtwork');


  const fallback =
    document
      .getElementById('specialFallback');


  overlay.dataset.actor =
    actor;


  const preload =
    specialPreloads[
      actor
    ];


  const loaded =
    preload.complete
    &&
    preload.naturalWidth > 0;


  art.style.display =
    loaded
      ?
      'block'
      :
      'none';


  art.src =
    SPECIAL_CONFIG[
      actor
    ].artwork;


  art.alt =
    SPECIAL_CONFIG[
      actor
    ].name;


  fallback.textContent =
    loaded
      ?
      ''
      :
      SPECIAL_CONFIG[
        actor
      ].name;


  overlay.hidden =
    false;


  const session =
    ++specialSession;


  specialPresentationTimer =
    setTimeout(
      () => {

        if (
          session
          !==
          specialSession
        ) return;


        cancelSpecialPresentation();


        lastClockTime =
          performance.now();


        if (
          !gameStarted
          ||
          gameFinished
        ) return;


        applySpecial(
          actor
        );

      },

      SPECIAL_CONFIG.presentationMs
    );

}



function applySpecial(
  actor
) {

  if (
    actor === 'cook'
  ) {

    const volley =
      () =>
        orderedTargets()
          .slice(
            0,
            SPECIAL_CONFIG.chefTargets
          )
          .forEach(
            target =>
              throwProjectile(
                target,
                'pasta',
                true
              )
          );


    volley();


    for (
      let i = 1;

      i < SPECIAL_CONFIG.chefVolleys;

      i++
    ) {

      gameLater(
        volley,
        i
        *
        SPECIAL_CONFIG.volleyIntervalMs
      );

    }

  }

  else if (
    actor === 'waitress'
  ) {

    orderedTargets()
      .forEach(
        target =>
          hitSpecialProjectile(
            target,
            null,
            'drink'
          )
      );

  }

  else if (
    actor === 'seon'
  ) {

    espressoUntil =
      gameClock
      +
      SPECIAL_CONFIG.espressoMs;


    for (
      const member
      in
      nextAttackAt
    ) {

      nextAttackAt[member] =
        gameClock
        +
        Math.max(
          0,
          nextAttackAt[member]
          -
          gameClock
        )
        /
        1.5;

    }


    document
      .getElementById('game')
      .classList
      .add(
        'espresso-active'
      );


    gameLater(
      () => {

        espressoUntil =
          0;


        document
          .getElementById('game')
          .classList
          .remove(
            'espresso-active'
          );

      },

      SPECIAL_CONFIG.espressoMs
    );

  }

}



function hitSpecialProjectile(
  customer,
  projectile,
  type
) {

  if (projectile) {

    projectile.remove();

  }


  if (
    !customerIsVisible(customer)
    ||
    customer.dataset.satisfied === 'true'
  ) return;


  createImpactEffect(
    customer,
    type
  );


  const chef =
    type === 'pasta';


  const damage =
    chef
      ?
      (
        5
        +
        powerUps.sauce
      )
      *
      SPECIAL_CONFIG.chefDamageMultiplier
      :
      SPECIAL_CONFIG.waitressDamage;


  customer.dataset.hp =
    Math.max(

      0,

      Number(
        customer.dataset.hp
      )
      -
      damage

    );


  if (
    Number(
      customer.dataset.hp
    )
    <=
    0
  ) {

    satisfyCustomer(
      customer,
      chef
        ?
        'cook'
        :
        'waitress',
      false
    );

  }

  else if (
    !chef
  ) {

    freezeCustomer(

      customer,

      customer.dataset.boss
      ===
      'true'
        ?
        SPECIAL_CONFIG.bossFreezeMs
        :
        SPECIAL_CONFIG.freezeMs

    );

  }

}



/* POWERUP INPUT LOCK */

function lockPowerUpBackground(
  locked
) {

  for (
    const child
    of
    document
      .getElementById('game')
      .children
  ) {

    if (
      child.id
      !==
      'powerup-overlay'
    ) {

      child.inert =
        locked;

    }

  }

}



function guardPowerUpInput(
  event
) {

  if (
    !powerUpPaused
  ) return;


  const options =
    document
      .getElementById('powerup-options');


  const slot =
    event.target
      .closest?.(
        'button.powerup-slot'
      );


  const allowed =
    slot
    &&
    options.contains(slot);


  if (
    event.type === 'keydown'
    &&
    event.key === 'Tab'
  ) {

    const cards =
      Array.from(
        options
          .querySelectorAll(
            'button.powerup-slot'
          )
      );


    if (
      cards.length
    ) {

      const index =
        cards.indexOf(
          document.activeElement
        );


      cards[
        (
          index
          +
          (
            event.shiftKey
              ?
              cards.length - 1
              :
              1
          )
        )
        %
        cards.length
      ]
      .focus();

    }


    event.preventDefault();


    event.stopImmediatePropagation();


    return;

  }


  if (
    !allowed
  ) {

    event.preventDefault();


    event.stopImmediatePropagation();

  }

}



for (
  const type
  of
  [
    'pointerdown',
    'pointerup',
    'click',
    'touchstart',
    'touchend',
    'keydown'
  ]
) {

  document.addEventListener(

    type,

    guardPowerUpInput,

    {
      capture:true,
      passive:false
    }

  );

}



initSpecialPanels();

</script>

</body>
