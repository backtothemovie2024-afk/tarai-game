<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);
    aspect-ratio: 9 / 16;
    margin: auto;
    overflow: hidden;
    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {
    position: absolute;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#cover {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 10;
}

#playButton {
    position: absolute;
    bottom: 12%;
    width: 60%;
    max-width: 240px;
    height: 70px;
    border: none;
    border-radius: 18px;
    background: #ef6428;
    color: white;
    font-size: 28px;
    font-weight: bold;
    z-index: 30;
}


/* ==================================================
   GIOCO
================================================== */

#game {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: black;
}

#background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {
    position: absolute;
    left: 50%;
    top: 83%;
    width: 115%;
    height: auto;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 50;
}

#kitchen {
    display: block;
}

#kitchenDamaged {
    display: none;
}

#kitchenDestroyed {
    display: none;
}


/* ==================================================
   HUD
================================================== */

#hud {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-size: 22px;
    font-weight: bold;
    z-index: 80;
}


/* ==================================================
   BARRA EXP
================================================== */

#exp-bar {
    position: absolute;
    left: 2.5%;
    bottom: 1.5%;
    width: 95%;
    height: 30px;
    background: #321b10;
    border: 3px solid #8a512d;
    border-radius: 15px;
    box-shadow:
        0 4px 0 #160b07,
        0 6px 12px rgba(0,0,0,0.6),
        inset 0 2px 3px rgba(255,255,255,0.18);
    overflow: hidden;
    z-index: 200;
}

#exp-fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 0%;
    height: 100%;
    background:
        linear-gradient(
            180deg,
            #ffe477,
            #f5a623 50%,
            #d96b16
        );
    border-radius: 10px;
    z-index: 1;
    transition: width 0.35s ease-out;
}

#exp-level {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    font-weight: 900;
    text-shadow:
        2px 2px 3px #000;
    z-index: 2;
    pointer-events: none;
}


/* ==================================================
   CLIENTI
================================================== */

.customer {
    position: absolute;
    width: 100px;
    height: 135px;
    top: -130px;
    z-index: 10;
}

.customer.walking {
    animation:
        walkDown
        60s
        linear
        forwards;
}

.customer.satisfied {
    animation: none !important;
}

.customer .frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

.customer .frame.active {
    display: block;
}

.customer .happy-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    z-index: 2;
}

.heart {
    position: absolute;
    left: 50%;
    top: -18px;
    transform: translateX(-50%);
    font-size: 24px;
    line-height: 1;
    z-index: 5;
    display: none;
    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;
}

.customer.satisfied .heart {
    display: block;
}

@keyframes heartFloat {

    0% {
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

    100% {
        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);
    }

}

@keyframes walkDown {

    0% {
        top: -130px;
    }

    100% {
        top: 69%;
    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {
    position: absolute;
    left: 43%;
    bottom: 7%;
    width: 100px;
    height: 135px;
    transform: translateX(-50%);
    z-index: 60;
}

#cook img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

#cook img.active {
    display: block;
}


/* ==================================================
   PASTA
================================================== */

.pasta {
    position: absolute;
    width: 84px;
    height: 84px;
    object-fit: contain;
    z-index: 70;
    pointer-events: none;
}


/* ==================================================
   HITBOX INVISIBILE
================================================== */

.hit-marker {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: red;
    border: 3px solid white;
    box-shadow:
        0 0 8px red,
        0 0 15px rgba(255,0,0,0.8);
    transform: translate(-50%, -50%);
    z-index: 90;
    pointer-events: none;
    opacity: 0;
}


/* ==================================================
   POWER UP
================================================== */

#powerup-overlay {

    position: absolute;

    inset: 0;

    background: rgba(18, 8, 3, 0.82);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 500;

}


#powerup-panel {

    width: 92%;

    max-width: 430px;

    height: 560px;

    background-image:
        url("https://i.ibb.co/60d5SFdx/1788123346934-removebg-preview.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: 100% 100%;

    border: none;

    border-radius: 0;

    box-shadow: none;

    padding: 0;

    position: relative;

}


/* ==================================================
   I 3 RIQUADRI DEL PANNELLO
================================================== */

#powerup-options {

    position: absolute;

    left: 8%;

    right: 8%;

    top: 28%;

    height: 44%;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 3%;

    align-items: center;

    justify-items: center;

}


/* ==================================================
   SINGOLO POWER UP
================================================== */

.powerup-option {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

}


/* ==================================================
   IMMAGINI POWER UP
================================================== */

.powerup-option img {

    width: 72%;

    height: 72%;

    object-fit: contain;

    display: block;

    pointer-events: none;

}


/* PASTA PIÙ PICCOLA E CENTRATA */

.powerup-option.pasta-option img {

    width: 62%;

    height: 62%;

}


/* TIMER PIÙ PICCOLO E CENTRATO */

.powerup-option.speed-option img {

    width: 62%;

    height: 62%;

}


/* PEPERONCINO */

.powerup-option.sauce-option img {

    width: 72%;

    height: 72%;

}


/* ==================================================
   PAUSA ANIMAZIONI
================================================== */

#game.powerup-paused * {
    animation-play-state: paused !important;
}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer,
    #cook {

        width: 65px;

        height: 88px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }


    #exp-bar {

        height: 27px;

        left: 2.5%;

        width: 95%;

    }


    #exp-level {

        font-size: 13px;

    }


    #powerup-panel {

        width: 94%;

        height: 560px;

    }


    #powerup-options {

        left: 8%;

        right: 8%;

        top: 28%;

        height: 44%;

        gap: 2%;

    }


    .powerup-option.pasta-option img,
    .powerup-option.speed-option img {

        width: 58%;

        height: 58%;

    }

}

</style>

</head>

<script>


/* ==================================================
   REGOLAZIONE HITBOX
================================================== */

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;



/* ==================================================
   IMPOSTAZIONI WAVE 1
================================================== */

const TOTAL_CUSTOMERS = 10;

const FIRST_SPAWN_SECOND = 1;

const LAST_SPAWN_SECOND = 60;

const CUSTOMER_WALK_TIME = 70;


const LANES = [

    28,
    39,
    50,
    61,
    72

];



/* ==================================================
   SISTEMA EXP
================================================== */

let currentLevel = 1;

let currentEXP = 0;

const EXP_PER_CUSTOMER = 5;

const EXP_REQUIREMENTS = [

    15,
    20,
    25,
    30,
    35,
    40,
    45,
    50,
    55,
    60,
    65

];

const MAX_LEVEL = 12;



/* ==================================================
   POWER UP
================================================== */

/*
   I tre tipi sono:

   pasta = quantità di pasta lanciata
   speed = velocità di attacco
   sauce = danno

   Ogni tipo può arrivare al livello 3.
*/

let powerUps = {

    pasta: 0,

    speed: 0,

    sauce: 0

};


let powerUpPaused = false;


/*
   Power-up scelti nel livello corrente.
   Serve per impedire che lo stesso tipo
   venga mostrato due volte nella stessa
   schermata.
*/

let currentPowerUpChoices = [];



/* ==================================================
   DATI DEI POWER UP
================================================== */

const POWER_UP_DATA = {

    pasta: {

        image:
            "https://i.ibb.co/zwM5xNK/1788123621728-removebg-preview.png",

        className:
            "pasta-option"

    },


    speed: {

        image:
            "https://i.ibb.co/tP1rgx4D/1788123653567-removebg-preview.png",

        className:
            "speed-option"

    },


    sauce: {

        image:
            "https://i.ibb.co/pB62NXDf/1788123663443-removebg-preview.png",

        className:
            "sauce-option"

    }

};



/* ==================================================
   POWER UP DISPONIBILI
================================================== */

function getAvailablePowerUps() {

    const available = [];


    Object.keys(powerUps).forEach(
        function(type) {

            /*
               Se è già al livello 3,
               non può più essere scelto.
            */

            if (
                powerUps[type] < 3
            ) {

                available.push(type);

            }

        }
    );


    return available;

}



/* ==================================================
   RANDOMIZZAZIONE
================================================== */

function shuffleArray(array) {

    const copy =
        array.slice();


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        const temp =
            copy[i];

        copy[i] =
            copy[j];

        copy[j] =
            temp;

    }


    return copy;

}



/* ==================================================
   MOSTRA POWER UP
================================================== */

function showPowerUpScreen() {

    if (
        powerUpPaused
    ) {

        return;

    }


    const options =
        document.getElementById(
            "powerup-options"
        );


    options.innerHTML =
        "";


    currentPowerUpChoices =
        [];


    const available =
        getAvailablePowerUps();


    /*
       Se ci sono 3 o più power-up disponibili,
       ne prendiamo 3 diversi.

       Se ne rimangono meno di 3,
       vengono mostrati quelli rimasti.
    */

    const shuffled =
        shuffleArray(
            available
        );


    const numberToShow =
        Math.min(
            3,
            shuffled.length
        );


    for (
        let i = 0;
        i < numberToShow;
        i++
    ) {

        currentPowerUpChoices.push(
            shuffled[i]
        );

    }


    currentPowerUpChoices.forEach(
        function(type) {

            const data =
                POWER_UP_DATA[type];


            const option =
                document.createElement(
                    "div"
                );


            option.className =
                "powerup-option " +
                data.className;


            option.dataset.type =
                type;


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                data.image;


            image.alt =
                "";


            option.appendChild(
                image
            );


            option.addEventListener(
                "click",
                function() {

                    selectPowerUp(
                        type
                    );

                }
            );


            options.appendChild(
                option
            );

        }
    );


    powerUpPaused =
        true;


    document
    .getElementById("game")
    .classList
    .add(
        "powerup-paused"
    );


    document
    .getElementById("powerup-overlay")
    .style.display =
        "flex";

}



/* ==================================================
   SCELTA POWER UP
================================================== */

function selectPowerUp(
    type
) {

    if (
        !powerUpPaused
    ) {

        return;

    }


    /*
       Controlliamo che il power-up
       sia effettivamente uno dei tre
       mostrati sullo schermo.
    */

    if (
        !currentPowerUpChoices.includes(
            type
        )
    ) {

        return;

    }


    /*
       Non permettiamo di superare LV 3.
    */

    if (
        powerUps[type] >= 3
    ) {

        return;

    }


    /*
       Aumenta di UN livello.

       Esempio:

       pasta 0 -> pasta LV1
       pasta 1 -> pasta LV2
       pasta 2 -> pasta LV3
    */

    powerUps[type]++;


    document
    .getElementById("powerup-overlay")
    .style.display =
        "none";


    document
    .getElementById("powerup-options")
    .innerHTML =
        "";


    currentPowerUpChoices =
        [];


    powerUpPaused =
        false;


    document
    .getElementById("game")
    .classList
    .remove(
        "powerup-paused"
    );


    updateEXPBar();

}



/* ==================================================
   AGGIORNA BARRA EXP
================================================== */

function updateEXPBar() {

    const fill =
        document.getElementById(
            "exp-fill"
        );


    const levelText =
        document.getElementById(
            "exp-level"
        );


    if (
        currentLevel >= MAX_LEVEL
    ) {

        currentLevel =
            MAX_LEVEL;


        currentEXP =
            0;


        fill.style.width =
            "100%";


        levelText.textContent =
            "LV MAX";


        return;

    }


    const requiredEXP =
        EXP_REQUIREMENTS[
            currentLevel - 1
        ];


    const percentage =
        Math.min(
            100,
            (
                currentEXP /
                requiredEXP
            ) * 100
        );


    fill.style.width =
        percentage + "%";


    levelText.textContent =
        "LV " +
        currentLevel;

}



/* ==================================================
   AGGIUNGI EXP
================================================== */

function addEXP(
    amount
) {

    if (
        currentLevel >= MAX_LEVEL
    ) {

        return;

    }


    currentEXP +=
        amount;


    const requiredEXP =
        EXP_REQUIREMENTS[
            currentLevel - 1
        ];


    if (
        currentEXP >=
        requiredEXP
    ) {

        currentEXP -=
            requiredEXP;


        currentLevel++;


        updateEXPBar();


        showPowerUpScreen();


        return;

    }


    updateEXPBar();

}



/* ==================================================
   VARIABILI
================================================== */

let customerTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;

let zIndexTimer = null;

let kitchenEnergy = 100;

let customers = [];



/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    function() {

        document
        .getElementById("menu")
        .style.display =
            "none";


        document
        .getElementById("game")
        .style.display =
            "block";


        kitchenEnergy =
            100;


        customers =
            [];


        currentLevel =
            1;


        currentEXP =
            0;


        powerUps.pasta =
            0;


        powerUps.speed =
            0;


        powerUps.sauce =
            0;


        powerUpPaused =
            false;


        currentPowerUpChoices =
            [];


        document
        .getElementById("powerup-overlay")
        .style.display =
            "none";


        document
        .getElementById("powerup-options")
        .innerHTML =
            "";


        document
        .getElementById("game")
        .classList
        .remove(
            "powerup-paused"
        );


        updateEXPBar();


        document
        .querySelectorAll(
            ".spawned-customer"
        )
        .forEach(
            function(customer) {

                customer.remove();

            }
        );


        document
        .getElementById("kitchen")
        .style.display =
            "block";


        document
        .getElementById("kitchenDamaged")
        .style.display =
            "none";


        document
        .getElementById("kitchenDestroyed")
        .style.display =
            "none";


        updateKitchenEnergy();


        createWave1();

        startCustomerAnimation();

        startCookAnimation();

        startKitchenEnergySystem();

        startFirstAttackDetection();

        startZIndexSystem();

    }
);



/* ==================================================
   CREA WAVE 1
================================================== */

function createWave1() {

    const spawnTimes = [

        FIRST_SPAWN_SECOND

    ];


    while (
        spawnTimes.length <
        TOTAL_CUSTOMERS - 1
    ) {

        const randomSecond =
            Math.floor(
                Math.random() *
                (
                    LAST_SPAWN_SECOND -
                    FIRST_SPAWN_SECOND +
                    1
                )
            ) +
            FIRST_SPAWN_SECOND;


        if (
            !spawnTimes.includes(
                randomSecond
            )
        ) {

            spawnTimes.push(
                randomSecond
            );

        }

    }


    spawnTimes.push(
        LAST_SPAWN_SECOND
    );


    spawnTimes.sort(
        function(a, b) {

            return a - b;

        }
    );


    spawnTimes.forEach(
        function(second, index) {

            setTimeout(
                function() {

                    if (
                        !powerUpPaused
                    ) {

                        spawnCustomer(
                            index
                        );

                    }

                },
                second * 1000
            );

        }
    );

}



/* ==================================================
   CREA SINGOLO CLIENTE
================================================== */

function spawnCustomer(
    index
) {

    const game =
        document
        .getElementById(
            "game"
        );


    const type =
        Math.random() < 0.5
            ? 1
            : 2;


    const template =
        document
        .getElementById(
            type === 1
                ? "customer1Template"
                : "customer2Template"
        );


    const customer =
        template.cloneNode(
            true
        );


    customer.id =
        "customer-" +
        (
            index + 1
        );


    customer.classList
    .remove(
        "customer-template"
    );


    customer.classList
    .add(
        "spawned-customer"
    );


    customer.style.display =
        "block";


    customer.style.animation =
        "none";


    customer.classList
    .remove(
        "satisfied"
    );


    customer.style.top =
        "-130px";


    const laneIndex =
        Math.floor(
            Math.random() *
            LANES.length
        );


    customer.dataset.lane =
        laneIndex;


    customer.style.left =
        LANES[laneIndex] +
        "%";


    customer.dataset.type =
        type;


    customer.dataset.hp =
        "30";


    customer.dataset.satisfied =
        "false";


    customer.dataset.atKitchen =
        "false";


    customer.dataset.frame =
        "0";


    const frames =
        customer
        .querySelectorAll(
            ".frame"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames.length > 0
    ) {

        frames[0]
        .classList
        .add(
            "active"
        );

    }


    const happyFrame =
        customer
        .querySelector(
            ".happy-frame"
        );


    happyFrame.style.display =
        "none";


    game.appendChild(
        customer
    );


    customers.push(
        customer
    );


    requestAnimationFrame(
        function() {

            customer.style.animation =
                "walkDown " +
                CUSTOMER_WALK_TIME +
                "s linear forwards";


            customer.classList
            .add(
                "walking"
            );

        }
    );


    setTimeout(
        function() {

            if (
                customer.dataset.satisfied !==
                "true"
            ) {

                customer.dataset.atKitchen =
                    "true";


                updateZIndexes();

            }

        },
        CUSTOMER_WALK_TIME * 1000
    );

}



/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {

    if (
        kitchenEnergy > 50
    ) {

        document
        .getElementById("kitchen")
        .style.display =
            "block";


        document
        .getElementById("kitchenDamaged")
        .style.display =
            "none";


        document
        .getElementById("kitchenDestroyed")
        .style.display =
            "none";

    }

    else if (
        kitchenEnergy > 20
    ) {

        document
        .getElementById("kitchen")
        .style.display =
            "none";


        document
        .getElementById("kitchenDamaged")
        .style.display =
            "block";


        document
        .getElementById("kitchenDestroyed")
        .style.display =
            "none";

    }

    else {

        document
        .getElementById("kitchen")
        .style.display =
            "none";


        document
        .getElementById("kitchenDamaged")
        .style.display =
            "none";


        document
        .getElementById("kitchenDestroyed")
        .style.display =
            "block";

    }

}



/* ==================================================
   ENERGIA
================================================== */

function startKitchenEnergySystem() {

    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
    setInterval(
        function() {

            if (powerUpPaused) {

                return;

            }


            let damage = 0;


            customers.forEach(
                function(customer) {

                    if (
                        customer &&
                        customer.dataset.atKitchen ===
                            "true" &&
                        customer.dataset.satisfied !==
                            "true"
                    ) {

                        damage++;

                    }

                }
            );


            if (
                damage > 0
            ) {

                kitchenEnergy -=
                    damage;


                if (
                    kitchenEnergy < 0
                ) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();

            }

        },
        5000
    );

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {

    if (
        !customer ||
        customer.style.display ===
            "none"
    ) {

        return false;

    }


    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}



/* ==================================================
   Z-INDEX CLIENTI
================================================== */

function startZIndexSystem() {

    if (
        zIndexTimer !== null
    ) {

        clearInterval(
            zIndexTimer
        );

    }


    zIndexTimer =
    setInterval(
        function() {

            if (powerUpPaused) {

                return;

            }


            updateZIndexes();

        },
        50
    );

}


function updateZIndexes() {

    const activeCustomers =
        customers.filter(
            function(customer) {

                return (

                    customer &&
                    customer.style.display !==
                        "none"

                );

            }
        );


    activeCustomers.sort(
        function(a, b) {

            const aTop =
                a
                .getBoundingClientRect()
                .top;


            const bTop =
                b
                .getBoundingClientRect()
                .top;


            return aTop - bTop;

        }
    );


    activeCustomers.forEach(
        function(customer, index) {

            customer.style.zIndex =
                10 + index;

        }
    );

}



/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {

    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

    }


    firstAttackTimer =
    setInterval(
        function() {

            if (powerUpPaused) {

                return;

            }


            const target =
                getNearestVisibleCustomer();


            if (
                target
            ) {

                playCookAttack();


                clearInterval(
                    firstAttackTimer
                );

            }

        },
        100
    );

}



/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {

    if (
        customerTimer !== null
    ) {

        clearInterval(
            customerTimer
        );

    }


    customerTimer =
    setInterval(
        function() {

            if (powerUpPaused) {

                return;

            }


            customers.forEach(
                function(customer) {

                    if (
                        !customer ||
                        customer.style.display ===
                            "none" ||
                        customer.dataset.satisfied ===
                            "true"
                    ) {

                        return;

                    }


                    const frames =
                        customer
                        .querySelectorAll(
                            ".frame"
                        );


                    if (
                        frames.length === 0
                    ) {

                        return;

                    }


                    let frame =
                        parseInt(
                            customer.dataset.frame ||
                            "0"
                        );


                    frames.forEach(
                        function(image) {

                            image.classList
                            .remove(
                                "active"
                            );

                        }
                    );


                    frames[frame]
                    .classList
                    .add(
                        "active"
                    );


                    frame++;


                    if (
                        frame >=
                        frames.length
                    ) {

                        frame = 0;

                    }


                    customer.dataset.frame =
                        frame;

                }
            );

        },
        300
    );

}



/* ==================================================
   FRAME CUOCO
================================================== */

function setCookFrame(
    frameNumber
) {

    const frames =
        document
        .getElementById("cook")
        .querySelectorAll("img");


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames[frameNumber]
    ) {

        frames[frameNumber]
        .classList
        .add(
            "active"
        );

    }

}



/* ==================================================
   ATTACCO
================================================== */

function playCookAttack() {

    if (powerUpPaused) {

        return;

    }


    const targets =
        getAttackTargets();


    if (
        targets.length === 0
    ) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            if (!powerUpPaused) {

                setCookFrame(1);

            }

        },
        120
    );


    setTimeout(
        function() {

            if (!powerUpPaused) {

                setCookFrame(2);

            }

        },
        240
    );


    setTimeout(
        function() {

            if (!powerUpPaused) {

                setCookFrame(3);


                targets.forEach(
                    function(target) {

                        if (
                            target &&
                            target.dataset.satisfied !==
                                "true"
                        ) {

                            throwPasta(
                                target
                            );

                        }

                    }
                );

            }

        },
        360
    );


    setTimeout(
        function() {

            if (!powerUpPaused) {

                setCookFrame(4);

            }

        },
        480
    );


    setTimeout(
        function() {

            if (!powerUpPaused) {

                setCookFrame(0);

            }

        },
        600
    );

}



/* ==================================================
   CLIENTI DA COLPIRE
================================================== */

function getAttackTargets() {

    const activeCustomers =
        customers.filter(
            function(customer) {

                if (
                    !customer
                ) {

                    return false;

                }


                if (
                    customer.style.display ===
                    "none"
                ) {

                    return false;

                }


                if (
                    customer.dataset.satisfied ===
                    "true"
                ) {

                    return false;

                }


                return customerIsVisible(
                    customer
                );

            }
        );


    activeCustomers.sort(
        function(a, b) {

            return (
                b.getBoundingClientRect().top -
                a.getBoundingClientRect().top
            );

        }
    );


    let numberOfPasta =
        1 +
        powerUps.pasta;


    return activeCustomers.slice(
        0,
        numberOfPasta
    );

}



/* ==================================================
   ATTACCO
================================================== */

function startCookAnimation() {

    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

    }


    setCookFrame(0);


    cookTimer =
    setInterval(
        function() {

            if (powerUpPaused) {

                return;

            }


            const target =
                getNearestVisibleCustomer();


            if (
                target !== null
            ) {

                playCookAttack();

            }

            else {

                setCookFrame(0);

            }

        },
        getCookAttackInterval()
    );

}



/* ==================================================
   VELOCITÀ ATTACCO
================================================== */

function getCookAttackInterval() {

    return Math.round(
        3000 /
        (
            1 +
            powerUps.speed * 0.33
        )
    );

}



/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer() {

    const activeCustomers =
        customers.filter(
            function(customer) {

                if (
                    !customer
                ) {

                    return false;

                }


                if (
                    customer.style.display ===
                    "none"
                ) {

                    return false;

                }


                if (
                    customer.dataset.satisfied ===
                    "true"
                ) {

                    return false;

                }


                return customerIsVisible(
                    customer
                );

            }
        );


    if (
        activeCustomers.length ===
        0
    ) {

        return null;

    }


    let nearest =
        activeCustomers[0];


    let nearestTop =
        nearest
        .getBoundingClientRect()
        .top;


    activeCustomers.forEach(
        function(customer) {

            const top =
                customer
                .getBoundingClientRect()
                .top;


            if (
                top >
                nearestTop
            ) {

                nearest =
                    customer;

                nearestTop =
                    top;

            }

        }
    );


    return nearest;

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {

    if (!target) {

        return;

    }


    if (
        target.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    const cook =
        document
        .getElementById("cook");


    const game =
        document
        .getElementById("game");


    const gameRect =
        game.getBoundingClientRect();


    const cookRect =
        cook.getBoundingClientRect();


    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;


    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );


    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );


    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";


    const speed =
        350 *
        (
            1 +
            powerUps.speed * 0.33
        );


    let lastTime =
        performance.now();



    function movePasta(
        currentTime
    ) {

        if (
            !target ||
            target.dataset.satisfied ===
            "true"
        ) {

            if (
                pasta.parentNode
            ) {

                pasta.remove();

            }


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        if (powerUpPaused) {

            lastTime =
                currentTime;


            requestAnimationFrame(
                movePasta
            );


            return;

        }


        const targetRect =
            target.getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;


        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";


        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;


        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {

            currentX =
                endX;


            currentY =
                endY;

        }

        else {

            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }


        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";


        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {

            hitCustomer(
                target,
                pasta
            );


            if (
                hitMarker.parentNode
            ) {

                hitMarker.remove();

            }


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}



/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {

    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.remove();

    }


    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    let hp =
        parseInt(
            customer.dataset.hp ||
            "30"
        );


    /*
       DANNO:

       LV0 = 5
       LV1 = 6
       LV2 = 7
       LV3 = 8
    */

    const damage =
        5 +
        powerUps.sauce;


    hp -=
        damage;


    customer.dataset.hp =
        hp;


    if (
        hp <= 0
    ) {

        satisfyCustomer(
            customer
        );

    }

}



/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    customer
) {

    if (
        !customer ||
        customer.dataset.satisfied ===
        "true"
    ) {

        return;

    }


    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    const currentTop =
        rect.top -
        gameRect.top;


    const currentLeft =
        rect.left -
        gameRect.left;


    customer.style.animation =
        "none";


    customer.classList
    .remove(
        "walking"
    );


    customer.classList
    .add(
        "satisfied"
    );


    customer.style.top =
        currentTop +
        "px";


    customer.style.left =
        currentLeft +
        "px";


    customer.dataset.satisfied =
        "true";


    customer.dataset.atKitchen =
        "false";


    addEXP(
        EXP_PER_CUSTOMER
    );


    const normalFrames =
        customer
        .querySelectorAll(
            ".frame"
        );


    normalFrames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    const happyFrame =
        customer
        .querySelector(
            ".happy-frame"
        );


    happyFrame.style.display =
        "block";


    updateZIndexes();


    setTimeout(
        function() {

            customer.style.display =
                "none";


            happyFrame.style.display =
                "none";


            customer.classList
            .remove(
                "satisfied"
            );


            updateZIndexes();

        },
        1000
    );

}



/* ==================================================
   COMPATIBILITÀ
================================================== */

function satisfyCustomer1() {

    const customer =
        customers.find(
            function(c) {

                return (
                    c.dataset.type === "1" &&
                    c.dataset.satisfied !== "true"
                );

            }
        );


    if (
        customer
    ) {

        satisfyCustomer(
            customer
        );

    }

}



function satisfyCustomer2() {

    const customer =
        customers.find(
            function(c) {

                return (
                    c.dataset.type === "2" &&
                    c.dataset.satisfied !== "true"
                );

            }
        );


    if (
        customer
    ) {

        satisfyCustomer(
            customer
        );

    }

}
