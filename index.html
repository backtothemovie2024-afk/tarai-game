<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;
}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 10;
}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


#kitchen {

    z-index: 15;

}


#kitchenDamaged {

    z-index: 16;

    display: none;

}


#kitchenDestroyed {

    z-index: 17;

    display: none;

}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   CONTENITORE CLIENTI
================================================== */

#customersLayer {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

    z-index: 10;

}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -130px;

    z-index: 10;

}


.customer.satisfied {

    animation: none;

}


/* ==================================================
   SPRITE NORMALI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


.customer .frame.active {

    display: block;

}


/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;

}


/* ==================================================
   CUORICINO
================================================== */

.heart {

    position: absolute;

    left: 50%;

    top: -18px;

    transform:
        translateX(-50%);

    font-size: 24px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;

}


.customer.satisfied .heart {

    display: block;

}


@keyframes heartFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

    100% {

        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1.12);

    }

}


/* ==================================================
   MOVIMENTO CLIENTI
   60 SECONDI
================================================== */

@keyframes walkDown {

    0% {

        top: -130px;

    }

    65% {

        top: 69%;

    }

    100% {

        top: 69%;

    }

}


/* ==================================================
   COLONNE INVISIBILI
================================================== */

/*
   Lo spazio centrale viene diviso
   logicamente in 5 colonne.

   Non vengono visualizzate.
*/

.customer.column1 {

    left: 30%;

}


.customer.column2 {

    left: 35%;

}


.customer.column3 {

    left: 40%;

}


.customer.column4 {

    left: 45%;

}


.customer.column5 {

    left: 50%;

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform:
        translateX(-50%);

    z-index: 20;

}


#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


#cook img.active {

    display: block;

}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 25;

    pointer-events: none;

}


/* ==================================================
   PUNTO ROSSO
   INVISIBILE MA FUNZIONANTE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:

        0 0 8px red,

        0 0 15px
        rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

    opacity: 0;

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {

    .customer,
    #cook {

        width: 65px;

        height: 88px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- ==================================================
     MENU
================================================== -->

<div id="menu">

    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt=""
    >

    <button id="playButton">

        PLAY

    </button>

</div>



<!-- ==================================================
   GIOCO
================================================== -->

<div id="game">


    <img
        id="background"
        src="https://i.ibb.co/pj7trt5y/IMG-20260829-WA0012.jpg"
        alt=""
    >


    <!-- CUCINA NORMALE -->

    <img
        id="kitchen"
        src="https://i.ibb.co/39jfnpgW/IMG-20260829-WA0013-removebg-preview.png"
        alt=""
    >


    <!-- CUCINA DANNEGGIATA -->

    <img
        id="kitchenDamaged"
        src="https://i.ibb.co/7t1CkQYc/IMG-20260829-WA0014-removebg-preview.png"
        alt=""
    >


    <!-- CUCINA DISTRUTTA -->

    <img
        id="kitchenDestroyed"
        src="https://i.ibb.co/HLF1Q2zn/IMG-20260829-WA0015-removebg-preview.png"
        alt=""
    >


    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>


    <!-- ==================================================
         CONTENITORE CLIENTI
    ================================================== -->

    <div id="customersLayer"></div>



    <!-- ==================================================
         CUOCO
    ================================================== -->

    <div id="cook">


        <!-- FRAME 1 -->

        <img
            class="active"
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 2 -->

        <img
            src="https://i.ibb.co/fY9GKKNP/IMG-20260829-WA0006-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 3 -->

        <img
            src="https://i.ibb.co/kskzw0J1/IMG-20260829-WA0004-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 4 = LANCIO -->

        <img
            src="https://i.ibb.co/9mSrQBZx/IMG-20260829-WA0007-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 5 -->

        <img
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt=""
        >

    </div>


</div>

</div>



<script>


/* ==================================================
   REGOLAZIONE HITBOX
================================================== */

const HIT_X = 5;

const HIT_Y = 0;

const HIT_POSITION_Y = 0.45;



/* ==================================================
   WAVE 1
================================================== */

const TOTAL_CUSTOMERS = 15;


/*
   60 secondi per arrivare
   alla cucina.
*/

const CUSTOMER_WALK_TIME = 60;


/*
   Intervallo casuale tra
   gli spawn.
*/

const MIN_SPAWN_DELAY = 1500;

const MAX_SPAWN_DELAY = 4500;


/*
   Le 5 colonne sono numerate
   da 1 a 5.
*/

const TOTAL_COLUMNS = 5;



/* ==================================================
   VARIABILI
================================================== */

let customerTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;

let spawnTimer = null;


let kitchenEnergy = 100;


let customers = [];

let customersSpawned = 0;

let customersSatisfied = 0;


/*
   ID progressivo dei clienti.
*/

let nextCustomerId = 1;


/*
   Indica se la wave è iniziata.
*/

let waveStarted = false;



/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    function() {


        document
        .getElementById("menu")
        .style.display =
            "none";


        document
        .getElementById("game")
        .style.display =
            "block";


        kitchenEnergy = 100;


        customers = [];

        customersSpawned = 0;

        customersSatisfied = 0;

        nextCustomerId = 1;

        waveStarted = true;


        /*
           Eliminiamo eventuali
           vecchi clienti.
        */

        document
        .getElementById(
            "customersLayer"
        )
        .innerHTML = "";


        /*
           Reset cucina.
        */

        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


        updateKitchenEnergy();


        startWave1();

        startCookAnimation();

        startKitchenEnergySystem();

    }
);



/* ==================================================
   CREAZIONE WAVE 1
================================================== */

function startWave1() {


    if (
        spawnTimer !== null
    ) {

        clearTimeout(
            spawnTimer
        );

    }


    spawnNextCustomer();

}



/* ==================================================
   SPAWN CLIENTE
================================================== */

function spawnNextCustomer() {


    if (
        customersSpawned >=
        TOTAL_CUSTOMERS
    ) {

        return;

    }


    createCustomer();


    customersSpawned++;


    if (
        customersSpawned <
        TOTAL_CUSTOMERS
    ) {


        const delay =
            randomNumber(
                MIN_SPAWN_DELAY,
                MAX_SPAWN_DELAY
            );


        spawnTimer =
            setTimeout(
                function() {

                    spawnNextCustomer();

                },
                delay
            );

    }

}



/* ==================================================
   CREA CLIENTE
================================================== */

function createCustomer() {


    const layer =
        document
        .getElementById(
            "customersLayer"
        );


    const customer =
        document.createElement(
            "div"
        );


    customer.className =
        "customer";


    customer.dataset.id =
        nextCustomerId;


    /*
       Tipo casuale:

       1 = Cliente 1
       2 = Cliente 2
    */

    const customerType =
        Math.random() < 0.5
            ? 1
            : 2;


    customer.dataset.type =
        customerType;


    /*
       Colonna casuale
       da 1 a 5.
    */

    const column =
        Math.floor(
            Math.random() *
            TOTAL_COLUMNS
        ) + 1;


    customer.dataset.column =
        column;


    customer.classList.add(
        "column" + column
    );


    /*
       Sprite Cliente 1.
    */

    if (
        customerType === 1
    ) {


        customer.innerHTML = `

            <img
                class="frame active"
                src="https://i.ibb.co/5XMzbb9t/IMG-20260830-WA0000-removebg-preview.png"
                alt=""
            >

            <img
                class="frame"
                src="https://i.ibb.co/zVPnZjZP/IMG-20260830-WA0001-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/mV43yWMM/grok-1788037208959-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    /*
       Sprite Cliente 2.
    */

    else {


        customer.innerHTML = `

            <img
                class="frame active"
                src="https://i.ibb.co/jP6QSPFd/1000040572-removebg-preview.png"
                alt=""
            >

            <img
                class="frame"
                src="https://i.ibb.co/vxJCRK81/1000040573-removebg-preview.png"
                alt=""
            >

            <img
                class="happy-frame"
                src="https://i.ibb.co/m5xmJrBq/Screenshot-20260830-060945-Grok-removebg-preview.png"
                alt=""
            >

            <div class="heart">
                ❤️
            </div>

        `;

    }


    layer.appendChild(
        customer
    );


    /*
       Oggetto cliente.
    */

    const customerData = {

        id:
            nextCustomerId,

        element:
            customer,

        type:
            customerType,

        column:
            column,

        hp:
            50,

        satisfied:
            false,

        atKitchen:
            false

    };


    nextCustomerId++;


    customers.push(
        customerData
    );


    /*
       Animazione di camminata.
    */

    customer.style.animation =
        "none";


    void customer.offsetWidth;


    customer.style.animation =
        "walkDown " +
        CUSTOMER_WALK_TIME +
        "s linear forwards";


    /*
       Iniziamo l'animazione
       dei due frame.
    */

    updateCustomerDepth();


    /*
       Aggiorna la posizione
       e la sovrapposizione.
    */

    requestAnimationFrame(
        function() {

            updateCustomerDepth();

        }
    );

}



/* ==================================================
   ANIMAZIONE SPRITE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (
        customerTimer !== null
    ) {

        clearInterval(
            customerTimer
        );

    }


    customerTimer =
        setInterval(
            function() {


                customers.forEach(
                    function(data) {


                        if (
                            data.satisfied
                        ) {

                            return;

                        }


                        const frames =
                            data.element
                            .querySelectorAll(
                                ".frame"
                            );


                        if (
                            frames.length === 0
                        ) {

                            return;

                        }


                        let currentFrame =
                            parseInt(
                                data.element
                                .dataset
                                .frame || "0"
                            );


                        frames.forEach(
                            function(frame) {

                                frame.classList
                                .remove(
                                    "active"
                                );

                            }
                        );


                        frames[
                            currentFrame
                        ]
                        .classList
                        .add(
                            "active"
                        );


                        currentFrame++;


                        if (
                            currentFrame >=
                            frames.length
                        ) {

                            currentFrame = 0;

                        }


                        data.element
                        .dataset
                        .frame =
                            currentFrame;

                    }
                );


            },
            300
        );

}



/* ==================================================
   ORDINE DI SOVRAPPOSIZIONE
================================================== */

/*
   Il cliente più avanti verso
   la cucina viene disegnato
   sopra quello dietro.

   Più il cliente è in basso,
   maggiore sarà lo z-index.
*/

function updateCustomerDepth() {


    customers.forEach(
        function(data) {


            if (
                !data.element ||
                data.satisfied
            ) {

                return;

            }


            const rect =
                data.element
                .getBoundingClientRect();


            /*
               Usiamo la posizione
               verticale reale.
            */

            const depth =
                Math.round(
                    rect.top
                );


            data.element.style.zIndex =
                10 +
                depth;

        }
    );


    requestAnimationFrame(
        updateCustomerDepth
    );

}



/* ==================================================
   CLIENTE ALLA CUCINA
================================================== */

function updateCustomersAtKitchen() {


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    const kitchenLine =
        gameRect.top +
        gameRect.height *
        0.69;


    customers.forEach(
        function(data) {


            if (
                data.satisfied
            ) {

                return;

            }


            const rect =
                data.element
                .getBoundingClientRect();


            /*
               Il cliente è arrivato
               alla posizione della cucina.
            */

            if (
                rect.top >=
                kitchenLine - 15
            ) {

                data.atKitchen =
                    true;

            }

        }
    );

}



/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {


    if (
        kitchenEnergy > 50
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


    }

    else if (
        kitchenEnergy > 20
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


    }

    else {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "block";

    }

}



/* ==================================================
   ENERGIA CUCINA
================================================== */

function startKitchenEnergySystem() {


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
        setInterval(
            function() {


                updateCustomersAtKitchen();


                let damage = 0;


                customers.forEach(
                    function(data) {


                        if (
                            data.atKitchen &&
                            !data.satisfied
                        ) {

                            damage++;

                        }

                    }
                );


                if (
                    damage > 0
                ) {


                    kitchenEnergy -=
                        damage;


                    if (
                        kitchenEnergy < 0
                    ) {

                        kitchenEnergy = 0;

                    }


                    updateKitchenEnergy();

                }


            },
            5000
        );

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer ||
        customer.style.display ===
            "none"
    ) {

        return false;

    }


    const rect =
        customer
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}



/* ==================================================
   TROVA CLIENTE PIÙ VICINO
   ALLA CUCINA
================================================== */

function getNearestVisibleCustomer() {


    const available =
        customers.filter(
            function(data) {


                return (

                    !data.satisfied &&

                    customerIsVisible(
                        data.element
                    )

                );

            }
        );


    if (
        available.length === 0
    ) {

        return null;

    }


    /*
       Ordiniamo dal più vicino
       alla cucina al più lontano.

       rect.top maggiore =
       cliente più in basso =
       cliente più vicino alla cucina.
    */

    available.sort(
        function(a, b) {


            const rectA =
                a.element
                .getBoundingClientRect();


            const rectB =
                b.element
                .getBoundingClientRect();


            return (
                rectB.top -
                rectA.top
            );

        }
    );


    return available[0].element;

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function getCustomerData(
    element
) {


    for (
        let i = 0;
        i < customers.length;
        i++
    ) {


        if (
            customers[i].element ===
            element
        ) {

            return customers[i];

        }

    }


    return null;

}



/* ==================================================
   ATTACCO
================================================== */

function playCookAttack() {


    const target =
        getNearestVisibleCustomer();


    /*
       Se non ci sono clienti,
       il cuoco non attacca.
    */

    if (
        target === null
    ) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            /*
               Ricontrolliamo che
               esista ancora un bersaglio.
            */

            if (
                target &&
                document
                .body
                .contains(target)
            ) {

                setCookFrame(1);

            }

        },
        120
    );


    setTimeout(
        function() {

            if (
                target &&
                document
                .body
                .contains(target)
            ) {

                setCookFrame(2);

            }

        },
        240
    );


    /*
       FRAME 4
       = LANCIO
    */

    setTimeout(
        function() {


            if (
                target &&
                document
                .body
                .contains(target)
            ) {


                setCookFrame(3);


                throwPasta(
                    target
                );

            }

        },
        360
    );


    setTimeout(
        function() {

            setCookFrame(4);

        },
        480
    );


    setTimeout(
        function() {

            setCookFrame(0);

        },
        600
    );

}



/* ==================================================
   ATTACCO CONTINUO
================================================== */

function startCookAnimation() {


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

    }


    setCookFrame(0);


    /*
       Primo controllo rapido.
    */

    cookTimer =
        setInterval(
            function() {


                /*
                   Se esiste almeno
                   un cliente disponibile,
                   il cuoco attacca.

                   La funzione sceglierà
                   SEMPRE quello più
                   vicino alla cucina.
                */

                const target =
                    getNearestVisibleCustomer();


                if (
                    target !== null
                ) {

                    playCookAttack();

                }

                else {

                    setCookFrame(0);

                }


            },
            3000
        );

}



/* ==================================================
   FRAME CUOCO
================================================== */

function setCookFrame(
    frameNumber
) {


    const frames =
        document
        .getElementById(
            "cook"
        )
        .querySelectorAll(
            "img"
        );


    frames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames[frameNumber]
    ) {

        frames[
            frameNumber
        ]
        .classList
        .add(
            "active"
        );

    }

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {


    if (!target) {

        return;

    }


    const targetData =
        getCustomerData(
            target
        );


    if (
        !targetData ||
        targetData.satisfied
    ) {

        return;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    const cookRect =
        cook.getBoundingClientRect();



    /* ==================================================
       PARTENZA MANO
    ================================================== */

    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;



    /* ==================================================
       PUNTO ROSSO
    ================================================== */

    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );



    /* ==================================================
       PASTA
================================================== */

    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );



    /* ==================================================
       POSIZIONE INIZIALE
================================================== */

    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";



    /* ==================================================
       VELOCITÀ PASTA
================================================== */

    const speed = 350;


    let lastTime =
        performance.now();



    /* ==================================================
       MOVIMENTO PASTA
================================================== */

    function movePasta(
        currentTime
    ) {


        /*
           Se il cliente è già soddisfatto,
           interrompiamo il volo.
        */

        if (
            targetData.satisfied
        ) {


            if (
                pasta.parentNode
            ) {

                pasta.parentNode
                .removeChild(
                    pasta
                );

            }


            if (
                hitMarker.parentNode
            ) {

                hitMarker.parentNode
                .removeChild(
                    hitMarker
                );

            }


            return;

        }


        const targetRect =
            target.getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;



        /* ==================================================
           PUNTO IMPATTO
        ================================================== */

        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";



        /* ==================================================
           DELTA TIME
        ================================================== */

        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;



        /* ==================================================
           DIREZIONE
        ================================================== */

        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );



        /* ==================================================
           MOVIMENTO
        ================================================== */

        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {


            currentX =
                endX;


            currentY =
                endY;


        }

        else {


            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }



        /* ==================================================
           AGGIORNA PASTA
        ================================================== */

        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";



        /* ==================================================
           IMPATTO
        ================================================== */

        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {


            hitCustomer(
                target,
                pasta
            );


            if (
                hitMarker.parentNode
            ) {

                hitMarker.parentNode
                .removeChild(
                    hitMarker
                );

            }


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}



/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {


        pasta.parentNode
        .removeChild(
            pasta
        );

    }


    const data =
        getCustomerData(
            customer
        );


    if (
        !data ||
        data.satisfied
    ) {

        return;

    }


    data.hp -= 5;


    if (
        data.hp <= 0
    ) {


        satisfyCustomer(
            data
        );

    }

}



/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    data
) {


    if (
        !data ||
        data.satisfied
    ) {

        return;

    }


    data.satisfied =
        true;


    data.atKitchen =
        false;


    customersSatisfied++;


    const customer =
        data.element;


    customer.classList.add(
        "satisfied"
    );


    /*
       Nascondiamo i frame normali.
    */

    const normalFrames =
        customer
        .querySelectorAll(
            ".frame"
        );


    normalFrames.forEach(
        function(frame) {

            frame.classList
            .remove(
                "active"
            );

        }
    );


    /*
       Mostriamo lo sprite felice.
    */

    const happyFrame =
        customer
        .querySelector(
            ".happy-frame"
        );


    happyFrame.style.display =
        "block";


    /*
       Il cuore viene mostrato
       tramite .satisfied.
    */


    /*
       Dopo 1 secondo
       il cliente scompare.
    */

    setTimeout(
        function() {


            customer.style.display =
                "none";


            happyFrame.style.display =
                "none";


            /*
               Aggiorniamo nuovamente
               l'ordine dei clienti.
            */

            updateCustomerDepth();


            /*
               Se tutti i 15 clienti
               sono stati soddisfatti,
               la wave è terminata.
            */

            if (
                customersSatisfied >=
                TOTAL_CUSTOMERS
            ) {


                waveStarted =
                    false;


                setCookFrame(0);

            }


        },
        1000
    );

}



/* ==================================================
   NUMERO CASUALE
================================================== */

function randomNumber(
    min,
    max
) {


    return Math.floor(
        Math.random() *
        (
            max - min + 1
        )
    ) + min;

}



/* ==================================================
   AVVIO ANIMAZIONE CLIENTI
================================================== */

startCustomerAnimation();
