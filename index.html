<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#phone{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;margin:auto;overflow:hidden;background:#000}
#intro{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1000}
#introVideo{width:100%;height:100%;object-fit:cover;display:block}
/* DISSOLVENZA INTRO → NERO → MENU */
#introFade{position:absolute;inset:0;background:#000;opacity:0;display:none;z-index:1100;transition:opacity .8s ease-in-out;pointer-events:auto}
#introTap{position:absolute;inset:0;z-index:1001;cursor:pointer}
#menu{position:absolute;inset:0;background:#000;display:flex;justify-content:center;align-items:center;z-index:100}
#cover,#coverOverlay{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:fill;display:block}
#cover{z-index:10;pointer-events:none}#coverOverlay{z-index:20;pointer-events:none}
#playButton{position:absolute;left:12%;top:58%;width:76%;height:14%;border:none;background:transparent;color:transparent;font-size:0;z-index:30;cursor:pointer;-webkit-tap-highlight-color:transparent}
#blackTransition{position:absolute;inset:0;background:#000;display:none;overflow:hidden;z-index:2000;pointer-events:none}
.transition-image{position:absolute;width:100%;height:auto;display:block;pointer-events:none}
#transitionImage1{top:5%;left:-100%}#transitionImage2{top:35%;right:-100%}#transitionImage3{bottom:5%;left:-100%}
@keyframes transitionFromLeft{from{left:-100%}to{left:0%}}
@keyframes transitionFromRight{from{right:-100%}to{right:0%}}
@keyframes transitionExit{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
@keyframes gameEnter{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
#game{display:none;position:absolute;inset:0;overflow:hidden;background:#000}
#background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto;z-index:0}
#kitchen,#kitchenDamaged,#kitchenDestroyed{position:absolute;left:50%;top:83%;width:115%;height:auto;transform:translate(-50%,-50%);pointer-events:none;z-index:50}
#kitchen{display:block}#kitchenDamaged,#kitchenDestroyed{display:none}
#exp-bar{position:absolute;left:2.5%;bottom:1.5%;width:95%;height:30px;background:#321b10;border:3px solid #8a512d;border-radius:15px;box-shadow:0 4px 0 #160b07,0 6px 12px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.18);overflow:hidden;z-index:200}
#exp-fill{position:absolute;left:0;top:0;width:0%;height:100%;background:linear-gradient(180deg,#ffe477,#f5a623 50%,#d96b16);border-radius:10px;z-index:1;transition:width .35s ease-out}
#exp-level{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:900;text-shadow:2px 2px 3px #000;z-index:2;pointer-events:none}
.customer{position:absolute;width:100px;height:135px;top:5%;z-index:10}
.customer.walking{animation:walkDown 60s linear forwards}.customer.satisfied{animation:none!important}
.customer .frame,.customer .happy-frame,.customer .frozen-frame{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:none}
.customer .frame.active{display:block}.customer .happy-frame{z-index:2}.customer .frozen-frame{z-index:3}
.customer1-sprite,.customer2-sprite{display:none}
.customer1-template .frame{width:100%;height:100%;object-fit:contain;transform:scale(1);transform-origin:center bottom}
.customer1-template{width:100px;height:135px}
.customer1-template .happy-frame{transform:scale(.90);transform-origin:center bottom}
.customer1-template .frozen-frame{transform:scale(.92);transform-origin:center bottom}
.customer2-sprite + .happy-frame{width:100%;height:100%;object-fit:contain;left:0%}
.customer2-template .frame:nth-of-type(1),.customer2-template .frame:nth-of-type(2){transform:scale(1);transform-origin:center bottom}
.customer2-template .happy-frame{width:100%;height:100%;object-fit:contain;left:0%;transform:scale(1);transform-origin:center bottom}
.customer2-template .frozen-frame{transform:scale(.90);transform-origin:center bottom}
.customer3-template .frame,.customer3-template .happy-frame,.customer4-template .frame,.customer4-template .happy-frame,.customer5-template .frame,.customer5-template .happy-frame{transform-origin:center bottom}
.customer3-template .frame:nth-of-type(1){transform:translateX(0)}
.customer3-template .frame:nth-of-type(2){transform:translateX(14.0625%)}
.customer6-template .frame,.customer6-template .happy-frame,.customer6-template .frozen-frame,.customer7-template .frame,.customer7-template .happy-frame,.customer7-template .frozen-frame,.customer8-template .frame,.customer8-template .happy-frame,.customer8-template .frozen-frame{width:100%;height:100%;object-fit:contain;object-position:center bottom;transform:scale(1);transform-origin:center bottom}
.boss-unit-template .frame,.boss-unit-template .happy-frame{width:100%;height:100%;object-fit:contain;transform:scale(1);transform-origin:center bottom}
/* VIDEO BOSS: ingresso e uscita secchi, 0,2 secondi. */
#bossIntro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;background:#000;z-index:450}
#bossIntroVideo{width:100%;height:100%;object-fit:cover;display:block}
#bossIntro.entering{animation:bossSnapIn .2s ease-out both}
#bossIntro.leaving{animation:bossSnapOut .2s ease-in both;pointer-events:none}
@keyframes bossSnapIn{0%{transform:scale(.72)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes bossSnapOut{from{transform:translateX(0)}to{transform:translateX(110%)}}
#bossVideoAction{position:absolute;left:10%;right:10%;bottom:12%;padding:14px;border:2px solid #fff;border-radius:10px;background:#191919;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
/* TEST TEMPORANEO: disattivare ENABLE_BOSS_TEST nel JavaScript per nasconderlo. */
#testBossButton{position:absolute;top:12px;right:10px;z-index:420;padding:8px 10px;border:2px solid #ffd45a;border-radius:8px;background:rgba(0,0,0,.78);color:#ffd45a;font-size:12px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent}
#testBossButton:disabled{opacity:.45;cursor:default}
.heart{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:24px;line-height:1;z-index:5;display:none;animation:heartFloat .8s ease-in-out infinite alternate}
.customer.satisfied .heart{display:block}
@keyframes heartFloat{0%{transform:translateX(-50%) translateY(0) scale(1)}100%{transform:translateX(-50%) translateY(-7px) scale(1.12)}}
@keyframes walkDown{0%{top:8%}100%{top:69%}}
#cook,#waitress{position:absolute;bottom:7%;width:100px;height:135px;transform:translateX(-50%);z-index:60}
#cook{left:37.5%;bottom:12%}
#cook img{position:absolute;top:0;left:0;width:170%;height:170%;object-fit:contain;display:none}
#cook img.active,#waitress img.active{display:block}
#waitress{left:62.5%;bottom:6%;display:none;overflow:visible}
#waitress img{position:absolute;left:50%;bottom:0;top:auto;width:104%;height:104%;max-width:none;max-height:none;object-fit:contain;display:none;transform:translateX(-50%);transform-origin:center bottom;pointer-events:none}
.pasta,.drink{position:absolute;width:84px;height:84px;object-fit:contain;z-index:70;pointer-events:none}.drink{width:140px;height:140px}
.hit-marker{position:absolute;width:22px;height:22px;border-radius:50%;background:red;border:3px solid white;box-shadow:0 0 8px red,0 0 15px rgba(255,0,0,.8);transform:translate(-50%,-50%);z-index:90;pointer-events:none;opacity:0}
.impact-particle{position:absolute;pointer-events:none;z-index:95;transform:translate(-50%,-50%)}
.drink-drop{width:7px;height:11px;border-radius:50% 50% 55% 55%;background:#62d9ff;box-shadow:0 0 5px rgba(98,217,255,.8);animation:drinkDropFly .32s ease-out forwards}
@keyframes drinkDropFly{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.45)}}
.pasta-strand{width:18px;height:5px;border-radius:50%;background:#ffd45a;box-shadow:0 0 3px rgba(255,190,40,.8);transform-origin:center;animation:pastaStrandFly .36s ease-out forwards}
@keyframes pastaStrandFly{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) rotate(var(--rot)) scaleX(.7)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(calc(var(--rot) + 90deg)) scaleX(1.2)}}
#powerup-overlay{position:absolute;inset:0;background:rgba(18,8,3,.82);display:none;align-items:center;justify-content:center;z-index:500}
#powerup-panel{width:103%;height:91%;position:relative;background:transparent;border:none;border-radius:0;box-shadow:none;padding:0}
#powerup-options{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.5%}
.powerup-slot{position:relative;width:32%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.powerup-slot img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.powerup-slot img[src*="MkNSjJwS"],
.powerup-slot img[src*="S4pzKRB7"],
.powerup-slot img[src*="yFG9djjL"],
.powerup-slot img[src*="WN2w5Gdr"],
.powerup-slot img[src*="TB2VNLT9"],

.powerup-slot img[src*="d0wKYzSF"],

#game.powerup-paused *{animation-play-state:paused!important}
/* POSIZIONE LAVAGNA: valori da rifinire sullo sfondo se necessario. */
#wave-display{
position:absolute;
left:11.6%;
top:2.5%;
width:11%;
height:4.6%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-family:"Knewave","Comic Sans MS",cursive;
font-weight:400;
font-size:18px;
line-height:1.15;
text-align:center;
white-space:nowrap;
overflow:hidden;
padding:2px;
z-index:5;
pointer-events:none;
}

#wave-message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:14px 25px;border-radius:15px;background:rgba(0,0,0,.72);color:white;font-size:25px;font-weight:900;text-align:center;text-shadow:2px 2px 3px #000;z-index:400;display:none;pointer-events:none}
@media(max-width:500px){
.customer,#cook,#waitress{width:65px;height:88px}
.customer1-template,.customer2-template,.customer3-template,.customer4-template,.customer5-template,.customer6-template,.customer7-template,.customer8-template{width:75px;height:102px}
.pasta,.drink{width:60px;height:60px}
#exp-bar{height:27px;left:2.5%;width:95%}#exp-level{font-size:13px}
#powerup-panel{width:110%;height:96%}#powerup-options{gap:0}.powerup-slot{width:33.33%;height:100%}.powerup-slot img{width:110%;height:96%;object-fit:contain}
#wave-message{font-size:21px}
}
.customer6-template .happy-frame,.customer7-template .happy-frame,.customer8-template .happy-frame{transform:scale(.90);transform-origin:center bottom}

.customer7-template .frame,.customer7-template .happy-frame,.customer7-template .frozen-frame{transform:scale(1.15);transform-origin:center bottom}
.customer7-template .frame:nth-of-type(2){transform:translateX(0) scale(1.15)}
#seon{position:absolute;left:12.5%;bottom:6%;width:100px;height:135px;transform:translateX(-50%);z-index:60;display:none}
#seon img{position:absolute;left:50%;bottom:0;width:104%;height:104%;object-fit:contain;transform:translateX(calc(-50% + var(--shift,0%)));display:none;pointer-events:none}
#seon img.active{display:block}
.cappuccino{position:absolute;width:70px;height:55px;z-index:70;pointer-events:none}
.cappuccino svg{width:100%;height:100%;display:block}
.coffee-drop{background:#aa6b38;box-shadow:0 0 3px #ffe6b7}
.powerup-slot{border:0;padding:0;background:transparent}
.powerup-slot.seon-panel img{width:130%;height:115%}
@media(max-width:500px){#seon{width:65px;height:88px}.cappuccino{width:52px;height:42px}}

/* CORREZIONE DIMENSIONI SEON JEONG */
#seon{
 left:22%;

 height:149px;

}
.cappuccino{
 width:28px;
 height:21px;
}

@media(max-width:500px){

  width:72px;
  height:98px;
  bottom:5%;
 }

  width:28px;
  height:21px;
 }
}

/* Tutti i timer del gioco sono cancellabili al salto di wave.
   Il tempo di gioco si ferma durante la scelta dei potenziamenti. */
let gameClock=0,lastClockTime=performance.now(),nextTaskId=1;
let generation=0;
const gameTasks=new Map();
const gameFrames=new Set();
function gameLater(callback,delay){
 const id=nextTaskId++;
 gameTasks.set(id,{callback,due:gameClock+delay,interval:0});
 return id;
}
function gameEvery(callback,delay){
 const id=nextTaskId++;
 gameTasks.set(id,{callback,due:gameClock+delay,interval:delay});
 return id;
}
function cancelTask(id){gameTasks.delete(id);}
function gameFrame(callback){
 const token=generation;
 const id=requestAnimationFrame(function(time){
  gameFrames.delete(id);
  if(token===generation) callback(time);
 });
 gameFrames.add(id);return id;
}
function tickGameClock(now){
 const delta=now-lastClockTime;lastClockTime=now;
 if(!powerUpPaused&&!bossIntroPlaying&&!gameFinished){
  gameClock+=delta;
  for(const [id,task] of Array.from(gameTasks)){
   if(powerUpPaused||bossIntroPlaying||gameFinished) break;
   if(!gameTasks.has(id)||task.due>gameClock) continue;
   if(task.interval) task.due=gameClock+task.interval;
   else gameTasks.delete(id);
   task.callback();
  }
 }
 requestAnimationFrame(tickGameClock);
}
requestAnimationFrame(tickGameClock);
function clearAllTimers(){
 generation++;
 gameTasks.clear();
 gameFrames.forEach(id=>cancelAnimationFrame(id));gameFrames.clear();
 customerTimer=customer4Timer=cookTimer=waitressAttackTimer=null;

function getAvailablePowerUps(){
 const available=[];
 function add(types){types.forEach(type=>{
  if(powerUps[type]<3)available.push({type,level:powerUps[type]+1});
 });}
 add(['pasta','speed','sauce']);
 if(!powerUps.waitress){
  if(currentLevel>=2)available.push({type:'waitress',level:1});
 }else add(['iceShot','iceChain','deepFreeze']);
 if(!powerUps.seon){
  if(currentLevel>=3)available.push({type:'seon',level:1});
 }else add(['hotSplash','caffeineRush','doubleShot']);
 return available;
}
function shuffle(items){
 for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
 return items;
}
function showPowerUpScreen(){
 if(powerUpPaused)return;
 const available=shuffle(getAvailablePowerUps());
 if(!available.length)return;
 // Sblocchi garantiti tra le tre scelte; gli altri pannelli sono mescolati.
 const guaranteed=currentLevel===2?'waitress':currentLevel===3?'seon':null;
 const fixed=available.find(p=>p.type===guaranteed);
 offeredPowerUps=fixed?[fixed,...available.filter(p=>p!==fixed).slice(0,2)]:available.slice(0,3);
 shuffle(offeredPowerUps);
 const options=document.getElementById('powerup-options');options.innerHTML='';
 offeredPowerUps.forEach(p=>{
  const slot=document.createElement('button');slot.type='button';slot.className='powerup-slot';
  if(['seon','hotSplash','caffeineRush','doubleShot'].includes(p.type))slot.classList.add('seon-panel');
  slot.dataset.type=p.type;slot.dataset.level=p.level;
  const image=document.createElement('img');
  const panel=POWER_UP_PANELS[p.type];image.src=Array.isArray(panel)?panel[p.level-1]:panel;
  image.alt=p.type+' '+p.level;slot.appendChild(image);
  slot.addEventListener('click',()=>selectPowerUp(p.type));options.appendChild(slot);
 });
 powerUpPaused=true;
 document.getElementById('game').classList.add('powerup-paused');
 document.getElementById('powerup-overlay').style.display='flex';
}
function selectPowerUp(type){
 if(!powerUpPaused)return;
 const choice=offeredPowerUps.find(p=>p.type===type);
 if(!choice||!getAvailablePowerUps().some(p=>p.type===type&&p.level===choice.level))return;
 if(type==='waitress'){powerUps.waitress=true;summonWaitress();}
 else if(type==='seon'){
  powerUps.seon=true;document.getElementById('seon').style.display='block';setActorFrame('seon',0);
 }else{
  powerUps[type]++;
  if(type==='pasta'&&powerUps.pasta===2)pastaSpeedBonus=.15;
 }
 // Caffeine Rush modifica solo la frequenza di Seon Jeong.
 if(type==='caffeineRush')startSeonAttack();
 offeredPowerUps=[];
 document.getElementById('powerup-overlay').style.display='none';
 document.getElementById('powerup-options').innerHTML='';
 powerUpPaused=false;document.getElementById('game').classList.remove('powerup-paused');
 updateEXPBar();
}
function summonWaitress(){document.getElementById('waitress').style.display='block';setWaitressFrame(0);}

function updateEXPBar(){

 fill.style.width=Math.min(100,currentEXP/EXP_REQUIREMENTS[currentLevel-1]*100)+'%';
 text.textContent='LV '+currentLevel;
}
function addEXP(amount){
 if(currentLevel>=MAX_LEVEL) return;
 currentEXP+=amount;let levelUp=false;
 while(currentLevel<MAX_LEVEL&&currentEXP>=EXP_REQUIREMENTS[currentLevel-1]){
  currentEXP-=EXP_REQUIREMENTS[currentLevel-1];currentLevel++;levelUp=true;
 }
 updateEXPBar();if(levelUp) showPowerUpScreen();
}

function fitWaveBoard(){

function startWave(number){

 currentWave=number;waveSpawned=0;waveFinished=false;waveStarting=true;updateWaveDisplay();
 if(number===BOSS_WAVE){showBossIntro();return;}
 // L'avvio della prima wave conserva i 4,2 secondi originali.
 gameLater(function(){waveStarting=false;spawnWaveCustomers();},number===1?4200:NORMAL_WAVE_DELAY);
}
function spawnWaveCustomers(){
 if(currentWave===BOSS_WAVE){spawnBossWave();return;}
 const config=WAVES[currentWave-1];if(!config) return;
 const lastLaneSpawn=LANES.map(()=>-Infinity);
 for(let i=0;i<config.customers;i++){
  gameLater(()=>spawnWaveCustomer(i,lastLaneSpawn,config),i*config.spawnInterval);
 }
}
function spawnWaveCustomer(index,lastLaneSpawn,config){
 if(waveSpawned>=config.customers) return;
 let laneIndex,attempts=0;
 do{laneIndex=Math.floor(Math.random()*LANES.length);attempts++;}
 while(attempts<50&&gameClock-lastLaneSpawn[laneIndex]<SAME_LANE_MIN_DELAY);
 lastLaneSpawn[laneIndex]=gameClock;
 spawnCustomer(waveSpawned,laneIndex,config.walkTime,config.hp);waveSpawned++;
 if(waveSpawned>=config.customers) scheduleWaveCheck();
}

  if(currentWave!==BOSS_WAVE||waveFinished) return;
  spawnBossEntity('mainBossTemplate',200,2,100,'boss');scheduleWaveCheck();
 },1500);
}
function spawnBossEntity(templateId,hp,laneIndex,walkTime,type){

}
function spawnCustomer(index,forcedLaneIndex=null,walkTime=null,waveHP=null){
 const type=Math.floor(Math.random()*8)+1;
 return createCustomer('customer'+type+'Template',type,waveHP||30,forcedLaneIndex??Math.floor(Math.random()*LANES.length),walkTime||60,false);
}
let nextCustomerId=0;
function createCustomer(templateId,type,hp,lane,walkTime,isBoss){
 const customer=document.getElementById(templateId).cloneNode(true);
 customer.id='customer-'+(++nextCustomerId);
 customer.classList.remove('customer-template','satisfied');customer.classList.add('spawned-customer');
 customer.style.display='block';customer.style.animation='none';customer.style.top='5%';customer.style.left=LANES[lane]+'%';
 Object.assign(customer.dataset,{type:String(type),hp:String(hp),lane:String(lane),satisfied:'false',atKitchen:'false',frame:'0',frozen:'false',wave:String(currentWave)});
 if(isBoss) customer.dataset.boss='true';
 customer.querySelectorAll('.frame').forEach((f,i)=>f.classList.toggle('active',i===0));
 customer.querySelector('.happy-frame').style.display='none';
 const frozen=customer.querySelector('.frozen-frame');if(frozen) frozen.style.display='none';
 document.getElementById('game').appendChild(customer);customers.push(customer);
 // L'arrivo segue l'animazione, comprese eventuali pause o congelamenti.
 customer.addEventListener('animationend',function(e){
  if(e.target===customer&&e.animationName==='walkDown'&&customer.dataset.satisfied!=='true'){
   customer.dataset.atKitchen='true';updateZIndexes();
  }
 });
 gameFrame(function(){customer.style.animation='walkDown '+walkTime+'s linear forwards';customer.classList.add('walking');});
 return customer;
}
function scheduleWaveCheck(){
 cancelTask(waveCheckTimer);
 // Attesa originale verso il boss; dimezzata verso le altre wave.
 const interval=currentWave>=BOSS_WAVE-1?500:250;
 waveCheckTimer=gameEvery(function(){
  if(waveFinished) return;
  const active=customers.filter(c=>c.isConnected&&c.dataset.wave==currentWave&&c.style.display!=='none');
  const expected=currentWave===BOSS_WAVE?3:WAVES[currentWave-1].customers;
  if(waveSpawned>=expected&&!active.length){cancelTask(waveCheckTimer);waveCheckTimer=null;completeWave();}
 },interval);
}
function completeWave(){
 if(waveFinished) return;waveFinished=true;
 if(currentWave>=TOTAL_WAVES){finishLevel();return;}
 startWave(currentWave+1);
}

const bossIntro=document.getElementById('bossIntro');

let videoSession=0,bossLeaving=false,videoWatchdog=null,videoExitTimer=null;
function stopBossIntro(){
 videoSession++;clearTimeout(videoWatchdog);clearTimeout(videoExitTimer);
 bossVideo.onended=null;bossVideo.onplaying=null;bossVideo.onerror=null;
 bossVideo.pause();bossIntroPlaying=false;bossLeaving=false;
 bossIntro.style.display='none';bossIntro.classList.remove('entering','leaving');
 bossVideoAction.hidden=true;bossVideoAction.onclick=null;
 document.getElementById('testBossButton').disabled=false;
}
function showBossIntro(){
 stopBossIntro();bossIntroPlaying=true;
 const session=videoSession;
 document.getElementById('testBossButton').disabled=true;
 bossIntro.style.display='flex';
 void bossIntro.offsetWidth;bossIntro.classList.add('entering');
 bossVideo.muted=true;bossVideo.currentTime=0;
 function valid(){return session===videoSession&&bossIntroPlaying&&!bossLeaving;}
 function showAction(text,callback){if(!valid())return;bossVideoAction.textContent=text;bossVideoAction.onclick=callback;bossVideoAction.hidden=false;}
 function playVideo(){
  if(!valid())return;bossVideoAction.hidden=true;
  const promise=bossVideo.play();
  if(promise) promise.catch(function(error){
   if(!valid())return;
   if(error.name==='NotAllowedError') showAction('TOCCA PER AVVIARE IL VIDEO',playVideo);
   else showAction('VIDEO NON DISPONIBILE · CONTINUA',finishBossIntro);
  });
 }
 bossVideo.onplaying=function(){if(valid()){clearTimeout(videoWatchdog);bossVideoAction.hidden=true;}};
 bossVideo.onended=function(){if(valid())finishBossIntro();};
 bossVideo.onerror=function(){showAction('VIDEO NON DISPONIBILE · CONTINUA',finishBossIntro);};
 // Nessun timer tronca il filmato: l'uscita parte solo dall'evento ended.
 videoWatchdog=setTimeout(function(){
  if(valid()&&(bossVideo.paused||bossVideo.readyState<3)) showAction('VIDEO IN CARICAMENTO · SALTA',finishBossIntro);
 },15000);
 playVideo();
}
function finishBossIntro(){
 if(!bossIntroPlaying||bossLeaving)return;
 bossLeaving=true;bossVideo.pause();bossVideoAction.hidden=true;clearTimeout(videoWatchdog);
 bossIntro.classList.remove('entering');bossIntro.classList.add('leaving');
 const session=videoSession;
 videoExitTimer=setTimeout(function(){
  if(session!==videoSession)return;
  stopBossIntro();
  gameLater(function(){waveStarting=false;spawnWaveCustomers();},BOSS_WAVE_DELAY);
 },200);
}

/* SALTO DI PROVA: mantiene livello, EXP, potenziamenti ed energia cucina. */
document.getElementById('testBossButton').addEventListener('click',jumpToBossWave);
function jumpToBossWave(){
 if(!ENABLE_BOSS_TEST||!gameStarted||bossIntroPlaying)return;
 clearAllTimers();clearScene();
 gameFinished=false;powerUpPaused=false;
 document.getElementById('powerup-overlay').style.display='none';
 document.getElementById('powerup-options').innerHTML='';
 document.getElementById('game').classList.remove('powerup-paused');
 document.getElementById('wave-message').style.display='none';
 startWave(BOSS_WAVE);startGameSystems();
}

/* CUCINA */
function updateKitchenEnergy(){
 document.getElementById('kitchen').style.display=kitchenEnergy>50?'block':'none';
 document.getElementById('kitchenDamaged').style.display=kitchenEnergy<=50&&kitchenEnergy>20?'block':'none';
 document.getElementById('kitchenDestroyed').style.display=kitchenEnergy<=20?'block':'none';
}
function startKitchenEnergySystem(){
 cancelTask(kitchenDamageTimer);
 kitchenDamageTimer=gameEvery(function(){
  const damage=customers.filter(c=>c.isConnected&&c.dataset.atKitchen==='true'&&c.dataset.satisfied!=='true').length;
  if(damage){kitchenEnergy=Math.max(0,kitchenEnergy-damage);updateKitchenEnergy();}
 },5000);
}
function customerIsVisible(customer){
 if(!customer||!customer.isConnected||customer.style.display==='none')return false;
 const r=customer.getBoundingClientRect(),g=document.getElementById('game').getBoundingClientRect();
 return r.bottom>g.top&&r.top<g.bottom;
}
function startZIndexSystem(){cancelTask(zIndexTimer);zIndexTimer=gameEvery(updateZIndexes,50);}
function updateZIndexes(){
 customers.filter(c=>c.isConnected&&c.style.display!=='none')
 .sort((a,b)=>a.getBoundingClientRect().top-b.getBoundingClientRect().top)
 .forEach((c,i)=>c.style.zIndex=10+i);
}
function startFirstAttackDetection(){
 cancelTask(firstAttackTimer);
 firstAttackTimer=gameEvery(function(){if(getNearestVisibleCustomer()){playCookAttack();cancelTask(firstAttackTimer);firstAttackTimer=null;}},100);
}
function animateCustomerGroup(customer4){
 customers.forEach(customer=>{
  if(!customer.isConnected||customer.style.display==='none'||customer.dataset.satisfied==='true'||customer.dataset.frozen==='true')return;
  if(customer.classList.contains('customer4-template')!==customer4)return;
  const frames=customer.querySelectorAll('.frame');if(!frames.length)return;
  let n=parseInt(customer.dataset.frame||'0')%frames.length;
  frames.forEach((f,i)=>f.classList.toggle('active',i===n));customer.dataset.frame=(n+1)%frames.length;
 });
}
function startCustomerAnimation(){cancelTask(customerTimer);customerTimer=gameEvery(()=>animateCustomerGroup(false),300);}
function startCustomer4Animation(){cancelTask(customer4Timer);customer4Timer=gameEvery(()=>animateCustomerGroup(true),300);}

/* ATTACCHI E BERSAGLI */
function getAttackTargets(){
 const active=customers.filter(c=>c.dataset.satisfied!=='true'&&customerIsVisible(c));
 active.sort((a,b)=>b.getBoundingClientRect().top-a.getBoundingClientRect().top);
 return active.slice(0,powerUps.pasta>=3?3:powerUps.pasta>=1?2:1);
}
function getNearestVisibleCustomer(){
 const active=customers.filter(c=>c.dataset.satisfied!=='true'&&customerIsVisible(c));
 active.sort((a,b)=>b.getBoundingClientRect().top-a.getBoundingClientRect().top);return active[0]||null;
}
function getCookAttackInterval(){return Math.round(3000/((1+powerUps.speed*.33)*(1+pastaSpeedBonus)));}
function getWaitressAttackInterval(){return Math.round(getCookAttackInterval()*.67);}
function startCookAnimation(){
 cancelTask(cookTimer);setCookFrame(0);
 cookTimer=gameEvery(function(){if(getNearestVisibleCustomer())playCookAttack();else if(!cookAttacking)setCookFrame(0);},getCookAttackInterval());
}
function playCookAttack(){
 if(powerUpPaused||bossIntroPlaying||cookAttacking)return;
 const targets=getAttackTargets();if(!targets.length){setCookFrame(0);return;}
 cookAttacking=true;setCookFrame(0);
 gameLater(()=>setCookFrame(1),160);gameLater(()=>setCookFrame(2),320);
 gameLater(function(){setCookFrame(3);gameFrame(()=>targets.forEach(t=>{if(t.isConnected&&t.dataset.satisfied!=='true')throwPasta(t);}));},480);
 gameLater(()=>setCookFrame(4),640);
 gameLater(function(){setCookFrame(0);cookAttacking=false;},800);
}
function startWaitressAttack(){
 cancelTask(waitressAttackTimer);
 waitressAttackTimer=gameEvery(function(){
  if(!powerUps.waitress||document.getElementById('waitress').style.display==='none')return;
  if(getNearestVisibleCustomer())playWaitressAttack();else if(!waitressAttacking)setWaitressFrame(0);
 },getWaitressAttackInterval());
}
function playWaitressAttack(){
 if(powerUpPaused||bossIntroPlaying||!powerUps.waitress||waitressAttacking)return;
 const target=getNearestVisibleCustomer();if(!target){setWaitressFrame(0);return;}
 waitressAttacking=true;setWaitressFrame(0);
 gameLater(()=>setWaitressFrame(1),160);gameLater(()=>setWaitressFrame(2),320);gameLater(()=>setWaitressFrame(3),480);
 gameLater(function(){setWaitressFrame(4);gameFrame(()=>{if(target.isConnected&&target.dataset.satisfied!=='true')throwDrink(target);});},640);
 gameLater(()=>setWaitressFrame(5),800);gameLater(()=>setWaitressFrame(6),960);
 gameLater(function(){setWaitressFrame(0);waitressAttacking=false;},1120);
}

/* SEON JEONG: quinto fotogramma a 640 ms. */
function getSeonAttackInterval(){
 // Frequenza base identica alla cameriera all'avvio della partita.
 const base=gameTasks.get(waitressAttackTimer)?.interval??getWaitressAttackInterval();
 return Math.round(base/(1+[0,.10,.25,.45][powerUps.caffeineRush]));
}
function startSeonAttack(){
 cancelTask(seonAttackTimer);
 seonAttackTimer=gameEvery(()=>{
  if(powerUps.seon&&getNearestVisibleCustomer())playSeonAttack();
 },getSeonAttackInterval());
}
function playSeonAttack(){
 if(powerUpPaused||bossIntroPlaying||!powerUps.seon||seonAttacking)return;
 const target=getNearestVisibleCustomer();if(!target)return;
 seonAttacking=true;setActorFrame('seon',0);
 for(let i=1;i<=5;i++)gameLater(()=>{
  setActorFrame('seon',i);
  if(i===3&&target.isConnected&&target.dataset.satisfied!=='true')throwProjectile(target,'cappuccino');
 },i*160);
 gameLater(()=>{setActorFrame('seon',0);seonAttacking=false;},960);
}
/* Ritaglio grafico della tazzina dal pannello: nessun file aggiuntivo. */
let cupId=0;
function makeCappuccino(){
 const element=document.createElement('div'),id='cup-'+(++cupId);
 element.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="674 756 181 130">
 <defs><clipPath id="${id}"><path d="M692 782 C695 751 815 746 825 788 C852 773 867 815 823 837 C863 854 837 883 764 885 C684 887 654 855 693 837 Z"/></clipPath></defs>
 <image href="${POWER_UP_PANELS.seon}" width="1155" height="1536" preserveAspectRatio="none" clip-path="url(#${id})"/>
 </svg>`;
 return element;
}
function hitCustomerWithCoffee(customer,projectile){
 if(projectile)projectile.remove();
 if(!customerIsVisible(customer)||customer.dataset.satisfied==='true')return;
 const damage=3*(1+[0,.20,.40,.65][powerUps.doubleShot]);
 const chance=[.10,.25,.45,.70][powerUps.hotSplash];
 // Un solo bersaglio aggiuntivo, vicino: lo splash non genera altri splash.
 const r=customer.getBoundingClientRect();
 const radius=document.getElementById('game').getBoundingClientRect().width*.32;
 let nearby=null,best=radius;
 if(Math.random()<chance)customers.forEach(c=>{
  if(c===customer||!customerIsVisible(c)||c.dataset.satisfied==='true')return;
  const b=c.getBoundingClientRect();
  const distance=Math.hypot(b.left+b.width/2-r.left-r.width/2,b.top+b.height/2-r.top-r.height/2);
  if(distance<best){best=distance;nearby=c;}
 });
 function hit(c){
  createImpactEffect(c,'cappuccino');
  c.dataset.hp=String(Math.max(0,Number(c.dataset.hp)-damage));
  if(Number(c.dataset.hp)<=0)satisfyCustomer(c);
 }
 hit(customer);if(nearby)hit(nearby);
}
/* PASTA / DRINK */
function throwPasta(target){throwProjectile(target,'pasta');}
function throwDrink(target){throwProjectile(target,'drink');}
function throwProjectile(target,type){
 if(!target||!target.isConnected||target.dataset.satisfied==='true')return;
 const isDrink=type==='drink',isCoffee=type==='cappuccino',game=document.getElementById('game'),gameRect=game.getBoundingClientRect();
 const frame=document.querySelector(isCoffee?'#seon img.active':isDrink?'#waitress img.active':'#cook img.active');if(!frame)return;
 const rect=frame.getBoundingClientRect();
 let currentX=rect.left+rect.width*(isCoffee?.72:isDrink?.88:.72),currentY=rect.top+rect.height*(isCoffee?.38:isDrink?.34:.32);
 const marker=document.createElement('div');marker.className='hit-marker';game.appendChild(marker);
 const projectile=isCoffee?makeCappuccino():document.createElement('img');projectile.className=type;
 if(!isCoffee)projectile.src=isDrink?'https://i.ibb.co/MDk4xzJd/1788234306668-removebg-preview.png':'https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png';
 game.appendChild(projectile);
 const pr=projectile.getBoundingClientRect();
 const halfWidth=pr.width/2,halfHeight=pr.height/2;
 function position(){projectile.style.left=currentX-gameRect.left-halfWidth+'px';projectile.style.top=currentY-gameRect.top-halfHeight+'px';}
 position();const speed=(isDrink||isCoffee)?350:350*(1+powerUps.speed*.33)*(1+pastaSpeedBonus);
 let lastTime=performance.now();
 function move(now){
  if(!target.isConnected||target.dataset.satisfied==='true'){projectile.remove();marker.remove();return;}
  if(powerUpPaused||bossIntroPlaying){lastTime=now;gameFrame(move);return;}
  const r=target.getBoundingClientRect(),endX=r.left+r.width/2+HIT_X,endY=r.top+r.height*HIT_POSITION_Y+HIT_Y;
  marker.style.left=endX-gameRect.left+'px';marker.style.top=endY-gameRect.top+'px';
  const dt=Math.min((now-lastTime)/1000,.05);lastTime=now;
  const dx=endX-currentX,dy=endY-currentY,distance=Math.hypot(dx,dy),movement=speed*dt;
  if(distance<=movement){currentX=endX;currentY=endY;}else{currentX+=dx/distance*movement;currentY+=dy/distance*movement;}
  position();
  if(Math.hypot(endX-currentX,endY-currentY)<=3){
   if(isCoffee)hitCustomerWithCoffee(target,projectile);else if(isDrink)hitCustomerWithDrink(target,projectile);else hitCustomer(target,projectile);
   marker.remove();return;
  }
  gameFrame(move);
 }
 gameFrame(move);
}
function createImpactEffect(customer,type){
 if(!customer)return;
 const game=document.getElementById('game'),g=game.getBoundingClientRect(),r=customer.getBoundingClientRect();
 const isDrink=type!=='pasta';
 for(let i=0;i<(isDrink?7:6);i++){
  const particle=document.createElement('div');particle.className='impact-particle '+(isDrink?'drink-drop':'pasta-strand');
  if(type==='cappuccino'){particle.classList.add('coffee-drop');particle.style.background=i%2?'#a56a38':'#ffe4b5';}
  particle.style.left=r.left+r.width/2-g.left+'px';particle.style.top=r.top+r.height*.45-g.top+'px';
  const angle=Math.random()*Math.PI*2,distance=isDrink?18+Math.random()*28:20+Math.random()*30;
  particle.style.setProperty('--dx',Math.cos(angle)*distance+'px');particle.style.setProperty('--dy',Math.sin(angle)*distance+'px');
  if(!isDrink)particle.style.setProperty('--rot',Math.floor(Math.random()*180)+'deg');
  game.appendChild(particle);gameLater(()=>particle.remove(),isDrink?400:450);
 }
}
function hitCustomer(customer,pasta){
 if(pasta)pasta.remove();if(!customer||!customer.isConnected||customer.dataset.satisfied==='true')return;
 createImpactEffect(customer,'pasta');const hp=Number(customer.dataset.hp||'30')-(5+powerUps.sauce);customer.dataset.hp=hp;
 if(hp<=0)satisfyCustomer(customer);
}
function hitCustomerWithDrink(customer,drink){
 if(drink)drink.remove();if(!customer||!customer.isConnected||customer.dataset.satisfied==='true')return;
 createImpactEffect(customer,'drink');const hp=Number(customer.dataset.hp||'30')-3;customer.dataset.hp=hp;
 if(hp<=0)satisfyCustomer(customer);
 else if(Math.random()<[.10,.20,.35,.50][powerUps.iceShot]){freezeCustomer(customer);tryIceChain(customer);}
}
function freezeCustomer(customer){
 if(!customer||!customer.isConnected||customer.style.display==='none'||customer.dataset.satisfied==='true')return;
 cancelTask(customer._freezeTimer);customer.dataset.frozen='true';customer.style.animationPlayState='paused';
 const frozen=customer.querySelector('.frozen-frame');
 if(frozen){customer.querySelectorAll('.frame').forEach(f=>f.classList.remove('active'));frozen.style.display='block';}
 customer._freezeTimer=gameLater(function(){
  if(customer.isConnected&&customer.style.display!=='none'&&customer.dataset.satisfied!=='true'){
   customer.style.animationPlayState='running';customer.dataset.frozen='false';if(frozen)frozen.style.display='none';
   const frames=customer.querySelectorAll('.frame'),n=parseInt(customer.dataset.frame||'0')%frames.length;
   frames.forEach((f,i)=>f.classList.toggle('active',i===n));
  }
  customer._freezeTimer=null;
 },[500,1500,2000,2500][powerUps.deepFreeze]);
}
function tryIceChain(original){
 if(powerUps.iceChain<=0||Math.random()>=[0,.30,.50,.75][powerUps.iceChain])return;
 const r=original.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 let nearest=null,best=Infinity;
 customers.forEach(c=>{
  if(!c.isConnected||c===original||c.style.display==='none'||c.dataset.satisfied==='true')return;
  const rect=c.getBoundingClientRect(),distance=Math.hypot(rect.left+rect.width/2-x,rect.top+rect.height/2-y);
  if(distance<best){best=distance;nearest=c;}
 });
 if(nearest)freezeCustomer(nearest);
}
function satisfyCustomer(customer){
 if(!customer||!customer.isConnected||customer.dataset.satisfied==='true')return;
 cancelTask(customer._freezeTimer);customer._freezeTimer=null;
 const rect=customer.getBoundingClientRect(),gameRect=document.getElementById('game').getBoundingClientRect();
 customer.style.animation='none';customer.style.animationPlayState='running';
 customer.classList.remove('walking');customer.classList.add('satisfied');
 customer.style.top=rect.top-gameRect.top+'px';customer.style.left=rect.left-gameRect.left+'px';
 customer.dataset.satisfied='true';customer.dataset.atKitchen='false';customer.dataset.frozen='false';
 addEXP(EXP_PER_CUSTOMER);
 customer.querySelectorAll('.frame').forEach(f=>f.classList.remove('active'));
 const frozen=customer.querySelector('.frozen-frame');if(frozen)frozen.style.display='none';
 const happy=customer.querySelector('.happy-frame');if(happy)happy.style.display='block';updateZIndexes();
 // 0,5 s + controllo 0–0,25 s + attesa 0,6 s = circa 1,1–1,35 s.
 // Verso la boss wave restano la posa da 1 s e il controllo da 0,5 s.
 gameLater(function(){customer.style.display='none';if(happy)happy.style.display='none';customer.classList.remove('satisfied');updateZIndexes();},currentWave>=BOSS_WAVE-1?1000:500);
}
function satisfyCustomer1(){const c=customers.find(c=>c.dataset.type==='1'&&c.dataset.satisfied!=='true');if(c)satisfyCustomer(c);}
function satisfyCustomer2(){const c=customers.find(c=>c.dataset.type==='2'&&c.dataset.satisfied!=='true');if(c)satisfyCustomer(c);}

</script>
