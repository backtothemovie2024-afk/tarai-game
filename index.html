<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* HOME */

#menu {
    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    color: #ffd447;
    font-size: 55px;
    margin: 0 0 40px;
}

button {
    width: 240px;
    height: 65px;

    border: none;
    border-radius: 15px;

    background: #ef6428;
    color: white;

    font-size: 28px;
    font-weight: bold;
}

/* LIVELLO */

#game {
    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    background: white;
}

/* HUD */

#hud {
    position: absolute;

    top: 15px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;

    font-size: 22px;
    font-weight: bold;

    color: black;
}

/* SPRITE */

#customer {

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 150px;
    height: 200px;

    object-fit: contain;
}

</style>
</head>

<body>


<!-- HOME -->

<div id="menu">

    <h1>TARAI RUSH</h1>

    <button onclick="startGame()">
        PLAY
    </button>

</div>


<!-- LIVELLO -->

<div id="game">

    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>


    <img
        id="customer"
        src="https://i.ibb.co/39yMsFWJ/1787786320198-3.jpg"
        alt="Cliente">

</div>


<script>

function startGame() {

    document.getElementById("menu").style.display = "none";

    document.getElementById("game").style.display = "block";

}

</script>

</body>
</html>
