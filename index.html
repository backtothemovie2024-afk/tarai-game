<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

/* ==================================================
   RESET
================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* ==================================================
   SCHERMO VERTICALE
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 100;
}


/* ==================================================
   COPERTINA
================================================== */

#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 10;
}


/* ==================================================
   PULSANTE PLAY
================================================== */

#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    z-index: 30;
}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


/* ==================================================
   BACKGROUND
================================================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform: translate(-50%, -50%);

    object-fit: contain;

    pointer-events: none;
}


/* ==================================================
   CUCINA INTEGRA
================================================== */

#kitchen {

    z-index: 15;
}


/* ==================================================
   CUCINA DANNEGGIATA
================================================== */

#kitchenDamaged {

    z-index: 16;

    display: none;
}


/* ==================================================
   BARRA ENERGIA
================================================== */

#energyContainer {

    position: absolute;

    top: 45%;

    left: 50%;

    transform: translateX(-50%);

    width: 65%;

    height: 22px;

    background: rgba(0, 0, 0, 0.65);

    border: 2px solid white;

    border-radius: 12px;

    overflow: hidden;

    z-index: 40;
}


#energyBar {

    width: 100%;

    height: 100%;

    background: #2ecc40;

    transition:
        width 0.3s linear,
        background 0.3s linear;
}


#energyText {

    position: absolute;

    top: 45%;

    left: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: 15px;

    font-weight: bold;

    z-index: 41;

    text-shadow:
        1px 1px 2px black,
        -1px -1px 2px black;

    pointer-events: none;
}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    color: white;

    z-index: 30;
}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -130px;

    z-index: 10;

    animation:
        walkDown
        20s
        linear
        forwards;
}


/* ==================================================
   CLIENTE 1
================================================== */

#customer1 {

    left: 35%;
}


/* ==================================================
   CLIENTE 2
================================================== */

#customer2 {

    left: 65%;
}


/* ==================================================
   FRAME CLIENTI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    object-position: center;

    display: none;
}


.customer .frame.active {

    display: block;
}


/* ==================================================
   MOVIMENTO CLIENTI
================================================== */

@keyframes walkDown {

    0% {

        top: -130px;

    }

    65% {

        top: 69%;

    }

    100% {

        top: 69%;

    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform: translateX(-50%);

    z-index: 20;
}


/* ==================================================
   FRAME CUOCO
================================================== */

#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    object-position: center;

    display: none;
}


#cook img.active {

    display: block;
}


/* ==================================================
   SPRITE PIÙ PICCOLI SU TELEFONO
================================================== */

@media (max-width: 500px) {

    .customer,
    #cook {

        width: 65px;

        height: 88px;

    }

}

</style>

</head>


<body>

<div id="phone">


    <!-- ==================================================
         MENU
    ================================================== -->

    <div id="menu">

        <img
            id="cover"
            src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
            alt="Tarai Rush">


        <button id="playButton">

            PLAY

        </button>

    </div>



    <!-- ==================================================
         GIOCO
    ================================================== -->

    <div id="game">


        <!-- BACKGROUND -->

        <img
            id="background"
            src="https://i.ibb.co/pj7trt5y/IMG-20260829-WA0012.jpg"
            alt="Background">



        <!-- CUCINA INTEGRA -->

        <img
            id="kitchen"
            src="https://i.ibb.co/39jfnpgW/IMG-20260829-WA0013-removebg-preview.png"
            alt="Cucina">



        <!-- CUCINA DANNEGGIATA -->

        <img
            id="kitchenDamaged"
            src="https://i.ibb.co/7t1CkQYc/IMG-20260829-WA0014-removebg-preview.png"
            alt="Cucina danneggiata">



        <!-- ==================================================
             BARRA ENERGIA
        ================================================== -->

        <div id="energyContainer">

            <div id="energyBar"></div>

        </div>

        <div id="energyText">

            100%

        </div>



        <!-- ==================================================
             HUD
        ================================================== -->

        <div id="hud">

            <span>❤️ 3</span>

            <span>⭐ 0</span>

        </div>



        <!-- ==================================================
             CLIENTE 1
        ================================================== -->

        <div
            id="customer1"
            class="customer">

            <img
                class="frame active"
                src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
                alt="Cliente 1">

            <img
                class="frame"
                src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
                alt="Cliente 1">

        </div>



        <!-- ==================================================
             CLIENTE 2
        ================================================== -->

        <div
            id="customer2"
            class="customer">

            <img
                class="frame active"
                src="https://i.ibb.co/jP6QSPFd/1000040572-removebg-preview.png"
                alt="Cliente 2">

            <img
                class="frame"
                src="https://i.ibb.co/vxJCRK81/1000040573-removebg-preview.png"
                alt="Cliente 2">

        </div>



        <!-- ==================================================
             CUOCO
        ================================================== -->

        <div id="cook">

            <img
                class="active"
                src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
                alt="Cuoco frame 1">

            <img
                src="https://i.ibb.co/fY9GKKNP/IMG-20260829-WA0006-removebg-preview.png"
                alt="Cuoco frame 2">

            <img
                src="https://i.ibb.co/kskzw0J1/IMG-20260829-WA0004-removebg-preview.png"
                alt="Cuoco frame 3">

            <img
                src="https://i.ibb.co/9mSrQBZx/IMG-20260829-WA0007-removebg-preview.png"
                alt="Cuoco frame 4">

            <img
                src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
                alt="Cuoco frame 5">

        </div>


    </div>

</div>



<script>

/* ==================================================
   VARIABILI
================================================== */

let customerFrame1 = 0;

let customerFrame2 = 0;

let cookFrame = 0;

let customerTimer = null;

let cookTimer = null;


/* ==================================================
   ENERGIA CUCINA
================================================== */

let kitchenEnergy = 100;

let kitchenDamageTimer = null;

let customer1AtKitchen = false;

let customer2AtKitchen = false;


/* ==================================================
   PLAY
================================================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        /* MENU */

        document
            .getElementById("menu")
            .style.display = "none";


        /* GIOCO */

        document
            .getElementById("game")
            .style.display = "block";


        /* RESET */

        kitchenEnergy = 100;

        customer1AtKitchen = false;

        customer2AtKitchen = false;


        /* RESET VISIVO */

        document
            .getElementById("kitchen")
            .style.display = "block";


        document
            .getElementById("kitchenDamaged")
            .style.display = "none";


        updateKitchenEnergy();



        /* CLIENTE 1 */

        const customer1 =
            document.getElementById("customer1");


        customer1.style.animation = "none";

        void customer1.offsetWidth;

        customer1.style.animation =
            "walkDown 20s linear forwards";



        /* CLIENTE 2 */

        const customer2 =
            document.getElementById("customer2");


        customer2.style.animation = "none";

        void customer2.offsetWidth;

        customer2.style.animation =
            "walkDown 20s linear forwards";



        /* ANIMAZIONI */

        startCustomerAnimation();

        startCookAnimation();

        startKitchenEnergySystem();


        /* CONTROLLO ARRIVO */

        startCustomerKitchenDetection();

    });



/* ==================================================
   AGGIORNA BARRA ENERGIA
================================================== */

function updateKitchenEnergy() {


    const bar =
        document.getElementById("energyBar");


    const text =
        document.getElementById("energyText");


    bar.style.width =
        kitchenEnergy + "%";


    text.textContent =
        kitchenEnergy + "%";



    /* COLORE */

    if (kitchenEnergy > 50) {

        bar.style.background =
            "#2ecc40";

    }

    else if (kitchenEnergy > 25) {

        bar.style.background =
            "#f1c40f";

    }

    else {

        bar.style.background =
            "#e74c3c";

    }



    /* CAMBIO CUCINA */

    if (kitchenEnergy <= 50) {

        document
            .getElementById("kitchen")
            .style.display = "none";


        document
            .getElementById("kitchenDamaged")
            .style.display = "block";

    }

}



/* ==================================================
   SISTEMA DANNO CUCINA
================================================== */

function startKitchenEnergySystem() {


    if (kitchenDamageTimer !== null) {

        clearInterval(kitchenDamageTimer);

    }


    kitchenDamageTimer =
        setInterval(function() {


            let damage = 0;


            if (customer1AtKitchen) {

                damage++;

            }


            if (customer2AtKitchen) {

                damage++;

            }


            if (damage > 0) {

                kitchenEnergy -= damage;


                if (kitchenEnergy < 0) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();


                console.log(
                    "Energia cucina:",
                    kitchenEnergy
                );

            }


        }, 5000);

}



/* ==================================================
   CONTROLLO ARRIVO CLIENTI
================================================== */

function startCustomerKitchenDetection() {


    const detectionTimer =
        setInterval(function() {


            const customer1 =
                document.getElementById("customer1");


            const customer2 =
                document.getElementById("customer2");


            const game =
                document.getElementById("game");


            const limit =
                game.clientHeight * 0.69;



            /* CLIENTE 1 */

            if (
                !customer1AtKitchen &&
                customer1.offsetTop >= limit
            ) {

                customer1AtKitchen = true;

            }



            /* CLIENTE 2 */

            if (
                !customer2AtKitchen &&
                customer2.offsetTop >= limit
            ) {

                customer2AtKitchen = true;

            }


            /* SE ENTRAMBI SONO ARRIVATI */

            if (
                customer1AtKitchen &&
                customer2AtKitchen
            ) {

                clearInterval(detectionTimer);

            }


        }, 100);

}



/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (customerTimer !== null) {

        clearInterval(customerTimer);

    }


    customerFrame1 = 0;

    customerFrame2 = 0;


    customerTimer =
        setInterval(function() {


            /* CLIENTE 1 */

            const c1 =
                document
                    .getElementById("customer1")
                    .querySelectorAll(".frame");


            c1.forEach(function(frame) {

                frame.classList.remove("active");

            });


            c1[customerFrame1]
                .classList.add("active");


            customerFrame1++;


            if (customerFrame1 >= 2) {

                customerFrame1 = 0;

            }



            /* CLIENTE 2 */

            const c2 =
                document
                    .getElementById("customer2")
                    .querySelectorAll(".frame");


            c2.forEach(function(frame) {

                frame.classList.remove("active");

            });


            c2[customerFrame2]
                .classList.add("active");


            customerFrame2++;


            if (customerFrame2 >= 2) {

                customerFrame2 = 0;

            }


        }, 300);

}



/* ==================================================
   ANIMAZIONE CUOCO
================================================== */

function startCookAnimation() {


    if (cookTimer !== null) {

        clearInterval(cookTimer);

    }


    cookFrame = 0;


    cookTimer =
        setInterval(function() {


            const cookFrames =
                document
                    .getElementById("cook")
                    .querySelectorAll("img");


            cookFrames.forEach(function(frame) {

                frame.classList.remove("active");

            });


            cookFrames[cookFrame]
                .classList.add("active");


            cookFrame++;


            if (cookFrame >= 5) {

                cookFrame = 0;

            }


        }, 120);

}

</script>


</body>

</html>
