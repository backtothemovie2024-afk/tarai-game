<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;
}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 10;
}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform: translate(-50%, -50%);

    pointer-events: none;
}


#kitchen {

    z-index: 15;

}


#kitchenDamaged {

    z-index: 16;

    display: none;

}


#kitchenDestroyed {

    z-index: 17;

    display: none;

}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -130px;

    z-index: 10;

    animation:

        walkDown

        40s

        linear

        forwards;

}


.customer.satisfied {

    animation: none;

}


#customer1 {

    left: 35%;

}


#customer2 {

    left: 65%;

}


.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


.customer .frame.active {

    display: block;

}


/* ==================================================
   MOVIMENTO CLIENTI
================================================== */

@keyframes walkDown {

    0% {

        top: -130px;

    }

    65% {

        top: 69%;

    }

    100% {

        top: 69%;

    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform: translateX(-50%);

    z-index: 20;

}


#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


#cook img.active {

    display: block;

}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 25;

    pointer-events: none;

}


/* ==================================================
   PUNTO ROSSO
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:

        0 0 8px red,

        0 0 15px rgba(255,0,0,0.8);

    transform:

        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

}


@media (max-width: 500px) {

    .customer,
    #cook {

        width: 65px;

        height: 88px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- ==================================================
     MENU
================================================== -->

<div id="menu">

    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt=""
    >

    <button id="playButton">

        PLAY

    </button>

</div>



<!-- ==================================================
     GIOCO
================================================== -->

<div id="game">


    <!-- SFONDO -->

    <img
        id="background"
        src="https://i.ibb.co/pj7trt5y/IMG-20260829-WA0012.jpg"
        alt=""
    >


    <!-- CUCINA INTEGRA -->

    <img
        id="kitchen"
        src="https://i.ibb.co/39jfnpgW/IMG-20260829-WA0013-removebg-preview.png"
        alt=""
    >


    <!-- CUCINA DANNEGGIATA -->

    <img
        id="kitchenDamaged"
        src="https://i.ibb.co/7t1CkQYc/IMG-20260829-WA0014-removebg-preview.png"
        alt=""
    >


    <!-- CUCINA DISTRUTTA -->

    <img
        id="kitchenDestroyed"
        src="https://i.ibb.co/HLF1Q2zn/IMG-20260829-WA0015-removebg-preview.png"
        alt=""
    >


    <!-- HUD -->

    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>



    <!-- ==================================================
         CLIENTE 1
    ================================================== -->

    <div
        id="customer1"
        class="customer"
    >

        <img
            class="frame active"
            src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
            alt=""
        >

        <img
            class="frame"
            src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
            alt=""
        >

    </div>



    <!-- ==================================================
         CLIENTE 2
    ================================================== -->

    <div
        id="customer2"
        class="customer"
    >

        <img
            class="frame active"
            src="https://i.ibb.co/jP6QSPFd/1000040572-removebg-preview.png"
            alt=""
        >

        <img
            class="frame"
            src="https://i.ibb.co/vxJCRK81/1000040573-removebg-preview.png"
            alt=""
        >

    </div>



    <!-- ==================================================
         CUOCO
    ================================================== -->

    <div id="cook">


        <!-- FRAME 1 -->

        <img
            class="active"
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 2 -->

        <img
            src="https://i.ibb.co/fY9GKKNP/IMG-20260829-WA0006-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 3 -->

        <img
            src="https://i.ibb.co/kskzw0J1/IMG-20260829-WA0004-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 4 = LANCIO -->

        <img
            src="https://i.ibb.co/9mSrQBZx/IMG-20260829-WA0007-removebg-preview.png"
            alt=""
        >


        <!-- FRAME 5 -->

        <img
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt=""
        >

    </div>


</div>

</div>



<script>


/* ==================================================
   REGOLAZIONE PUNTO DI IMPATTO
================================================== */


/*
   HIT_X

   Negativo = sinistra
   Positivo = destra
*/

const HIT_X = 5;



/*
   HIT_Y

   Negativo = più in alto
   Positivo = più in basso
*/

const HIT_Y = 0;



/*
   Posizione verticale
   relativa allo sprite.

   0.45 = 45%

   0.50 = centro
   0.55 = più basso
*/

const HIT_POSITION_Y = 0.45;



/* ==================================================
   VARIABILI
================================================== */

let customerFrame1 = 0;

let customerFrame2 = 0;

let customerTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;


let kitchenEnergy = 100;


let customer1AtKitchen = false;

let customer2AtKitchen = false;


let customer1HP = 50;

let customer2HP = 50;


let customer1Satisfied = false;

let customer2Satisfied = false;



/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener("click", function() {


    document
    .getElementById("menu")
    .style.display = "none";


    document
    .getElementById("game")
    .style.display = "block";


    kitchenEnergy = 100;


    customer1AtKitchen = false;

    customer2AtKitchen = false;


    customer1HP = 50;

    customer2HP = 50;


    customer1Satisfied = false;

    customer2Satisfied = false;


    const customer1 =
        document.getElementById(
            "customer1"
        );


    const customer2 =
        document.getElementById(
            "customer2"
        );


    customer1.style.display =
        "block";


    customer2.style.display =
        "block";


    customer1.classList.remove(
        "satisfied"
    );


    customer2.classList.remove(
        "satisfied"
    );


    customer1.style.animation =
        "none";


    void customer1.offsetWidth;


    customer1.style.animation =
        "walkDown 40s linear forwards";


    customer2.style.animation =
        "none";


    void customer2.offsetWidth;


    customer2.style.animation =
        "walkDown 40s linear forwards";


    document
    .getElementById("kitchen")
    .style.display =
        "block";


    document
    .getElementById("kitchenDamaged")
    .style.display =
        "none";


    document
    .getElementById("kitchenDestroyed")
    .style.display =
        "none";


    updateKitchenEnergy();


    startCustomerAnimation();

    startCookAnimation();

    startKitchenEnergySystem();

    startCustomerKitchenDetection();

    startFirstAttackDetection();

});



/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {


    if (kitchenEnergy > 50) {


        document
        .getElementById("kitchen")
        .style.display =
            "block";


        document
        .getElementById("kitchenDamaged")
        .style.display =
            "none";


        document
        .getElementById("kitchenDestroyed")
        .style.display =
            "none";


    }

    else if (kitchenEnergy > 20) {


        document
        .getElementById("kitchen")
        .style.display =
            "none";


        document
        .getElementById("kitchenDamaged")
        .style.display =
            "block";


        document
        .getElementById("kitchenDestroyed")
        .style.display =
            "none";


    }

    else {


        document
        .getElementById("kitchen")
        .style.display =
            "none";


        document
        .getElementById("kitchenDamaged")
        .style.display =
            "none";


        document
        .getElementById("kitchenDestroyed")
        .style.display =
            "block";

    }

}



/* ==================================================
   ENERGIA CUCINA
================================================== */

function startKitchenEnergySystem() {


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
    setInterval(function() {


        let damage = 0;


        if (
            customer1AtKitchen &&
            !customer1Satisfied
        ) {

            damage++;

        }


        if (
            customer2AtKitchen &&
            !customer2Satisfied
        ) {

            damage++;

        }


        if (damage > 0) {


            kitchenEnergy -= damage;


            if (
                kitchenEnergy < 0
            ) {

                kitchenEnergy = 0;

            }


            updateKitchenEnergy();

        }


    }, 5000);

}



/* ==================================================
   ARRIVO ALLA CUCINA
================================================== */

function startCustomerKitchenDetection() {


    setTimeout(function() {


        if (!customer1Satisfied) {

            customer1AtKitchen = true;

        }


    }, 26000);


    setTimeout(function() {


        if (!customer2Satisfied) {

            customer2AtKitchen = true;

        }


    }, 26000);

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer ||
        customer.style.display === "none"
    ) {

        return false;

    }


    const rect =
        customer.getBoundingClientRect();


    const game =
        document.getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}



/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {


    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

    }


    firstAttackTimer =
    setInterval(function() {


        const c1 =
            document.getElementById(
                "customer1"
            );


        const c2 =
            document.getElementById(
                "customer2"
            );


        if (
            customerIsVisible(c1) &&
            !customer1Satisfied
        ) {


            playCookAttack();


            clearInterval(
                firstAttackTimer
            );


            return;

        }


        if (
            customerIsVisible(c2) &&
            !customer2Satisfied
        ) {


            playCookAttack();


            clearInterval(
                firstAttackTimer
            );


            return;

        }


    }, 100);

}



/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (
        customerTimer !== null
    ) {

        clearInterval(
            customerTimer
        );

    }


    customerFrame1 = 0;

    customerFrame2 = 0;


    customerTimer =
    setInterval(function() {


        if (!customer1Satisfied) {


            const frames =
                document
                .getElementById(
                    "customer1"
                )
                .querySelectorAll(
                    ".frame"
                );


            frames.forEach(
                function(frame) {

                    frame.classList
                    .remove("active");

                }
            );


            frames[
                customerFrame1
            ].classList.add(
                "active"
            );


            customerFrame1++;


            if (
                customerFrame1 >=
                frames.length
            ) {

                customerFrame1 = 0;

            }

        }



        if (!customer2Satisfied) {


            const frames =
                document
                .getElementById(
                    "customer2"
                )
                .querySelectorAll(
                    ".frame"
                );


            frames.forEach(
                function(frame) {

                    frame.classList
                    .remove("active");

                }
            );


            frames[
                customerFrame2
            ].classList.add(
                "active"
            );


            customerFrame2++;


            if (
                customerFrame2 >=
                frames.length
            ) {

                customerFrame2 = 0;

            }

        }


    }, 300);

}



/* ==================================================
   FRAME CUOCO
================================================== */

function setCookFrame(
    frameNumber
) {


    const frames =
        document
        .getElementById("cook")
        .querySelectorAll("img");


    frames.forEach(
        function(frame) {

            frame.classList
            .remove("active");

        }
    );


    frames[
        frameNumber
    ].classList.add(
        "active"
    );

}



/* ==================================================
   ATTACCO CUOCO
================================================== */

function playCookAttack() {


    const target =
        getNearestVisibleCustomer();


    if (target === null) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(function() {

        setCookFrame(1);

    }, 120);


    setTimeout(function() {

        setCookFrame(2);

    }, 240);


    /*
       FRAME 4
       = LANCIO
    */

    setTimeout(function() {


        setCookFrame(3);


        throwPasta(target);


    }, 360);


    setTimeout(function() {

        setCookFrame(4);

    }, 480);


    setTimeout(function() {

        setCookFrame(0);

    }, 600);

}



/* ==================================================
   ATTACCO OGNI 3 SECONDI
================================================== */

function startCookAnimation() {


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

    }


    setCookFrame(0);


    cookTimer =
    setInterval(function() {


        playCookAttack();


    }, 3000);

}



/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer() {


    const customers = [];


    const c1 =
        document.getElementById(
            "customer1"
        );


    const c2 =
        document.getElementById(
            "customer2"
        );


    if (
        customerIsVisible(c1) &&
        !customer1Satisfied
    ) {

        customers.push(c1);

    }


    if (
        customerIsVisible(c2) &&
        !customer2Satisfied
    ) {

        customers.push(c2);

    }


    if (
        customers.length === 0
    ) {

        return null;

    }


    const cook =
        document.getElementById(
            "cook"
        );


    const cookRect =
        cook.getBoundingClientRect();


    const cookX =
        cookRect.left +
        cookRect.width / 2;


    let nearest = null;

    let nearestDistance =
        Infinity;


    customers.forEach(
        function(customer) {


            const rect =
                customer
                .getBoundingClientRect();


            const customerX =
                rect.left +
                rect.width / 2;


            const distance =
                Math.abs(
                    customerX -
                    cookX
                );


            if (
                distance <
                nearestDistance
            ) {


                nearestDistance =
                    distance;


                nearest =
                    customer;

            }

        }
    );


    return nearest;

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(target) {


    if (!target) {

        return;

    }


    if (
        target.id === "customer1" &&
        customer1Satisfied
    ) {

        return;

    }


    if (
        target.id === "customer2" &&
        customer2Satisfied
    ) {

        return;

    }


    const cook =
        document.getElementById(
            "cook"
        );


    const game =
        document.getElementById(
            "game"
        );


    const gameRect =
        game.getBoundingClientRect();


    const cookRect =
        cook.getBoundingClientRect();



    /* ==================================================
       PARTENZA DALLA MANO
    ================================================== */

    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;



    /* ==================================================
       CREA PUNTO ROSSO
    ================================================== */

    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );



    /* ==================================================
       CREA PASTA
    ================================================== */

    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );



    /* ==================================================
       POSIZIONE INIZIALE
    ================================================== */

    pasta.style.left =
        (
            startX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            startY -
            gameRect.top -
            42
        ) + "px";



    /* ==================================================
       VELOCITÀ
    ================================================== */

    const speed = 350;


    const startTime =
        performance.now();


    let lastX =
        startX;


    let lastY =
        startY;



    /* ==================================================
       MOVIMENTO
    ================================================== */

    function movePasta(
        currentTime
    ) {


        /*
           LEGGIAMO LA POSIZIONE ATTUALE
           DEL CLIENTE.

           Questo è il punto fondamentale:
           il bersaglio si muove insieme
           al cliente.
        */

        const targetRect =
            target.getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;



        /* ==================================================
           AGGIORNA IL PUNTO ROSSO
        ================================================== */

        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";



        /* ==================================================
           DISTANZA
        ================================================== */

        const dx =
            endX -
            lastX;


        const dy =
            endY -
            lastY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           Calcoliamo quanto tempo serve
           per raggiungere il nuovo punto.
        */

        const frameTime =
            16 / 1000;


        const maxMovement =
            speed *
            frameTime;


        let nextX =
            lastX;


        let nextY =
            lastY;


        if (
            distance <=
            maxMovement
        ) {


            nextX =
                endX;


            nextY =
                endY;


        }

        else {


            nextX =
                lastX +
                (
                    dx /
                    distance
                ) *
                maxMovement;


            nextY =
                lastY +
                (
                    dy /
                    distance
                ) *
                maxMovement;

        }



        /* ==================================================
           AGGIORNA POSIZIONE PASTA
        ================================================== */

        pasta.style.left =
            (
                nextX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                nextY -
                gameRect.top -
                42
            ) + "px";


        lastX =
            nextX;


        lastY =
            nextY;



        /* ==================================================
           CONTROLLO IMPATTO
        ================================================== */

        const remainingX =
            endX -
            nextX;


        const remainingY =
            endY -
            nextY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +

                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            maxMovement
        ) {


            pasta.style.left =
                (
                    endX -
                    gameRect.left -
                    42
                ) + "px";


            pasta.style.top =
                (
                    endY -
                    gameRect.top -
                    42
                ) + "px";


            hitCustomer(
                target,
                pasta
            );


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}



/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.parentNode
        .removeChild(pasta);

    }


    if (
        customer.id ===
        "customer1"
    ) {


        if (
            customer1Satisfied
        ) {

            return;

        }


        customer1HP -= 5;


        if (
            customer1HP <= 0
        ) {

            satisfyCustomer1();

        }

    }


    if (
        customer.id ===
        "customer2"
    ) {


        if (
            customer2Satisfied
        ) {

            return;

        }


        customer2HP -= 5;


        if (
            customer2HP <= 0
        ) {

            satisfyCustomer2();

        }

    }

}



/* ==================================================
   CLIENTE 1 SODDISFATTO
================================================== */

function satisfyCustomer1() {


    customer1Satisfied =
        true;


    customer1AtKitchen =
        false;


    const customer =
        document.getElementById(
            "customer1"
        );
