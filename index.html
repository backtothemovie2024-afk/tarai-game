========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================
   HOME
========================= */

#menu {

    width: 100vw;
    height: 100vh;

    background: #1b1b2f;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


#menu h1 {

    margin: 0 0 45px;

    color: #ffd447;

    font-size: clamp(45px, 14vw, 70px);

    font-weight: 900;

    text-shadow:

}


.menu-button {

    width: min(70vw, 280px);

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: 900;

    box-shadow:
        0 7px 0 #8d2e0e;
}


/* =========================
   LIVELLO 1
========================= */

#game {

    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: white;
}


/* =========================
   HUD
========================= */

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}
