<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

/* =====================
   PAGINA
===================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* =====================
   SCHERMATA SMARTPHONE
===================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: white;
}


/* =====================
   HOME
===================== */

#menu {

    position: absolute;

    inset: 0;

    background: #1b1b2f;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 50;
}


#menu h1 {

    margin: 0 0 40px;

    color: #ffd447;

    font-size: clamp(35px, 8vw, 55px);

    font-weight: 900;
}


#playButton {

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;
}


/* =====================
   GIOCO
===================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;
}


/* =====================
   BACKGROUND
===================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* =====================
   HUD
===================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* =====================
   CLIENTE
===================== */

#customer {

    position: absolute;

    width: 150px;

    height: 200px;

    left: 50%;

    top: -220px;

    transform: translateX(-50%);

    z-index: 10;

    animation: walkDown 5s linear forwards;
}


/* =====================
   FRAME
===================== */

.frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 150px;

    height: 200px;

    object-fit: contain;

    display: none;
}


.frame1 {

    display: block;
}


/* =====================
   MOVIMENTO
===================== */

@keyframes walkDown {

    from {

        top: -220px;

    }

    to {

        top: 55%;

    }

}

</style>

</head>


<body>


<!-- =====================
     AREA SMARTPHONE
===================== -->

<div id="phone">


    <!-- =====================
         HOME
    ===================== -->

    <div id="menu">

        <h1>
            TARAI RUSH
        </h1>


        <button id="playButton">

            PLAY

        </button>

    </div>



    <!-- =====================
         GIOCO
    ===================== -->

    <div id="game">


        <!-- BACKGROUND -->

        <img
            id="background"
            src="https://i.ibb.co/fzKdg9TY/1787950008908.png"
            alt="Background">


        <!-- HUD -->

        <div id="hud">

            <span>
                ❤️ 3
            </span>

            <span>
                ⭐ 0
            </span>

        </div>



        <!-- CLIENTE -->

        <div id="customer">


            <!-- GAMBA SINISTRA -->

            <img
                class="frame frame1"
                src="https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg"
                alt="Gamba sinistra">


            <!-- GAMBA DESTRA -->

            <img
                class="frame frame2"
                src="https://i.ibb.co/YxRzGxP/Screenshot-20260829-161529-Grok-3.jpg"
                alt="Gamba destra">


        </div>


    </div>

</div>



<script>

/* =====================
   ANIMAZIONE
===================== */

let currentFrame = 1;

let walkAnimation;


/* =====================
   PLAY
===================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        document
            .getElementById("menu")
            .style.display = "none";


        document
            .getElementById("game")
            .style.display = "block";


        const customer =
            document.getElementById("customer");


        customer.style.animation = "none";

        void customer.offsetWidth;

        customer.style.animation =
            "walkDown 5s linear forwards";


        startWalking();

    });



/* =====================
   CAMMINATA
===================== */

function startWalking() {


    if (walkAnimation) {

        clearInterval(walkAnimation);

    }


    currentFrame = 1;


    walkAnimation = setInterval(function() {


        document
            .querySelectorAll(".frame")
            .forEach(function(frame) {

                frame.style.display = "none";

            });


        if (currentFrame === 1) {

            currentFrame = 2;

        } else {

            currentFrame = 1;

        }


        document
            .querySelector(".frame" + currentFrame)
            .style.display = "block";


    }, 300);

}

</script>


</body>

</html>
