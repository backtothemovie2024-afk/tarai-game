<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* =====================
   SCHERMO SMARTPHONE
===================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* =====================
   HOME
===================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 50;
}


/* =====================
   COPERTINA
===================== */

#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    opacity: 0;

    z-index: 10;

    animation: coverAppear 0s linear 1s forwards;
}


@keyframes coverAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =====================
   PLAY
===================== */

#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    opacity: 0;

    z-index: 30;

    animation: playAppear 0.6s ease-out 1.5s forwards;
}


@keyframes playAppear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =====================
   GIOCO
===================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;
}


/* =====================
   BACKGROUND
===================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* =====================
   HUD
===================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;
    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 84.4px;
    height: 112.5px;

    top: -130px;

    z-index: 10;

    animation: walkDown 5s linear forwards;
}


/* =====================
   POSIZIONI CLIENTI
===================== */

#customer1 {
    left: 35%;
}

#customer2 {
    left: 65%;
}


/* =====================
   SPRITE CLIENTI
===================== */

.customer .frame {

    position: absolute;

    top: 0;
    left: 0;

    width: 84.4px;
    height: 112.5px;

    object-fit: contain;

    display: none;
}


.customer .frame.active {
    display: block;
}


/* =====================
   MOVIMENTO CLIENTI
===================== */

@keyframes walkDown {

    from {
        top: -130px;
    }

    to {
        top: 55%;
    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    /*
       Posizione del secondo cerchio
       da sinistra.
    */

    left: 40%;

    bottom: 8%;

    width: 100px;
    height: 135px;

    transform: translateX(-50%);

    z-index: 15;
}


/* =====================
   SPRITE CUOCO
===================== */

#cook img {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;
}


#cook img.active {
    display: block;
}

</style>

</head>


<body>


<div id="phone">


<!-- ==================================================
     HOME
================================================== -->

<div id="menu">

    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt="Tarai Rush">


    <button id="playButton">
        PLAY
    </button>

</div>



<!-- ==================================================
     GIOCO
================================================== -->

<div id="game">


    <!-- BACKGROUND -->

    <img
        id="background"
        src="https://i.ibb.co/fzKdg9TY/1787950008908.png"
        alt="Background">


    <!-- HUD -->

    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>



    <!-- ==================================================
         CLIENTE 1
    ================================================== -->

    <div
        id="customer1"
        class="customer">


        <img
            class="frame active"
            src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
            alt="Cliente 1">


        <img
            class="frame"
            src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
            alt="Cliente 1">


    </div>



    <!-- ==================================================
         CLIENTE 2
    ================================================== -->

    <div
        id="customer2"
        class="customer">


        <img
            class="frame active"
            src="https://i.ibb.co/jP6QSPFd/1000040572-removebg-preview.png"
            alt="Cliente 2">


        <img
            class="frame"
            src="https://i.ibb.co/vxJCRK81/1000040573-removebg-preview.png"
            alt="Cliente 2">


    </div>



    <!-- ==================================================
         CUOCO
    ================================================== -->

    <div id="cook">


        <!-- FRAME 1 -->

        <img
            class="active"
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt="Cuoco 1">


        <!-- FRAME 2 -->

        <img
            src="https://i.ibb.co/fY9GKKNP/IMG-20260829-WA0006-removebg-preview.png"
            alt="Cuoco 2">


        <!-- FRAME 3 -->

        <img
            src="https://i.ibb.co/kskzw0J1/IMG-20260829-WA0004-removebg-preview.png"
            alt="Cuoco 3">


        <!-- FRAME 4 -->

        <img
            src="https://i.ibb.co/9mSrQBZx/IMG-20260829-WA0007-removebg-preview.png"
            alt="Cuoco 4">


        <!-- FRAME 5 -->

        <img
            src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
            alt="Cuoco 5">


    </div>


</div>


</div>



<script>

/* ==================================================
   VARIABILI
================================================== */

let customerFrame1 = 0;

let customerFrame2 = 0;

let cookFrame = 0;

let customerTimer = null;

let cookTimer = null;


/* ==================================================
   PLAY
================================================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        document
            .getElementById("menu")
            .style.display = "none";


        document
            .getElementById("game")
            .style.display = "block";


        /* =====================
           CLIENTE 1
        ===================== */

        const customer1 =
            document.getElementById("customer1");


        customer1.style.animation = "none";

        void customer1.offsetWidth;

        customer1.style.animation =
            "walkDown 5s linear forwards";


        /* =====================
           CLIENTE 2
        ===================== */

        const customer2 =
            document.getElementById("customer2");


        customer2.style.animation = "none";

        void customer2.offsetWidth;

        customer2.style.animation =
            "walkDown 5s linear forwards";


        /* AVVIA */

        startCustomerAnimation();

        startCookAnimation();

    });



/* ==================================================
   ANIMAZIONE CLIENTE 1 E 2
================================================== */

function startCustomerAnimation() {


    if (customerTimer !== null) {

        clearInterval(customerTimer);

    }


    customerFrame1 = 0;

    customerFrame2 = 0;


    customerTimer = setInterval(function() {


        /* =====================
           CLIENTE 1
        ===================== */

        const c1 =
            document
                .getElementById("customer1")
                .querySelectorAll(".frame");


        c1.forEach(function(frame) {

            frame.classList.remove("active");

        });


        c1[customerFrame1]
            .classList.add("active");


        customerFrame1++;


        if (customerFrame1 >= 2) {

            customerFrame1 = 0;

        }



        /* =====================
           CLIENTE 2
        ===================== */

        const c2 =
            document
                .getElementById("customer2")
                .querySelectorAll(".frame");


        c2.forEach(function(frame) {

            frame.classList.remove("active");

        });


        c2[customerFrame2]
            .classList.add("active");


        customerFrame2++;


        if (customerFrame2 >= 2) {

            customerFrame2 = 0;

        }


    }, 300);

}



/* ==================================================
   ANIMAZIONE CUOCO
================================================== */

function startCookAnimation() {


    if (cookTimer !== null) {

        clearInterval(cookTimer);

    }


    cookFrame = 0;


    cookTimer = setInterval(function() {


        const cookFrames =
            document
                .getElementById("cook")
                .querySelectorAll("img");


        cookFrames.forEach(function(frame) {

            frame.classList.remove("active");

        });


        cookFrames[cookFrame]
            .classList.add("active");


        cookFrame++;


        if (cookFrame >= 5) {

            cookFrame = 0;

        }


    }, 120);

}

</script>


</body>

    </html>
