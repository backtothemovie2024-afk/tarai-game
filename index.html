<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>


<style>


* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;

}


/* ==================================================
   TELEFONO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;

}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;

}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 10;

}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    z-index: 30;

}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;

}


#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;

}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

}


#kitchen {

    z-index: 45;

}


#kitchenDamaged {

    z-index: 46;

    display: none;

}


#kitchenDestroyed {

    z-index: 47;

    display: none;

}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 22px;

    font-weight: bold;

    z-index: 80;

}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -170px;

    z-index: 40;

    pointer-events: none;

}


.customer.satisfied {

    animation: none !important;

}


#customer3 {

    width: 108px;

    height: 146px;

}


/* ==================================================
   FRAME CLIENTI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


.customer .frame.active {

    display: block;

}


/* ==================================================
   CLIENTE 3 SPECCHIO
================================================== */

#customer3 .walking-frame {

    transform: scaleX(1);

}


#customer3 .walking-frame.flipped {

    transform: scaleX(-1);

}


/* ==================================================
   SPRITE FELICE
================================================== */

.customer .happy-frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

    z-index: 2;

}


/* ==================================================
   CUORE
   RIDOTTO DELLA META'
================================================== */

.heart {

    position: absolute;

    left: 50%;

    top: -12px;

    transform:
        translateX(-50%);

    font-size: 12px;

    line-height: 1;

    z-index: 5;

    display: none;

    animation:
        heartFloat
        0.8s
        ease-in-out
        infinite alternate;

}


.customer.satisfied .heart {

    display: block;

}


@keyframes heartFloat {

    0% {

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

    100% {

        transform:
            translateX(-50%)
            translateY(-4px)
            scale(1.12);

    }

}


/* ==================================================
   MOVIMENTO CLIENTI
================================================== */

@keyframes walkDown {

    0% {

        top: -170px;

    }

    65% {

        top: 69%;

    }

    100% {

        top: 69%;

    }

}


/* ==================================================
   PERSONAGGI GIOCANTI
================================================== */

/*
   4 SLOT:

   20%
   40%
   60%
   80%
*/


.player-character {

    position: absolute;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform:
        translateX(-50%);

    z-index: 50;

    pointer-events: none;

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    left: 20%;

}


#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


#cook img.active {

    display: block;

}


/* ==================================================
   CAMERIERA
================================================== */

#waitress {

    left: 40%;

}


#waitress img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: none;

}


#waitress img.active {

    display: block;

}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 60;

    pointer-events: none;

}


/* ==================================================
   COCKTAIL
================================================== */

/*
   Il cocktail viene ritagliato
   direttamente dallo sprite 2
   della cameriera.
*/

.cocktail {

    position: absolute;

    width: 28px;

    height: 38px;

    z-index: 61;

    pointer-events: none;

    background-image:
        url("https://i.ibb.co/Y4VhPb8q/Screenshot-20260830-195703-Grok-3-removebg-preview.png");

    background-repeat: no-repeat;

    background-size:
        161px 400px;

    background-position:
        -85px -70px;

}


/* ==================================================
   HITBOX INVISIBILE
================================================== */

.hit-marker {

    position: absolute;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: red;

    border: 3px solid white;

    box-shadow:
        0 0 8px red,
        0 0 15px rgba(255,0,0,0.8);

    transform:
        translate(-50%, -50%);

    z-index: 90;

    pointer-events: none;

    opacity: 0;

}


/* ==================================================
   SCHIZZO COCKTAIL
================================================== */

.splash {

    position: absolute;

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #b9f5ff;

    box-shadow:
        0 0 5px rgba(180,245,255,0.9);

    z-index: 75;

    pointer-events: none;

    transform:
        translate(-50%, -50%);

    animation:
        splashDrop
        0.28s
        ease-out
        forwards;

}


@keyframes splashDrop {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

    }

    100% {

        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--dx)),
                calc(-50% + var(--dy))
            )
            scale(0.25);

    }

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 500px) {


    .customer {

        width: 65px;

        height: 88px;

    }


    #customer3 {

        width: 72px;

        height: 97px;

    }


    .player-character {

        width: 65px;

        height: 88px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }


    .cocktail {

        width: 24px;

        height: 34px;

        background-size:
            139px 345px;

        background-position:
            -73px -60px;

    }


}


</style>

</head>

<script>


/* ==================================================
   CONFIGURAZIONE
================================================== */


/*
   HITBOX

   X positivo = destra
   X negativo = sinistra
*/

const HIT_X = 5;


/*
   Y positivo = basso
   Y negativo = alto
*/

const HIT_Y = 0;


/*
   Punto verticale del cliente
*/

const HIT_POSITION_Y = 0.45;



/* ==================================================
   4 SLOT PERSONAGGI
================================================== */

const PLAYER_SLOTS = [

    20,

    40,

    60,

    80

];



/* ==================================================
   CORSIE CLIENTI
================================================== */

const LANES = [

    30,

    40,

    50,

    60,

    70

];



/* ==================================================
   SPAWN
================================================== */

const SPAWN_X = 50;

const SPAWN_INTERVAL = 2500;

const WAVE_SIZE = 15;

const WALK_TIME = 60;

const MIN_DISTANCE = 9;



/* ==================================================
   DANNO
================================================== */


/*
   CUOCO
*/

const COOK_DAMAGE = 5;

const COOK_ATTACK_INTERVAL = 3000;


/*
   CAMERIERA
*/

const WAITRESS_DAMAGE = 3;

const WAITRESS_ATTACK_INTERVAL = 2000;



/* ==================================================
   VARIABILI
================================================== */

let customers = [];

let spawnTimer = null;

let waveIndex = 0;

let customerAnimationTimer = null;

let cookTimer = null;

let waitressTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;

let kitchenEnergy = 100;



/* ==================================================
   PLAY
================================================== */

document
.getElementById("playButton")
.addEventListener(
    "click",
    startGame
);



function startGame() {


    document
    .getElementById("menu")
    .style.display =
        "none";


    document
    .getElementById("game")
    .style.display =
        "block";


    kitchenEnergy = 100;


    customers = [];


    waveIndex = 0;


    clearAllTimers();


    clearCustomers();


    document
    .getElementById("kitchen")
    .style.display =
        "block";


    document
    .getElementById("kitchenDamaged")
    .style.display =
        "none";


    document
    .getElementById("kitchenDestroyed")
    .style.display =
        "none";


    updateKitchenEnergy();


    startCustomerAnimation();


    startCookAnimation();


    startWaitressAnimation();


    startKitchenEnergySystem();


    startFirstAttackDetection();


    startWave();

}



/* ==================================================
   TIMER
================================================== */

function clearAllTimers() {


    if (
        spawnTimer !== null
    ) {

        clearInterval(
            spawnTimer
        );

        spawnTimer = null;

    }


    if (
        customerAnimationTimer !== null
    ) {

        clearInterval(
            customerAnimationTimer
        );

        customerAnimationTimer = null;

    }


    if (
        cookTimer !== null
    ) {

        clearInterval(
            cookTimer
        );

        cookTimer = null;

    }


    if (
        waitressTimer !== null
    ) {

        clearInterval(
            waitressTimer
        );

        waitressTimer = null;

    }


    if (
        firstAttackTimer !== null
    ) {

        clearInterval(
            firstAttackTimer
        );

        firstAttackTimer = null;

    }


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

        kitchenDamageTimer = null;

    }

}



/* ==================================================
   WAVE
================================================== */

function startWave() {


    let spawned = 0;


    spawnCustomer();


    spawned++;


    spawnTimer =
    setInterval(
        function() {


            if (
                spawned >=
                WAVE_SIZE
            ) {


                clearInterval(
                    spawnTimer
                );


                spawnTimer = null;


                return;

            }


            spawnCustomer();


            spawned++;


        },
        SPAWN_INTERVAL
    );

}



/* ==================================================
   SCELTA CORSIA
================================================== */

function chooseLane() {


    const counts =
        LANES.map(
            function(lane) {


                return customers.filter(
                    function(c) {


                        return (

                            c.lane === lane &&

                            c.element.style.display !==
                                "none"

                        );

                    }
                ).length;

            }
        );


    const minimum =
        Math.min(
            ...counts
        );


    const available = [];


    counts.forEach(
        function(
            count,
            index
        ) {


            if (
                count ===
                minimum
            ) {

                available.push(
                    index
                );

            }

        }
    );


    const randomIndex =
        Math.floor(
            Math.random() *
            available.length
        );


    return LANES[
        available[
            randomIndex
        ]
    ];

}



/* ==================================================
   TIPO CLIENTE
================================================== */

function chooseCustomerType() {


    return (

        Math.floor(
            Math.random() * 3
        ) + 1

    );

}



/* ==================================================
   CREA CLIENTE
================================================== */

function spawnCustomer() {


    const type =
        chooseCustomerType();


    const lane =
        chooseLane();


    let templateId;


    if (
        type === 1
    ) {

        templateId =
            "customer1Template";

    }

    else if (
        type === 2
    ) {

        templateId =
            "customer2Template";

    }

    else {

        templateId =
            "customer3Template";

    }


    const template =
        document
        .getElementById(
            templateId
        );


    const clone =
        template
        .content
        .cloneNode(
            true
        );


    const customerElement =
        clone
        .querySelector(
            ".customer"
        );


    const customerData = {


        element:
            customerElement,


        type:
            type,


        lane:
            lane,


        hp:
            50,


        satisfied:
            false,


        atKitchen:
            false


    };


    customerElement.style.left =
        SPAWN_X + "%";


    customerElement.style.top =
        "-170px";


    customerElement.style.transform =
        "translateX(-50%)";


    customerElement.dataset.lane =
        lane;


    if (
        type === 3
    ) {

        customerElement.id =
            "customer3";

    }


    document
    .getElementById(
        "customers"
    )
    .appendChild(
        customerElement
    );


    customers.push(
        customerData
    );


    requestAnimationFrame(
        function() {


            moveCustomerToLane(
                customerData
            );


        }
    );

}



/* ==================================================
   MOVIMENTO CLIENTE
================================================== */

function moveCustomerToLane(
    customer
) {


    if (
        !customer ||
        customer.satisfied
    ) {

        return;

    }


    const element =
        customer.element;


    element.style.transition =
        "left 1.2s ease-out";


    element.style.left =
        customer.lane + "%";


    setTimeout(
        function() {


            if (
                customer.satisfied
            ) {

                return;

            }


            element.style.transition =
                "none";


            element.style.animation =
                "walkDown " +
                WALK_TIME +
                "s linear forwards";


        },
        1200
    );

}



/* ==================================================
   PULIZIA
================================================== */

function clearCustomers() {


    const container =
        document
        .getElementById(
            "customers"
        );


    container.innerHTML =
        "";


    customers = [];

}



/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (
        customerAnimationTimer !== null
    ) {

        clearInterval(
            customerAnimationTimer
        );

    }


    customerAnimationTimer =
    setInterval(
        function() {


            customers.forEach(
                function(customer) {


                    if (
                        customer.satisfied
                    ) {

                        return;

                    }


                    const frames =
                        customer.element
                        .querySelectorAll(
                            ".frame"
                        );


                    /* CLIENTI 1 E 2 */

                    if (

                        customer.type === 1 ||

                        customer.type === 2

                    ) {


                        let current =
                            parseInt(
                                customer.element
                                .dataset
                                .frame ||
                                "0"
                            );


                        frames.forEach(
                            function(frame) {

                                frame.classList
                                .remove(
                                    "active"
                                );

                            }
                        );


                        current =
                            current + 1;


                        if (
                            current >=
                            frames.length
                        ) {

                            current = 0;

                        }


                        frames[
                            current
                        ]
                        .classList
                        .add(
                            "active"
                        );


                        customer.element
                        .dataset
                        .frame =
                            current;

                    }


                    /* CLIENTE 3 */

                    if (
                        customer.type === 3
                    ) {


                        const walkingFrame =
                            customer.element
                            .querySelector(
                                ".walking-frame"
                            );


                        if (
                            walkingFrame
                            .classList
                            .contains(
                                "flipped"
                            )
                        ) {


                            walkingFrame
                            .classList
                            .remove(
                                "flipped"
                            );


                        }

                        else {


                            walkingFrame
                            .classList
                            .add(
                                "flipped"
                            );


                        }

                    }

                }
            );


            preventOverlap();


        },
        300
    );

}



/* ==================================================
   EVITA SOVRAPPOSIZIONE
================================================== */

function preventOverlap() {


    const activeCustomers =
        customers.filter(
            function(c) {


                return (

                    !c.satisfied &&

                    c.element.style.display !==
                        "none"

                );

            }
        );


    LANES.forEach(
        function(lane) {


            const laneCustomers =
                activeCustomers
                .filter(
                    function(c) {


                        return (
                            c.lane === lane
                        );

                    }
                );


            laneCustomers.sort(
                function(a, b) {


                    const aRect =
                        a.element
                        .getBoundingClientRect();


                    const bRect =
                        b.element
                        .getBoundingClientRect();


                    return (

                        aRect.top -
                        bRect.top

                    );

                }
            );


            for (
                let i = 1;
                i < laneCustomers.length;
                i++
            ) {


                const front =
                    laneCustomers[
                        i - 1
                    ];


                const back =
                    laneCustomers[
                        i
                    ];


                const frontRect =
                    front.element
                    .getBoundingClientRect();


                const backRect =
                    back.element
                    .getBoundingClientRect();


                const distance =
                    backRect.top -
                    frontRect.top;


                if (
                    distance <
                    MIN_DISTANCE
                ) {


                    back.element.style.zIndex =
                        front.element.style.zIndex - 1;


                }

                else {


                    back.element.style.zIndex =
                        40;

                }

            }

        }
    );

}



/* ==================================================
   VISIBILITÀ
================================================== */

function customerIsVisible(
    customer
) {


    if (
        !customer ||
        customer.element.style.display ===
            "none"
    ) {

        return false;

    }


    const rect =
        customer.element
        .getBoundingClientRect();


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    return (

        rect.bottom >
            gameRect.top &&

        rect.top <
            gameRect.bottom

    );

}



/* ==================================================
   CUCINA
================================================== */

function updateKitchenEnergy() {


    if (
        kitchenEnergy > 50
    ) {


        document
        .getElementById(
            "kitchen"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDestroyed"
        )

            "none";


    }

        kitchenEnergy > 20

        .getElementById(
            "kitchen"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "kitchenDamaged"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "kitchenDestroyed"
        )
        .style.display =
            "none";


    }

    else {

        .getElementById(
            "kitchen"
        )

        .style.display =

        )

/* ==================================================
   DANNO ALLA CUCINA
================================================== */

function startKitchenEnergySystem() {


    if (
        kitchenDamageTimer !== null
    ) {

        clearInterval(
            kitchenDamageTimer
        );

    }


    kitchenDamageTimer =
    setInterval(
        function() {


            let damage = 0;


            customers.forEach(
                function(customer) {


                    if (

                        customer.atKitchen &&

                        !customer.satisfied

                    ) {

                        damage++;

                    }

                }
            );


            if (
                damage > 0
            ) {


                kitchenEnergy -=
                    damage;


                if (
                    kitchenEnergy < 0
                ) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();

            }


        },
        5000
    );

}



/* ==================================================
   CONTROLLO ARRIVO CLIENTI
================================================== */

setInterval(
    function() {


        customers.forEach(
            function(customer) {


                if (
                    customer.satisfied
                ) {

                    return;

                }


                const rect =
                    customer.element
                    .getBoundingClientRect();


                const game =
                    document
                    .getElementById(
                        "game"
                    );


                const gameRect =
                    game
                    .getBoundingClientRect();


                const kitchenLine =
                    gameRect.top +
                    gameRect.height *
                    0.69;


                if (
                    rect.top >=

                    customer.atKitchen =

);

================================================== */

function setCookFrame(

) {


    const frames =
        document
        .getElementById(
            "cook"

        .querySelectorAll(
            "img"
        );


    frames.forEach(
        function(frame) {


            frame.classList
            .remove(
                "active"
            );

        }
    );


    if (
        frames[frameNumber]
    ) {


        frames[
            frameNumber
        ]
        .classList
        .add(
            "active"
        );

    }

}



/* ==================================================
   ATTACCO CUOCO
================================================== */

function playCookAttack() {


    const target =
        getNearestCustomerToKitchen();


    if (
        target === null
    ) {


        setCookFrame(0);


        return;

    }


    setCookFrame(0);


    setTimeout(
        function() {

            setCookFrame(1);

        },
        120
    );


    setTimeout(
        function() {

            setCookFrame(2);

        },
        240
    );


    setTimeout(
        function() {


            setCookFrame(3);


            throwPasta(
                target

        },
        360
    );


    setTimeout(
        function() {

            setCookFrame(4);

        },
        480
    );


    setTimeout(

            setCookFrame(0);

        },

    );

}

/* ==================================================
   CLIENTE PIÙ VICINO ALLA CUCINA
================================================== */

function getNearestCustomerToKitchen() {


    const visible =
        customers.filter(
            function(customer) {


                return (

                    !customer.satisfied &&

                    customerIsVisible(
                        customer
                    )

                );

            }
        );


    if (
        visible.length === 0
    ) {

        return null;

    }


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    const kitchenLine =
        gameRect.top +
        gameRect.height *
        0.69;


    let nearest =
        null;


    let nearestDistance =
        Infinity;


    visible.forEach(
        function(customer) {


            const rect =
                customer.element
                .getBoundingClientRect();


            /*
               Più il cliente è in basso,
               più è vicino alla cucina.
            */

            const customerBottom =
                rect.bottom;


            const distance =
                Math.abs(
                    kitchenLine -
                    customerBottom
                );


            if (
                distance <
                nearestDistance
            ) {


                nearestDistance =
                    distance;


                nearest =
                    customer;

            }

        }
    );


    return nearest;

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(
    target
) {


    if (
        !target ||
        target.satisfied
    ) {

        return;

    }


    const cook =
        document
        .getElementById(
            "cook"
        );


    const game =
        document
        .getElementById(
            "game"
        );


    const gameRect =
        game
        .getBoundingClientRect();


    const cookRect =
        cook
        .getBoundingClientRect();


    /*
       PARTENZA MANO CUOCO
    */

    const startX =
        cookRect.left +
        cookRect.width *
        0.72;


    const startY =
        cookRect.top +
        cookRect.height *
        0.32;


    /*
       HITBOX INVISIBILE
    */

    const hitMarker =
        document.createElement(
            "div"
        );


    hitMarker.className =
        "hit-marker";


    game.appendChild(
        hitMarker
    );


    /*
       PASTA
    */

    const pasta =
        document.createElement(
            "img"
        );


    pasta.className =
        "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    game.appendChild(
        pasta
    );


    let currentX =
        startX;


    let currentY =
        startY;


    pasta.style.left =
        (
            currentX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            currentY -
            gameRect.top -
            42
        ) + "px";


    const speed =
        350;


    let lastTime =
        performance.now();


    function movePasta(
        currentTime
    ) {


        /*
           IL BERSAGLIO NON CAMBIA
           DURANTE IL VOLO.
        */

        if (
            !target ||
            target.satisfied
        ) {


            pasta.remove();

            hitMarker.remove();

            return;

        }


        const targetRect =
            target.element
            .getBoundingClientRect();


        const endX =
            targetRect.left +
            targetRect.width / 2 +
            HIT_X;


        const endY =
            targetRect.top +
            targetRect.height *
            HIT_POSITION_Y +
            HIT_Y;


        hitMarker.style.left =
            (
                endX -
                gameRect.left
            ) + "px";


        hitMarker.style.top =
            (
                endY -
                gameRect.top
            ) + "px";


        const deltaTime =
            Math.min(
                (
                    currentTime -
                    lastTime
                ) / 1000,
                0.05
            );


        lastTime =
            currentTime;


        const dx =
            endX -
            currentX;


        const dy =
            endY -
            currentY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const movement =
            speed *
            deltaTime;


        if (
            distance <=
            movement
        ) {


            currentX =
                endX;


            currentY =
                endY;


        }

        else {


            currentX +=
                (
                    dx /
                    distance
                ) *
                movement;


            currentY +=
                (
                    dy /
                    distance
                ) *
                movement;

        }


        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";


        const remainingX =
            endX -
            currentX;


        const remainingY =
            endY -
            currentY;


        const remainingDistance =
            Math.sqrt(
                remainingX *
                remainingX +
                remainingY *
                remainingY
            );


        if (
            remainingDistance <=
            3
        ) {


            hitCustomer(
                target,
                pasta,
                COOK_DAMAGE
            );


            hitMarker.remove();


            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}

/* ==================================================
   SCHIZZO
================================================== */

function createSplash(
    x,
    y
) {


    const game =
        document
        .getElementById(
            "game"
        );


    const directions = [

        [-12, -8],

        [-7, -16],

        [0, -20],

        [8, -15],

        [14, -7],

        [10, 5],

        [-10, 5]

    ];


    directions.forEach(
        function(direction) {


            const drop =
                document.createElement(
                    "div"
                );


            drop.className =
                "splash";


            drop.style.left =
                x + "px";


            drop.style.top =
                y + "px";


            drop.style.setProperty(
                "--dx",
                direction[0] + "px"
            );


            drop.style.setProperty(
                "--dy",
                direction[1] + "px"
            );


            game.appendChild(
                drop
            );


            setTimeout(
                function() {


                    if (
                        drop.parentNode
                    ) {

                        drop.remove();

                    }


                },
                300
            );

        }
    );

}



/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    projectile,
    damage
) {


    if (
        projectile &&
        projectile.parentNode
    ) {

        projectile.remove();

    }


    if (
        !customer ||
        customer.satisfied
    ) {

        return;

    }


    customer.hp -=
        damage;


    if (
        customer.hp <=
        0
    ) {


        satisfyCustomer(
            customer
        );

    }

}



/* ==================================================
   CLIENTE SODDISFATTO
================================================== */

function satisfyCustomer(
    customer
) {


    customer.satisfied =
        true;


    customer.atKitchen =
        false;


    const element =
        customer.element;


    element.classList.add(
        "satisfied"
    );


    element.style.animation =
        "none";


    /*
       NASCONDI FRAME NORMALI
    */

    const normalFrames =
        element
        .querySelectorAll(
            ".frame"
        );


    normalFrames.forEach(
        function(frame) {


            frame.classList
            .remove(
                "active"
            );

        }
    );


    /*
       MOSTRA SPRITE FELICE
    */

    const happyFrame =
        element
        .querySelector(
            ".happy-frame"
        );


    if (
        happyFrame
    ) {

        happyFrame.style.display =
            "block";

    }


    /*
       DOPO 1 SECONDO
       SCOMPARE
    */

    setTimeout(
        function() {


            element.style.display =
                "none";


            if (
                happyFrame
            ) {

                happyFrame.style.display =
                    "none";

            }


        },
        1000
    );

}
