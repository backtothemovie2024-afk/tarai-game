/* ================================================================
 [CSS 02] CLIENTI — DIMENSIONI COMUNI
 ================================================================ */
.customer {

  width: 100px;
  height: 135px;
  top: 3%;
  z-index: 10
}

.customer.walking {
  animation: walkDown 60s linear forwards
}

.customer.satisfied {
  animation: none !important
}

.customer .frame,
.customer .happy-frame,
.customer .frozen-frame {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none
}

.customer .frame.active {
  display: block
}

.customer .happy-frame {
  z-index: 2
}

.customer .frozen-frame {
  z-index: 3
}

/* [CSS 02.1] ALLINEAMENTO DEGLI OTTO CLIENTI */
.customer.sprite-aligned {
  --client-height: 95%;
  --client-ground: 100%;
}

.customer1-template {
  --client-height: 80.111821%;
}

.customer2-template {
  --client-height: 95.000000%;
}

.customer3-template {
  --client-height: 95.027624%;
}

.customer4-template {
  --client-height: 90.617284%;
}

.customer5-template {
  --client-height: 81.175000%;
}

.customer6-template {
  --client-height: 84.470247%;
}

.customer7-template {
  --client-height: 83.846154%;
}

.customer8-template {
  --client-height: 94.498069%;
}

.customer.sprite-aligned>.frame,
.customer.sprite-aligned>.happy-frame,
.customer.sprite-aligned>.frozen-frame {
  top:
    calc(var(--client-ground) - var(--client-height) * var(--asset-bottom));
  left: 50%;
  bottom: auto;
  right: auto;
  width: auto;
  height:
    calc(var(--client-height) * var(--asset-height));
  max-width: none;
  max-height: none;
  object-fit: contain;
  object-position: center;
  transform:
    translateX(var(--asset-anchor));
  transform-origin: center bottom;
  pointer-events: none;
}

<script>
/* [CONFIG 01] BOSS: dimensioni in CSS 90; foto, evocazioni e durata qui sotto. */

const BOSS_SETTINGS = {
  hp: 320, // Resistenza del boss.
  walkSeconds: 36, // Tempo di avanzamento effettivo, escluse le foto.
  summonChance: 0.50, // 50% per scatto: evoca due clienti.
  summonCount: 2,
  celebrationMs: 2500, // Sprite felice + APPROVED! + cinque stelle.
  photoFrames: {
    19: {
      x: 33 / 300,
      y: 94 / 465
    },
    42: {
      x: 239 / 300,
      y: 99 / 465
    }
  },
  stoppedRanges: [
    [16, 22],
    [39, 45]
  ] // Preparazione, scatto e recupero; estremi inclusi.
};
/* ================================================================
   TEST
   ================================================================ */
let specialPaused = false;
let espressoUntil = 0;
const ENABLE_BOSS_TEST = true;
const ENABLE_GAMEOVER_TEST = false;
/*
  METTI FALSE PER NASCONDERE CLEAR TEST.
*/
const ENABLE_CLEAR_TEST = true;

const intro = document.getElementById('intro');
const studioRyuVideo = document.getElementById('studioRyuVideo');
const introVideo = document.getElementById('introVideo');
const introFade = document.getElementById('introFade');
const menuVideo = document.getElementById('cover');
let introClosing = false;
let menuReady = false;
studioRyuVideo.addEventListener('ended', function() {
  studioRyuVideo.style.display = 'none';
  introVideo.style.display = 'block';
  introVideo.currentTime = 0;
  introVideo.play();
});

/* [JS 001] PLAY MENU VIDEO */
function playMenuVideo() {
  if (document.getElementById('menu').style.display === 'none') return;
  menuVideo.muted = true;
  const promise = menuVideo.play();
  if (promise) {
    promise.catch(function() {
      /* Poster se autoplay bloccato */
    });
  }
}

/* [JS 002] CLOSE INTRO */
function closeIntro() {
  if (introClosing || intro.style.display === 'none') return;
  introClosing = true;
  introFade.style.display = 'block';
  introFade.style.opacity = '0';
  void introFade.offsetWidth;
  introFade.style.opacity = '1';
  setTimeout(function() {
    introVideo.pause();
    intro.style.display = 'none';
    menuVideo.currentTime = 0;
    playMenuVideo();
    introFade.style.opacity = '0';
    setTimeout(function() {
      introFade.style.display = 'none';
      menuReady = true;
      document.getElementById('playButton').disabled = false;
    }, 800);
  }, 800);
}
document.getElementById('introTap').addEventListener('click', closeIntro);
document.getElementById('introTap').addEventListener('touchend', function(e) {
  e.preventDefault();
  closeIntro();
}, {
  passive: false

/* [JS 003] GAME LATER */
function gameLater(callback, delay) {
  const id = nextTaskId++;
  gameTasks.set(id, {
    callback,
    due: gameClock + delay,
    interval: 0
  });
  return id;
}

/* [JS 004] GAME EVERY */
function gameEvery(callback, delay) {
  const id = nextTaskId++;
  gameTasks.set(id, {
    callback,
    due: gameClock + delay,
    interval: delay
  });
  return id;
}

/* [JS 005] CANCEL TASK */
function cancelTask(id) {
  gameTasks.delete(id);
}

/* [JS 006] GAME FRAME */
function gameFrame(callback) {
  const token = generation;
  const id = requestAnimationFrame(function(time) {
    gameFrames.delete(id);
    if (token === generation) {
      callback(time);
    }
  });
  gameFrames.add(id);
  return id;
}

/* [JS 007] TICK GAME CLOCK */
function tickGameClock(now) {
  const delta = now - lastClockTime;
  lastClockTime = now;
  if (!powerUpPaused && !specialPaused && !bossIntroPlaying && !gameFinished) {
    gameClock += delta;
    for (const [id, task] of Array.from(gameTasks)) {
      if (powerUpPaused || specialPaused || bossIntroPlaying || gameFinished) break;
      if (!gameTasks.has(id) || task.due > gameClock) continue;
      if (task.interval) {
        task.due = gameClock + task.interval;
      } else {
        gameTasks.delete(id);
      }
      task.callback();
    }
  }
  requestAnimationFrame(tickGameClock);
}
requestAnimationFrame(tickGameClock);

  firstAttackTimer = kitchenDamageTimer = zIndexTimer = waveCheckTimer = null;
  cookAttacking = waitressAttacking = seonAttacking = false;
  seonAttackTimer = null;
}

/* [JS 009] GET AVAILABLE POWER UPS */
function getAvailablePowerUps() {
  const available = [];

  /* [JS 010] ADD */
function add(types) {
    types.forEach(type => {
      if (powerUps[type] < 3) {
        available.push({
          type,
          level: powerUps[type] + 1
        });
      }
    });
  }
  add(['pasta', 'speed', 'sauce']);
  if (!powerUps.waitress) {
    if (currentLevel >= 2) {
      available.push({
        type: 'waitress',
        level: 1
      });
    }
  } else {
    add(['iceShot', 'iceChain', 'deepFreeze']);
  }
  if (!powerUps.seon) {
    if (currentLevel >= 3) {
      available.push({
        type: 'seon',
        level: 1
      });
    }
  } else {
    add(['hotSplash', 'caffeineRush', 'doubleShot']);
  }
  return available;
}

/* [JS 011] SHUFFLE */
function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [
      items[i],
      items[j]
    ] = [
      items[j],
      items[i]
    ];
  }
  return items;
}

/* [JS 024] SPAWN WAVE CUSTOMERS */
function spawnWaveCustomers() {
  if (currentWave === BOSS_WAVE) {
    spawnBossWave();
    return;
  }
  const config = WAVES[currentWave - 1];
  const wave = currentWave;
  if (!config) return;

  /* [JS 025] NEXT */
function next() {
    if (currentWave !== wave || waveFinished || gameFinished) return;
    const type = chooseCustomerType();
    const templateId = 'customer' + type + 'Template';
    const height = measureCustomerHeight(templateId);

    /* [JS 026] ATTEMPT */
function attempt() {
      if (currentWave !== wave || waveFinished || gameFinished) return;
      const game = document.getElementById('game');
      const start = CUSTOMER_START_Y * game.clientHeight;
      const lanes = LANES.map(
        (_, i) => i).filter(lane => customers.every(c => {
        if (!c.isConnected || c.style.display === 'none' || Number(c.dataset.lane) !== lane)
      return true;
        return hasLaneSpace(start, height, c._walkY * game.clientHeight, c.offsetHeight);
      }));
      if (!lanes.length) {
        gameLater(attempt, 100);
        return;
      }
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      createCustomer(templateId, type, config.hp, lane, config.walkTime, false);
      waveSpawned++;
      if (waveSpawned >= config.customers) {
        scheduleWaveCheck();
      } else {
        gameLater(next, config.spawnInterval);
      }
    }
    attempt();
  }
  next();
}

  document.getElementById('game').appendChild(probe);

}

/* [JS 028] LANE TOP LIMIT */
function laneTopLimit(frontY, frontHeight, backHeight) {
  return (frontY - frontHeight * .15 - backHeight - CUSTOMER_GAP * Math.max(frontHeight, backHeight));
}

/* [JS 029] HAS LANE SPACE */
function hasLaneSpace(backY, backHeight, frontY, frontHeight) {
  return (backY <= laneTopLimit(frontY, frontHeight, backHeight));
}

/* [JS 033] CREATE CUSTOMER BASE */
function createCustomerBase(templateId, type, hp, lane, walkTime, isBoss) {
  const customer = document.getElementById(templateId).cloneNode(true);
  customer.id = 'customer-' + (++nextCustomerId);
  customer.classList.remove('customer-template', 'satisfied');
  customer.classList.add('spawned-customer');
  customer.style.display = 'block';
  customer.style.animation = 'none';
  customer.style.top = (CUSTOMER_START_Y * 100) + '%';
  customer.style.left = LANES[lane] + '%';
  Object.assign(customer.dataset, {
    type: String(type),
    hp: String(hp),
    lane: String(lane),
    satisfied: 'false',
    atKitchen: 'false',
    frame: '0',
    frozen: 'false',
    wave: String(currentWave)
  });
  if (isBoss) {
    customer.dataset.boss = 'true';
  }
  customer.querySelectorAll('.frame').forEach(
    (f, i) => f.classList.toggle('active', i === 0));
  customer.querySelector('.happy-frame').style.display = 'none';
  const frozen = customer.querySelector('.frozen-frame');
  if (frozen) {
    frozen.style.display = 'none';
  }
  document.getElementById('game').appendChild(customer);
  customers.push(customer);
  customer._walkY = CUSTOMER_START_Y;
  customer._walkTime = walkTime;
  customer.style.animation = 'none';
  customer.classList.add('walking');
  return customer;
}

/* [JS 034] SCHEDULE WAVE CHECK */
function scheduleWaveCheck() {
  cancelTask(waveCheckTimer);
  const interval = currentWave >= BOSS_WAVE - 1 ? 500 : 250;
  waveCheckTimer = gameEvery(function() {
    if (waveFinished) return;
    const active = customers.filter(c => c.isConnected && c.dataset.wave == currentWave && c.style
      .display !== 'none');
    const expected = currentWave === BOSS_WAVE ? 1 : WAVES[currentWave - 1].customers;
    if (waveSpawned >= expected && !active.length) {
      cancelTask(waveCheckTimer);
      waveCheckTimer = null;
      completeWave();
    }
  }, interval);
}

/* [JS 035] COMPLETE WAVE */
function completeWave() {
  if (waveFinished) return;
  waveFinished = true;
  if (currentWave >= TOTAL_WAVES) {
    finishLevel();
    return;
  }
  const next = currentWave + 1;
  startWave(next);
}

function valid() {

function showAction(text, callback) {

/* [JS 060] START ACTOR ATTACK */
function startActorAttack(actor) {
  if (powerUpPaused || specialPaused || bossIntroPlaying || gameFinished || gameClock < nextAttackAt[actor])
    return;
  if (actor !== 'cook' && !powerUps[actor]) return;
  if (actor === 'cook' ? cookAttacking : actor === 'waitress' ? waitressAttacking : seonAttacking) return;
  const targets = actor === 'cook' ? getAttackTargets() : [
    getNearestVisibleCustomer()
  ].filter(Boolean);
  if (!targets.length) {
    setActorFrame(actor, 0);
    return;
  }
  const interval = actor === 'cook' ? getCookAttackInterval() : actor === 'waitress' ?
    getWaitressAttackInterval() : getSeonAttackInterval();
  const steps = actor === 'cook' ? 5 : actor === 'waitress' ? 7 : 6;
  const frameTime = Math.min(160,
    (interval - 60) / steps);
  const release = actor === 'waitress' ? 4 : 3;
  const type = actor === 'cook' ? 'pasta' : actor === 'waitress' ? 'drink' : 'cappuccino';
  if (actor === 'cook') {
    cookAttacking = true;
  } else if (actor === 'waitress') {
    waitressAttacking = true;
  } else {
    seonAttacking = true;
  }
  nextAttackAt[actor] = gameClock + interval;
  setActorFrame(actor, 0);
  for (let i = 1; i < steps; i++) {
    gameLater(
      () => {
        setActorFrame(actor, i);
        if (i === release) {
          const releaseTargets = actor === 'cook' ? getAttackTargets() : [
            getNearestVisibleCustomer()
          ].filter(Boolean);
          releaseTargets.forEach(target => throwProjectile(target, type));
        }
      }, i * frameTime);
  }
  gameLater(
    () => {
      setActorFrame(actor, 0);
      if (actor === 'cook') {
        cookAttacking = false;
      } else if (actor === 'waitress') {
        waitressAttacking = false;
      } else {
        seonAttacking = false;
      }
    }, steps * frameTime);
}

/* [JS 066] THROW PROJECTILE */
function throwProjectile(target, type, special = false) {
  if (!target || !target.isConnected || target.dataset.satisfied === 'true') return;
  const isDrink = type === 'drink';
  const isCoffee = type === 'cappuccino';
  const game = document.getElementById('game');
  const gameRect = game.getBoundingClientRect();
  const frame = document.querySelector(isCoffee ? '#seon img.active' : isDrink ? '#waitress img.active' :
    '#cook img.active');
  if (!frame) return;
  const rect = frame.getBoundingClientRect();
  let currentX = rect.left + rect.width * (isCoffee ? .72 : isDrink ? .88 : .72);
  let currentY = rect.top + rect.height * (isCoffee ? .38 : isDrink ? .34 : .32);
  const marker = document.createElement('div');
  marker.className = 'hit-marker';
  game.appendChild(marker);
  const projectile = isCoffee ? makeCappuccino() : document.createElement('img');
  projectile.className = type + (special ? ' special-projectile' : '');
  if (!isCoffee) {
    projectile.src = isDrink ? 'MDk4xzJd_1788234306668-removebg-preview.png' :
      'LDw4VzQs_1788013611587-removebg-preview.png';
  }
  game.appendChild(projectile);
  const pr = projectile.getBoundingClientRect();
  const halfWidth = pr.width / 2;
  const halfHeight = pr.height / 2;

  /* [JS 067] POSITION */
function position() {
    projectile.style.left = currentX - gameRect.left - halfWidth + 'px';
    projectile.style.top = currentY - gameRect.top - halfHeight + 'px';
  }
  position();
  const speed = special ? SPECIAL_CONFIG.projectileSpeed : (isDrink || isCoffee) ? 350 : 350 * (1 + powerUps
    .speed * .33) * (1 + pastaSpeedBonus);
  let lastTime = performance.now();
  let lastTrailAt = -Infinity;

  /* [JS 068] MOVE */
function move(now) {
    if (!target.isConnected || target.dataset.satisfied === 'true') {
      projectile.remove();
      marker.remove();
      return;
    }
    if (powerUpPaused || specialPaused || bossIntroPlaying) {
      lastTime = now;
      gameFrame(move);
      return;
    }
    const r = target.getBoundingClientRect();
    const endX = r.left + r.width / 2 + HIT_X;
    const endY = r.top + r.height * HIT_POSITION_Y + HIT_Y;
    marker.style.left = endX - gameRect.left + 'px';
    marker.style.top = endY - gameRect.top + 'px';
    const dt = Math.min(
      (now - lastTime) / 1000, .05);
    lastTime = now;
    const dx = endX - currentX;
    const dy = endY - currentY;
    const distance = Math.hypot(dx, dy);
    // [JS 068.1] Scia: usa il tempo di gioco e rispetta le pause.
    if (special && gameClock - lastTrailAt >= 30) {
      lastTrailAt = gameClock;
      const trail = document.createElement('div');
      trail.className = 'impact-particle special-pasta-trail';
      trail.style.left = (currentX - gameRect.left) + 'px';
      trail.style.top = (currentY - gameRect.top) + 'px';
      trail.style.setProperty('--angle', Math.atan2(dy, dx) + 'rad');
      game.appendChild(trail);
      gameLater(() => trail.remove(), 180);
    }
    const movement = speed * dt;
    if (distance <= movement) {
      currentX = endX;
      currentY = endY;
    } else {
      currentX += dx / distance * movement;
      currentY += dy / distance * movement;
    }
    position();
    if (Math.hypot(endX - currentX, endY - currentY) <= 3) {
      if (special) {
        hitSpecialProjectile(target, projectile, type);
      } else if (isCoffee) {
        hitCustomerWithCoffee(target, projectile);
      } else if (isDrink) {
        hitCustomerWithDrink(target, projectile);
      } else {
        hitCustomer(target, projectile);
      }
      marker.remove();
      return;
    }
    gameFrame(move);
  }
  gameFrame(move);
}

let waveStartedAt = 0;

const CUSTOMER_ROLES = {
  1: 'normal',

  4: 'normal',
  5: 'heavy',
  6: 'fast',
  7: 'normal',
  8: 'heavy'
};

/* [JS 077] CHOOSE CUSTOMER TYPE */
function chooseCustomerType() {
  const normal = [
    1,
    3,
    4,
    7
  ];
  if (currentWave < 3) {
    return normal[Math.floor(Math.random() * normal.length)];
  }
  const roll = Math.random();
  if (roll < .22) {
    return 6;
  }
  if (currentWave >= 5 && roll < .47) {
    const heavy = [
      2,
      5,
      8
    ];
    return heavy[Math.floor(Math.random() * heavy.length)];
  }
  return normal[Math.floor(Math.random() * normal.length)];
}

/* [JS 078] CREATE CUSTOMER */
function createCustomer(templateId, type, hp, lane, walkTime, isBoss) {
  const role = isBoss ? 'boss' : CUSTOMER_ROLES[type];
  if (role === 'fast') {
    hp = Math.round(hp * .75);
    walkTime /= 1.3;
  }
  if (role === 'heavy') {
    hp = Math.round(hp * 1.4);
    walkTime /= .8;
  }
  const c = createCustomerBase(templateId, type, hp, lane, walkTime, isBoss);
  c.dataset.role = role;
  c._boostUntil = 0;
  c.addEventListener('click', e => {
    e.stopPropagation();
    if (powerUpPaused || specialPaused || bossIntroPlaying || gameFinished || c.dataset.satisfied ===
      'true') return;
    const previous = priorityCustomer;
    if (previous) {
      previous.classList.remove('priority');
    }
    priorityCustomer = previous === c ? null : c;
    if (priorityCustomer) {
      priorityCustomer.classList.add('priority');
    }
  });
  return c;
}

/* [JS 079] ORDERED TARGETS */
function orderedTargets() {
  const active = customers.filter(c => c.dataset.satisfied !== 'true' && customerIsVisible(c));
  if (!active.includes(priorityCustomer)) {
    priorityCustomer = null;
  }
  active.sort(
    (a, b) => a === priorityCustomer ? -1 : b === priorityCustomer ? 1 : b._walkY - a._walkY);
  return active;
}

/* [JS 082] START CUSTOMER MOVEMENT */
function startCustomerMovement() {
  let last = performance.now();

  /* [JS 083] MOVE */
function move(now) {
    const dt = Math.min(Math.max(0,
      (now - last) / 1000), .05);
    last = now;
    if (!powerUpPaused && !specialPaused && !bossIntroPlaying && !gameFinished) {
      stageElapsed += dt;
      for (const c of customers) {
        if (!c.isConnected || c.style.display === 'none' || c.dataset.satisfied === 'true') continue;
        const boost = c._boostUntil > gameClock ? 1.45 : 1;
        c.classList.toggle('boosted', boost > 1);
        const walkDelta = c.dataset.type === 'boss' ? advanceBossAnimation(c, dt) : dt;
        if (c.dataset.frozen !== 'true') {
          c._walkY = Math.min(CUSTOMER_END_Y, c._walkY + (CUSTOMER_END_Y - CUSTOMER_START_Y) * walkDelta / c
            ._walkTime * boost);
        }
        c.style.top = c._walkY * 100 + '%';
        c.dataset.atKitchen = c._walkY >= CUSTOMER_END_Y ? 'true' : 'false';
      }
    }
    if (!gameFinished) {
      gameFrame(move);
    }
  }
  gameFrame(move);
}

/* [JS 098] SHOW POWER UP SCREEN */
function showPowerUpScreen() {
  if (powerUpPaused || gameFinished) return;
  const available = shuffle(getAvailablePowerUps());
  if (!available.length) return;
  const selected = [];
  const add = p => {
    if (p && !selected.includes(p) && selected.length < 3) {
      selected.push(p);
    }
  };
  add(available.find(p => p.type === (currentLevel === 2 ? 'waitress' : currentLevel === 3 ? 'seon' : null)));
  const offense = ['pasta', 'speed', 'sauce', 'doubleShot', 'caffeineRush', 'hotSplash'];
  if (!selected.some(p => offense.includes(p.type))) {
    add(available.find(p => offense.includes(p.type) && !lastOffer.includes(p.type)) || available.find(p =>
      offense.includes(p.type)));
  }
  for (const p of available.filter(p => !lastOffer.includes(p.type))) {
    add(p);
  }
  for (const p of available) {
    add(p);
  }
  offeredPowerUps = shuffle(selected);
  const options = document.getElementById('powerup-options');
  options.innerHTML = '';
  for (const p of offeredPowerUps) {
    const slot = document.createElement('button');
    slot.type = 'button';

      ['seon', 'hotSplash', 'caffeineRush', 'doubleShot'].includes(p.type)) {

    image.alt = p.type + ' ' + p.level;
    slot.appendChild(image);

      () => selectPowerUp(p.type));
    options.appendChild(slot);

  document.getElementById('game').classList.add('powerup-paused');
  document.getElementById('powerup-overlay').style.display = 'flex';
  lockPowerUpBackground(true);
  options.querySelector('button')?.focus();
}

const BOSS_CAMERA_X = .35;
const BOSS_CAMERA_Y = .21;

/* [JS 099] CAMERA POSITION */
function cameraPosition(boss, cameraX = BOSS_CAMERA_X, cameraY = BOSS_CAMERA_Y) {
  const img = boss.querySelector('.frame.active');
  const r = (img || boss).getBoundingClientRect();
  const g = document.getElementById('game').getBoundingClientRect();
  const scale = img && img.naturalWidth ? Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight) :
    1;
  const w = img && img.naturalWidth ? img.naturalWidth * scale : r.width;
  const h = img && img.naturalHeight ? img.naturalHeight * scale : r.height;
  return {
    x: r.left - g.left + (r.width - w) / 2 + w * cameraX,
    y: r.top - g.top + (r.height - h) / 2 + h * cameraY
  };
}

/* [JS 100] START BOSS FLASH */
function startBossFlash(boss) {

/* [JS 101] ADVANCE BOSS ANIMATION */
function advanceBossAnimation(boss, dt) {
  if (boss.dataset.frozen === 'true' || boss.dataset.satisfied === 'true') return 0;
  let remaining = dt * 1000;
  let walkingMs = 0;
  while (remaining > 0.00001) {
    const frame = boss._photoFrame || 0;
    const elapsed = boss._photoElapsed || 0;
    const step = Math.min(remaining, BOSS_ANIMATION.durations[frame] - elapsed);
    const stopped = BOSS_SETTINGS.stoppedRanges.some(([first, last]) => frame >= first && frame <= last);
    if (!stopped) walkingMs += step;
    boss._photoElapsed = elapsed + step;
    remaining -= step;
    if (boss._photoElapsed >= BOSS_ANIMATION.durations[frame] - 0.00001) {
      boss._photoElapsed = 0;
      boss._photoFrame = (frame + 1) % BOSS_ANIMATION.frames.length;
      boss.querySelector('.boss-photo-frame').src = BOSS_ANIMATION.frames[boss._photoFrame];
      const photo = BOSS_SETTINGS.photoFrames[boss._photoFrame];
      if (photo) fireBossPhoto(boss, photo);
    }
  }
  return walkingMs / 1000;
}

/* [JS 102] FIRE BOSS PHOTO */
function fireBossPhoto(boss, photo) {
  const p = cameraPosition(boss, photo.x, photo.y);
  const game = document.getElementById('game');
  const light = document.createElement('div');
  light.className = 'camera-light fired';
  const ring = document.createElement('div');
  ring.className = 'flash-ring';
  for (const element of [light, ring]) {
    element.style.left = p.x + 'px';
    element.style.top = p.y + 'px';
    game.appendChild(element);
  }
  const wash = document.getElementById('bossFlashWash');
  wash.classList.remove('active');
  void wash.offsetWidth;
  wash.classList.add('active');
  gameLater(() => {
    light.remove();
    ring.remove();
  }, 650);
  if (Math.random() < BOSS_SETTINGS.summonChance) summonBossCustomers(boss);
}

/* [JS 103] SUMMON BOSS CUSTOMERS */
function summonBossCustomers(boss) {
  const queue = Array.from({
    length: BOSS_SETTINGS.summonCount
  }, () => 1 + Math.floor(Math.random() * 8));
  const config = WAVES[BOSS_WAVE - 2];

  /* [JS 104] ATTEMPT */
function attempt() {
    if (gameFinished || !boss.isConnected || boss.dataset.satisfied === 'true' || !queue.length) return;
    const game = document.getElementById('game');
    const type = queue[0];
    const templateId = 'customer' + type + 'Template';
    const height = measureCustomerHeight(templateId);
    const startY = CUSTOMER_START_Y * game.clientHeight;
    const lanes = LANES.map((_, i) => i).filter(lane => customers.every(c => !c.isConnected || c.style
      .display === 'none' || Number(c.dataset.lane) !== lane || hasLaneSpace(startY, height, c._walkY *
        game.clientHeight, c.offsetHeight)));
    if (!lanes.length) {
      gameLater(attempt, 100);
      return;
    }
    const customer = createCustomer(templateId, type, config.hp, lanes[Math.floor(Math.random() * lanes
      .length)], config.walkTime, false);
    customer.dataset.bossSummon = 'true';
    queue.shift();
    if (queue.length) gameLater(attempt, 180);
  }
  attempt();
}

/* [JS 108] LAYOUT TICKET LIGHTS */
function layoutTicketLights(button) {
  const img = button.querySelector('img');
  if (!img.naturalWidth || !button.clientHeight) return;
  const factor = Math.min(button.clientWidth / img.naturalWidth, button.clientHeight / img.naturalHeight);
  const w = img.naturalWidth * factor;
  const h = img.naturalHeight * factor;
  const x = (button.clientWidth - w) / 2;
  const y = (button.clientHeight - h) / 2;
  button.querySelectorAll('.special-ticket-light, .special-ticket-check').forEach(light => {
    const i = Number(light.dataset.ticket);
    light.style.fontSize = w * .19 + 'px';
    light.style.left = (x + w * (.185 + i * .215)) + 'px';
    light.style.top = (y + h * .67) + 'px';
    light.style.width = w * .18 + 'px';
    light.style.height = h * .21 + 'px';
    light.style.transform = 'rotate(' + [-8,
      0,
      8
    ][i] + 'deg)';
  });
}

    button.querySelectorAll('.special-ticket-check').forEach(
      (check, i) => {
        check.hidden = amount < (i + 1) * SPECIAL_CONFIG.killsRequired / 3;
      });
    layoutTicketLights(button);

/* [JS 112] SNAPSHOT ANIMATED CUSTOMERS */
function snapshotAnimatedCustomers() {
  document.querySelectorAll('.spawned-customer .walk-gif.active').forEach(img => {
    if (!img.complete || !img.naturalWidth || getComputedStyle(img).display === 'none') return;
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    try {
      canvas.getContext('2d').drawImage(img, 0, 0);
    } catch (_) {
      return;
    }
    const style = getComputedStyle(img);
    for (const key of ['position', 'left', 'top', 'width', 'height', 'transform', 'transformOrigin',
        'zIndex', 'filter'
      ]) {
      canvas.style[key] = style[key];
    }
    canvas.style.pointerEvents = 'none';
    img.parentNode.appendChild(canvas);
    pausedImageSnapshots.push({
      img,
      canvas,
      visibility: img.style.visibility
    });
    img.style.visibility = 'hidden';
  });
}

/* [JS 113] RESTORE ANIMATED CUSTOMERS */
function restoreAnimatedCustomers() {
  pausedImageSnapshots.forEach(
    ({
      img,
      canvas,
      visibility
    }) => {
      img.style.visibility = visibility;
      canvas.remove();
    });
  pausedImageSnapshots = [];
}

/* [JS 115] ACTIVATE SPECIAL */
function activateSpecial(actor) {
  if (!gameStarted || gameFinished || powerUpPaused || bossIntroPlaying || specialPaused || !actorIsSummoned(
      actor) || !(actor in specialCharge) || specialCharge[actor] < SPECIAL_CONFIG.killsRequired) return;
  if (!orderedTargets().length) return;
  specialCharge[actor] = 0;
  updateSpecialPanels();
  specialPaused = true;
  lastClockTime = performance.now();
  snapshotAnimatedCustomers();
  document.getElementById('game').classList.add('special-paused');
  const overlay = document.getElementById('specialPresentation');
  const art = document.getElementById('specialArtwork');
  const fallback = document.getElementById('specialFallback');
  overlay.dataset.actor = actor;
  const preload = specialPreloads[actor];
  const loaded = preload.complete && preload.naturalWidth > 0;
  art.style.display = loaded ? 'block' : 'none';
  art.src = SPECIAL_CONFIG[actor].artwork;
  art.alt = SPECIAL_CONFIG[actor].name;
  fallback.textContent = loaded ? '' : SPECIAL_CONFIG[actor].name;
  overlay.hidden = false;
  const session =
    ++specialSession;
  specialPresentationTimer = setTimeout(
    () => {
      if (session !== specialSession) return;
      cancelSpecialPresentation();
      lastClockTime = performance.now();
      if (!gameStarted || gameFinished) return;
      applySpecial(actor);
    }, SPECIAL_CONFIG.presentationMs);
}

/* [JS 116] APPLY SPECIAL */
function applySpecial(actor) {
  if (actor === 'cook') {
    const volley = () => orderedTargets().slice(0, SPECIAL_CONFIG.chefTargets).forEach(target =>
      throwProjectile(target, 'pasta', true));
    volley();
    for (let i = 1; i < SPECIAL_CONFIG.chefVolleys; i++) {
      gameLater(volley, i * SPECIAL_CONFIG.volleyIntervalMs);
    }
  } else if (actor === 'waitress') {
    orderedTargets().forEach(target => hitSpecialProjectile(target, null, 'drink'));
  } else if (actor === 'seon') {
    espressoUntil = gameClock + SPECIAL_CONFIG.espressoMs;
    for (const member in nextAttackAt) {
      nextAttackAt[member] = gameClock + Math.max(0, nextAttackAt[member] - gameClock) / 1.5;
    }
    document.getElementById('game').classList.add('espresso-active');
    gameLater(
      () => {
        espressoUntil = 0;
        document.getElementById('game').classList.remove('espresso-active');
      }, SPECIAL_CONFIG.espressoMs);
  }
}
