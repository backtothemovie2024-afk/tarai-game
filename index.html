<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* =====================
   SCHERMATA SMARTPHONE
===================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* =====================
   HOME
===================== */

#menu {
    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 50;
}


/* =====================
   FLASH
===================== */

#flash {

    position: absolute;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 20;

    animation: flashEffect 1.2s ease-out forwards;
}


@keyframes flashEffect {

    0% {
        opacity: 0;
    }

    25% {
        opacity: 0.9;
    }

    45% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }

}


/* =====================
   COPERTINA
===================== */

#cover {

    position: relative;

    width: 88%;

    height: auto;

    object-fit: contain;

    opacity: 0;

    z-index: 10;

    animation:
        logoIntro 1.2s
        cubic-bezier(0.16, 1, 0.3, 1)
        0.3s
        forwards;
}


@keyframes logoIntro {

    0% {

        opacity: 0;

        transform:
            scale(2.5)
            rotate(-8deg);

        filter:
            brightness(3)
            drop-shadow(0 0 30px #ff8c00);

    }


    35% {

        opacity: 1;

        transform:
            scale(1.15)
            rotate(3deg);

        filter:
            brightness(1.8)
            drop-shadow(0 0 25px #ff8c00);

    }


    55% {

        transform:
            scale(0.94)
            rotate(-2deg);

    }


    72% {

        transform:
            scale(1.06)
            rotate(1deg);

    }


    86% {

        transform:
            scale(0.98)
            rotate(-0.5deg);

    }


    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

        filter:
            brightness(1)
            drop-shadow(0 0 0 transparent);

    }

}


/* =====================
   PLAY
===================== */

#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    opacity: 0;

    transform: translateY(30px);

    animation:
        playIntro
        0.6s
        ease-out
        1.5s
        forwards;

    z-index: 30;
}


@keyframes playIntro {

    from {

        opacity: 0;

        transform: translateY(30px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


/* =====================
   GIOCO
===================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;
}


/* =====================
   BACKGROUND
===================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* =====================
   HUD
===================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    z-index: 20;
}


/* =====================
   CLIENTE
===================== */

#customer {

    position: absolute;

    width: 150px;

    height: 200px;

    left: 50%;

    top: -220px;

    transform: translateX(-50%);

    z-index: 10;

    animation:
        walkDown
        5s
        linear
        forwards;
}


/* =====================
   FRAME
===================== */

.frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 150px;

    height: 200px;

    object-fit: contain;

    display: none;
}


.frame1 {

    display: block;
}


/* =====================
   MOVIMENTO CLIENTE
===================== */

@keyframes walkDown {

    from {

        top: -220px;

    }

    to {

        top: 55%;

    }

}

</style>

</head>


<body>


<div id="phone">


<!-- =====================
     HOME
===================== -->

<div id="menu">


    <div id="flash"></div>


    <img
        id="cover"
        src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
        alt="Tarai Rush">


    <button id="playButton">
        PLAY
    </button>


</div>



<!-- =====================
     GIOCO
===================== -->

<div id="game">


    <img
        id="background"
        src="https://i.ibb.co/fzKdg9TY/1787950008908.png"
        alt="Background">


    <div id="hud">

        <span>❤️ 3</span>

        <span>⭐ 0</span>

    </div>


    <div id="customer">


        <img
            class="frame frame1"
            src="https://i.ibb.co/WWQSVh2c/Screenshot-20260829-161529-Grok-2.jpg"
            alt="Gamba sinistra">


        <img
            class="frame frame2"
            src="https://i.ibb.co/YxRzGxP/Screenshot-20260829-161529-Grok-3.jpg"
            alt="Gamba destra">


    </div>


</div>


</div>



<script>


/* =====================
   ANIMAZIONE CAMMINATA
===================== */

let currentFrame = 1;

let walkAnimation;


/* =====================
   PLAY
===================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        document
            .getElementById("menu")
            .style.display = "none";


        document
            .getElementById("game")
            .style.display = "block";


        const customer =
            document.getElementById("customer");


        customer.style.animation = "none";

        void customer.offsetWidth;

        customer.style.animation =
            "walkDown 5s linear forwards";


        startWalking();

    });



/* =====================
   CAMMINATA
===================== */

function startWalking() {


    if (walkAnimation) {

        clearInterval(walkAnimation);

    }


    currentFrame = 1;


    walkAnimation = setInterval(function() {


        document
            .querySelectorAll(".frame")
            .forEach(function(frame) {

                frame.style.display = "none";

            });


        if (currentFrame === 1) {

            currentFrame = 2;

        } else {

            currentFrame = 1;

        }


        document
            .querySelector(".frame" + currentFrame)
            .style.display = "block";


    }, 300);

}

</script>


</body>

</html>
