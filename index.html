<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tarai Rush</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;
}


/* ==================================================
   SCHERMO
================================================== */

#phone {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    aspect-ratio: 9 / 16;

    margin: auto;

    overflow: hidden;

    background: black;
}


/* ==================================================
   MENU
================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 100;
}


#cover {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 10;
}


#playButton {

    position: absolute;

    bottom: 12%;

    width: 60%;

    max-width: 240px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ef6428;

    color: white;

    font-size: 28px;

    font-weight: bold;

    cursor: pointer;

    z-index: 30;
}


/* ==================================================
   GIOCO
================================================== */

#game {

    display: none;

    position: absolute;

    inset: 0;

    overflow: hidden;

    background: black;
}


/* ==================================================
   BACKGROUND
================================================== */

#background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;
}


/* ==================================================
   CUCINA
================================================== */

#kitchen,
#kitchenDamaged,
#kitchenDestroyed {

    position: absolute;

    left: 50%;

    top: 83%;

    width: 115%;

    height: auto;

    transform: translate(-50%, -50%);

    object-fit: contain;

    pointer-events: none;
}


#kitchen {

    z-index: 15;

}


#kitchenDamaged {

    z-index: 16;

    display: none;

}


#kitchenDestroyed {

    z-index: 17;

    display: none;

}


/* ==================================================
   HUD
================================================== */

#hud {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    color: white;

    z-index: 30;
}


/* ==================================================
   CLIENTI
================================================== */

.customer {

    position: absolute;

    width: 100px;

    height: 135px;

    top: -130px;

    z-index: 10;

    animation:
        walkDown
        40s
        linear
        forwards;
}


.customer.satisfied {

    animation: none;

}


#customer1 {

    left: 35%;

}


#customer2 {

    left: 65%;

}


/* ==================================================
   FRAME CLIENTI
================================================== */

.customer .frame {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    object-position: center;

    display: none;
}


.customer .frame.active {

    display: block;

}


/* ==================================================
   MOVIMENTO CLIENTI
================================================== */

@keyframes walkDown {

    0% {

        top: -130px;

    }

    65% {

        top: 69%;

    }

    100% {

        top: 69%;

    }

}


/* ==================================================
   CUOCO
================================================== */

#cook {

    position: absolute;

    left: 43%;

    bottom: 7%;

    width: 100px;

    height: 135px;

    transform: translateX(-50%);

    z-index: 20;
}


/* ==================================================
   FRAME CUOCO
================================================== */

#cook img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    object-position: center;

    display: none;
}


#cook img.active {

    display: block;

}


/* ==================================================
   PASTA
================================================== */

.pasta {

    position: absolute;

    width: 84px;

    height: 84px;

    object-fit: contain;

    z-index: 25;

    pointer-events: none;

}


/* ==================================================
   TELEFONO
================================================== */

@media (max-width: 500px) {

    .customer,
    #cook {

        width: 65px;

        height: 88px;

    }


    .pasta {

        width: 60px;

        height: 60px;

    }

}

</style>

</head>


<body>

<div id="phone">


    <!-- ==================================================
         MENU
    ================================================== -->

    <div id="menu">

        <img
            id="cover"
            src="https://i.ibb.co/qMC7T0bk/1787735382053.png"
            alt="">

        <button id="playButton">

            PLAY

        </button>

    </div>



    <!-- ==================================================
         GIOCO
    ================================================== -->

    <div id="game">


        <!-- BACKGROUND -->

        <img
            id="background"
            src="https://i.ibb.co/pj7trt5y/IMG-20260829-WA0012.jpg"
            alt="">



        <!-- CUCINA INTEGRA -->

        <img
            id="kitchen"
            src="https://i.ibb.co/39jfnpgW/IMG-20260829-WA0013-removebg-preview.png"
            alt="">



        <!-- CUCINA DANNEGGIATA -->

        <img
            id="kitchenDamaged"
            src="https://i.ibb.co/7t1CkQYc/IMG-20260829-WA0014-removebg-preview.png"
            alt="">



        <!-- CUCINA DISTRUTTA -->

        <img
            id="kitchenDestroyed"
            src="https://i.ibb.co/HLF1Q2zn/IMG-20260829-WA0015-removebg-preview.png"
            alt="">



        <!-- HUD -->

        <div id="hud">

            <span>❤️ 3</span>

            <span>⭐ 0</span>

        </div>



        <!-- ==================================================
             CLIENTE 1
        ================================================== -->

        <div
            id="customer1"
            class="customer">

            <img
                class="frame active"
                src="https://i.ibb.co/xqSsVvcc/Screenshot-20260829-161529-Grok-2-removebg-preview.png"
                alt="">

            <img
                class="frame"
                src="https://i.ibb.co/4nvV4nPq/Screenshot-20260829-161529-Grok-3-removebg-preview.png"
                alt="">

        </div>



        <!-- ==================================================
             CLIENTE 2
        ================================================== -->

        <div
            id="customer2"
            class="customer">

            <img
                class="frame active"
                src="https://i.ibb.co/jP6QSPFd/1000040572-removebg-preview.png"
                alt="">

            <img
                class="frame"
                src="https://i.ibb.co/vxJCRK81/1000040573-removebg-preview.png"
                alt="">

        </div>



        <!-- ==================================================
             CUOCO
        ================================================== -->

        <div id="cook">


            <!-- FRAME 1 -->

            <img
                class="active"
                src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
                alt="">


            <!-- FRAME 2 -->

            <img
                src="https://i.ibb.co/fY9GKKNP/IMG-20260829-WA0006-removebg-preview.png"
                alt="">


            <!-- FRAME 3 -->

            <img
                src="https://i.ibb.co/kskzw0J1/IMG-20260829-WA0004-removebg-preview.png"
                alt="">


            <!-- FRAME 4 = LANCIO -->

            <img
                src="https://i.ibb.co/9mSrQBZx/IMG-20260829-WA0007-removebg-preview.png"
                alt="">


            <!-- FRAME 5 -->

            <img
                src="https://i.ibb.co/x8BnTGCV/IMG-20260829-WA0005-removebg-preview.png"
                alt="">

        </div>

    </div>

</div>



<script>

/* ==================================================
   VARIABILI
================================================== */

let customerFrame1 = 0;

let customerFrame2 = 0;

let customerTimer = null;

let cookTimer = null;

let firstAttackTimer = null;

let kitchenDamageTimer = null;


/* ==================================================
   ENERGIA CUCINA
================================================== */

let kitchenEnergy = 100;

let customer1AtKitchen = false;

let customer2AtKitchen = false;


/* ==================================================
   HP CLIENTI
================================================== */

let customer1HP = 50;

let customer2HP = 50;

let customer1Satisfied = false;

let customer2Satisfied = false;


/* ==================================================
   PLAY
================================================== */

document
    .getElementById("playButton")
    .addEventListener("click", function() {


        document
            .getElementById("menu")
            .style.display = "none";


        document
            .getElementById("game")
            .style.display = "block";


        /* RESET */

        kitchenEnergy = 100;

        customer1AtKitchen = false;

        customer2AtKitchen = false;

        customer1HP = 50;

        customer2HP = 50;

        customer1Satisfied = false;

        customer2Satisfied = false;


        document
            .getElementById("customer1")
            .classList.remove("satisfied");


        document
            .getElementById("customer2")
            .classList.remove("satisfied");


        document
            .getElementById("customer1")
            .style.display = "block";


        document
            .getElementById("customer2")
            .style.display = "block";


        /* RESET CUCINA */

        document
            .getElementById("kitchen")
            .style.display = "block";


        document
            .getElementById("kitchenDamaged")
            .style.display = "none";


        document
            .getElementById("kitchenDestroyed")
            .style.display = "none";


        updateKitchenEnergy();



        /* ==================================================
           CLIENTE 1
        ================================================== */

        const customer1 =
            document.getElementById("customer1");


        customer1.style.animation = "none";

        void customer1.offsetWidth;

        customer1.style.animation =
            "walkDown 40s linear forwards";



        /* ==================================================
           CLIENTE 2
        ================================================== */

        const customer2 =
            document.getElementById("customer2");


        customer2.style.animation = "none";

        void customer2.offsetWidth;

        customer2.style.animation =
            "walkDown 40s linear forwards";



        /* AVVIA SISTEMI */

        startCustomerAnimation();

        startCookAnimation();

        startKitchenEnergySystem();

        startCustomerKitchenDetection();

        startFirstAttackDetection();

    });



/* ==================================================
   STATO CUCINA
================================================== */

function updateKitchenEnergy() {


    if (kitchenEnergy > 50) {

        document
            .getElementById("kitchen")
            .style.display = "block";


        document
            .getElementById("kitchenDamaged")
            .style.display = "none";


        document
            .getElementById("kitchenDestroyed")
            .style.display = "none";

    }

    else if (kitchenEnergy > 20) {

        document
            .getElementById("kitchen")
            .style.display = "none";


        document
            .getElementById("kitchenDamaged")
            .style.display = "block";


        document
            .getElementById("kitchenDestroyed")
            .style.display = "none";

    }

    else {

        document
            .getElementById("kitchen")
            .style.display = "none";


        document
            .getElementById("kitchenDamaged")
            .style.display = "none";


        document
            .getElementById("kitchenDestroyed")
            .style.display = "block";

    }

}



/* ==================================================
   ENERGIA CUCINA
================================================== */

function startKitchenEnergySystem() {


    if (kitchenDamageTimer !== null) {

        clearInterval(kitchenDamageTimer);

    }


    kitchenDamageTimer =
        setInterval(function() {


            let damage = 0;


            if (
                customer1AtKitchen &&
                !customer1Satisfied
            ) {

                damage++;

            }


            if (
                customer2AtKitchen &&
                !customer2Satisfied
            ) {

                damage++;

            }


            if (damage > 0) {

                kitchenEnergy -= damage;


                if (kitchenEnergy < 0) {

                    kitchenEnergy = 0;

                }


                updateKitchenEnergy();

            }


        }, 5000);

}



/* ==================================================
   ARRIVO CLIENTI
================================================== */

function startCustomerKitchenDetection() {


    /*
       Il cliente arriva alla cucina
       dopo il 65% dei 40 secondi.
    */

    setTimeout(function() {

        if (!customer1Satisfied) {

            customer1AtKitchen = true;

        }

    }, 26000);



    setTimeout(function() {

        if (!customer2Satisfied) {

            customer2AtKitchen = true;

        }

    }, 26000);

}



/* ==================================================
   CLIENTE VISIBILE
================================================== */

function customerIsVisible(customer) {


    if (
        !customer ||
        customer.style.display === "none"
    ) {

        return false;

    }


    const rect =
        customer.getBoundingClientRect();


    const game =
        document.getElementById("game");


    const gameRect =
        game.getBoundingClientRect();


    return (

        rect.bottom > gameRect.top &&

        rect.top < gameRect.bottom

    );

}



/* ==================================================
   PRIMO ATTACCO
================================================== */

function startFirstAttackDetection() {


    if (firstAttackTimer !== null) {

        clearInterval(firstAttackTimer);

    }


    firstAttackTimer =
        setInterval(function() {


            const c1 =
                document.getElementById("customer1");


            const c2 =
                document.getElementById("customer2");


            if (
                customerIsVisible(c1) &&
                !customer1Satisfied
            ) {

                playCookAttack();

                clearInterval(firstAttackTimer);

                return;

            }


            if (
                customerIsVisible(c2) &&
                !customer2Satisfied
            ) {

                playCookAttack();

                clearInterval(firstAttackTimer);

                return;

            }


        }, 100);

}



/* ==================================================
   ANIMAZIONE CLIENTI
================================================== */

function startCustomerAnimation() {


    if (customerTimer !== null) {

        clearInterval(customerTimer);

    }


    customerFrame1 = 0;

    customerFrame2 = 0;


    customerTimer =
        setInterval(function() {


            /* CLIENTE 1 */

            if (!customer1Satisfied) {

                const c1 =
                    document
                        .getElementById("customer1")
                        .querySelectorAll(".frame");


                c1.forEach(function(frame) {

                    frame.classList.remove("active");

                });


                c1[customerFrame1]
                    .classList.add("active");


                customerFrame1++;


                if (customerFrame1 >= 2) {

                    customerFrame1 = 0;

                }

            }



            /* CLIENTE 2 */

            if (!customer2Satisfied) {

                const c2 =
                    document
                        .getElementById("customer2")
                        .querySelectorAll(".frame");


                c2.forEach(function(frame) {

                    frame.classList.remove("active");

                });


                c2[customerFrame2]
                    .classList.add("active");


                customerFrame2++;


                if (customerFrame2 >= 2) {

                    customerFrame2 = 0;

                }

            }


        }, 300);

}



/* ==================================================
   FRAME CUOCO
================================================== */

function setCookFrame(frameNumber) {


    const cookFrames =
        document
            .getElementById("cook")
            .querySelectorAll("img");


    cookFrames.forEach(function(frame) {

        frame.classList.remove("active");

    });


    cookFrames[frameNumber]
        .classList.add("active");

}



/* ==================================================
   ATTACCO CUOCO
================================================== */

function playCookAttack() {


    const target =
        getNearestVisibleCustomer();


    if (target === null) {

        setCookFrame(0);

        return;

    }


    setCookFrame(0);


    setTimeout(function() {

        setCookFrame(1);

    }, 120);


    setTimeout(function() {

        setCookFrame(2);

    }, 240);


    /* FRAME 4 = LANCIO */

    setTimeout(function() {

        setCookFrame(3);

        throwPasta(target);

    }, 360);


    setTimeout(function() {

        setCookFrame(4);

    }, 480);


    setTimeout(function() {

        setCookFrame(0);

    }, 600);

}



/* ==================================================
   ATTACCO OGNI 3 SECONDI
================================================== */

function startCookAnimation() {


    if (cookTimer !== null) {

        clearInterval(cookTimer);

    }


    setCookFrame(0);


    cookTimer =
        setInterval(function() {

            playCookAttack();

        }, 3000);

}



/* ==================================================
   CLIENTE PIÙ VICINO
================================================== */

function getNearestVisibleCustomer() {


    const customers = [];


    const c1 =
        document.getElementById("customer1");


    const c2 =
        document.getElementById("customer2");


    if (
        customerIsVisible(c1) &&
        !customer1Satisfied
    ) {

        customers.push(c1);

    }


    if (
        customerIsVisible(c2) &&
        !customer2Satisfied
    ) {

        customers.push(c2);

    }


    if (customers.length === 0) {

        return null;

    }


    const cook =
        document.getElementById("cook");


    const cookRect =
        cook.getBoundingClientRect();


    const cookX =
        cookRect.left +
        cookRect.width / 2;


    let nearest = null;

    let nearestDistance = Infinity;


    customers.forEach(function(customer) {


        const rect =
            customer.getBoundingClientRect();


        const customerX =
            rect.left +
            rect.width / 2;


        const distance =
            Math.abs(customerX - cookX);


        if (distance < nearestDistance) {

            nearestDistance = distance;

            nearest = customer;

        }

    });


    return nearest;

}



/* ==================================================
   LANCIO PASTA
================================================== */

function throwPasta(target) {


    if (!target) {

        return;

    }


    if (
        target.id === "customer1" &&
        customer1Satisfied
    ) {

        return;

    }


    if (
        target.id === "customer2" &&
        customer2Satisfied
    ) {

        return;

    }


    const cook =
        document.getElementById("cook");


    const cookRect =
        cook.getBoundingClientRect();


    const targetRect =
        target.getBoundingClientRect();


    const game =
        document.getElementById("game");


    const gameRect =
        game.getBoundingClientRect();


    const pasta =
        document.createElement("img");


    pasta.className = "pasta";


    pasta.src =
        "https://i.ibb.co/LDw4VzQs/1788013611587-removebg-preview.png";


    /* ==================================================
       PARTENZA DALLA MANO
    ================================================== */

    const startX =
        cookRect.left +
        cookRect.width * 0.72;


    const startY =
        cookRect.top +
        cookRect.height * 0.32;



    /* ==================================================
       BERSAGLIO: VISO
    ================================================== */

    const endX =
        targetRect.left +
        targetRect.width / 2;


    const endY =
        targetRect.top +
        targetRect.height * 0.50;



    game.appendChild(pasta);



    /* ==================================================
       POSIZIONE INIZIALE
    ================================================== */

    pasta.style.left =
        (
            startX -
            gameRect.left -
            42
        ) + "px";


    pasta.style.top =
        (
            startY -
            gameRect.top -
            42
        ) + "px";



    /* ==================================================
       VELOCITÀ COSTANTE
       350 PIXEL AL SECONDO
    ================================================== */

    const distanceX =
        endX - startX;


    const distanceY =
        endY - startY;


    const distance =
        Math.sqrt(
            distanceX * distanceX +
            distanceY * distanceY
        );


    const speed = 350;


    const duration =
        (distance / speed) * 1000;


    const startTime =
        performance.now();



    function movePasta(currentTime) {


        const elapsed =
            currentTime - startTime;


        let progress =
            elapsed / duration;


        if (progress > 1) {

            progress = 1;

        }


        const currentX =
            startX +
            distanceX *
            progress;


        const currentY =
            startY +
            distanceY *
            progress;


        pasta.style.left =
            (
                currentX -
                gameRect.left -
                42
            ) + "px";


        pasta.style.top =
            (
                currentY -
                gameRect.top -
                42
            ) + "px";



        if (progress >= 1) {

            hitCustomer(
                target,
                pasta
            );

            return;

        }


        requestAnimationFrame(
            movePasta
        );

    }


    requestAnimationFrame(
        movePasta
    );

}



/* ==================================================
   COLPITO
================================================== */

function hitCustomer(
    customer,
    pasta
) {


    if (
        pasta &&
        pasta.parentNode
    ) {

        pasta.parentNode
            .removeChild(pasta);

    }



    /* CLIENTE 1 */

    if (
        customer.id === "customer1"
    ) {


        if (customer1Satisfied) {

            return;

        }


        customer1HP -= 5;


        console.log(
            "Cliente 1 HP:",
            customer1HP
        );


        if (
            customer1HP <= 0
        ) {

            satisfyCustomer1();

        }

    }



    /* CLIENTE 2 */

    if (
        customer.id === "customer2"
    ) {


        if (customer2Satisfied) {

            return;

        }


        customer2HP -= 5;


        console.log(
            "Cliente 2 HP:",
            customer2HP
        );


        if (
            customer2HP <= 0
        ) {

            satisfyCustomer2();

        }

    }

}



/* ==================================================
   CLIENTE 1 SODDISFATTO
================================================== */

function satisfyCustomer1() {


    customer1Satisfied = true;

    customer1AtKitchen = false;


    const customer =
        document.getElementById(
            "customer1"
        );


    customer.classList.add(
        "satisfied"
    );


    setTimeout(function() {

        customer.style.display =
            "none";

    }, 1000);

}



/* ==================================================
   CLIENTE 2 SODDISFATTO
================================================== */

function satisfyCustomer2() {


    customer2Satisfied = true;

    customer2AtKitchen = false;


    const customer =
        document.getElementById(
            "customer2"
        );


    customer.classList.add(
        "satisfied"
    );


    setTimeout(function() {

        customer.style.display =
            "none";

    }, 1000);

}

</script>

</body>

</html>
